  function syncFreeZoomDot(){
    if (!freeZoomDotWanted() || !map3d || !Marker3DElement) {
      clearFreeZoomDot();
      return;
    }
    const pos = exploreYouPoint();
    if (!pos) return;
    if (!freeZoomDot) {
      try {
        freeZoomDot = new Marker3DElement({
          position: pos,
          altitudeMode: "RELATIVE_TO_GROUND",
          sizePreserved: true,
          drawsWhenOccluded: true
        });
        const img = document.createElement("img");
        img.src = YOU_HERE_ICON;
        img.width = 40;
        img.height = 40;
        img.alt = "Current location";
        const template = document.createElement("template");
        template.content.append(img);
        freeZoomDot.append(template);
        map3d.append(freeZoomDot);
      } catch (err) {
        freeZoomDot = null;
        return;
      }
    }
    try { freeZoomDot.position = pos; } catch (err) {}
    if (!freeZoomDot.parentElement) map3d.append(freeZoomDot);
  }

  function clearExploreYou(){
    if (!exploreYouMarker) return;
    try { exploreYouMarker.remove(); } catch (err) {}
    exploreYouMarker = null;
  }

  function syncExploreYou(){
    if (!explore.mode || !map3d || !Marker3DElement) {
      clearExploreYou();
      return;
    }
    const pos = exploreYouPoint();
    if (!pos) return;
    const created = !exploreYouMarker;
    if (!exploreYouMarker) {
      try {
        exploreYouMarker = new Marker3DElement({
          position: pos,
          altitudeMode: "RELATIVE_TO_GROUND",
          sizePreserved: true,
          drawsWhenOccluded: true
        });
        const img = document.createElement("img");
        img.src = YOU_HERE_ICON;
        img.width = 40;
        img.height = 40;
        img.alt = "Current location";
        const template = document.createElement("template");
        template.content.append(img);
        exploreYouMarker.append(template);
        map3d.append(exploreYouMarker);
      } catch (err) {
        exploreYouMarker = null;
        return;
      }
    } else {
      try { exploreYouMarker.position = pos; } catch (err) {}
      if (!exploreYouMarker.parentElement) map3d.append(exploreYouMarker);
    }
    if (created && !explore.youFitted) {
      explore.youFitted = true;
      const ov = computeExploreOverview(explore.places);
      if (ov && map3d && !exploreFly && !explore.selected) {
        explore.overview = ov;
        map3d.center = ov.center;
        map3d.range = ov.range;
      }
    }
  }

  function computeExploreOverview(places){
    const pts = (places || explore.places || []).slice();
    const you = exploreYouPoint();
    if (you && pts.length) {
      let nearest = Infinity;
      pts.forEach(p => { nearest = Math.min(nearest, distanceMetres(you, p)); });
      if (nearest < 12000) pts.push(you);
    }
    if (!pts.length) return null;
    let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
    pts.forEach(p => {
      minLat = Math.min(minLat, p.lat);
      maxLat = Math.max(maxLat, p.lat);
      minLng = Math.min(minLng, p.lng);
      maxLng = Math.max(maxLng, p.lng);
    });
    const mid = { lat: (minLat + maxLat) / 2, lng: (minLng + maxLng) / 2 };
    const span = Math.max(
      distanceMetres({ lat: minLat, lng: minLng }, { lat: maxLat, lng: maxLng }),
      500
    );
    return { center: mid, range: clamp(span * 1.55, 800, 48000), tilt: 28, heading: 0 };
  }

  function fitExploreCamera(places){
    const ov = computeExploreOverview(places);
    if (!map3d || !ov) return;
    following = false;
    autoRefollowArmed = false;
    document.getElementById("followBtn").textContent = "Following: OFF";
    stopDestPreview();
    exploreFly = null;
    cam.seeded = false;
    map3d.center = ov.center;
    map3d.heading = ov.heading;
    map3d.tilt = ov.tilt;
    map3d.range = ov.range;
    explore.overview = ov;
    updateRecenterButton();
  }

  function startExploreOverviewFly(overview){
    if (!map3d || !overview || !overview.center) return;
    following = false;
    autoRefollowArmed = false;
    document.getElementById("followBtn").textContent = "Following: OFF";
    stopDestPreview();
    const c = readMapCenter();
    const heading = numOr(map3d.heading, 0);
    const range = numOr(map3d.range, 0);
    exploreFly = {
      from: {
        lat: c.lat,
        lng: c.lng,
        heading,
        range: range > 0 ? range : overview.range,
        tilt: numOr(map3d.tilt, overview.tilt)
      },
      to: overview,
      startMs: performance.now()
    };
    cam.lat = exploreFly.from.lat;
    cam.lng = exploreFly.from.lng;
    cam.heading = exploreFly.from.heading;
    cam.range = exploreFly.from.range;
    cam.tilt = exploreFly.from.tilt;
    cam.seeded = true;
    ensureFollowTicker();
    updateRecenterButton();
  }

  function applyExploreOverviewCamera(dtEase, now){
    if (!exploreFly || !map3d) return;
    const from = exploreFly.from;
    const to = exploreFly.to;
    const u = clamp((now - exploreFly.startMs) / EXPLORE_OVERVIEW_MS, 0, 1);
    const e = u * u * (3 - 2 * u);
    cam.lat = lerp(from.lat, to.center.lat, e);
    cam.lng = lerp(from.lng, to.center.lng, e);
    cam.range = lerp(from.range, to.range, e);
    cam.tilt = lerp(from.tilt, to.tilt, e);
    const dH = ((to.heading - from.heading + 540) % 360) - 180;
    cam.heading = normaliseHeading(from.heading + dH * e);
    const center = { lat: cam.lat, lng: cam.lng };
    const alt = followGroundAltitude(center, dtEase);
    if (Number.isFinite(alt)) center.altitude = alt;
    map3d.center = center;
    if (Math.abs(((numOr(map3d.heading, 0) - cam.heading + 540) % 360) - 180) > 0.005) map3d.heading = cam.heading;
    if (Math.abs(numOr(map3d.range, 0) - cam.range) > 0.02) map3d.range = cam.range;
    if (Math.abs(numOr(map3d.tilt, 0) - cam.tilt) > 0.005) map3d.tilt = cam.tilt;
    updateCompassNeedle(cam.heading);
    applyExploreLabelMode();
    if (u >= 1) exploreFly = null;
  }

  function exploreLabelScore(place){
    if (!place) return 0;
    const rating = Number(place.rating) || 0;
    const reviews = Number(place.userRatingCount) || 0;
    let score = rating * (Math.log10(reviews + 10) + 0.4);
    if (place.name) score += 1.2;
    if (explore.selected && place.id === explore.selected.id) score += 1000;
    return score;
  }

  function labeledExploreIds(places, range){
    const pts = (places || []).filter(p => p && p.name);
    if (!pts.length) return {};
    const r = Number.isFinite(range) && range > 0 ? range : 8000;
    const minSep = clamp(r * 0.12, 160, 2600);
    const ranked = pts.slice().sort((a, b) => {
      const d = exploreLabelScore(b) - exploreLabelScore(a);
      if (Math.abs(d) > 0.001) return d;
      return String(a.id || "").localeCompare(String(b.id || ""));
    });
    const kept = [];
    ranked.forEach(place => {
      if (kept.some(other => distanceMetres(other, place) < minSep)) return;
      kept.push(place);
    });
    const ids = {};
    kept.forEach(place => { ids[place.id] = true; });
    return ids;
  }

  function applyExploreLabelMode(force){
    if (!explore.mode || !explore.markers.length || !map3d) return;
    const range = Number(map3d.range);
    const bucket = Math.round((Number.isFinite(range) ? range : 0) / 350);
    if (!force && bucket === explore.labelBucket) return;
    explore.labelBucket = bucket;
    const ids = labeledExploreIds(explore.places, range);
    explore.markers.forEach((marker, i) => {
      const place = (marker._explorePlace) || explore.places[i];
      if (!place) return;
      const show = !!(ids[place.id] && place.name);
      const href = rewriteIconHref(place.iconHref);
      const custom = href && !isBlankStockIcon(href);
      try { marker.label = null; } catch (err) {}
      if (custom) return;
      applyExplorePinImage(marker._pinImg, place, show);
    });
  }

  async function enrichPlaceFromGoogle(dest){
    if (!dest || dest.photoUrl) return dest;
    try {
      const { Place } = await google.maps.importLibrary("places");
      const q = String(dest.name || "").replace(/^\d+\.\s*/, "").trim();
      if (!q) return dest;
      const found = await Place.searchByText({
        textQuery: q + " Auckland",
        fields: PLACE_CORE_FIELDS.concat(PLACE_EXTRA_FIELDS),
        locationBias: { center: { lat: dest.lat, lng: dest.lng }, radius: 600 },
        maxResultCount: 5,
        region: "nz"
      });
      const pool = found.places || [];
      let best = null, bestD = 280;
      pool.forEach(place => {
        const loc = latLngOf(place.location);
        if (!loc) return;
        const d = distanceMetres(dest, loc);
        if (d < bestD) { bestD = d; best = place; }
      });
      if (!best) return dest;
      const extra = snapshotPlace(best, dest.name);
      if (!extra) return dest;
      dest.placeId = extra.placeId || dest.placeId;
      dest.photoUrl = extra.photoUrl || "";
      dest.photoAttr = extra.photoAttr || "";
      dest.rating = extra.rating || dest.rating;
      dest.userRatingCount = extra.userRatingCount || dest.userRatingCount;
      dest.hours = extra.hours || dest.hours;
      dest.address = dest.address || extra.address;
    } catch (err) {
      console.warn("Place photo lookup failed", err);
    }
    return dest;
  }

  const PLACE_CORE_FIELDS = ["id", "displayName", "formattedAddress", "location"];
  const PLACE_EXTRA_FIELDS = ["rating", "userRatingCount", "photos", "regularOpeningHours", "currentOpeningHours", "businessStatus", "utcOffsetMinutes"];

  function latLngOf(loc){
    if (!loc) return null;
    const lat = typeof loc.lat === "function" ? loc.lat() : loc.lat;
    const lng = typeof loc.lng === "function" ? loc.lng() : loc.lng;
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
    return { lat, lng };
  }

  function placeNameOf(place, fallback){
    const n = place && place.displayName;
    if (typeof n === "string" && n.trim()) return n.trim();
    if (n && typeof n.text === "string" && n.text.trim()) return n.text.trim();
    const addr = place && place.formattedAddress;
    if (typeof addr === "string" && addr.trim()) return addr.trim();
    return fallback || "Destination";
  }

  function formatClockHm(minutes){
    const mins = ((Math.round(minutes) % 1440) + 1440) % 1440;
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
  }

  function placeLocalNow(place){
    const now = new Date();
    const offset = Number(place && place.utcOffsetMinutes);
    if (!Number.isFinite(offset)) {
      return { day: now.getDay(), minutes: now.getHours() * 60 + now.getMinutes() };
    }
    const utc = now.getTime() + now.getTimezoneOffset() * 60000;
    const local = new Date(utc + offset * 60000);
    return { day: local.getDay(), minutes: local.getHours() * 60 + local.getMinutes() };
  }

  function periodMinutes(pt){
    return (Number(pt && pt.hour) || 0) * 60 + (Number(pt && pt.minute) || 0);
  }

  function isAllDayPeriod(period){
    if (!period || !period.open) return false;
    if (!period.close) return true;
    const openM = periodMinutes(period.open);
    const closeM = periodMinutes(period.close);
    return openM === 0 && (closeM >= 23 * 60 + 59 || closeM === 0);
  }

  function isOpen24Hours(periods){
    if (!periods || !periods.length) return false;
    if (periods.length === 1 && isAllDayPeriod(periods[0])) return true;
    return periods.length >= 7 && periods.every(isAllDayPeriod);
  }

  function describeOpeningHours(place){
    const status = place && place.businessStatus;
    if (status === "CLOSED_PERMANENTLY") return { text: "Permanently closed", kind: "closed" };
    if (status === "CLOSED_TEMPORARILY") return { text: "Temporarily closed", kind: "closed" };
    const hours = (place && (place.currentOpeningHours || place.regularOpeningHours)) || null;
    const periods = hours && hours.periods;
    if (!periods || !periods.length) return null;
    if (isOpen24Hours(periods)) return { text: "Open 24 hours", kind: "open24" };
    const now = placeLocalNow(place);
    const nowAbs = now.day * 1440 + now.minutes;
    const week = 7 * 1440;
    function pointAbs(pt){
      return (Number(pt.day) || 0) * 1440 + (Number(pt.hour) || 0) * 60 + (Number(pt.minute) || 0);
    }
    let current = null;
    let nextOpen = null;
    for (let wrap = 0; wrap <= 1; wrap++) {
      for (let i = 0; i < periods.length; i++) {
        const p = periods[i];
        if (!p || !p.open) continue;
        if (isAllDayPeriod(p)) {
          const open = pointAbs(p.open) + wrap * week;
          const close = open + 1440;
          if (nowAbs >= open && nowAbs < close) current = { open, close, allDay: true };
          continue;
        }
        let open = pointAbs(p.open) + wrap * week;
        let close = p.close ? pointAbs(p.close) + wrap * week : open + 1440;
        if (p.close && close <= open) close += 1440;
        if (nowAbs >= open && nowAbs < close) current = { open, close };
        else if (open > nowAbs && (!nextOpen || open < nextOpen.open)) nextOpen = { open, close };
      }
    }
    if (current) {
      if (current.allDay || isAllDayPeriod({ open: { hour: 0, minute: 0 }, close: { hour: Math.floor((current.close % 1440) / 60), minute: (current.close % 1440) % 60 } })) {
        const closeM = ((current.close % 1440) + 1440) % 1440;
        if (closeM === 0 || closeM >= 23 * 60 + 59) return { text: "Open 24 hours", kind: "open24" };
      }
      const remain = current.close - nowAbs;
      const closeClock = formatClockHm(current.close);
      if (closeClock === "23:59" || closeClock === "00:00" || closeClock === "24:00") {
        return { text: "Open 24 hours", kind: "open24" };
      }
      return { text: `Closes at ${closeClock}`, kind: remain <= 60 ? "soon" : "open" };
    }
    if (nextOpen) {
      let text = `Opens at ${formatClockHm(nextOpen.open)}`;
      const closeClock = nextOpen.close ? formatClockHm(nextOpen.close) : "";
      if (closeClock && closeClock !== "23:59" && closeClock !== "00:00") text += ` · Closes at ${closeClock}`;
      return { text, kind: "closed" };
    }
    return { text: "Closed", kind: "closed" };
  }

  function snapshotPlace(place, fallbackName){
    const loc = latLngOf(place && place.location);
    if (!loc) return null;
    let photoUrl = "";
    let photoAttr = "";
    const photos = place && place.photos;
    if (photos && photos.length) {
      try {
        const photo = photos[0];
        photoUrl = typeof photo.getURI === "function" ? photo.getURI({ maxWidth: 480 }) : (photo.uri || "");
        const attr = photo.authorAttributions && photo.authorAttributions[0];
        photoAttr = (attr && (attr.displayName || attr.name)) || "";
      } catch (err) {}
    }
    const rating = Number(place.rating);
    const reviews = Number(place.userRatingCount);
    return {
      name: placeNameOf(place, fallbackName),
      lat: loc.lat,
      lng: loc.lng,
      placeId: place.id || "",
      address: place.formattedAddress || "",
      rating: Number.isFinite(rating) && rating > 0 ? rating : 0,
      userRatingCount: Number.isFinite(reviews) && reviews > 0 ? reviews : 0,
      photoUrl,
      photoAttr,
      hours: describeOpeningHours(place)
    };
  }

  async function fetchPlaceDestination(place, fallbackName){
    if (!place) return null;
    try {
      await place.fetchFields({ fields: PLACE_CORE_FIELDS });
    } catch (err) {
      console.warn("Place core fields failed", err);
      return null;
    }
    try {
      await place.fetchFields({ fields: PLACE_EXTRA_FIELDS });
    } catch (err) {
      console.warn("Place extra fields failed", err);
    }
    return snapshotPlace(place, fallbackName);
  }

  const ROUTE_FIELDS = ["path", "distanceMeters", "durationMillis", "staticDurationMillis", "legs"];
  // "speedPaths" is the JS library's shorthand that also populates travelAdvisory.speedReadingIntervals.
  const ROUTE_TRAFFIC_FIELDS = ["speedPaths"];
  const ROUTE_NAV_EXTRAS = ["HTML_FORMATTED_NAVIGATION_INSTRUCTIONS"];

  function isPrivateDriveWay(tags){
    const access = String((tags && tags.access) || "").toLowerCase();
    const service = String((tags && tags.service) || "").toLowerCase();
    const hw = String((tags && tags.highway) || "").toLowerCase();
    const motor = String((tags && (tags.motor_vehicle || tags.vehicle)) || "").toLowerCase();
    if (service === "driveway") return true;
    if (hw === "service" && service !== "parking_aisle" && !tags.name) return true;
    if (access === "private" || access === "no" || access === "destination") return true;
    if (motor === "private" || motor === "no") return true;
    return false;
  }

  function distPointToWay(point, pts){
    let best = Infinity;
    if (!point || !pts || pts.length < 2) return best;
    for (let i = 1; i < pts.length; i++) {
      const pr = projectOnSegment(point, pts[i - 1], pts[i]);
      const d = distanceMetres(point, pr.point);
      if (d < best) best = d;
    }
    return best;
  }

  function nearestOsmWay(point, ways, maxM){
    let best = null, bestD = maxM;
    for (let i = 0; i < (ways || []).length; i++) {
      const d = distPointToWay(point, ways[i].pts);
      if (d < bestD) { bestD = d; best = ways[i]; }
    }
    return best;
  }

  async function fetchOsmWaysAlongTail(path){
    if (!path || path.length < 2) return [];
    const cum = cumulativeLengths(path);
    const total = cum[cum.length - 1] || 0;
    const fromM = Math.max(0, total - 500);
    let start = 0;
    while (start < cum.length && cum[start] < fromM) start++;
    start = Math.max(0, start - 1);
    const tail = path.slice(start);
    const pts = downsamplePath(tail, 22).map(p => p.lat.toFixed(5) + "," + p.lng.toFixed(5)).join(",");
    if (!pts) return [];
    const query = '[out:json][timeout:8];way["highway"](around:20,' + pts + ");out tags geom;";
    const json = await overpassJson(query, 8000, OVERPASS_MIRRORS.slice(0, 2));
    const ways = [];
    (json.elements || []).forEach(el => {
      if (!Array.isArray(el.geometry) || el.geometry.length < 2) return;
      ways.push({
        tags: el.tags || {},
        pts: el.geometry.map(g => ({ lat: g.lat, lng: g.lon }))
      });
    });
    return ways;
  }

  async function trimPrivateRoadTail(path){
    if (!path || path.length < 4) return path;
    let ways = [];
    try {
      ways = await fetchOsmWaysAlongTail(path);
    } catch (err) {
      console.warn("Private-road tail check failed", err);
      return path;
    }
    if (!ways.length) return path;
    const cum = cumulativeLengths(path);
    const total = cum[cum.length - 1] || 0;
    const minM = Math.max(0, total - 450);
    let minIndex = 1;
    while (minIndex < path.length - 1 && cum[minIndex] < minM) minIndex++;
    minIndex = Math.max(1, minIndex);
    let i = path.length - 1;
    let sawPrivate = false;
    let cut = path.length;
    while (i >= minIndex) {
      const way = nearestOsmWay(path[i], ways, 18);
      if (way && isPrivateDriveWay(way.tags)) {
        sawPrivate = true;
        cut = i;
        i -= 1;
        continue;
      }
      if (way && !isPrivateDriveWay(way.tags)) break;
      if (sawPrivate) {
        cut = i;
        i -= 1;
        continue;
      }
      break;
    }
    if (!sawPrivate || cut < 2) return path;
    const trimmed = path.slice(0, Math.max(2, cut));
    return trimmed.length >= 2 ? trimmed : path;
  }

  function trimDriveWalkOverlap(drivePath, walkPath){
    if (!drivePath || drivePath.length < 4 || !walkPath || walkPath.length < 2) {
      return { path: drivePath, walk: walkPath, trimmedM: 0 };
    }
    const nearM = 22;
    let firstOverlap = drivePath.length;
    for (let i = drivePath.length - 1; i >= 2; i--) {
      if (distPointToWay(drivePath[i], walkPath) <= nearM) firstOverlap = i;
      else break;
    }
    if (firstOverlap >= drivePath.length - 1) return { path: drivePath, walk: walkPath, trimmedM: 0 };
    const cum = cumulativeLengths(drivePath);
    const trimmedM = (cum[cum.length - 1] || 0) - (cum[firstOverlap] || 0);
    if (trimmedM < 40) return { path: drivePath, walk: walkPath, trimmedM: 0 };
    const path = drivePath.slice(0, firstOverlap + 1);
    const end = path[path.length - 1];
    let bestI = 0, bestD = Infinity;
    for (let i = 0; i < walkPath.length; i++) {
      const d = distanceMetres(end, walkPath[i]);
      if (d < bestD) { bestD = d; bestI = i; }
    }
    return { path: path, walk: snapWalkToDriveEnd(end, walkPath.slice(bestI)), trimmedM: trimmedM };
  }

  function bucklandsEndsOnFencedDriveway(end, dest){
    dest = dest || BUCKLANDS_ACCESS_TEST.dest;
    if (!end || !dest) return true;
    return end.lng < dest.lng - 0.00085 && end.lat > dest.lat - 0.00075;
  }

  // One traffic-aware route. `origin` may carry a `heading` (DirectionalLocation) so a
  // reroute departs the way the car is already pointing. The traffic-on-polyline extra
  // is requested first; if the loaded API build rejects it, retry for a plain route.
  async function requestRoute(origin, destination, wantTraffic = true, opts){
    const placeId = usablePlaceId(destination && destination.placeId);
    const request = {
      origin,
      destination: placeId ? { placeId: placeId } : { lat: destination.lat, lng: destination.lng },
      travelMode: "DRIVING",
      routingPreference: "TRAFFIC_AWARE",
      language: "en-NZ",
      units: google.maps.UnitSystem.METRIC,
      fields: wantTraffic ? ROUTE_FIELDS.concat(ROUTE_TRAFFIC_FIELDS) : ROUTE_FIELDS
    };
    if (wantTraffic) request.extraComputations = ["TRAFFIC_ON_POLYLINE"].concat(ROUTE_NAV_EXTRAS);
    else request.extraComputations = ROUTE_NAV_EXTRAS.slice();
    let result;
    try {
      result = await RouteClass.computeRoutes(request);
    } catch (err) {
      if (wantTraffic) {
        console.warn("Traffic-on-polyline request failed, retrying without traffic", err);
        return requestRoute(origin, destination, false, opts);
      }
      if (placeId && Number.isFinite(destination.lat) && Number.isFinite(destination.lng)) {
        console.warn("Place-id route failed, retrying at coordinates", err);
        return requestRoute(origin, { lat: destination.lat, lng: destination.lng }, false, opts);
      }
      if (request.extraComputations && request.extraComputations.length) {
        console.warn("Nav instruction extra failed, retrying without it", err);
        request.extraComputations = [];
        try {
          result = await RouteClass.computeRoutes(request);
        } catch (err2) {
          if (request.fields.includes("legs")) {
            console.warn("Route legs request failed, retrying without steps", err2);
            request.fields = request.fields.filter(name => name !== "legs");
            result = await RouteClass.computeRoutes(request);
          } else {
            throw err2;
          }
        }
      } else if (request.fields.includes("legs")) {
        console.warn("Route legs request failed, retrying without steps", err);
        request.fields = request.fields.filter(name => name !== "legs");
        result = await RouteClass.computeRoutes(request);
      } else {
        throw err;
      }
    }
    if (!result.routes || !result.routes.length) throw new Error("Google returned no route.");
    const route = result.routes[0];
    const path = Array.from(route.path || []).map(point => ({
      lat: typeof point.lat === "function" ? point.lat() : point.lat,
      lng: typeof point.lng === "function" ? point.lng() : point.lng
    }));
    if (path.length < 2) throw new Error("Route returned without a usable path.");
    let trimmed = path;
    if (!(opts && opts.skipTrim)) {
      try {
        trimmed = await Promise.race([
          trimPrivateRoadTail(path),
          new Promise(resolve => setTimeout(() => resolve(path), 5000))
        ]);
      } catch (err) {
        trimmed = path;
      }
    }
    return { route, path: trimmed, intervals: routeTrafficIntervals(route, trimmed) };
  }

  // Make `route` the active one: geometry, drawing, card, speed limits, trace metadata.
  // `keepNav` = a mid-drive reroute (stay in navigation; the car re-acquires at the next fix).
  function adoptRoute(route, path, intervals, destination, keepNav, walkPath){
    activeRoute = route;
    const driveEnd = path && path.length ? path[path.length - 1] : null;
    const driven = offsetPathLeft(path, ROUTE_LANE_OFFSET_M);
    activeRoutePath = driven;
    activeDestination = destination;
    setRouteGeometry(driven);
    rebuildNavSteps(route, driven, routeCum);
    ensureGoogleNavSteps(driven, routeCum, destination);
    drawRoute(driven, intervals);
    if (explore.mode) {
      if (destinationMarker) { destinationMarker.remove(); destinationMarker = null; }
    } else {
      drawDestination(destination);
    }
    updateRouteInfo(route, destination.name, keepNav);
    fetchSpeedLimits(driven);
    if (!keepNav) {
      const key = destination.lat.toFixed(5) + "," + destination.lng.toFixed(5);
      if (parkingNear.destKey !== key) fetchParkingNear(destination);
    }
    const visualEnd = (driven && driven.length) ? driven[driven.length - 1] : driveEnd;
    const lot = parkingNear.selected;
    const walkFrom = (lot && Number.isFinite(lot.lat) && destination && !destIsSamePlace(destination, lot))
      ? lot
      : visualEnd;
    if (destination && walkFrom && !destIsSamePlace(destination, walkFrom)) {
      drawParkingWalk(walkFrom, destination, walkPath);
    } else {
      parkingNear.walkId += 1;
      clearParkingWalk();
    }
    offRoute.hits = 0;
    if (keepNav) traceRec.dest = { name: destination.name, lat: destination.lat, lng: destination.lng };
    if (!keepNav) maybeStartRouteCountdown();
  }

  async function calculateRoute(origin, destination, destinationName, opts){
    stopDemo();
    if (!RouteClass || !map3d) return;
    setMessage(`Calculating route to ${destinationName}...`);

    try {
      const noCard = !!(opts && opts.noCard);
      if (!noCard) armStartCountdown();
      setSuppressRouteCard(noCard);
      const dest = Object.assign({}, destination, {
        name: destinationName || destination.name,
        lat: destination.lat,
        lng: destination.lng
      });
      activeDestination = dest;
      if (!noCard) {
        document.body.classList.add("has-route");
        document.documentElement.classList.add("has-route");
        document.body.classList.remove("navigating");
        document.documentElement.classList.remove("navigating");
        routeTitleEl.textContent = dest.name || "";
        fillRouteCardExtras(dest);
        if (!routeTimeEl.textContent) routeTimeEl.textContent = "";
        if (!routeStatsEl.textContent) routeStatsEl.textContent = dest.address || "";
        following = false;
        autoRefollowArmed = false;
        const followBtn = document.getElementById("followBtn");
        if (followBtn) followBtn.textContent = "Following: OFF";
        if ((!opts || opts.preview !== false) && !destPreview) startDestPreview(dest);
        if (explore.mode && destPreview) destPreview.noSpin = true;
        updateRecenterButton();
      }
      const gen = ++routeGen;
      const parkingP = fetchParkingNear(destination);
      const fast = !!(opts && opts.refineWalk === false);
      if (!fast) {
        try {
          await Promise.race([
            parkingP,
            new Promise(resolve => setTimeout(resolve, 900))
          ]);
        } catch (err) {}
      }
      const driveTo = await pickDriveDestination(destination, { skipOsm: fast });
      if (gen !== routeGen) {
        if (!noCard && (!opts || opts.preview !== false)) maybeStartRouteCountdown();
        return;
      }
      activeDriveTo = driveTo;
      let { route, path, intervals } = await requestRoute({ lat: origin.lat, lng: origin.lng }, driveTo, true, { skipTrim: fast });
      if (gen !== routeGen) {
        if (!noCard && (!opts || opts.preview !== false)) maybeStartRouteCountdown();
        return;
      }
      adoptRoute(route, path, intervals, dest, false, null);
      const lot = parkingNear.selected;
      if (lot && Number.isFinite(lot.lat) && !destIsSamePlace(dest, lot) && distanceMetres(driveTo, lot) > 28) {
        rerouteDriveToParking(lot, dest);
      }
      if (!noCard && (!opts || opts.preview !== false)) showRoutePreview(origin, dest, route.distanceMeters, { keepPreview: true });
      else if (!noCard) maybeStartRouteCountdown();
      if (!noCard) setMessage("Route ready. Tap Start, or wait for the countdown.");

      const applyRefine = async () => {
        try { await parkingP; } catch (err) {}
        if (gen !== routeGen) return;
        const refined = await refineDriveByWalk({ lat: origin.lat, lng: origin.lng }, destination, path);
        if (gen !== routeGen) return;
        let useRoute = route;
        let usePath = path;
        let useIntervals = intervals;
        let useWalk = null;
        if (refined && refined.drive && refined.drive.path) {
          useRoute = refined.drive.route;
          usePath = refined.drive.path;
          useIntervals = refined.drive.intervals;
          if (refined.access) activeDriveTo = refined.access;
          useWalk = refined.walk || null;
        } else if (refined && refined.walk) {
          useWalk = refined.walk;
        }
        if (!useWalk || useWalk.length < 2) {
          try {
            const w = await walkAccessFrom(usePath[usePath.length - 1], destination);
            useWalk = w && w.path;
          } catch (err) {}
        }
        const overlap = trimDriveWalkOverlap(usePath, useWalk);
        usePath = overlap.path || usePath;
        useWalk = overlap.walk || useWalk;
        if ((refined && refined.drive && refined.drive.path) || overlap.trimmedM > 0) {
          if (overlap.trimmedM > 0) useIntervals = routeTrafficIntervals(useRoute, usePath);
          if (gen !== routeGen) return;
          adoptRoute(useRoute, usePath, useIntervals, dest, isNavigating(), useWalk);
        } else if (useWalk) {
          const lot = parkingNear.selected;
          const end = (lot && Number.isFinite(lot.lat)) ? lot : usePath[usePath.length - 1];
          drawParkingWalk(end, dest, useWalk);
        }
      };
      if (opts && opts.refineWalk === false) {
        parkingP.catch(() => {});
        return;
      }
      if (opts && opts.waitRefine) await applyRefine();
      else applyRefine().catch(err => console.warn("Walk access refine failed", err));
    } catch (err) {
      console.error(err);
      setMessage("Route request failed. Check that Routes API is enabled for this key. " + (err?.message || String(err)));
    }
  }

  // ---- Route line: traffic-coloured ahead, grey behind the car ----

  const ROUTE_COLOURS = {
    NORMAL: "#4285F4",       // free flow
    SLOW: "#E8923D",         // slowdown
    TRAFFIC_JAM: "#D93838",  // jam
    DONE: "#9AA0A6"          // traversed
  };
  let routeLines = [];        // one Polyline3DElement per traffic interval (the whole route)
  let routeDoneLine = null;   // grey overlay from the route start to the car
  let routeDoneUpdatedM = -Infinity;
  const ROUTE_DONE_STEP_M = 4;

  // Routes API speedReadingIntervals -> [{start, end, speed}] over `path` indices; a route
  // without traffic data (or a plain retry) is one NORMAL interval.
  function routeTrafficIntervals(route, path){
    const raw = route && route.travelAdvisory && route.travelAdvisory.speedReadingIntervals;
    const out = [];
    if (Array.isArray(raw)) {
      for (const iv of raw) {
        const s = Number(iv.startPolylinePointIndex), e = Number(iv.endPolylinePointIndex);
        if (!Number.isFinite(s) || !Number.isFinite(e) || e <= s) continue;
        out.push({ start: clamp(Math.round(s), 0, path.length - 1), end: clamp(Math.round(e), 0, path.length - 1), speed: String(iv.speed || "NORMAL") });
      }
    }
    if (!out.length) out.push({ start: 0, end: path.length - 1, speed: "NORMAL" });
    return out;
  }

  function makeRouteLine(path, color, zIndex){
    return new Polyline3DElement({
      path,
      strokeColor: color,
      outerColor: "#FFFFFF",
      strokeWidth: 9,
      outerWidth: 0.35,
      altitudeMode: MODEL_ALTITUDE_MODE,
      drawsOccludedSegments: true,
      zIndex
    });
  }

  function drawRoute(path, intervals){
    removeRouteLines();
    for (const iv of intervals || [{ start: 0, end: path.length - 1, speed: "NORMAL" }]) {
      const seg = path.slice(iv.start, iv.end + 1);
      if (seg.length < 2) continue;
      const line = makeRouteLine(seg, ROUTE_COLOURS[iv.speed] || ROUTE_COLOURS.NORMAL, 20);
      map3d.append(line);
      routeLines.push(line);
    }
    routeDoneUpdatedM = -Infinity;
  }

  // Guaranteed orange / red stretches on the drive-route demo so traffic colours are
  // visible even when live Auckland traffic is all free-flow (blue).
  function demoTrafficIntervals(path){
    const last = path.length - 1;
    if (last < 6) return [{ start: 0, end: last, speed: "NORMAL" }];
    const cum = (routeCum.length === path.length) ? routeCum : cumulativeLengths(path);
    const total = cum[cum.length - 1] || 1;
    const at = frac => {
      const m = total * frac;
      let i = 0;
      while (i < cum.length - 1 && cum[i] < m) i++;
      return clamp(i, 0, last);
    };
    const cuts = [
      { i: 0, speed: "NORMAL" },
      { i: at(0.18), speed: "SLOW" },
      { i: at(0.32), speed: "NORMAL" },
      { i: at(0.46), speed: "TRAFFIC_JAM" },
      { i: at(0.58), speed: "NORMAL" },
      { i: last, speed: null }
    ];
    const out = [];
    for (let k = 0; k < cuts.length - 1; k++) {
      const start = cuts[k].i;
      const end = cuts[k + 1].i;
      if (end > start) out.push({ start, end, speed: cuts[k].speed });
    }
    return out.length ? out : [{ start: 0, end: last, speed: "NORMAL" }];
  }

  function paintDemoTraffic(path){
    if (!path || path.length < 2) return;
    drawRoute(path, demoTrafficIntervals(path));
  }

  function removeRouteLines(){
    for (const line of routeLines) { try { line.remove(); } catch (err) {} }
    routeLines = [];
    if (routeDoneLine) { try { routeDoneLine.remove(); } catch (err) {} routeDoneLine = null; }
    routeDoneUpdatedM = -Infinity;
  }

  // The traversed part greys out behind the car: a grey line from the route start to the
  // car's along-route position, drawn OVER the coloured segments (so they never need
  // re-splitting). Refreshed every few metres of progress, not every frame.
  function updateTraversedRoute(){
    if (!isNavigating() || !puck.engaged || activeRoutePath.length < 2 || routeCum.length !== activeRoutePath.length) return;
    const m = puck.progressM;
    if (Math.abs(m - routeDoneUpdatedM) < ROUTE_DONE_STEP_M) return;
    routeDoneUpdatedM = m;
    let i = 1;
    while (i < routeCum.length && routeCum[i] <= m) i++;
    const donePath = activeRoutePath.slice(0, i);
    donePath.push(pointAtMetres(activeRoutePath, routeCum, m).point);
    if (donePath.length < 2) return;
    if (!routeDoneLine) {
      routeDoneLine = makeRouteLine(donePath, ROUTE_COLOURS.DONE, 21);
      map3d.append(routeDoneLine);
    } else {
      routeDoneLine.path = donePath;
    }
  }

  function drawDestination(destination){
    if (destinationMarker) destinationMarker.remove();
    destinationMarker = new Marker3DElement({
      position: { lat: destination.lat, lng: destination.lng, altitude: 8 },
      altitudeMode: "RELATIVE_TO_GROUND",
      label: destination.name,
      sizePreserved: true,
      drawsWhenOccluded: true
    });
    map3d.append(destinationMarker);
  }

  function raiseDestinationMarker(){
    if (!map3d || !destinationMarker) return;
    try { map3d.append(destinationMarker); } catch (err) {}
  }

  function svgIconUrl(body){
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 64 64">' +
      '<circle cx="32" cy="32" r="29" fill="#1A73E8"/>' +
      '<circle cx="32" cy="32" r="29" fill="none" stroke="#fff" stroke-width="3.2"/>' +
      body + "</svg>"
    );
  }

  const MANEUVER_ICONS = {
    dest: svgIconUrl('<path fill="#fff" d="M32 12c8.3 0 15 6.6 15 14.8C47 36.8 32 52 32 52S17 36.8 17 26.8C17 18.6 23.7 12 32 12zm0 20.2a6 6 0 1 0 0-12 6 6 0 0 0 0 12z"/>'),
    straight: svgIconUrl('<path fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" d="M32 50V22"/><path fill="#fff" d="M21 24.5L32 8l11 16.5z"/>'),
    right: svgIconUrl('<path fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" d="M24 50V24h18"/><path fill="#fff" d="M34 15l18 11-18 11z"/>'),
    left: svgIconUrl('<path fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" d="M40 50V24H22"/><path fill="#fff" d="M30 15L12 26l18 11z"/>'),
    "slight-right": svgIconUrl('<path fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" d="M26 50V30L42 16"/><path fill="#fff" d="M34 8l18 8-10 16z"/>'),
    "slight-left": svgIconUrl('<path fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" d="M38 50V30L22 16"/><path fill="#fff" d="M30 8L12 16l10 16z"/>'),
    "uturn-left": svgIconUrl('<path fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" d="M42 54V30a11 11 0 0 0-22 0v8"/><path fill="#fff" d="M9 36 20 54 31 36z"/>'),
    "uturn-right": svgIconUrl('<path fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" d="M22 54V30a11 11 0 0 1 22 0v8"/><path fill="#fff" d="M33 36 44 54 55 36z"/>'),
    uturn: svgIconUrl('<path fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" d="M42 54V30a11 11 0 0 0-22 0v8"/><path fill="#fff" d="M9 36 20 54 31 36z"/>'),
    roundabout: svgIconUrl('<path fill="#fff" d="M32 12l10 12h-7v4.2A12 12 0 1 1 20 34.5l5.6-3.2A6.5 6.5 0 1 0 32 30.2V24h-7z"/>')
  };

  function maneuverTypeFromTurn(turn){
    const abs = Math.abs(turn);
    if (abs > 135) return turn > 0 ? "uturn-right" : "uturn-left";
    if (abs > 70) return turn > 0 ? "right" : "left";
    if (abs > 20) return turn > 0 ? "slight-right" : "slight-left";
    return "straight";
  }

  function makeManeuverMarker(item){
    const marker = new Marker3DElement({
      position: { lat: item.point.lat, lng: item.point.lng },
      sizePreserved: true,
      drawsWhenOccluded: true
    });
    const img = document.createElement("img");
    img.src = MANEUVER_ICONS[item.type] || MANEUVER_ICONS.straight;
    img.width = 34;
    img.height = 34;
    img.style.width = "34px";
    img.style.height = "34px";
    img.alt = item.type;
    const template = document.createElement("template");
    template.content.append(img);
    marker.append(template);
    return marker;
  }

  let builtManeuvers = [];
  let builtManeuversPath = null;
  function routeManeuvers(){
    if (builtManeuversPath !== activeRoutePath) {
      builtManeuversPath = activeRoutePath;
      builtManeuvers = buildManeuvers(activeRoutePath, routeCum);
    }
    return builtManeuvers;
  }

  function buildManeuvers(path, cum){
    const raw = [];
    if (!path || path.length < 3 || !cum || cum.length !== path.length) return raw;
    for (let i = 1; i < path.length - 1; i++) {
      const turn = ((bearingDegrees(path[i], path[i + 1]) - bearingDegrees(path[i - 1], path[i]) + 540) % 360) - 180;
      if (Math.abs(turn) < 20) continue;
      raw.push({ i, m: cum[i], turn, point: path[i] });
    }
    const items = [];
    let cluster = [];
    const flush = () => {
      if (!cluster.length) return;
      const first = cluster[0], last = cluster[cluster.length - 1];
      const span = last.m - first.m;
      const sumTurn = cluster.reduce((s, c) => s + c.turn, 0);
      const mid = cluster[Math.floor(cluster.length / 2)];
      if (cluster.length >= 3 || (cluster.length >= 2 && span < 70 && Math.abs(sumTurn) > 90)) {
        items.push({ point: mid.point, m: mid.m, type: "roundabout" });
      } else {
        for (const c of cluster) {
          items.push({ point: c.point, m: c.m, type: maneuverTypeFromTurn(c.turn) });
        }
      }
      cluster = [];
    };
    for (const t of raw) {
      if (cluster.length && t.m - cluster[cluster.length - 1].m > 55) flush();
      cluster.push(t);
    }
    flush();

  function maneuverTypeFromNav(maneuver){
    const fam = maneuverFamily(maneuver);
    const m = String(maneuver || "").toUpperCase();

    if (fam === "uturn") return String(maneuver || "").toUpperCase().includes("RIGHT") ? "uturn-right" : "uturn-left";
    if (fam === "roundabout") return "roundabout";
    if (fam === "left") return m.includes("SLIGHT") ? "slight-left" : "left";
    if (fam === "right") return m.includes("SLIGHT") ? "slight-right" : "right";

  function skipFocusStep(){

    const targetM = span.targets[idx];
    const all = upcomingNavSteps(0, { hold: false });
    let best = null;
    all.forEach(step => {
      if (!best || Math.abs(step.m - targetM) < Math.abs(best.m - targetM)) best = step;

  function formatDuration(ms){
    const mins = Math.max(1, Math.round(ms / 60000));

  function formatDistance(meters){
    const km = meters / 1000;
    if (meters < 1000) return `${Math.max(1, Math.round(meters / 10) * 10)} m`;

  function formatTurnDistance(meters){

  function turnArrivalSeconds(distM, speedMps){

  function readLatLng(value){
    if (!value) return null;
    const loc = value.latLng || value.location || value;

    const lng = typeof loc.lng === "function" ? loc.lng() : (loc.lng ?? loc.longitude);
    if (!Number.isFinite(Number(lat)) || !Number.isFinite(Number(lng))) return null;

  function nearestAlongRoute(point, path, cum){
    if (!point || !path || path.length < 2 || !cum || cum.length !== path.length) return 0;

    for (let i = 1; i < path.length; i++) {
      const proj = projectOnSegment(point, path[i - 1], path[i]);
      const d = distanceMetres(point, proj.point);
      if (d < bestD) {
        bestD = d;
        best = cum[i - 1] + proj.t * (cum[i] - cum[i - 1]);
      }
    }
    return best;
  }

  function maneuverFamily(maneuver){

  function typeToManeuver(type){

  function laneDirKey(dir){
    const d = String(dir || "through").toLowerCase().replace(/-/g, "_");

    if (d.includes("slight") && d.includes("left")) return "slight_left";
    if (d.includes("slight") && d.includes("right")) return "slight_right";
    if (d.includes("merge") && d.includes("left")) return "slight_left";
    if (d.includes("merge") && d.includes("right")) return "slight_right";
    if (d.includes("left") || d.includes("west")) return "left";
    if (d.includes("right") || d.includes("east")) return "right";

  function laneArrowHead(x, y, ux, uy, scale, dim){
    const s = scale || 1;
    const len = 7.2 * s, w = 4.6 * s;

  function laneColumnSvg(dirs){

    keys.sort((a, b) => order.indexOf(a) - order.indexOf(b));
    const set = new Set(keys.slice(0, 2));
    const sw = 'fill="none" stroke="currentColor" stroke-width="' + ((set.size && !set.has("through") && (set.has("left") || set.has("right"))) ? "4.2" : "3.3") + '" stroke-linecap="round" stroke-linejoin="round"';
    const through = set.has("through");
    const left = set.has("left") || set.has("slight_left");
    const right = set.has("right") || set.has("slight_right");
    const slightL = set.has("slight_left");
    const slightR = set.has("slight_right");

    const slightFork = 34;

    if (left) splits.push((slightL && !set.has("left")) ? slightFork : hardFork);
    if (right) splits.push((slightR && !set.has("right")) ? slightFork : hardFork);

  // Net bend of the drawn route nearest this step. A fixed look-back of
  // 90 m spans the previous junction on a short block and can report the
  // opposite direction from the corner the driver is looking at.
  function pathTurnNear(metres){
    const path = activeRoutePath, cum = routeCum;
    if (!path || path.length < 3 || !cum || cum.length !== path.length) return null;
    const total = cum[cum.length - 1];
    const m = Number(metres);
    if (!Number.isFinite(m)) return null;
    const lo = clamp(m - 40, 0, total);
    const hi = clamp(m + 80, 0, total);
    const verts = [];
    for (let i = 1; i < path.length - 1; i++) {
      if (cum[i] < lo || cum[i] > hi) continue;
      const turn = ((bearingDegrees(path[i], path[i + 1]) - bearingDegrees(path[i - 1], path[i]) + 540) % 360) - 180;
      if (Math.abs(turn) < 7) continue;
      verts.push({ m: cum[i], turn });

    if (!verts.length) return null;
    const clusters = [];
    let cur = [verts[0]];
    for (let i = 1; i < verts.length; i++) {
      if (verts[i].m - cur[cur.length - 1].m > 36) {
        clusters.push(cur);
        cur = [];

      cur.push(verts[i]);

    if (turn > 22) return "TURN_SLIGHT_RIGHT";
    if (turn < -48) return "TURN_LEFT";
    if (turn < -22) return "TURN_SLIGHT_LEFT";
    return "";

      if (m.includes("LEFT")) return "left";
      return "uturn";

    if (fam === "right") return "right";

  function roundaboutExitNumber(text){

    if (/\bfourth\s+exit\b/.test(t)) return 4;
    return 0;

  function maneuverFromWords(maneuver, instructions){
    const m = String(maneuver || "").toUpperCase();

      if (m.includes("RIGHT") && !m.includes("LEFT")) return "UTURN_RIGHT";
      if (m.includes("LEFT") && !m.includes("RIGHT")) return "UTURN_LEFT";
      return "UTURN";

    if (m.includes("RIGHT") && !m.includes("LEFT")) return m.includes("SLIGHT") ? "TURN_SLIGHT_RIGHT" : "TURN_RIGHT";
    if (m.includes("LEFT") && !m.includes("RIGHT")) return m.includes("SLIGHT") ? "TURN_SLIGHT_LEFT" : "TURN_LEFT";
    const text = stripNavHtml(instructions);
    const t = text.toLowerCase();
    if (/\b(u-?turn|make a u)\b/.test(t)) {
      if (/\bright\b/.test(t) && !/\bleft\b/.test(t)) return "UTURN_RIGHT";
      if (/\bleft\b/.test(t) && !/\bright\b/.test(t)) return "UTURN_LEFT";
      return "UTURN";

    if (/\b(slight(?:ly)?|sharp)?\s*(?:turn|keep|bear|fork|ramp|merge|exit)\s+(?:to the\s+)?left\b/.test(t) || /\bleft\s+(?:turn|lane|fork|ramp)\b/.test(t)) {

  function isBannerStreetPart(s){
    const name = String(s || "").trim();

    if (/^(first|second|third|fourth|exit|ramp|pin)$/i.test(name)) return false;
    if (/^(overbridge|bridge|motorway|highway)$/i.test(name)) return false;
    return /[a-z]/i.test(name);

  function cleanBannerStreet(name){
    let s = stripNavHtml(name)
      .replace(/\s+heading\s+to\b.*$/i, "")
      .replace(/\s+toward[s]?\b.*$/i, "")
      .replace(/^[^a-z0-9]+/i, "")
      .replace(/[.,;:]+$/g, "")
      .trim();
    if (s.includes(" / ")) {
      const parts = s.split(/\s\/\s/).map(p => p.trim()).filter(isBannerStreetPart);
      if (parts.length) s = parts[0];
    }
    const comma = s.split(",")[0].trim();
    if (comma) s = comma;
    return s;

  function streetNameFromInstruction(text){

      const part = stripNavHtml(inner);
      if (isBannerStreetPart(part)) bolds.push(part);

    let name = bolds[0] || "";
    if (!name) {
      const onto = raw.match(/\b(?:onto|on to)\s+(.+)$/i);
      if (onto) name = onto[1];

    if (!name) {

    const street = streetNameFromInstruction(text);

    if (fam === "dest") return activeDestination?.name || "Destination";
    if (fam === "left") return "Turn left";
    if (fam === "right") return "Turn right";
    if (fam === "roundabout") return "Roundabout";
    return "Continue";

  function parseTurnLanes(tag){

  function laneMatches(dir, family, maneuver){
    const d = String(dir || "").toLowerCase();
    const m = String(maneuver || "").toUpperCase();
    if (family === "left") return d.includes("left") && !d.includes("right");
    if (family === "right") return d.includes("right") && !d.includes("left");

    if (family === "roundabout") return true;
    if (m.includes("SLIGHT_LEFT")) return d === "slight_left" || d === "through" || d === "left";
    if (m.includes("SLIGHT_RIGHT")) return d === "slight_right" || d === "through" || d === "right";
    return d === "through" || d === "none" || d === "";
  }

  function markRecommendedLanes(lanes, maneuver){
    const family = maneuverFamily(maneuver);
    let any = false;
    for (const lane of lanes) {
      lane.rec = lane.dirs.some(dir => laneMatches(dir, family, maneuver));
      if (lane.rec) any = true;
    }
    if (!any && lanes.length) {
      if (family === "left") lanes[0].rec = true;
      else if (family === "right") lanes[lanes.length - 1].rec = true;
      else {
        const mid = Math.floor((lanes.length - 1) / 2);
        lanes[mid].rec = true;
        if (lanes[mid + 1]) lanes[mid + 1].rec = true;
      }
    }
    return lanes;
  }

  function googleShapeToDir(shape){
    const s = String(shape || "").toUpperCase().replace(/-/g, "_");
    if (s.includes("U_TURN") || s.includes("UTURN") || s.includes("REVERSE")) return "reverse";
    if (s.includes("SLIGHT_LEFT") || s.includes("SLIGHTLY_LEFT")) return "slight_left";
    if (s.includes("SLIGHT_RIGHT") || s.includes("SLIGHTLY_RIGHT")) return "slight_right";
    if (s.includes("LEFT")) return "left";
    if (s.includes("RIGHT")) return "right";
    return "through";
  }

  function parseGoogleLanes(step){
    if (!step) return null;
    const ni = step.navigationInstruction || {};
    const raw = step.lanes || step.laneGuidance || ni.lanes || step.travelAdvisory?.lanes;
    if (!raw || !raw.length) return null;
    const lanes = [];
    for (const lane of raw) {
      if (!lane) continue;
      if (typeof lane === "string") {
        const dirs = lane.split(";").map(googleShapeToDir);
        if (dirs.length) lanes.push({ dirs, rec: false });
        continue;
      }
      const shapes = lane.laneDirections || lane.directions || lane.laneShapes || null;
      const dirs = [];
      let rec = !!(lane.isRecommended || lane.recommended);
      if (Array.isArray(shapes) && shapes.length) {
        for (const item of shapes) {
          if (item == null) continue;
          if (typeof item === "string") dirs.push(googleShapeToDir(item));
          else {
            dirs.push(googleShapeToDir(item.laneShape || item.shape || item.direction || item.maneuver));
            if (item.isRecommended || item.recommended) rec = true;
          }
        }
      } else if (lane.laneShape || lane.shape) {
        dirs.push(googleShapeToDir(lane.laneShape || lane.shape));
      }
      if (dirs.length) lanes.push({ dirs, rec });
    }
    return lanes.length >= 2 ? lanes : null;
  }

  function stripNavHtml(text){
    return String(text || "").replace(/<[^>]+>/g, " ").replace(/&nbsp;/g, " ").replace(/\s+/g, " ").trim();
  }

  function stepManeuver(step){
    const ni = step && step.navigationInstruction;
    return String((step && (step.maneuver || step.maneuverType)) || (ni && ni.maneuver) || "STRAIGHT").toUpperCase();
  }

  function stepInstructions(step){
    const ni = step && step.navigationInstruction;
    const loc = step && step.localizedValues;
    return String(
      (step && (step.html_instructions || step.htmlInstructions || step.instructions || step.instruction)) ||
      (ni && ni.instructions) ||
      (loc && loc.instructions) ||
      ""
    );
  }

  function stepStartPoint(step){
    if (!step) return null;
    return readLatLng(step.startLocation) ||
      readLatLng(step.start_location) ||
      (step.path && step.path[0] ? readLatLng(step.path[0]) : null) ||
      (step.lat_lngs && step.lat_lngs[0] ? readLatLng(step.lat_lngs[0]) : null);
  }

  function googleStepsFromLegs(legs, path, cum){
    const out = [];
    for (const leg of legs || []) {
      for (const step of leg.steps || []) {
        const start = stepStartPoint(step);
        if (start && path && path.length >= 2 && distanceToRoute(start, path).d > 32) continue;
        const m = start ? nearestAlongRoute(start, path, cum) : (out.length ? out[out.length - 1].m : 0);
        out.push({
          m,
          maneuver: stepManeuver(step),
          instructions: stepInstructions(step),
          lanes: parseGoogleLanes(step),
          source: "google"
        });
      }
    }
    out.sort((a, b) => a.m - b.m);
    return out;
  }

  function stepsFromGoogleRoute(route, path, cum){
    try {
      return googleStepsFromLegs(route && route.legs, path, cum);
    } catch (err) {
      return [];
    }
  }

  async function stepsFromDirections(origin, destination, path, cum){
    if (!origin || !destination || !google || !google.maps) return [];
    try {
      if (!google.maps.DirectionsService) await google.maps.importLibrary("maps");
      if (!google.maps.DirectionsService) return [];
      const svc = new google.maps.DirectionsService();
      const result = await svc.route({
        origin: { lat: origin.lat, lng: origin.lng },
        destination: { lat: destination.lat, lng: destination.lng },
        travelMode: google.maps.TravelMode.DRIVING,
        unitSystem: google.maps.UnitSystem.METRIC,
        region: "NZ",
        drivingOptions: { departureTime: new Date() }
      });
      const legs = result && result.routes && result.routes[0] && result.routes[0].legs;
      return googleStepsFromLegs(legs, path, cum);
    } catch (err) {
      console.warn("Directions turn steps unavailable", err);
      return [];
    }
  }

  function googleGuidanceOk(steps){
    return (steps || []).some(step => {
      if (step.instructions) return true;
      const m = String(step.maneuver || "");
      return m && m !== "STRAIGHT" && m !== "MANEUVER_UNSPECIFIED" && m !== "DEPART" && m !== "NAME_CHANGE";
    });
  }

  function appendDestinationStep(steps, destM, destName){
    if (!steps.length || Math.abs((steps[steps.length - 1].m || 0) - destM) > 40) {
      steps.push({ m: destM, maneuver: "DESTINATION", instructions: destName, source: steps.length ? steps[0].source : "google" });
    }
    return steps;
  }

  let navStepsFromGoogle = false;

  function rebuildNavSteps(route, path, cum){
    navHudKey = "";
    navPassHold = { m: null, until: 0 };
    const destM = cum && cum.length ? cum[cum.length - 1] : 0;
    const destName = (activeDestination && activeDestination.name) || "Destination";
    const google = stepsFromGoogleRoute(route, path, cum);
    if (googleGuidanceOk(google)) {
      navStepsFromGoogle = true;
      navSteps = appendDestinationStep(google, destM, destName);
      turnCue.played.clear();
      rebuildOsmSideStreets();
      return;
    }
    navStepsFromGoogle = false;
    navSteps = appendDestinationStep(routeManeuvers().map(item => ({
      m: item.m,
      maneuver: typeToManeuver(item.type),
      instructions: "",
      source: "geometry"
    })), destM, destName);
    turnCue.played.clear();
    rebuildOsmSideStreets();
  }

  async function ensureGoogleNavSteps(path, cum, destination){
    if (navStepsFromGoogle || !path || path.length < 2) return;
    const dest = destination || path[path.length - 1];
    const google = await stepsFromDirections(path[0], dest, path, cum);
    if (!googleGuidanceOk(google)) return;
    if (activeRoutePath !== path) return;
    const destM = cum && cum.length ? cum[cum.length - 1] : 0;
    const destName = (destination && destination.name) || "Destination";
    navStepsFromGoogle = true;
    navSteps = appendDestinationStep(google, destM, destName);
    turnCue.played.clear();
    rebuildOsmSideStreets();
    updateNavHud();
    if (infoLevel > 0) showManeuverMarkers();
  }

  function trustedLaneGuidance(googleLanes, osm, maneuver){
    if (googleLanes && googleLanes.length >= 2 && googleLanes.length <= 6) return googleLanes;
    const parsed = osm && osm.turnLanes ? parseTurnLanes(osm.turnLanes) : null;
    if (!parsed || parsed.length < 2) return null;
    let lanes = parsed;
    const forward = osm.lanesForward || 0;
    if (osm.turnLaneSource !== "forward" && forward >= 1 && lanes.length > forward) {
      lanes = lanes.slice(0, forward);
    }
    if (lanes.length < 2 || lanes.length > 6) return null;
    return markRecommendedLanes(lanes, maneuver);
  }

  function matchTurnLanes(point, heading){
    if (!point || !speedLimit.ways.length) return null;
    let best = null, bestD = 28;
    const latTol = 0.0012, lngTol = 0.0016;
    for (const way of speedLimit.ways) {
      if (!way.turnLanes) continue;
      const pts = way.pts;
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i];
        if (Math.abs(a.lat - point.lat) > latTol && Math.abs(b.lat - point.lat) > latTol) continue;
        if (Math.abs(a.lng - point.lng) > lngTol && Math.abs(b.lng - point.lng) > lngTol) continue;
        const d = distanceMetres(point, projectOnSegment(point, a, b).point);
        if (d >= bestD) continue;
        if (Number.isFinite(heading)) {
          const diff = angleDelta(bearingDegrees(a, b), heading);
          if (Math.min(diff, 180 - diff) > 50) continue;
        }
        bestD = d;
        best = way;
      }
    }
    return best;
  }

  function upcomingNavSteps(progressM, opts){
    const pos = Number.isFinite(progressM) ? progressM : 0;
    if (!navSteps.length) return [];
    const hold = !opts || opts.hold !== false;
    if (!hold) {
      const ahead = navSteps.filter(step => step.m > pos + 12);
      return ahead.length ? ahead : navSteps.slice(-1);
    }
    const now = performance.now();
    let idx = 0;
    while (idx < navSteps.length - 1 && navSteps[idx].m < pos) idx++;
    if (idx > 0 && navSteps[idx].m > pos) {
      const prev = navSteps[idx - 1];
      if (maneuverFamily(prev.maneuver) !== "dest") {
        if (navPassHold.m !== prev.m) navPassHold = { m: prev.m, until: now + NAV_TURN_HOLD_MS, idx: idx - 1 };
        if (now < navPassHold.until) idx = navPassHold.idx;
      }
    }
    return navSteps.slice(idx);
  }

  function hideNavHud(){
    const lanes = document.getElementById("navLanes");
    const banner = document.getElementById("navBanner");
    const thenEl = document.getElementById("navThen");
    const eta = document.getElementById("navEtaBar");
    const clock = document.getElementById("navClock");
    const wrap = document.getElementById("navIconWrap");
    if (lanes) { lanes.hidden = true; lanes.classList.remove("visible"); lanes.innerHTML = ""; lanes.dataset.sig = ""; }
    if (banner) { banner.hidden = true; banner.classList.remove("visible"); }
    if (thenEl) { thenEl.hidden = true; thenEl.classList.remove("visible"); }
    if (eta) { eta.hidden = true; eta.classList.remove("visible"); }
    const sepEl = document.getElementById("navEtaSep");
    if (sepEl) { sepEl.hidden = true; sepEl.classList.remove("visible"); }
    if (clock) { clock.hidden = true; clock.classList.remove("visible"); }
    if (wrap) wrap.classList.remove("clock");
    document.body.classList.remove("has-lanes", "nav-flyover", "nav-arrived");
    document.documentElement.classList.remove("has-lanes", "nav-flyover", "nav-arrived");
    navHudKey = "";
    navPassHold = { m: null, until: 0 };
  }

  function renderLaneBar(lanes){
    const host = document.getElementById("navLanes");
    if (!host) return;
    if (!lanes || lanes.length < 2) {
      host.hidden = true;
      host.classList.remove("visible");
      host.innerHTML = "";
      document.body.classList.remove("has-lanes");
      document.documentElement.classList.remove("has-lanes");
      return;
    }
    const sig = lanes.map(l => l.dirs.join(";") + (l.rec ? "*" : "")).join("|");
    if (host.dataset.sig === sig && host.classList.contains("visible")) return;
    host.dataset.sig = sig;
    host.innerHTML = lanes.map(lane => `<div class="nav-lane${lane.rec ? " rec" : ""}">${laneColumnSvg(lane.dirs)}</div>`).join("");
    host.hidden = false;
    host.classList.add("visible");
    document.body.classList.add("has-lanes");
    document.documentElement.classList.add("has-lanes");
  }

  function updateNavHud(){
    if (!isNavigating() || !activeRoutePath.length) {
      hideNavHud();
      return;
    }
    const total = routeCum.length ? routeCum[routeCum.length - 1] : 0;
    const progressM = clamp(Number.isFinite(puck.progressM) ? puck.progressM : 0, 0, total);
    const remainM = Math.max(0, total - progressM);
    const durationMs = Number(activeRoute?.durationMillis) || 0;
    const remainMs = total > 0 && durationMs > 0 ? remainM / total * durationMs : remainM / Math.max(speedKalman.speed, 8) * 1000;
    const eta = new Date(Date.now() + remainMs);
    const remainEl = document.getElementById("navEtaRemain");
    const etaDistEl = document.getElementById("navEtaDist");
    const clockEl = document.getElementById("navEtaClock");
    const etaBar = document.getElementById("navEtaBar");
    if (etaBar) {
      etaBar.hidden = false;
      etaBar.classList.add("visible");
    }
    const arrived = !flyover && remainM <= 40;
    document.body.classList.toggle("nav-arrived", arrived);
    document.documentElement.classList.toggle("nav-arrived", arrived);
    if (remainEl) remainEl.textContent = arrived ? "Arrived" : formatDuration(remainMs);
    if (etaDistEl) etaDistEl.textContent = formatDistance(remainM);
    if (clockEl) clockEl.textContent = formatTime(eta);
    const sepEl = document.getElementById("navEtaSep");
    if (sepEl) {
      const showSep = !!(etaDistEl && etaDistEl.textContent) && !!(clockEl && clockEl.textContent);
      sepEl.hidden = !showSep;
      sepEl.classList.toggle("visible", showSep);
    }
    document.body.classList.toggle("nav-flyover", !!flyover);
    document.documentElement.classList.toggle("nav-flyover", !!flyover);
    if (flyover) {
      const banner = document.getElementById("navBanner");
      const thenEl = document.getElementById("navThen");
      if (banner) { banner.hidden = true; banner.classList.remove("visible"); }
      if (thenEl) { thenEl.hidden = true; thenEl.classList.remove("visible"); }
      renderLaneBar(null);
      return;
    }

    const ahead = upcomingNavSteps(progressM, { hold: !infoSkipMode });
    let current = ahead[0];
    let next = ahead[1];
    if (infoSkipMode && infoLevel > 0) {
      const span = navSkipCoverTargets();
      const idx = Math.min(infoLevel - 1, Math.max(0, span.targets.length - 1));
      const targetM = span.targets[idx];
      const all = upcomingNavSteps(0, { hold: false });
      let best = all[0];
      all.forEach(step => {
        if (!best || Math.abs(step.m - targetM) < Math.abs(best.m - targetM)) best = step;
      });
      current = best || current;
      const curIdx = all.indexOf(current);
      next = curIdx >= 0 ? all[curIdx + 1] : next;
    }
    const banner = document.getElementById("navBanner");
    const icon = document.getElementById("navIcon");
    const text = document.getElementById("navPrimaryText");
    const distEl = document.getElementById("navPrimaryDist");
    const thenEl = document.getElementById("navThen");
    const thenIcon = document.getElementById("navThenIcon");
    const clock = document.getElementById("navClock");
    const clockNum = document.getElementById("navClockNum");
    const clockRing = document.getElementById("navClockRing");
    const wrap = document.getElementById("navIconWrap");
    if (banner && arrived) {
      banner.hidden = false;
      banner.classList.add("visible");
      const place = (activeDestination && activeDestination.name) || "Destination";
      if (distEl && distEl.textContent !== "You've arrived") distEl.textContent = "You've arrived";
      if (text && text.textContent !== place) text.textContent = place;
      if (icon && icon.dataset.maneuver !== "arrived") {
        icon.dataset.maneuver = "arrived";
        icon.innerHTML = '<svg viewBox="0 0 48 48" width="66" height="66" aria-hidden="true"><circle cx="24" cy="24" r="15" fill="none" stroke="currentColor" stroke-width="3.2"/><path fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" d="M15.2 24.6l6 6.2 12.2-13"/></svg>';
      }
      if (thenEl) { thenEl.hidden = true; thenEl.classList.remove("visible"); }
      if (clock) { clock.hidden = true; clock.classList.remove("visible"); }
      if (wrap) wrap.classList.remove("clock");
      renderLaneBar(null);
    } else if (banner && current) {
      banner.hidden = false;
      banner.classList.add("visible");
      const turn = hudManeuver(current);
      const title = shortInstruction(current.instructions, turn);
      if (text && text.textContent !== title) text.textContent = title;
      const iconKey = turn;
      if (icon && icon.dataset.maneuver !== iconKey) {
        icon.dataset.maneuver = iconKey;
        icon.innerHTML = maneuverIconSvg(turn, 66);
      }
      const nextTurn = next ? hudManeuver(next) : "";
      if (next && thenEl && thenIcon && maneuverFamily(nextTurn) !== "straight") {
        thenEl.hidden = false;
        thenEl.classList.add("visible");
        if (thenIcon.dataset.maneuver !== nextTurn) {
          thenIcon.dataset.maneuver = nextTurn;
          thenIcon.innerHTML = maneuverIconSvg(nextTurn, 28);
        }
      } else if (thenEl) {
        thenEl.hidden = true;
        thenEl.classList.remove("visible");
      }
      const dist = Math.max(0, current.m - progressM);
      if (distEl) {
        const label = formatTurnDistance(dist);
        if (distEl.textContent !== label) distEl.textContent = label;
      }
      const speed = Math.max(speedKalman.speed, 0);
      const etaS = turnArrivalSeconds(dist, speed);
      const showClock = !infoSkipMode && speed > 0.8 && etaS >= 0.5 && etaS <= NAV_CLOCK_S + 0.4 && dist < 140;
      if (clock && wrap && clockNum) {
        if (showClock) {
          const secs = Math.max(1, Math.round(etaS));
          clock.hidden = false;
          clock.classList.add("visible");
          wrap.classList.add("clock");
          if (clockNum.textContent !== String(secs)) clockNum.textContent = String(secs);
          if (clockRing) {
            const frac = clamp(etaS / NAV_CLOCK_S, 0, 1);
            clockRing.setAttribute("stroke-dasharray", String(CLOCK_RING));
            clockRing.setAttribute("stroke-dashoffset", String((1 - frac) * CLOCK_RING));
          }
        } else {
          clock.hidden = true;
          clock.classList.remove("visible");
          wrap.classList.remove("clock");
        }
      }
      const fam = maneuverFamily(turn);
      const showLanes = dist < NAV_LANE_AHEAD_M && fam !== "dest" && (fam !== "straight" || dist < 80);
      if (showLanes) {
        const turnPt = pointAtMetres(activeRoutePath, routeCum, current.m).point;
        const googleLanes = current.lanes && current.lanes.length >= 2
          ? (current.lanes.some(l => l.rec) ? current.lanes : markRecommendedLanes(current.lanes, turn))
          : null;
        const osm = googleLanes ? null : matchTurnLanes(turnPt, puck.heading);
        renderLaneBar(trustedLaneGuidance(googleLanes, osm, turn));
      } else {
        renderLaneBar(null);
      }
    } else if (banner) {
      banner.hidden = true;
      banner.classList.remove("visible");
      renderLaneBar(null);
    }
  }

  const TURN_CUE = {
    LEAD_S: 12,
    MIN_M: 70,
    MAX_M: 140,
    AFTER_DECOY_M: 16,
    MIN_BEFORE_TURN_M: 18,
    LATE_M: 10,
    DECOY_WINDOW_M: 170,
    DECOY_CLEAR_M: 22,
    SIDE_MATCH_M: 16
  };

  function turnCueSpeaker(maneuver){
    const fam = maneuverFamily(maneuver);
    if (fam === "left") return "left";
    if (fam === "right") return "right";
    return "both";
  }

  function resumeNavAudio(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!turnCue.ctx) {
      try { turnCue.ctx = new AC(); } catch (err) { return null; }
    }
    const ctx = turnCue.ctx;
    if (ctx.state === "suspended" || ctx.state === "interrupted") {
      try {
        const pending = ctx.resume();
        if (pending && typeof pending.catch === "function") pending.catch(() => {});
      } catch (err) {}
    }
    return ctx;
  }

  function connectCueToSpeakers(ctx, node, side){
    // A channel merger rejects this gain node (it is not mono) and the cue throws
    // before it starts. That silenced every left/right turn. Pan instead, and if
    // that is unavailable play the chime on both speakers rather than dropping it.
    try {
      if (side !== "both" && typeof ctx.createStereoPanner === "function") {
        const panner = ctx.createStereoPanner();
        panner.pan.value = side === "left" ? -1 : 1;
        node.connect(panner);
        panner.connect(ctx.destination);
        return;
      }
    } catch (err) {}
    try { node.connect(ctx.destination); } catch (err) {}
  }

  function startTurnCueGraph(ctx, side){
    const t0 = ctx.currentTime + 0.02;
    const notes = [370, 494];
    for (let i = 0; i < notes.length; i++) {
      const osc = ctx.createOscillator();
      const over = ctx.createOscillator();
      const gain = ctx.createGain();
      const overGain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      osc.type = "triangle";
      over.type = "sine";
      const start = t0 + i * 0.24;
      const dur = 0.11;
      osc.frequency.setValueAtTime(notes[i], start);
      over.frequency.setValueAtTime(notes[i] * 2, start);
      filter.type = "lowpass";
      filter.frequency.value = 2400;
      filter.Q.value = 0.6;
      overGain.gain.value = 0.35;
      const peak = i === 0 ? 0.24 : 0.3;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(peak, start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(filter);
      over.connect(overGain);
      overGain.connect(filter);
      filter.connect(gain);
      connectCueToSpeakers(ctx, gain, side);
      osc.start(start);
      over.start(start);
      osc.stop(start + dur + 0.02);
      over.stop(start + dur + 0.02);
    }
  }

  function playTurnCue(side){
    const which = side === "left" || side === "right" ? side : "both";
    try {
      if (window.Car && typeof Car.playNavChime === "function") {
        Car.playNavChime(which);
        return;
      }
    } catch (err) {
      console.warn("Native turn cue failed", err);
    }
    const ctx = resumeNavAudio();
    if (!ctx) return;
    const run = () => {
      try { startTurnCueGraph(ctx, side || "both"); } catch (err) { console.warn("Turn cue failed", err); }
    };
    if (ctx.state === "running") {
      run();
      return;
    }
    let done = false;
    const once = () => {
      if (done || ctx.state !== "running") return;
      done = true;
      try { ctx.removeEventListener("statechange", once); } catch (err) {}
      run();
    };
    try {
      const pending = ctx.resume();
      if (pending && typeof pending.then === "function") pending.then(once).catch(() => {});
    } catch (err) {}
    ctx.addEventListener("statechange", once);
  }

  function signedTurnDeg(fromBearing, toBearing){
    return ((toBearing - fromBearing + 540) % 360) - 180;
  }

  function sideStreetFamily(routeBearing, streetBearing){
    const turn = signedTurnDeg(routeBearing, streetBearing);
    const abs = Math.abs(turn);
    if (abs < 42 || abs > 145) return null;
    return turn > 0 ? "right" : "left";
  }

  function isSideStreetHighway(highway, name){
    const hw = String(highway || "");
    if (!hw || /^(footway|cycleway|path|steps|pedestrian|track|bridleway|corridor|platform)$/.test(hw)) return false;
    if (hw === "service" && !name) return false;
    return true;
  }

  function rebuildOsmSideStreets(){
    osmSideStreets = [];
    if (turnCue.ignoreOsm) return;
    const path = activeRoutePath;
    const cum = routeCum;
    if (!path || path.length < 2 || !cum || cum.length !== path.length) return;
    const turns = (navSteps || []).filter(step => {
      const fam = maneuverFamily(step.maneuver);
      return fam === "left" || fam === "right";
    });
    if (!turns.length) return;
    const samples = [];
    for (const step of turns) {
      const lo = Math.max(0, step.m - TURN_CUE.DECOY_WINDOW_M);
      const hi = Math.max(lo, step.m - TURN_CUE.DECOY_CLEAR_M);
      for (let m = lo; m <= hi; m += 10) {
        const at = pointAtMetres(path, cum, m);
        samples.push({ m, point: at.point, bearing: at.bearing, turnM: step.m });
      }
    }
    if (!samples.length) return;
    const hits = [];
    for (const way of speedLimit.ways) {
      if (!isSideStreetHighway(way.highway, way.name) || !way.pts || way.pts.length < 2) continue;
      for (let i = 1; i < way.pts.length; i++) {
        const a = way.pts[i - 1], b = way.pts[i];
        const mid = { lat: (a.lat + b.lat) / 2, lng: (a.lng + b.lng) / 2 };
        const wayBrg = bearingDegrees(a, b);
        let best = null, bestD = TURN_CUE.SIDE_MATCH_M;
        for (const s of samples) {
          const d = distanceMetres(mid, s.point);
          if (d < bestD) { bestD = d; best = s; }
        }
        if (!best) continue;
        const fam = sideStreetFamily(best.bearing, wayBrg);
        if (!fam) continue;
        hits.push({ m: best.m, family: fam, name: way.name || "side street" });
      }
    }
    hits.sort((a, b) => a.m - b.m);
    for (const hit of hits) {
      const last = osmSideStreets[osmSideStreets.length - 1];
      if (last && last.family === hit.family && Math.abs(hit.m - last.m) < 18) continue;
      osmSideStreets.push(hit);
    }
  }

  function decoysForStep(step, decoys){
    const fam = maneuverFamily(step && step.maneuver);
    if (fam !== "left" && fam !== "right") return [];
    const list = decoys || extraSideStreets.concat(turnCue.ignoreOsm ? [] : osmSideStreets);
    const out = [];
    for (const item of list) {
      if (!item || item.family !== fam) continue;
      if (item.m < step.m - TURN_CUE.DECOY_WINDOW_M || item.m > step.m - TURN_CUE.DECOY_CLEAR_M) continue;
      out.push(item);
    }
    out.sort((a, b) => a.m - b.m);
    return out;
  }

  function turnCueLeadM(speedMps){
    return clamp((Number(speedMps) > 0.8 ? speedMps : 8) * TURN_CUE.LEAD_S, TURN_CUE.MIN_M, TURN_CUE.MAX_M);
  }

  function turnCueArmedM(step, speedMps, decoys){
    if (!step) return Infinity;
    const lead = turnCueLeadM(speedMps);
    let armed = step.m - lead;
    const last = decoysForStep(step, decoys);
    if (last.length) armed = Math.max(armed, last[last.length - 1].m + TURN_CUE.AFTER_DECOY_M);
    return Math.min(armed, step.m - TURN_CUE.MIN_BEFORE_TURN_M);
  }

  function turnCueShouldPlay(step, progressM, speedMps, decoys){
    if (!step) return false;
    const fam = maneuverFamily(step.maneuver);
    if (fam === "dest") return false;
    const dist = step.m - progressM;
    if (dist < TURN_CUE.LATE_M || dist > TURN_CUE.MAX_M + 40) return false;
    if (fam === "straight") return false;
    return progressM + 0.01 >= turnCueArmedM(step, speedMps, decoys);
  }

  function evaluateTurnCueLogic(){
    const step = { m: 180, maneuver: "TURN_RIGHT", instructions: "Second Ave" };
    const decoys = [{ m: 90, family: "right", name: "First Ave" }];
    const speed = 10;
    const naive = step.m - turnCueLeadM(speed);
    let played = null;
    for (let m = 0; m < step.m; m += 1) {
      if (turnCueShouldPlay(step, m, speed, decoys)) { played = m; break; }
    }
    const afterDecoy = decoys[0].m + TURN_CUE.AFTER_DECOY_M;
    const pass = played != null && played >= afterDecoy - 1 && played < step.m - TURN_CUE.LATE_M && naive < decoys[0].m;
    return { pass, played, naive, decoyM: decoys[0].m, turnM: step.m, afterDecoy, speaker: turnCueSpeaker(step.maneuver) };
  }

  function clearCueDecor(){
    for (const item of cueDecor) {
      try { item.remove(); } catch (err) {}
    }
    cueDecor = [];
  }

  function resetTurnCue(){
    turnCue.played.clear();
    turnCue.ignoreOsm = false;
    turnCue.test = null;
    extraSideStreets = [];
    clearCueDecor();
    hideTurnCueHud();

    const hud = document.getElementById("turnCueHud");

  function showTurnCueHud(){

  function setTurnCueHud(logicText, liveText, detailText, logicOk, liveOk){
    const logicEl = document.getElementById("turnCueLogic");
    const liveEl = document.getElementById("turnCueLive");
    const detailEl = document.getElementById("turnCueDetail");
    if (logicEl) {
      logicEl.textContent = logicText;
      logicEl.className = "cue-row " + (logicOk === true ? "cue-pass" : logicOk === false ? "cue-fail" : "cue-wait");
    }
    if (liveEl) {
      liveEl.textContent = liveText;
      liveEl.className = "cue-row " + (liveOk === true ? "cue-pass" : liveOk === false ? "cue-fail" : "cue-wait");
    }
    if (detailEl) detailEl.textContent = detailText;
  }

  function judgeTurnCueDrive(progressM){
    const test = turnCue.test;
    if (!test) return;
    const played = test.playedM;
    if (played == null) {
      if (progressM >= test.turnM - TURN_CUE.LATE_M) {
        test.liveOk = false;
        setTurnCueHud(test.logicLine, "Live: FAIL — cue never played", test.detail, test.logicOk, false);
      }
      return;
    }
    const expect = test.expectSide || "right";
    const afterDecoy = Number.isFinite(test.decoyM) ? test.decoyM + TURN_CUE.AFTER_DECOY_M - 2 : 0;
    const ok = played >= afterDecoy && played < test.turnM - TURN_CUE.LATE_M && test.side === expect;
    test.liveOk = ok;
    setTurnCueHud(
      test.logicLine,
      ok ? `Live: PASS — dun-dun at ${Math.round(played)} m on ${test.side}` : `Live: FAIL — played at ${Math.round(played)} m (${test.side})`,
      test.detail,
      test.logicOk,
      ok
    );
  }

  function updateTurnCue(){
    if (!isNavigating() || !navSteps.length || !activeRoutePath.length) return;
    const total = routeCum.length ? routeCum[routeCum.length - 1] : 0;
    let progressM = clamp(Number.isFinite(puck.progressM) ? puck.progressM : 0, 0, total);
    if (!puck.engaged && currentGpsPoint && activeRoutePath.length >= 2) {
      progressM = nearestAlongRoute(currentGpsPoint, activeRoutePath, routeCum);
    }
    const speed = speedKalman.speed;
    const ahead = upcomingNavSteps(progressM, { hold: false });
    const current = ahead[0];
    if (!current) return;
    const decoys = decoysForStep(current);
    const lastDecoy = decoys.length ? decoys[decoys.length - 1] : null;
    const armedM = turnCueArmedM(current, speed, decoys);
    const cueMan = hudManeuver(current);
    const key = Math.round(current.m) + ":" + cueMan;
    const fam = maneuverFamily(cueMan);
    if (turnCue.test) {
      const waiting = lastDecoy && progressM < lastDecoy.m + TURN_CUE.AFTER_DECOY_M;
      const live = turnCue.test.playedM == null
        ? (waiting ? `Live: holding for ${lastDecoy.name || "side street"} (${Math.round(lastDecoy.m)} m)` : `Live: ${Math.round(progressM)} m · cue at ${Math.round(armedM)} m`)
        : null;
      if (live) setTurnCueHud(turnCue.test.logicLine, live, turnCue.test.detail, turnCue.test.logicOk, null);
      judgeTurnCueDrive(progressM);
    }
    if (fam === "dest" || fam === "straight") return;
    if (turnCue.played.has(key)) return;
    if (!turnCueShouldPlay(current, progressM, speed, decoys)) return;
    const side = turnCueSpeaker(cueMan);
    playTurnCue(side);
    turnCue.played.add(key);
    if (turnCue.test) {
      turnCue.test.playedM = progressM;
      turnCue.test.side = side;
      judgeTurnCueDrive(progressM);
    }
  }

  function updateRouteInfo(route, destinationName, keepNav){
    const mins = Math.max(1, Math.round(route.durationMillis / 60000));
    const eta = new Date(Date.now() + route.durationMillis);

    routeStatsEl.textContent = `${formatDistance(route.distanceMeters)} · ${formatTime(eta)}`;
