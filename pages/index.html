<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Auckland 3D Route Demo</title>
  <style>
    html, body {width:100%; height:100%; margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#000; overflow:hidden}
    #map {position:absolute; top:0; left:0; width:100%; height:108.696%; z-index:1; transform:translateZ(0); isolation:isolate}
    #mapLoader {position:absolute; inset:0; z-index:80; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; opacity:.99; gap:22px; transition:opacity .45s ease, visibility .45s ease; pointer-events:auto}
    body.map-ready #mapLoader {opacity:0; visibility:hidden; pointer-events:none}
    .gmaps-pin {position:relative; width:96px; height:128px; animation:gmapsBounce 1.1s ease-in-out infinite}
    .gmaps-pin svg {width:96px; height:128px; display:block; filter:drop-shadow(0 12px 14px rgba(0,0,0,.45))}
    .gmaps-pin::after {content:""; position:absolute; left:50%; top:34%; width:108px; height:108px; margin:-54px 0 0 -54px; border-radius:50%; background:rgba(66,133,244,.22); animation:gmapsRipple 1.4s ease-out infinite; z-index:-1}
    .gmaps-shadow {width:48px; height:12px; border-radius:50%; background:rgba(0,0,0,.45); animation:gmapsShadow 1.1s ease-in-out infinite}
    .gmaps-status {color:#fff; font-weight:650; letter-spacing:.2px; font-size:15px; opacity:.88; max-width:70%; text-align:center}
    @keyframes gmapsBounce {0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes gmapsShadow {0%,100%{transform:scale(1); opacity:.35}50%{transform:scale(.72); opacity:.18}}
    @keyframes gmapsRipple {0%{transform:scale(.5); opacity:.65}100%{transform:scale(1.75); opacity:0}}
    gmp-map-3d {width:100% !important; height:100% !important; min-width:100%; min-height:100%; display:block; transform:translate3d(0,0,0); will-change:contents}
    #topPanel {position:absolute; z-index:20; top:max(10px,env(safe-area-inset-top)); left:10px; right:10px; display:grid; gap:8px; pointer-events:none}
    #searchRow,#buttonRow,#routeCard,#carDebugBtn {pointer-events:auto}
    #searchRow {display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:stretch}
    #searchHost {min-width:0; min-height:44px; border-radius:12px; background:rgba(255,255,255,.96); box-shadow:0 2px 10px rgba(0,0,0,.24); overflow:hidden}
    #searchHost gmp-place-autocomplete {width:100%; min-height:44px; display:block; border:0; border-radius:12px; background:transparent; overflow:hidden}
    #searchHost gmp-place-autocomplete::part(input),
    #searchHost gmp-place-autocomplete::part(search) {border:0; border-radius:12px; background:transparent; min-height:44px}
    button,select {min-height:44px; border:0; border-radius:12px; padding:0 13px; font:inherit; font-weight:650; background:rgba(255,255,255,.96); color:#111; box-shadow:0 2px 10px rgba(0,0,0,.24)}
    button:active {transform:translateY(1px)}
    #buttonRow {display:flex; flex-wrap:wrap; gap:7px}
    #searchRow,#buttonRow,#searchResults,#status {transition:opacity .4s ease, transform .4s ease}
    body.chrome-hidden #searchRow,body.chrome-hidden #buttonRow,body.chrome-hidden #searchResults {opacity:0; pointer-events:none; transform:translateY(-10px)}
    #searchResults {display:none; pointer-events:auto; justify-self:stretch; max-width:min(640px,100%); max-height:min(46vh,340px); overflow:auto; border-radius:12px; background:rgba(255,255,255,.98); box-shadow:0 8px 24px rgba(0,0,0,.28)}
    #searchResults.open {display:block}
    #searchResults button {display:block; width:100%; min-height:52px; border:0; border-radius:0; box-shadow:none; text-align:left; padding:10px 14px; background:transparent}
    #searchResults button + button {border-top:1px solid rgba(0,0,0,.08)}
    #searchResults .sub {display:block; font-size:13px; font-weight:500; opacity:.62; margin-top:2px}
    body.chrome-hidden #status {opacity:0; pointer-events:none; transform:translateY(10px)}
    #carDebugBtn {display:none; position:absolute; top:max(12px,env(safe-area-inset-top)); left:max(12px,env(safe-area-inset-left)); z-index:32; width:76px; height:76px; min-height:76px; padding:0; border-radius:50%; background:#2E3134; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.45); align-items:center; justify-content:center}
    #carDebugBtn svg {width:34px; height:34px; fill:currentColor}
    body.debug-open #carDebugBtn {background:#1A73E8}
    #recenterBtn {position:absolute; right:max(16px,env(safe-area-inset-right)); bottom:max(20px,env(safe-area-inset-bottom)); z-index:32; display:none; align-items:center; gap:10px; min-height:76px; padding:0 24px 0 18px; border-radius:38px; font:inherit; font-size:18px; font-weight:650; background:#2E3134; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.45)}
    #recenterBtn.visible {display:flex}
    #recenterBtn svg {width:24px; height:32px; display:block; flex:0 0 auto; fill:currentColor}
    #recenterBtn svg circle {fill:#2E3134}
    #speedLimitBadge {display:none; position:absolute; left:max(16px,env(safe-area-inset-left)); bottom:max(20px,env(safe-area-inset-bottom)); z-index:32; width:76px; height:76px; box-sizing:border-box; border-radius:50%; background:#fff; border:7px solid #D93838; align-items:center; justify-content:center; font-size:30px; font-weight:800; color:#111; font-variant-numeric:tabular-nums; box-shadow:0 2px 8px rgba(0,0,0,.45); pointer-events:none}
    #speedLimitBadge.visible {display:flex}
    #compassBtn {display:none; position:absolute; left:max(16px,env(safe-area-inset-left)); bottom:max(108px,calc(env(safe-area-inset-bottom) + 88px)); z-index:32; width:64px; height:64px; min-height:64px; padding:0; border-radius:50%; background:#2E3134; color:#fff; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.45)}
    #compassBtn.visible {display:flex}
    #compassBtn svg {width:38px; height:38px; display:block}
    #compassBtn.north-up {background:#1A73E8}
    body.night gmp-map-3d {filter:brightness(.68) saturate(.82)}
    body.night #speedLimitBadge {background:#ECEDEE}
    #traceOverlay {display:none; position:absolute; inset:0; z-index:47; align-items:center; justify-content:center; background:rgba(0,0,0,.55); pointer-events:auto}
    #traceOverlay.open {display:flex}
    html.aa-car:not(.debug-open) #traceOverlay,body.aa-car:not(.debug-open) #traceOverlay {display:none !important}
    #traceCard {position:relative; width:min(78vw,640px); max-height:min(78vh,560px); border-radius:20px; background:#1C1C1E; color:#fff; box-shadow:0 12px 40px rgba(0,0,0,.55); overflow:hidden; display:flex; flex-direction:column}
    #traceTitle {padding:16px 56px 10px 16px; font-size:17px; font-weight:700}
    #traceList {flex:1; min-height:0; overflow:auto; padding:0 10px 12px}
    #traceEmpty {padding:8px 16px 20px; font-size:14px; color:rgba(255,255,255,.7)}
    .trace-row {display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:8px; align-items:center; padding:8px 6px; border-top:1px solid rgba(255,255,255,.1)}
    .trace-row .trace-name {font-size:14px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .trace-row .trace-meta {display:block; font-size:12px; font-weight:500; color:rgba(255,255,255,.62); margin-top:2px}
    .trace-row button {min-height:40px; background:#2E3134; color:#fff; box-shadow:none; font-size:14px}
    .trace-row button.trace-replay {background:#1A73E8}
    #traceClose {position:absolute; top:10px; right:10px; z-index:2; width:40px; height:40px; min-height:40px; padding:0; border-radius:50%; background:#3C4043; color:#fff; box-shadow:none; font-size:24px; line-height:1}
    html.aa-car #searchRow,body.aa-car #searchRow {display:none}
    html.aa-car #searchResults,body.aa-car #searchResults {display:none !important}
    html.aa-car #chromeWake,body.aa-car #chromeWake {display:none; pointer-events:none}
    html.aa-car #carDebugBtn,body.aa-car #carDebugBtn {display:flex}
    html.aa-car #buttonRow,body.aa-car #buttonRow {position:fixed; left:max(140px,calc(env(safe-area-inset-left) + 128px)); right:148px; bottom:max(16px,env(safe-area-inset-bottom)); top:auto; z-index:30; overflow:visible}
    html.aa-car #buttonRow button,html.aa-car #buttonRow select,
    body.aa-car #buttonRow button,body.aa-car #buttonRow select {background:#2E3134; color:#fff}
    html.aa-car:not(.debug-open) #buttonRow,body.aa-car:not(.debug-open) #buttonRow {opacity:0; pointer-events:none}
    html.aa-car.debug-open #buttonRow,body.aa-car.debug-open #buttonRow {opacity:1; pointer-events:auto; transform:none}
    html:not(.aa-car) #carApiBtn,body:not(.aa-car) #carApiBtn {display:none}
    #viewPicker {position:relative; display:inline-flex}
    #viewSelectBtn {white-space:nowrap}
    #viewSelectMenu {display:none; position:absolute; left:0; top:calc(100% + 6px); min-width:max(100%,180px); z-index:46; padding:6px; border-radius:12px; background:#1C1C1E; box-shadow:0 8px 24px rgba(0,0,0,.4)}
    #viewSelectMenu.open {display:grid; gap:4px}
    #viewSelectMenu button {min-height:44px; width:100%; white-space:nowrap; text-align:left; background:#2E3134; color:#fff; box-shadow:none}
    html.aa-car #viewSelectMenu,body.aa-car #viewSelectMenu {top:auto; bottom:calc(100% + 6px)}
    #viewSpecPanel {display:none; position:absolute; z-index:31; top:max(96px,calc(env(safe-area-inset-top) + 88px)); left:max(10px,env(safe-area-inset-left)); width:176px; padding:6px; border-radius:12px; background:#1C1C1E; color:#fff; box-shadow:0 8px 20px rgba(0,0,0,.4); pointer-events:auto; gap:2px}
    body.view-specs #viewSpecPanel {display:grid}
    html.aa-car #viewSpecPanel,body.aa-car #viewSpecPanel {top:max(96px,calc(env(safe-area-inset-top) + 88px)); left:max(12px,env(safe-area-inset-left)); right:auto; width:168px; bottom:auto}
    html.aa-car:not(.debug-open) #viewSpecPanel,body.aa-car:not(.debug-open) #viewSpecPanel {display:none !important}
    #viewSpecPanel .spec-row {display:grid; grid-template-columns:1fr auto 26px 26px; align-items:center; gap:4px}
    #viewSpecPanel .spec-name {font-size:11px; font-weight:650; opacity:.82; line-height:1.1}
    #viewSpecPanel .spec-value {font-size:12px; font-weight:750; font-variant-numeric:tabular-nums; min-width:3.6em; text-align:right}
    #viewSpecPanel button {min-height:26px; width:26px; padding:0; background:#2E3134; color:#fff; box-shadow:none; font-size:15px; font-weight:700; border-radius:8px}
    #viewSpecPanel .spec-zoom {display:grid; grid-template-columns:26px 1fr 26px; align-items:center; gap:4px; margin-bottom:4px; padding-bottom:4px; border-bottom:1px solid rgba(255,255,255,.12)}
    #viewSpecPanel .spec-zoom span {text-align:center; font-size:11px; font-weight:700}
    #routeCard {display:none; position:absolute; z-index:31; top:max(96px,calc(env(safe-area-inset-top) + 88px)); left:max(10px,env(safe-area-inset-left)); width:min(280px,calc(100vw - 180px)); padding:14px 48px 14px 16px; border-radius:20px; background:#1C1C1E; color:#fff; box-shadow:0 8px 28px rgba(0,0,0,.4); pointer-events:auto}
    html.aa-car #routeCard,body.aa-car #routeCard {top:max(96px,calc(env(safe-area-inset-top) + 88px))}
    html.aa-car.view-specs #routeCard,body.aa-car.view-specs #routeCard {left:max(190px,calc(env(safe-area-inset-left) + 178px))}
    body.has-route:not(.navigating) #routeCard {display:block}
    body.navigating #routeCard {display:none !important}
    #routeClose {position:absolute; top:10px; right:10px; width:36px; height:36px; min-height:36px; padding:0; border-radius:50%; background:#3C4043; color:#fff; box-shadow:none; font-size:22px; line-height:1; font-weight:500}
    #routeTime {font-size:32px; font-weight:750; letter-spacing:-.6px; line-height:1.1}
    #routeStats {margin-top:4px; font-size:16px; font-weight:550; opacity:.92}
    #routeSub {margin-top:4px; font-size:14px; font-weight:600; color:rgba(255,255,255,.62)}
    #routeSub.traffic-delay {color:#FFB74D}
    #routeTitle {margin-top:10px; font-size:15px; font-weight:600; opacity:.82; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    #routeGo {margin-top:12px; width:100%; min-height:44px; background:#1A73E8; color:#fff; box-shadow:none}
    #status {display:none}
    #chromeWake {position:absolute; top:0; left:0; right:0; height:max(80px,calc(env(safe-area-inset-top) + 68px)); z-index:25; pointer-events:none}
    body.chrome-hidden #chromeWake {pointer-events:auto}
    body:not(.map-ready) #searchRow,
    body:not(.map-ready) #searchResults,
    body:not(.map-ready) #buttonRow,
    body:not(.map-ready) #carDebugBtn,
    body:not(.map-ready) #recenterBtn,
    body:not(.map-ready) #compassBtn,
    body:not(.map-ready) #speedLimitBadge,
    body:not(.map-ready) #routeCard,
    body:not(.map-ready) #viewSpecPanel {
      display:none !important;
      visibility:hidden !important;
      pointer-events:none !important;
    }
    #carApiHud {display:none; position:absolute; z-index:45; left:50%; top:50%; transform:translate(-50%,-50%); min-width:140px; padding:14px 22px; border-radius:18px; background:#1C1C1E; color:#fff; box-shadow:0 8px 28px rgba(0,0,0,.45); text-align:center; pointer-events:none}
    #carApiHud.visible {display:grid; gap:2px}
    html.aa-car:not(.debug-open) #carApiHud,body.aa-car:not(.debug-open) #carApiHud {display:none !important}
    #carApiHud .car-api-label {font-size:13px; font-weight:650; opacity:.72}
    #carApiHud .car-api-value {font-size:42px; font-weight:750; line-height:1.1; font-variant-numeric:tabular-nums}
    #carModelOverlay {display:none; position:absolute; inset:0; z-index:47; align-items:center; justify-content:center; background:rgba(0,0,0,.55); pointer-events:auto}
    #carModelOverlay.open {display:flex}
    html.aa-car:not(.debug-open) #carModelOverlay,body.aa-car:not(.debug-open) #carModelOverlay {display:none !important}
    #carModelCard {position:relative; width:min(78vw,760px); height:min(78vh,520px); border-radius:20px; background:#1C1C1E; box-shadow:0 12px 40px rgba(0,0,0,.55); overflow:hidden; display:flex; flex-direction:column}
    #carModelSwitch {display:flex; gap:6px; padding:12px 48px 0 14px; flex:0 0 auto}
    #carModelSwitch button {flex:1; min-height:40px; background:#2E3134; color:#fff; box-shadow:none; font-size:14px}
    #carModelSwitch button.active {background:#1A73E8}
    #carModelHost {flex:1; min-height:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; background:radial-gradient(ellipse at 50% 70%, #3a3e44 0%, #1C1C1E 70%)}
    #carModelHost model-viewer {width:100%; height:100%; --poster-color:transparent; touch-action:none}
    #carModelHint {padding:8px 14px; font-size:13px; font-weight:600; color:rgba(255,255,255,.7); text-align:center}
    #carModelClose {position:absolute; top:10px; right:10px; z-index:2; width:40px; height:40px; min-height:40px; padding:0; border-radius:50%; background:#3C4043; color:#fff; box-shadow:none; font-size:24px; line-height:1}
    @media (max-width:580px){#searchRow{grid-template-columns:minmax(0,1fr)}button,select{font-size:14px}}
  </style>
</head>
<body class="chrome-hidden">
  <div id="map"></div>
  <div id="mapLoader" aria-live="polite">
    <div class="gmaps-pin" aria-hidden="true">
      <svg viewBox="0 0 92.3 132.3" xmlns="http://www.w3.org/2000/svg">
        <path fill="#1A73E8" d="M60.2 2.2C55.8.8 51 0 46.1 0 32 0 19.3 6.4 10.8 16.5l21.8 18.3L60.2 2.2z"/>
        <path fill="#EA4335" d="M10.8 16.5C4.1 24.5 0 34.9 0 46.1c0 8.7 1.7 15.7 4.6 22l28-33.3-21.8-18.3z"/>
        <path fill="#4285F4" d="M46.2 28.5c9.8 0 17.7 7.9 17.7 17.7 0 4.3-1.6 8.3-4.2 11.4 0 0 13.9-16.6 27.5-32.7-5.6-10.8-15.3-19-27-22.7L32.6 34.8c3.3-3.8 8.1-6.3 13.6-6.3"/>
        <path fill="#FBBC04" d="M46.2 63.8c-9.8 0-17.7-7.9-17.7-17.7 0-4.3 1.5-8.3 4.1-11.3l-28 33.3c4.8 10.6 12.8 19.2 21 29.9l34.1-40.5c-3.3 3.9-8.1 6.3-13.5 6.3"/>
        <path fill="#34A853" d="M59.1 109.2c15.4-24.1 33.3-35 33.3-63 0-7.7-1.9-14.9-5.2-21.3L25.6 98c2.6 3.4 5.3 7.3 7.9 11.3 9.4 14.5 6.8 23.1 12.8 23.1s3.4-8.7 12.8-23.2"/>
      </svg>
    </div>
    <div class="gmaps-shadow"></div>
    <div class="gmaps-status" id="mapLoaderStatus" hidden></div>
  </div>
  <div id="chromeWake" aria-hidden="true"></div>
  <div id="topPanel">
    <div id="searchRow">
      <div id="searchHost"></div>
    </div>
    <div id="searchResults" hidden></div>
    <div id="buttonRow">
      <button id="gpsBtn" type="button">Start GPS</button>
      <button id="followBtn" type="button">Following: ON</button>
      <button id="labelsBtn" type="button">Labels: OFF</button>
      <button id="demoBtn" type="button">Drive route demo</button>
      <button id="freeFollowBtn" type="button">Free follow</button>
      <button id="randomBtn" type="button">Random route</button>
      <button id="viewSpecBtn" type="button">View specs</button>
      <button id="carApiBtn" type="button">API level</button>
      <button id="carModelBtn" type="button">Car model</button>
      <button id="traceRecBtn" type="button">Rec trace</button>
      <button id="tracesBtn" type="button">Traces</button>
      <div id="viewPicker">
        <button id="viewSelectBtn" type="button" aria-haspopup="listbox" aria-expanded="false">Driving view</button>
        <div id="viewSelectMenu" hidden role="listbox">
          <button type="button" role="option" data-view="overview">Route overview</button>
          <button type="button" role="option" data-view="drive">Driving view</button>
          <button type="button" role="option" data-view="high">Higher view</button>
          <button type="button" role="option" data-view="top">Top-down</button>
        </div>
      </div>
    </div>
  </div>
  <div id="viewSpecPanel" hidden>
    <div class="spec-zoom">
      <button type="button" id="specZoomOut" aria-label="Zoom out">−</button>
      <span>Zoom</span>
      <button type="button" id="specZoomIn" aria-label="Zoom in">+</button>
    </div>
    <div class="spec-row">
      <span class="spec-name">Height</span>
      <span class="spec-value" id="specAltitude">—</span>
      <button type="button" data-spec="altitude" data-dir="-" aria-label="Decrease height">−</button>
      <button type="button" data-spec="altitude" data-dir="+" aria-label="Increase height">+</button>
    </div>
    <div class="spec-row">
      <span class="spec-name">Tilt</span>
      <span class="spec-value" id="specTilt">—</span>
      <button type="button" data-spec="tilt" data-dir="-" aria-label="Decrease tilt">−</button>
      <button type="button" data-spec="tilt" data-dir="+" aria-label="Increase tilt">+</button>
    </div>
    <div class="spec-row">
      <span class="spec-name">Distance</span>
      <span class="spec-value" id="specRange">—</span>
      <button type="button" data-spec="range" data-dir="-" aria-label="Decrease distance">−</button>
      <button type="button" data-spec="range" data-dir="+" aria-label="Increase distance">+</button>
    </div>
    <div class="spec-row">
      <span class="spec-name">Heading</span>
      <span class="spec-value" id="specHeading">—</span>
      <button type="button" data-spec="heading" data-dir="-" aria-label="Decrease heading">−</button>
      <button type="button" data-spec="heading" data-dir="+" aria-label="Increase heading">+</button>
    </div>
    <div class="spec-row">
      <span class="spec-name">Field of view</span>
      <span class="spec-value" id="specFov">—</span>
      <button type="button" data-spec="fov" data-dir="-" aria-label="Decrease field of view">−</button>
      <button type="button" data-spec="fov" data-dir="+" aria-label="Increase field of view">+</button>
    </div>
  </div>
  <div id="carModelOverlay" hidden>
    <div id="carModelCard">
      <button id="carModelClose" type="button" aria-label="Close model viewer">&times;</button>
      <div id="carModelSwitch">
        <button type="button" data-model="forte">Kia Forte</button>
        <button type="button" data-model="cerato">Kia Cerato</button>
      </div>
      <div id="carModelHost"></div>
      <div id="carModelHint">Kia Forte · drag to rotate · pinch to zoom</div>
    </div>
  </div>
  <div id="traceOverlay" hidden>
    <div id="traceCard">
      <button id="traceClose" type="button" aria-label="Close traces">&times;</button>
      <div id="traceTitle">Recorded drives</div>
      <div id="traceList"></div>
    </div>
  </div>
  <div id="carApiHud" hidden>
    <div class="car-api-label">Car API</div>
    <div class="car-api-value" id="carApiValue">unknown</div>

<script>
  // Injected at GitHub Pages deploy from the GOOGLE_MAPS_API_KEY repo secret.
  const GOOGLE_MAPS_API_KEY = "__GOOGLE_MAPS_API_KEY__";
  try {
    if (sessionStorage.getItem("aaMapRevealed") === "1") {
      document.body.classList.add("map-ready");
      document.documentElement.classList.add("map-ready");
    }
  } catch (err) {}

  const AUCKLAND = { lat: -36.848461, lng: 174.763336 };
  // Maps Model3DElement only accepts URLs that end in ".glb" — no query strings.
  function modelFileUrl(file){
    return new URL(file, new URL("./", document.baseURI)).href;
  }
  const CAR_MODELS = {
    forte: { id: "forte", label: "Kia Forte", url: modelFileUrl("forte.glb"), previewUrl: modelFileUrl("forte-preview.glb"), orbit: "0deg 75deg 8m", target: "0m 0.75m 0m", yawOffset: 90 },
    cerato: { id: "cerato", label: "Kia Cerato 2021", url: modelFileUrl("cerato.glb"), orbit: "35deg 74deg 8m", target: "0m 0.7m 0m", yawOffset: 90 }
  };
  const HEADING_ARROW_URL = modelFileUrl("heading-arrow.glb");
  let activeCarModelId = "forte";
  try {
    const saved = localStorage.getItem("aaCarModel");
    if (saved && CAR_MODELS[saved]) activeCarModelId = saved;
  } catch (err) {}
  // Keep a constant on-screen size: about one lane / half a two-lane road.
  const CAR_WIDTH_M = 1.80;
  const CAR_TARGET_WIDTH_M = 3.5;
  const CAR_REF_RANGE = 88;
  const CAR_REF_FOV = 42;
  const CAR_REF_TILT = 70;
  const CAR_BASE_SCALE = CAR_TARGET_WIDTH_M / CAR_WIDTH_M;
  const MODEL_ALTITUDE_MODE = "CLAMP_TO_GROUND";
  const USE_HEADING_ARROW = false;
  const CAR_ARROW_RANGE = 240;
  const CAR_ARROW_RANGE_IN = 175;
  const ARROW_REF_RANGE = 420;
  const ARROW_REF_FOV = 40;
  let lastCarScale = 0;
  let lastArrowScale = 0;
  let usingArrow = false;
  let lastCarHeading = 0;
  let lastCarPoint = null;
  let followAlt = null;

  // ---------------------------------------------------------------------------
  // Follow camera + car motion model.
  // Ported from Vela (reference/app/src/main/java/app/vela/ui/map/VelaMapView.kt
  // nav + free-drive follow tickers, reference/app/src/main/java/app/vela/car/
  // CarMapRenderer.kt, and core/location/{SpeedKalman,AlongRouteFilter}.kt).
  // GPS fixes arrive ~1 Hz. Nothing here writes the camera from a fix: a fix only
  // updates a TARGET, and a requestAnimationFrame ticker glides the drawn car and
  // the camera toward it every frame.
  //  - Navigating: the fix is map-matched onto the route (forward-only window),
  //    progress along the route is dead-reckoned at the modelled speed between
  //    fixes and corrected in the RATE domain (bounded, never a jump, never
  //    backwards), the car is drawn at a boxcar-smoothed point on the line and
  //    its heading is the chord across that window (no per-vertex snap).
  //  - Free follow (no route): the car rolls on at the modelled speed along its
  //    smoothed heading; the last fix, projected forward along its course
  //    (capped), enters as a rate-capped correction, so GPS noise is a gentle
  //    drift rather than a hop once a second.
  //  - Camera: split time constants (tight position, heavy adaptively-damped
  //    heading, breathing range/tilt), aimed a computed distance AHEAD of the
  //    car so the car sits low on screen and the road ahead owns the view. The
  //    orbit target's altitude is the real ground height (Terrarium DEM), since
  //    Map3DElement.center.altitude is absolute and defaults to sea level.
  // ---------------------------------------------------------------------------
  const FOLLOW = {
    CAR_SCREEN_Y: 0.72,     // where the car sits on screen while heading-up (0 = top, 1 = bottom)
    POS_TAU: 0.25,          // camera position ease time-constant (s)
    BRG_TAU_STILL: 1.6,     // camera heading damping while tracking a straight road
    BRG_TAU_TURN: 0.35,     // ...and through a genuine turn
    BRG_TURN_DEG: 25,       // heading error at which the damping is fully in "turn" mode
    BRG_MAX_RATE: 150,      // camera heading rate cap (deg/s); corners peak ~60-120, view switches would exceed it
    TILT_TAU: 0.55,
    RANGE_TAU: 0.5,
    SPEED_TAU: 0.6,         // low-pass on the speed that drives the range breathing
    CAR_BRG_TAU: 0.3,       // drawn car heading smoothing
    FREE_RECKON_S: 2.5,     // free-follow dead-reckon cap (a dropped signal can't run the car away)
    FREE_GENTLE_M: 8,       // free-follow residual treated as GPS noise (gentle correction)...
    FREE_FULL_M: 30,        // ...and where the correction reaches full catch-up rate
    DEAD_RECKON_S: 3.0,     // nav dead-reckon cap
    CORRECT_TIME_S: 0.6,    // seconds to absorb an along-route position error
    SMOOTH_SAMPLES: 7,      // boxcar samples across the along-route smoothing window
    WIN_TAU: 2.5,           // time constant of the smoothing window WIDTH (tracks town vs motorway only)
    SNAP_MAX_M: 22,         // map-match tolerance (+ up to 13 m at speed)
    MISS_LIMIT: 3,          // consecutive snap misses before re-acquiring globally
    MAX_EASE_DT: 0.065,     // cap on the ease step so a janky frame spreads its catch-up over several
    FLIGHT_TAU: 0.6,        // extra shared time-constant while the camera is far from the car (re-center, overview -> drive)
    TELEPORT_M: 250,        // a fix this far from the drawn car snaps instead of gliding
    ZOOM_TAU: 2.0,          // ease between speed-band zoom levels (a band step must not pump the view)
    LATCH_MPS: 2.5,         // heading-up latches onto the car's course only above this speed (compass doesn't spin when parked)
    HOLD_MPS: 2.0           // ...and the course keeps updating while latched only above this
  };

  // Vela CarMapRenderer.navZoom: one zoom level per speed band (km/h upper bound -> zoom).
  // The drive-view range scales by 2^(band0 - zoom), so the RATIOS between bands are
  // Vela's (town 1x ... motorway ~4.9x); the absolute range stays this view's own.
  const ZOOM_BANDS = [[15, 17.5], [40, 17.0], [70, 16.3], [100, 15.7], [Infinity, 15.2]];
  const ZOOM_BAND_HYST_KMH = 3;   // a band changes only this far past its threshold (no flapping at 40 km/h)
  let zoomBandIdx = 0;

  // Car mode: a pan detaches the camera; it re-attaches this long after the LAST touch (Vela: 6 s).
  const AUTO_REFOLLOW_MS = 10000;
  let lastTouchMs = 0, autoRefollowArmed = false;
  let northUp = false;           // camera north-up (default heading-up)

  // World-frame horizontal acceleration from the host (TYPE_LINEAR_ACCELERATION rotated
  // into East/North, low-passed). Stale after a second -> the model coasts (a = 0).
  const motion = { east: 0, north: 0, atMs: -Infinity };
  const MOTION_STALE_MS = 1000;

  // 1-D Kalman filter over speed (Vela SpeedKalman): GPS doppler = measurement, the
  // accelerometer steers the PREDICTION so the model brakes and launches WITH the car
  // between the 1 Hz fixes; no accelerometer degrades to holding the speed (a = 0).
  const speedKalman = {
    speed: 0, p: 4, seeded: false,
    update(v){
      v = Math.max(0, v);
      if (!this.seeded) { this.speed = v; this.p = 0.5; this.seeded = true; return; }
      const k = this.p / (this.p + 0.5);                 // R_GPS 0.5 (m/s)^2
      this.speed = Math.max(0, this.speed + k * (v - this.speed));
      this.p = Math.max(0.05, (1 - k) * this.p);
    },
    // `accel` = forward acceleration (m/s^2, + = speeding up along the travel bearing).
    predict(dt, accel){
      if (!this.seeded || dt <= 0) return;
      let a = Number.isFinite(accel) ? accel : 0;
      // Denoise gain a^2/(a^2 + 0.5^2): road/engine vibration (~0.3 m/s^2) is cut to a
      // quarter, a real 4 m/s^2 brake passes within 1.5%. Beyond +-8 is sensor junk.
      a = clamp(a * ((a * a) / (a * a + 0.25)), -8, 8);
      this.speed = Math.max(0, this.speed + a * dt);
      this.p += (0.75 + 0.5 * Math.abs(a)) * dt;         // Q_BASE + Q_ACCEL*|a|
    },
    decay(dt, tau){ if (!this.seeded || dt <= 0) return; this.speed *= Math.exp(-dt / (tau || 4)); this.p += 0.75 * dt; },
    reset(){ this.speed = 0; this.p = 4; this.seeded = false; }
  };

  // Acceleration along the car's travel bearing from the host's East/North reading.
  function forwardAccelNow(now){
    if (now - motion.atMs > MOTION_STALE_MS || !Number.isFinite(puck.heading)) return 0;
    const r = toRad(puck.heading);
    return motion.east * Math.sin(r) + motion.north * Math.cos(r);
  }

  // 1-D Kalman filter over the along-route position: dead-reckoned forward each
  // frame (variance grows), each accepted fix folded in weighted by its accuracy.
  const alongFilter = {
    alongM: 0, variance: 0, seeded: false,
    measVar(acc){
      const a = clamp(Number.isFinite(acc) && acc > 0 ? acc : 12, 1, 60);
      const sigma = Math.max(2.5, a * 0.66);
      return sigma * sigma;
    },
    predict(advanceM, dt){ if (!this.seeded) return; if (advanceM > 0) this.alongM += advanceM; if (dt > 0) this.variance += 0.5 * dt; },
    update(m, acc){
      if (!this.seeded) return this.reseed(m, acc);
      const r = this.measVar(acc);
      const k = this.variance / (this.variance + r);
      this.alongM += k * (m - this.alongM);
      this.variance = Math.max(0.25, (1 - k) * this.variance);
    },
    reseed(m, acc){ this.alongM = m; this.variance = this.measVar(acc); this.seeded = true; },
    reset(){ this.alongM = 0; this.variance = 0; this.seeded = false; }
  };

  // The drawn car ("puck"): what the camera follows. Never the raw fix.
  const puck = {
    fix: null,             // latest fix {lat,lng,heading,bearingOk,speed,accuracy,atMs}
    lat: NaN, lng: NaN,    // drawn position
    heading: NaN,          // drawn heading (smoothed)
    freeHeading: NaN,      // last trustworthy GPS course (free-follow reckoning direction)
    engaged: false,        // riding the route
    progressM: 0,          // drawn metres along the route
    targetM: 0,            // last accepted fix's metres along the route
    targetAtMs: 0,         // when it was accepted (dead-reckoning anchor)
    smoothWin: NaN,        // eased along-route smoothing half-window (m)
    missCount: 0,
    fwdRejects: 0,
    speedAtAccept: 0
  };
  let routeCum = [];       // cumulative metres at each activeRoutePath vertex

  // Eased camera state (what is actually written to map3d while following).
  const cam = {
    seeded: false,
    lat: 0, lng: 0, heading: 0,
    range: 0, tilt: 0, fov: 0,
    speedLP: 0,
    zoom: NaN,             // eased speed-band zoom level
    latched: false,        // heading-up has locked onto the car's course (set once moving)
    userRange: null        // pinch-zoom override while following; Re-center clears it
  };

  // Route-start fly-over: the camera sweeps the route from the destination back to the
  // car before diving into the drive view. Null when not running.
  let flyover = null;
  const FLYOVER_MIN_M = 800;

  // Off-route detection (Vela NavEngine/NavSession).
  const OFF_ROUTE = {
    CORRIDOR_M: 40,        // on-route corridor (accuracy-scaled)
    FAR_M: 90,             // this far off counts double, even when stopped
    HITS: 3,               // consecutive off-route hits before a reroute
    HEADING_DEG: 60,       // course this far from the road's bearing counts as off-route inside the corridor
    MOVING_MPS: 2.0,       // stationary multipath is ignored unless far-off
    DEST_ZONE_M: 150,      // no reroute this close to the destination (arriving)
    COOLDOWN_MS: 10000     // between adopted reroutes
  };
  const offRoute = { hits: 0, lastRerouteMs: -Infinity, inFlight: false };
  const TEST_ORIGIN = { name: "Sky Tower", lat: -36.848461, lng: 174.763336 };
  const TEST_DESTINATIONS = [
    { name: "Auckland War Memorial Museum", lat: -36.860158, lng: 174.777953 },
    { name: "Mission Bay", lat: -36.849888, lng: 174.832367 },
    { name: "Mount Eden", lat: -36.877160, lng: 174.764470 },
    { name: "Auckland Zoo", lat: -36.864250, lng: 174.719620 },
    { name: "Cornwall Park", lat: -36.897820, lng: 174.785000 },
    { name: "Wynyard Quarter", lat: -36.841990, lng: 174.757200 }
  ];

  let map3d, Polyline3DElement, Marker3DElement, Model3DElement, PlaceAutocompleteClass, RouteClass, placeAutocomplete;
  let userMarker, userCar, userArrow, destinationMarker;
  let watchId = null, following = true, labelsOn = false, demoTimer = null, demoActive = false, demoKind = null;
  let previousFix = null, currentGpsPoint = null, activeRoute = null, activeDestination = null;
  let activeRoutePath = [];
  let currentView = "high";
  let carModelReady = false;

  const messageEl = document.getElementById("message");
  const coordsEl = document.getElementById("coords");
  const headingEl = document.getElementById("heading");
  const routeTitleEl = document.getElementById("routeTitle");
  const routeStatsEl = document.getElementById("routeStats");
  const routeSubEl = document.getElementById("routeSub");
  const routeTimeEl = document.getElementById("routeTime");

  function setMessage(text){ messageEl.textContent = text; }

  function isNavigating(){
    return document.body.classList.contains("navigating");
  }

  function arrowOrientation(heading){
    return { heading: normaliseHeading(heading - 90), tilt: 270, roll: 90 };
  }

  window.initMap = async function initMap(){
    try {
      const maps3d = await google.maps.importLibrary("maps3d");
      const routes = await google.maps.importLibrary("routes");
      const places = await google.maps.importLibrary("places");

      Polyline3DElement = maps3d.Polyline3DElement;
      Marker3DElement = maps3d.Marker3DElement;
      Model3DElement = maps3d.Model3DElement;
      RouteClass = routes.Route;
      PlaceAutocompleteClass = places.PlaceAutocompleteElement;

      const startAt = currentGpsPoint || AUCKLAND;
      const startHeading = currentGpsPoint && Number.isFinite(currentGpsPoint.heading) ? currentGpsPoint.heading : 0;
      map3d = new maps3d.Map3DElement({
        center: { lat: startAt.lat, lng: startAt.lng },
        range: 650,
        tilt: 67,
        heading: startHeading,
        mode: "SATELLITE",
        gestureHandling: "GREEDY",
        defaultUIHidden: true,
        description: "Photorealistic 3D routing map"
      });
      map3d.style.width = "100%";
      map3d.style.height = "100%";
      try { map3d.defaultUIHidden = true; } catch (err) {}
      document.getElementById("map").append(map3d);
      startGps();
      preloadCarModel();

      map3d.addEventListener("gmp-centerchange", () => {
        if (!following) updateRecenterButton();
        refreshViewSpecs();
      });
      ["gmp-headingchange","gmp-rangechange","gmp-tiltchange","gmp-fovchange","gmp-rollchange"].forEach(name => {
        map3d.addEventListener(name, () => {
          if (name === "gmp-rangechange" || name === "gmp-fovchange" || name === "gmp-headingchange") syncCarLod();
          refreshViewSpecs();
        });
      });
      armMapReveal();
    } catch (err) {
      console.error(err);
      const detail = (err && err.message) ? err.message : String(err);
      showMapFailure("Initialisation failed. " + detail);
    }
  };

  function activeCarModel(){
    return CAR_MODELS[activeCarModelId] || CAR_MODELS.forte;
  }

  function carModelUrl(){
    return activeCarModel().url;
  }

  function currentCarPoint(){
    if (lastCarPoint && Number.isFinite(lastCarPoint.lat) && Number.isFinite(lastCarPoint.lng)) {
      return { lat: lastCarPoint.lat, lng: lastCarPoint.lng };
    }
    if (currentGpsPoint && Number.isFinite(currentGpsPoint.lat) && Number.isFinite(currentGpsPoint.lng)) {
      return { lat: currentGpsPoint.lat, lng: currentGpsPoint.lng };
    }
    return { lat: AUCKLAND.lat, lng: AUCKLAND.lng };
  }

  function currentCarHeading(){
    const heading = map3d && Number(map3d.heading);
    return Number.isFinite(heading) ? heading : 0;
  }

  function syncCarModelSwitch(){
    document.querySelectorAll("#carModelSwitch [data-model]").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.model === activeCarModelId);
    });
    const hint = document.getElementById("carModelHint");
    if (hint) hint.textContent = activeCarModel().label + " · drag to rotate · pinch to zoom";
  }

  function setActiveCarModel(id){
    if (!CAR_MODELS[id]) return;
    const changed = id !== activeCarModelId;
    activeCarModelId = id;
    try { localStorage.setItem("aaCarModel", id); } catch (err) {}
    syncCarModelSwitch();
    const viewerHost = document.getElementById("carModelHost");
    if (viewerHost) {
      const old = viewerHost.querySelector("model-viewer");
      if (old) old.remove();
      if (document.getElementById("carModelOverlay")?.classList.contains("open")) {
        openCarModelViewer();
      }
    }
    if (!changed || !map3d) return;
    const pos = currentCarPoint();
    const heading = currentCarHeading();
    if (userCar) {
      try { userCar.remove(); } catch (err) {}
      userCar = null;
    }
    detachUserCar();
    preloadCarModel();
    if (isNavigating()) showUserCar();
  }

  function preloadCarModel(){
    if (!map3d || !Model3DElement) return;
    attachUserCar(currentCarPoint(), currentCarHeading());
    hideUserCar();
  }

  function prefetchCarModels(){
    Object.keys(CAR_MODELS).forEach(id => {
      const url = CAR_MODELS[id] && CAR_MODELS[id].url;
      if (!url) return;
      try { fetch(url, { cache: "force-cache", mode: "cors" }); } catch (err) {}
    });
  }
  prefetchCarModels();

  function carMapPosition(point){
    return { lat: point.lat, lng: point.lng };
  }

  function cameraRange(){
    const range = Number(map3d && map3d.range);
    return Number.isFinite(range) ? range : CAR_REF_RANGE;
  }

  function carScaleForCamera(){
    const range = Math.max(cameraRange(), 40);
    const fov = Number(map3d && map3d.fov);
    const f = Number.isFinite(fov) ? clamp(fov, 20, 90) : CAR_REF_FOV;
    const refTan = Math.tan((CAR_REF_FOV * Math.PI / 180) / 2);
    const tan = Math.tan((f * Math.PI / 180) / 2);
    const raw = CAR_BASE_SCALE * (range / CAR_REF_RANGE) * (tan / refTan);
    return Math.max(CAR_BASE_SCALE * 0.9, raw);
  }

  function applyLiveCarScale(){
    if (!userCar || usingArrow) return;
    const next = carScaleForCamera();
    if (Math.abs(next - lastCarScale) < 0.02) return;
    lastCarScale = next;
    try { userCar.scale = next; } catch (err) {}
  }

  function arrowScaleForCamera(){
    const range = clamp(cameraRange(), 80, 14000);
    const fov = Number(map3d && map3d.fov);
    const f = Number.isFinite(fov) ? clamp(fov, 20, 90) : ARROW_REF_FOV;
    const refTan = Math.tan((ARROW_REF_FOV * Math.PI / 180) / 2);
    const tan = Math.tan((f * Math.PI / 180) / 2);
    return (range / ARROW_REF_RANGE) * (tan / refTan);
  }

  function applyCarScale(){
    syncCarLod();
  }

  function hideUserCar(){
    if (userCar) {
      try { userCar.scale = 0.001; } catch (err) {}
    }
  }

  function detachUserCar(){
    if (userCar) {
      try { userCar.remove(); } catch (err) {}
      userCar = null;
      carModelReady = false;
    }
  }

  function showUserCar(){
    if (!isNavigating()) {
      hideUserCar();
      return;
    }
    const pos = currentCarPoint();
    const heading = Number.isFinite(lastCarHeading) ? lastCarHeading : currentCarHeading();
    if (!userCar) {
      attachUserCar(pos, heading);
      return;
    }
    if (!userCar.parentElement && map3d) map3d.append(userCar);
    // Guarded: this runs on every camera-change event (60x/s while following).
    applyLiveCarScale();
    applyCarPose(pos, heading);
  }

  function hideHeadingArrow(){
    if (userArrow) {
      try { userArrow.scale = 0.001; } catch (err) {}
    }
    lastArrowScale = 0;
    if (userMarker) {
      try { userMarker.remove(); } catch (err) {}
      userMarker = null;
    }
  }

  function detachHeadingArrow(){
    if (userArrow) {
      try { userArrow.remove(); } catch (err) {}
      userArrow = null;
      lastArrowScale = 0;
    }
    if (userMarker) {
      try { userMarker.remove(); } catch (err) {}
      userMarker = null;
    }
  }

  function applyArrowPose(point, heading){
    if (!userArrow) return;
    const h = Number.isFinite(heading) ? heading : lastCarHeading;
    try { userArrow.position = carMapPosition(point); } catch (err) {}
    try { userArrow.orientation = arrowOrientation(h); } catch (err) {}
    const next = arrowScaleForCamera();
    if (usingArrow && Math.abs(next - lastArrowScale) >= 0.02) {
      lastArrowScale = next;
      try { userArrow.scale = next; } catch (err) {}
    }
  }

  function attachHeadingArrow(position, heading){
    if (!isNavigating() || !Model3DElement || !map3d) return;
    if (userArrow) {
      applyArrowPose(position, heading);
      return;
    }
    try {
      const scale = arrowScaleForCamera();
      lastArrowScale = scale;
      userArrow = new Model3DElement({
        src: HEADING_ARROW_URL,
        position: carMapPosition(position),
        orientation: arrowOrientation(Number.isFinite(heading) ? heading : 0),
        scale,
        altitudeMode: MODEL_ALTITUDE_MODE
      });
      map3d.append(userArrow);
      try { userArrow.src = HEADING_ARROW_URL; } catch (err) {}
      applyArrowPose(position, heading);
    } catch (err) {
      console.error(err);
      userArrow = null;
    }
  }

  function showHeadingArrow(){
    if (!isNavigating()) {
      hideHeadingArrow();
      return;
    }
    const pos = currentCarPoint();
    const heading = Number.isFinite(lastCarHeading) ? lastCarHeading : currentCarHeading();
    if (!userArrow) {
      attachHeadingArrow(pos, heading);
      return;
    }
    if (!userArrow.parentElement && map3d) map3d.append(userArrow);
    applyArrowPose(pos, heading);
  }

  function syncCarLod(){
    if (syncCarLod.busy) return;
    syncCarLod.busy = true;
    try {
      if (!isNavigating()) {
        hideUserCar();
        hideHeadingArrow();
        usingArrow = false;
        return;
      }
      const range = cameraRange();
      const wantArrow = USE_HEADING_ARROW && (usingArrow ? range > CAR_ARROW_RANGE_IN : range > CAR_ARROW_RANGE);
      usingArrow = wantArrow;
      if (wantArrow) {
        hideUserCar();
        showHeadingArrow();
      } else {
        hideHeadingArrow();
        showUserCar();
        applyLiveCarScale();
      }
    } finally {
      syncCarLod.busy = false;
    }
  }

  let carPoseWritten = null;
  function applyCarPose(point, heading){
    lastCarPoint = { lat: point.lat, lng: point.lng };
    if (Number.isFinite(heading)) lastCarHeading = heading;
    if (userCar) {
      // Skip the native writes when nothing moved enough to see (the follow ticker
      // and the camera-change events both land here every frame).
      const w = carPoseWritten;
      const same = w && w.car === userCar &&
        Math.abs(w.lat - lastCarPoint.lat) < 1e-8 && Math.abs(w.lng - lastCarPoint.lng) < 1e-8 &&
        Math.abs(((w.heading - lastCarHeading + 540) % 360) - 180) < 0.02;
      if (!same) {
        try { userCar.position = carMapPosition(lastCarPoint); } catch (err) {}
        try { userCar.orientation = carOrientation(lastCarHeading); } catch (err) {}
        carPoseWritten = { car: userCar, lat: lastCarPoint.lat, lng: lastCarPoint.lng, heading: lastCarHeading };
      }
    }
    if (userArrow) applyArrowPose(lastCarPoint, lastCarHeading);
    if (userMarker) {
      try { userMarker.position = { lat: lastCarPoint.lat, lng: lastCarPoint.lng }; } catch (err) {}
    }
  }

  function attachUserCar(position, heading){
    if (!Model3DElement || !map3d) return;
    if (userCar) {
      applyCarPose(position, heading);
      return;
    }
    const h = Number.isFinite(heading) ? heading : 0;
    const src = carModelUrl();
    const hidden = !isNavigating();
    const scale = hidden ? 0.001 : carScaleForCamera();
    try {
      userCar = new Model3DElement({
        src,
        position: carMapPosition(position),
        orientation: carOrientation(h),
        scale,
        altitudeMode: MODEL_ALTITUDE_MODE
      });
      const revealModel = () => {
        carModelReady = true;
        if (!userCar) return;
        if (!isNavigating()) {
          try { userCar.scale = 0.001; } catch (err) {}
          lastCarScale = 0.001;
        } else {
          applyLiveCarScale();
        }
      };
      userCar.addEventListener("gmp-load", revealModel);
      userCar.addEventListener("load", revealModel);
      userCar.addEventListener("gmp-error", () => {
        console.error("3D car model failed to load", src);
        if (userCar) {
          userCar.remove();
          userCar = null;
        }
        carModelReady = false;
        usingArrow = false;
        if (USE_HEADING_ARROW && isNavigating()) showHeadingArrow();
      });
      map3d.append(userCar);
      try { userCar.src = src; } catch (err) {}
      try { userCar.scale = scale; } catch (err) {}
      lastCarScale = scale;
      applyCarPose(position, h);
    } catch (err) {
      console.error(err);
      userCar = null;
      usingArrow = false;
    }
  }

  function setupAutocomplete(PlaceAutocompleteElement){
    placeAutocomplete = new PlaceAutocompleteElement();
    placeAutocomplete.placeholder = "Search destination...";
    placeAutocomplete.includedRegionCodes = ["nz"];
    placeAutocomplete.locationBias = { radius: 50000, center: AUCKLAND };
    document.getElementById("searchHost").append(placeAutocomplete);
    document.getElementById("searchHost").addEventListener("click", event => {
      if (event.target && event.target.closest && event.target.closest("#searchResults")) return;
      const value = (placeAutocomplete && placeAutocomplete.value != null) ? String(placeAutocomplete.value) : "";
      try { if (window.Car && typeof Car.onInputFocused === "function") Car.onInputFocused(value); } catch (err) {}
    });

    placeAutocomplete.addEventListener("gmp-select", async ({ placePrediction }) => {
      try {
        setMessage("Loading selected destination...");
        const place = placePrediction.toPlace();
        await place.fetchFields({ fields: ["displayName", "formattedAddress", "location"] });
        if (!place.location) throw new Error("Selected place has no location.");
        const destination = { lat: place.location.lat(), lng: place.location.lng() };
        const name = place.displayName || place.formattedAddress || "Selected destination";
        await calculateRoute(getRouteOrigin(), destination, name);
      } catch (err) {
        console.error(err);
        setMessage("Could not route to that destination.");
      }
    });
  }

  function setAutocompleteValue(text){
    const ac = placeAutocomplete || document.querySelector("gmp-place-autocomplete");
    if (!ac) return;
    const value = String(text || "");
    try { ac.value = value; } catch (err) {}
    const inner = ac.shadowRoot && ac.shadowRoot.querySelector("input, textarea, [contenteditable='true']");
    if (inner) {
      if (inner.isContentEditable) inner.textContent = value;
      else inner.value = value;
      inner.dispatchEvent(new Event("input", { bubbles:true }));
      inner.dispatchEvent(new Event("change", { bubbles:true }));
    }
    ac.dispatchEvent(new Event("input", { bubbles:true }));
    ac.dispatchEvent(new Event("change", { bubbles:true }));
  }

  function predictionText(value){
    if (value == null) return "";
    if (typeof value === "string") return value;
    if (typeof value.text === "string") return value.text;
    try { return String(value); } catch (err) { return ""; }
  }

  let suggestTimer = null;
  function scheduleSearchSuggestions(query){
    clearTimeout(suggestTimer);
    suggestTimer = setTimeout(() => previewSearchSuggestions(query), 180);
  }

  function pushSearchSuggestions(query, items){
    renderSearchDropdown(items);
    try {
      if (window.Car && typeof Car.onSearchSuggestions === "function") {
        Car.onSearchSuggestions(JSON.stringify({ query: String(query || ""), items: items || [] }));
      }
    } catch (err) {}
  }

  function renderSearchDropdown(items){
    const box = document.getElementById("searchResults");
    if (!box) return;
    const hits = Array.isArray(items) ? items : [];
    box.innerHTML = "";
    if (!hits.length) {
      box.hidden = true;
      box.classList.remove("open");
      chromeLocked = false;
      return;
    }
    hits.forEach(item => {
      const button = document.createElement("button");
      button.type = "button";
      const title = document.createElement("span");
      title.textContent = item.title || item.placeId || "Result";
      button.append(title);
      if (item.subtitle) {
        const sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = item.subtitle;
        button.append(sub);
      }
      button.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        pickSearchResult(item.placeId, item.title);
      });
      box.append(button);
    });
    box.hidden = false;
    box.classList.add("open");
    if (!isAndroidAuto()) {
      showChrome();
      chromeLocked = true;
    }
  }

  function hideSearchDropdown(){
    const box = document.getElementById("searchResults");
    if (!box) return;
    box.hidden = true;
    box.classList.remove("open");
    box.innerHTML = "";
    chromeLocked = false;
  }

  async function previewSearchSuggestions(query){
    const q = String(query || "").trim();
    if (!q) {
      pushSearchSuggestions("", []);
      return;
    }
    try {
      const { AutocompleteSuggestion } = await google.maps.importLibrary("places");
      const center = currentGpsPoint || AUCKLAND;
      const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
        input: q,
        includedRegionCodes: ["nz"],
        locationBias: { radius: 50000, center }
      });
      const items = (suggestions || []).slice(0, 6).map(entry => {
        const prediction = entry.placePrediction || {};
        const structured = prediction.structuredFormat || {};
        const place = (typeof prediction.toPlace === "function") ? prediction.toPlace() : null;
        const title = predictionText(structured.mainText || prediction.mainText) || predictionText(prediction.text);
        const subtitle = predictionText(structured.secondaryText || prediction.secondaryText);
        return {
          placeId: prediction.placeId || (place && (place.id || place.placeId)) || "",
          title: title || q,
          subtitle
        };
      }).filter(item => item.placeId || item.title);
      pushSearchSuggestions(q, items);
    } catch (err) {
      console.error(err);
    }
  }

  async function searchDestinationFromQuery(query){
    const q = String(query || "").trim();
    setAutocompleteValue(q);
    showChrome();
    if (!q) {
      pushSearchSuggestions("", []);
      return;
    }
    await previewSearchSuggestions(q);
  }

  async function pickSearchResult(placeId, fallbackName){
    const id = String(placeId || "").trim();
    const label = String(fallbackName || "").trim();
    setAutocompleteValue(label);
    hideSearchDropdown();
    showChrome();
    if (!id) return;
    try {
      const { Place } = await google.maps.importLibrary("places");
      const place = new Place({ id });
      await place.fetchFields({ fields: ["displayName", "formattedAddress", "location"] });
      if (!place.location) throw new Error("Selected place has no location.");
      const destination = { lat: place.location.lat(), lng: place.location.lng() };
      const name = place.displayName || place.formattedAddress || label || "Selected destination";
      await calculateRoute(getRouteOrigin(), destination, name);
    } catch (err) {
      console.error(err);
      setMessage("Could not route to that destination.");
    }
  }

  window.__aaSetSearchText = function(text){
    setAutocompleteValue(text);
    scheduleSearchSuggestions(text);
  };
  window.__aaSubmitSearch = searchDestinationFromQuery;
  window.__aaPickSearchResult = pickSearchResult;

  const ROUTE_FIELDS = ["path", "distanceMeters", "durationMillis", "staticDurationMillis"];
  // "speedPaths" is the JS library's shorthand that also populates travelAdvisory.speedReadingIntervals.
  const ROUTE_TRAFFIC_FIELDS = ["speedPaths"];

  // One traffic-aware route. `origin` may carry a `heading` (DirectionalLocation) so a
  // reroute departs the way the car is already pointing. The traffic-on-polyline extra
  // is requested first; if the loaded API build rejects it, retry for a plain route.
  async function requestRoute(origin, destination, wantTraffic = true){
    const request = {
      origin,
      destination: { lat: destination.lat, lng: destination.lng },
      travelMode: "DRIVING",
      routingPreference: "TRAFFIC_AWARE",
      language: "en-NZ",
      units: google.maps.UnitSystem.METRIC,
      fields: wantTraffic ? ROUTE_FIELDS.concat(ROUTE_TRAFFIC_FIELDS) : ROUTE_FIELDS
    };
    if (wantTraffic) request.extraComputations = ["TRAFFIC_ON_POLYLINE"];
    let result;
    try {
      result = await RouteClass.computeRoutes(request);
    } catch (err) {
      if (!wantTraffic) throw err;
      console.warn("Traffic-on-polyline request failed, retrying without traffic", err);
      return requestRoute(origin, destination, false);
    }
    if (!result.routes || !result.routes.length) throw new Error("Google returned no route.");
    const route = result.routes[0];
    const path = Array.from(route.path || []).map(point => ({
      lat: typeof point.lat === "function" ? point.lat() : point.lat,
      lng: typeof point.lng === "function" ? point.lng() : point.lng
    }));
    if (path.length < 2) throw new Error("Route returned without a usable path.");
    return { route, path, intervals: routeTrafficIntervals(route, path) };
  }

  // Make `route` the active one: geometry, drawing, card, speed limits, trace metadata.
  // `keepNav` = a mid-drive reroute (stay in navigation; the car re-acquires at the next fix).
  function adoptRoute(route, path, intervals, destination, keepNav){
    activeRoute = route;
    activeRoutePath = path;
    activeDestination = destination;
    setRouteGeometry(path);
    drawRoute(path, intervals);
    drawDestination(destination);
    updateRouteInfo(route, destination.name, keepNav);
    fetchSpeedLimits(path);
    offRoute.hits = 0;
    if (keepNav) traceRec.dest = { name: destination.name, lat: destination.lat, lng: destination.lng };
  }

  async function calculateRoute(origin, destination, destinationName){
    stopDemo();
    if (!RouteClass || !map3d) return;
    setMessage(`Calculating route to ${destinationName}...`);

    try {
      const { route, path, intervals } = await requestRoute({ lat: origin.lat, lng: origin.lng }, destination);
      adoptRoute(route, path, intervals, { name: destinationName, lat: destination.lat, lng: destination.lng }, false);
      showRoutePreview(origin, destination, route.distanceMeters);
      setMessage("Route ready. Tap Go to start, or X to cancel.");
    } catch (err) {
      console.error(err);
      setMessage("Route request failed. Check that Routes API is enabled for this key. " + (err?.message || String(err)));
    }
  }

  // ---- Route line: traffic-coloured ahead, grey behind the car ----

  const ROUTE_COLOURS = {
    NORMAL: "#4285F4",       // free flow
    SLOW: "#E8923D",         // slowdown
    TRAFFIC_JAM: "#D93838",  // jam
    DONE: "#9AA0A6"          // traversed
  };
  let routeLines = [];        // one Polyline3DElement per traffic interval (the whole route)
  let routeDoneLine = null;   // grey overlay from the route start to the car
  let routeDoneUpdatedM = -Infinity;
  const ROUTE_DONE_STEP_M = 4;

  // Routes API speedReadingIntervals -> [{start, end, speed}] over `path` indices; a route
  // without traffic data (or a plain retry) is one NORMAL interval.
  function routeTrafficIntervals(route, path){
    const raw = route && route.travelAdvisory && route.travelAdvisory.speedReadingIntervals;
    const out = [];
    if (Array.isArray(raw)) {
      for (const iv of raw) {
        const s = Number(iv.startPolylinePointIndex), e = Number(iv.endPolylinePointIndex);
        if (!Number.isFinite(s) || !Number.isFinite(e) || e <= s) continue;
        out.push({ start: clamp(Math.round(s), 0, path.length - 1), end: clamp(Math.round(e), 0, path.length - 1), speed: String(iv.speed || "NORMAL") });
      }
    }
    if (!out.length) out.push({ start: 0, end: path.length - 1, speed: "NORMAL" });
    return out;
  }

  function makeRouteLine(path, color, zIndex){
    return new Polyline3DElement({
      path,
      strokeColor: color,
      outerColor: "#FFFFFF",
      strokeWidth: 9,
      outerWidth: 0.35,
      altitudeMode: MODEL_ALTITUDE_MODE,
      drawsOccludedSegments: true,
      zIndex
    });
  }

  function drawRoute(path, intervals){
    removeRouteLines();
    for (const iv of intervals || [{ start: 0, end: path.length - 1, speed: "NORMAL" }]) {
      const seg = path.slice(iv.start, iv.end + 1);
      if (seg.length < 2) continue;
      const line = makeRouteLine(seg, ROUTE_COLOURS[iv.speed] || ROUTE_COLOURS.NORMAL, 20);
      map3d.append(line);
      routeLines.push(line);
    }
    routeDoneUpdatedM = -Infinity;
  }

  function removeRouteLines(){
    for (const line of routeLines) { try { line.remove(); } catch (err) {} }
    routeLines = [];
    if (routeDoneLine) { try { routeDoneLine.remove(); } catch (err) {} routeDoneLine = null; }
    routeDoneUpdatedM = -Infinity;
  }

  // The traversed part greys out behind the car: a grey line from the route start to the
  // car's along-route position, drawn OVER the coloured segments (so they never need
  // re-splitting). Refreshed every few metres of progress, not every frame.
  function updateTraversedRoute(){
    if (!isNavigating() || !puck.engaged || activeRoutePath.length < 2 || routeCum.length !== activeRoutePath.length) return;
    const m = puck.progressM;
    if (Math.abs(m - routeDoneUpdatedM) < ROUTE_DONE_STEP_M) return;
    routeDoneUpdatedM = m;
    let i = 1;
    while (i < routeCum.length && routeCum[i] <= m) i++;
    const donePath = activeRoutePath.slice(0, i);
    donePath.push(pointAtMetres(activeRoutePath, routeCum, m).point);
    if (donePath.length < 2) return;
    if (!routeDoneLine) {
      routeDoneLine = makeRouteLine(donePath, ROUTE_COLOURS.DONE, 21);
      map3d.append(routeDoneLine);
    } else {
      routeDoneLine.path = donePath;
    }
  }

  function drawDestination(destination){
    if (destinationMarker) destinationMarker.remove();
    destinationMarker = new Marker3DElement({
      position: { lat: destination.lat, lng: destination.lng },
      label: destination.name,
      sizePreserved: true
    });
    map3d.append(destinationMarker);
  }

  function formatDuration(ms){
    const mins = Math.max(1, Math.round(ms / 60000));
    if (mins < 60) return `${mins} min`;
    const hours = Math.floor(mins / 60);
    const remain = mins % 60;
    return remain ? `${hours} hr ${remain} min` : `${hours} hr`;
  }

  function formatDistance(meters){
    const km = meters / 1000;
    if (km < 10) return `${km.toFixed(1)} km`;
    return `${Math.round(km)} km`;
  }

  function updateRouteInfo(route, destinationName, keepNav){
    const mins = Math.max(1, Math.round(route.durationMillis / 60000));
    const eta = new Date(Date.now() + route.durationMillis);
    routeTimeEl.textContent = formatDuration(route.durationMillis);
    routeStatsEl.textContent = `${formatDistance(route.distanceMeters)} · ${formatTime(eta)}`;
    routeTitleEl.textContent = destinationName;

    if (Number.isFinite(route.staticDurationMillis) && route.staticDurationMillis > 0) {
      const staticMins = Math.round(route.staticDurationMillis / 60000);
      const trafficDifference = mins - staticMins;
      if (trafficDifference > 1) {
        routeSubEl.textContent = `+${trafficDifference} min traffic`;
        routeSubEl.className = "traffic-delay";
      } else {
        routeSubEl.textContent = "Usual traffic";
        routeSubEl.className = "";
      }
    } else {
      routeSubEl.textContent = "Traffic-aware route";
      routeSubEl.className = "";
    }
    document.body.classList.add("has-route");
    document.documentElement.classList.add("has-route");
    if (!keepNav) {
      document.body.classList.remove("navigating");
      document.documentElement.classList.remove("navigating");
    }
    syncCarLod();
  }

  function showRoutePreview(origin, destination, distanceMeters){
    following = false;
    document.getElementById("followBtn").textContent = "Following: OFF";
    updateRecenterButton();
    showRouteOverview(origin, destination, distanceMeters);
  }

  // `opts.flyover` (default true): sweep the route from the destination back to the car
  // before diving into the drive view.
  function enterNavigation(opts){
    if (!activeRoutePath || activeRoutePath.length < 2) return;
    document.body.classList.add("navigating");
    document.documentElement.classList.add("navigating");
    following = true;
    cam.userRange = null;
    autoRefollowArmed = false;
    document.getElementById("followBtn").textContent = "Following: ON";
    // Re-acquire the car onto this route at the next fix (the ticker glides the
    // camera from wherever it is - typically the route overview - into the drive view).
    disengageRoutePuck();
    currentView = "drive";
    setViewSelectValue("drive");
    cam.seeded = false; // never cut: seed from the live (overview) camera and ease
    updateCompassButton();
    const here = currentGpsPoint || getRouteOrigin();
    let heading = Number.isFinite(here.heading) ? here.heading : (Number(map3d.heading) || 0);
    if (activeRoutePath.length >= 2) heading = bearingDegrees(activeRoutePath[0], activeRoutePath[1]);
    // Synthetic re-injection of the current point: carry the modelled speed so it isn't
    // read as "zero metres since the last fix" and briefly stall the car / zoom.
    applyGpsFix({ lat: here.lat, lng: here.lng }, heading, speedKalman.seeded ? { speed: speedKalman.speed } : undefined);
    if (!opts || opts.flyover !== false) startFlyover();
    if (activeDestination) traceRec.dest = { name: activeDestination.name, lat: activeDestination.lat, lng: activeDestination.lng };
    syncCarLod();
    updateRecenterButton();
    updateSpeedLimitBadge();
    setMessage("Navigation started.");
  }

  function clearNavigation(){
    stopDemo();
    removeRouteLines();
    flyover = null;
    offRoute.hits = 0;
    if (destinationMarker) { destinationMarker.remove(); destinationMarker = null; }
    activeRoute = null;
    activeDestination = null;
    activeRoutePath = [];
    setRouteGeometry([]);
    speedLimit.ways = [];
    speedLimit.current = null;
    speedLimit.routeId += 1;
    updateSpeedLimitBadge();
    traceRec.dest = null;
    document.body.classList.remove("has-route", "navigating");
    document.documentElement.classList.remove("has-route", "navigating");
    hideUserCar();
    hideHeadingArrow();
    usingArrow = false;
    routeTimeEl.textContent = "--";
    routeStatsEl.textContent = "";
    routeSubEl.textContent = "";
    routeTitleEl.textContent = "";
    setMessage("Navigation ended.");
  }

  function showRouteOverview(origin, destination, distanceMeters){
    map3d.center = { lat: (origin.lat + destination.lat) / 2, lng: (origin.lng + destination.lng) / 2 };
    map3d.heading = bearingDegrees(origin, destination);
    map3d.tilt = 58;
    const routeDistance = Number.isFinite(distanceMeters) ? distanceMeters : distanceMetres(origin, destination);
    map3d.range = clamp(routeDistance * 0.75, 1200, 18000);
    cam.seeded = false; // camera moved outside the ticker: re-seed from here when following resumes
    setViewSelectValue("overview");
  }

  function getRouteOrigin(){
    return currentGpsPoint ? { lat: currentGpsPoint.lat, lng: currentGpsPoint.lng } : { lat: TEST_ORIGIN.lat, lng: TEST_ORIGIN.lng };
  }

  async function randomRoute(){
    const destination = TEST_DESTINATIONS[Math.floor(Math.random() * TEST_DESTINATIONS.length)];
    await calculateRoute(getRouteOrigin(), destination, destination.name);
  }

  function startGps(){
    stopDemo();
    if (!navigator.geolocation) { setMessage("This browser does not support geolocation."); return; }
    if (watchId !== null) return;
    setMessage("Requesting precise location permission...");
    watchId = navigator.geolocation.watchPosition(handlePosition, handleGpsError, { enableHighAccuracy:true, maximumAge:500, timeout:20000 });
    document.getElementById("gpsBtn").textContent = "Stop GPS";
  }

  function stopGps(){
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    document.getElementById("gpsBtn").textContent = "Start GPS";
  }

  function toggleGps(){
    if (watchId !== null) { stopGps(); setMessage("GPS stopped."); }
    else startGps();
  }

  function isDemoRunning(){
    return demoActive || demoTimer !== null;
  }

  // `extra` = { speed (m/s), accuracy (m), bearingAccuracy (deg), headingMeasured (bool) }.
  function applyGpsFix(point, heading, extra){
    const pos = { lat: point.lat, lng: point.lng };
    const h = Number.isFinite(heading) ? heading : lastCarHeading;
    currentGpsPoint = { lat: pos.lat, lng: pos.lng, heading: h };
    previousFix = currentGpsPoint;
    if (placeAutocomplete) {
      placeAutocomplete.locationBias = { radius: 50000, center: pos };
    }
    updateCar(pos, h, extra || {});
  }

  // Provider gating (Vela): once the follow model has a fix, only GPS-quality fixes feed it -
  // a network/fused fix, or anything coarser than 50 m, would yank the car off the road.
  // Only fixes that carry a provider (host-injected) are gated; browser geolocation has none.
  const GPS_MAX_ACCURACY_M = 50;
  function acceptLiveFix(c){
    if (!c.provider || !puck.fix) return true;
    if (String(c.provider).toLowerCase() !== "gps") return false;
    return !(Number.isFinite(c.accuracy) && c.accuracy > GPS_MAX_ACCURACY_M);
  }

  function handlePosition(position){
    if (isDemoRunning()) return;
    const c = position.coords;
    if (!acceptLiveFix(c)) return;
    recordTraceFix(c);
    const fix = { lat:c.latitude, lng:c.longitude, heading:Number.isFinite(c.heading) ? c.heading : null };
    let heading = fix.heading;
    let headingMeasured = heading !== null;
    if (heading === null && previousFix && distanceMetres(previousFix, fix) > 2) {
      heading = bearingDegrees(previousFix, fix);
      headingMeasured = true;
    }
    if (heading === null) heading = Number.isFinite(lastCarHeading) ? lastCarHeading : (map3d && Number.isFinite(Number(map3d.heading)) ? Number(map3d.heading) : 0);
    currentGpsPoint = { lat: fix.lat, lng: fix.lng, heading };
    previousFix = currentGpsPoint;
    if (!map3d) return;
    applyGpsFix(fix, heading, {
      speed: Number.isFinite(c.speed) && c.speed >= 0 ? c.speed : null,
      accuracy: Number.isFinite(c.accuracy) ? c.accuracy : null,
      bearingAccuracy: Number.isFinite(c.bearingAccuracy) ? c.bearingAccuracy : null,
      headingMeasured
    });
    setMessage(`Live GPS · accuracy about ${Math.round(c.accuracy || 0)} m`);
  }

  function carOrientation(heading){
    const yaw = Number.isFinite(activeCarModel().yawOffset) ? activeCarModel().yawOffset : -90;
    return { heading: normaliseHeading(heading + yaw), tilt: 270, roll: 90 };
  }

  function updateCar(point, heading, extra){
    const h = normaliseHeading(heading);
    ingestFix({
      lat: point.lat,
      lng: point.lng,
      heading: h,
      headingMeasured: extra.headingMeasured !== false,
      speed: extra.speed,
      accuracy: extra.accuracy,
      bearingAccuracy: extra.bearingAccuracy
    });
    updateRecenterButton();
    coordsEl.textContent = `${point.lat.toFixed(5)}, ${point.lng.toFixed(5)}`;
    headingEl.textContent = `${Math.round(h)}°`;
  }

  function lookAhead(point, heading, metres){
    const rad = toRad(heading);
    const dLat = (metres * Math.cos(rad)) / 111320;
    const dLng = (metres * Math.sin(rad)) / (111320 * Math.max(0.2, Math.cos(toRad(point.lat))));
    return { lat: point.lat + dLat, lng: point.lng + dLng };
  }

  // ---- Route geometry helpers (Vela: pointAtMeters / snapToRouteWindowed) ----

  function setRouteGeometry(path){
    routeCum = cumulativeLengths(path);
    disengageRoutePuck();
    prefetchRouteTerrain(path, routeCum);
  }

  function disengageRoutePuck(){
    puck.engaged = false;
    puck.missCount = 0;
    puck.fwdRejects = 0;
    puck.smoothWin = NaN;
    alongFilter.reset();
  }

  function cumulativeLengths(path){
    const cum = new Array(path.length).fill(0);
    for (let i = 1; i < path.length; i++) cum[i] = cum[i - 1] + distanceMetres(path[i - 1], path[i]);
    return cum;
  }

  // Point + segment bearing at `metres` along the route (binary search on cum).
  function pointAtMetres(path, cum, metres){
    if (path.length < 2) return { point: path[0] || { lat: AUCKLAND.lat, lng: AUCKLAND.lng }, bearing: 0 };
    const total = cum[cum.length - 1];
    const d = clamp(metres, 0, total);
    let lo = 1, hi = path.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (cum[mid] < d) lo = mid + 1; else hi = mid;
    }
    const a = path[lo - 1], b = path[lo];
    const segLen = cum[lo] - cum[lo - 1];
    const t = segLen > 0 ? clamp((d - cum[lo - 1]) / segLen, 0, 1) : 0;
    return { point: { lat: lerp(a.lat, b.lat, t), lng: lerp(a.lng, b.lng, t) }, bearing: bearingDegrees(a, b) };
  }

  // Closest point on segment a->b to p (local equirectangular), plus t in [0,1].
  function projectOnSegment(p, a, b){
    const k = Math.cos(toRad((a.lat + b.lat) / 2));
    const ax = a.lng * k, ay = a.lat, bx = b.lng * k, by = b.lat, px = p.lng * k, py = p.lat;
    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    const t = len2 === 0 ? 0 : clamp(((px - ax) * dx + (py - ay) * dy) / len2, 0, 1);
    return { point: { lat: ay + t * dy, lng: (ax + t * dx) / k }, t };
  }

  // Map-match `me` onto the route, considering only segments whose along-route range
  // overlaps [loM, hiM] (forward-only once engaged, so a route that passes near itself
  // can't yank the car onto the wrong leg). Null when we're not genuinely on the route:
  // farther than maxM, or the GPS course disagrees with the road by > 55 degrees.
  function snapToRouteWindowed(me, gpsBearing, path, cum, loM, hiM, maxM){
    if (path.length < 2 || cum.length < path.length) return null;
    let bestD = Infinity, best = null;
    for (let i = 1; i < path.length; i++) {
      if (cum[i] < loM || cum[i - 1] > hiM) continue;
      const a = path[i - 1], b = path[i];
      const proj = projectOnSegment(me, a, b);
      const d = distanceMetres(me, proj.point);
      if (d < bestD) {
        bestD = d;
        best = { point: proj.point, bearing: bearingDegrees(a, b), metres: cum[i - 1] + proj.t * (cum[i] - cum[i - 1]) };
      }
    }
    if (!best || bestD > maxM) return null;
    if (Number.isFinite(gpsBearing) && angleDelta(gpsBearing, best.bearing) > 55) return null;
    return best;
  }

  function angleDelta(a, b){ return Math.abs(((a - b + 540) % 360) - 180); }
  function easeK(dt, tau){ return 1 - Math.exp(-dt / tau); }
  function smoothBearing(cur, target, dt, tau){
    const d = ((target - cur + 540) % 360) - 180;
    return normaliseHeading(cur + d * easeK(dt, tau));
  }

  // ---- Fix ingest: a fix updates targets only; the ticker does the moving ----

  function ingestFix(fix){
    const now = performance.now();
    const prev = puck.fix;
    let speed = Number.isFinite(fix.speed) && fix.speed >= 0 ? fix.speed : null;
    if (speed == null && prev) {
      // No doppler speed (browser geolocation often omits it): derive from the fix pair.
      const dt = (now - prev.atMs) / 1000;
      if (dt > 0.3) speed = clamp(distanceMetres(prev, fix) / dt, 0, 60);
    }
    const heading = Number.isFinite(fix.heading) ? normaliseHeading(fix.heading) : null;
    const bearingOk = heading != null && fix.headingMeasured &&
      (!Number.isFinite(fix.bearingAccuracy) || fix.bearingAccuracy <= 45);
    puck.fix = {
      lat: fix.lat, lng: fix.lng, heading, bearingOk, speed,
      accuracy: Number.isFinite(fix.accuracy) ? fix.accuracy : null,
      atMs: now
    };
    if (speed != null) speedKalman.update(speed);

    // First fix, or a teleport: snap into place, don't glide across the city.
    const drawn = Number.isFinite(puck.lat) ? { lat: puck.lat, lng: puck.lng } : null;
    if (!drawn || distanceMetres(drawn, fix) > FOLLOW.TELEPORT_M) {
      puck.lat = fix.lat;
      puck.lng = fix.lng;
      if (heading != null) puck.heading = heading;
      disengageRoutePuck();
      followAlt = null;
    }

    // A trustworthy course: moving, measured (not a held-over value), and not flagged inaccurate.
    // Speed unknown = trust the measured heading (handlePosition only derives one after > 2 m).
    if (bearingOk && (speed == null || speed > 2)) puck.freeHeading = heading;
    if (!Number.isFinite(puck.heading) && heading != null) puck.heading = heading;
    prefetchTerrain(fix, Number.isFinite(puck.freeHeading) ? puck.freeHeading : heading);

    const routeLive = isNavigating() && activeRoutePath.length >= 2 && routeCum.length === activeRoutePath.length;
    if (routeLive) {
      ingestRouteFix(puck.fix, now);
      checkOffRoute(puck.fix, now);
      updateSpeedLimit(puck.fix);
    } else if (puck.engaged) {
      disengageRoutePuck();
    }
    ensureFollowTicker();
  }

  // ---- Off-route detection -> reroute (Vela NavEngine) ----

  // Nearest point on the WHOLE route (the map matcher only looks in its forward window).
  function distanceToRoute(me, path){
    let best = Infinity, bearing = NaN;
    for (let i = 1; i < path.length; i++) {
      const a = path[i - 1], b = path[i];
      const proj = projectOnSegment(me, a, b);
      const d = distanceMetres(me, proj.point);
      if (d < best) { best = d; bearing = bearingDegrees(a, b); }
    }
    return { d: best, bearing };
  }

  function checkOffRoute(fix, now){
    if (!activeDestination || activeRoutePath.length < 2) return;
    const { d, bearing } = distanceToRoute(fix, activeRoutePath);
    const acc = Number.isFinite(fix.accuracy) && fix.accuracy > 0 ? fix.accuracy : 12;
    const corridor = Math.max(OFF_ROUTE.CORRIDOR_M, acc * 1.5);
    const moving = speedKalman.speed >= OFF_ROUTE.MOVING_MPS;
    const far = d > OFF_ROUTE.FAR_M;
    const headingOff = moving && fix.bearingOk && Number.isFinite(bearing) && angleDelta(bearing, fix.heading) > OFF_ROUTE.HEADING_DEG;
    if (d <= corridor) {
      // Inside the corridor: clean unless the course disagrees with the road AND we're
      // clearly to one side of it (a parallel street), which counts double.
      if (!headingOff) offRoute.hits = 0;
      else if (d > corridor * 0.25) offRoute.hits += 2;
    } else if (!moving && !far) {
      // Stationary multipath drifting outside the corridor: hold the count.
    } else {
      offRoute.hits += far ? 2 : 1;
    }
    if (offRoute.hits < OFF_ROUTE.HITS) return;
    offRoute.hits = 0;
    if (offRoute.inFlight || now - offRoute.lastRerouteMs < OFF_ROUTE.COOLDOWN_MS) return;
    if (distanceMetres(fix, activeDestination) <= OFF_ROUTE.DEST_ZONE_M) return;
    requestReroute(fix);
  }

  async function requestReroute(fix){
    if (!RouteClass || !activeDestination) return;
    const dest = activeDestination;
    offRoute.inFlight = true;
    offRoute.lastRerouteMs = performance.now();
    setMessage("Rerouting...");
    try {
      const origin = fix.bearingOk && Number.isFinite(fix.heading)
        ? { lat: fix.lat, lng: fix.lng, heading: fix.heading }
        : { lat: fix.lat, lng: fix.lng };
      const { route, path, intervals } = await requestRoute(origin, dest);
      // Navigation ended or the destination changed while the request was out: drop it.
      if (!isNavigating() || activeDestination !== dest) return;
      adoptRoute(route, path, intervals, dest, true);
      offRoute.lastRerouteMs = performance.now();
      setMessage("Rerouted.");
    } catch (err) {
      console.error(err);
      setMessage("Reroute failed. " + (err?.message || String(err)));
    } finally {
      offRoute.inFlight = false;
    }
  }

  // ---- Speed limit (OSM maxspeed along the route, via Overpass) ----
  // The Routes API carries no speed limits, so like Vela the badge comes from OpenStreetMap:
  // one query per route for every tagged way within 20 m of the path, then the car is
  // matched to the nearest heading-compatible way each fix. Shown only while navigating
  // and only when a limit is known; never the current speed.

  const OVERPASS_URL = "https://overpass-api.de/api/interpreter";
  const SPEED_LIMIT_MATCH_M = 22;      // way must pass this close to the fix
  const SPEED_LIMIT_FORGET_M = 300;    // clear the badge this far past the last matched way
  const IMPLICIT_MAXSPEED = {          // OSM zone tags -> km/h
    "NZ:urban": 50, "NZ:rural": 100, "AU:urban": 50, "AU:rural": 100,
    "GB:nsl_single": 97, "GB:nsl_dual": 113, "GB:motorway": 113,
    "DE:urban": 50, "DE:rural": 100, "FR:urban": 50, "FR:rural": 80
  };
  const speedLimit = { ways: [], routeId: 0, current: null, lastHitM: -Infinity };

  function parseMaxspeed(raw){
    if (!raw) return null;
    const s = String(raw).trim();
    if (IMPLICIT_MAXSPEED[s]) return IMPLICIT_MAXSPEED[s];
    const m = s.match(/^(\d+(?:\.\d+)?)\s*(mph|km\/h|kmh|kph)?$/i);
    if (!m) return null;
    const n = parseFloat(m[1]);
    const kmh = m[2] && m[2].toLowerCase() === "mph" ? n * 1.609344 : n;
    return kmh > 0 ? Math.round(kmh) : null;
  }

  async function fetchSpeedLimits(path){
    const id = ++speedLimit.routeId;
    speedLimit.ways = [];
    speedLimit.current = null;
    speedLimit.lastHitM = -Infinity;
    updateSpeedLimitBadge();
    if (!path || path.length < 2) return;
    const pts = downsamplePath(path, 80).map(p => `${p.lat.toFixed(5)},${p.lng.toFixed(5)}`).join(",");
    const query = `[out:json][timeout:20];way["highway"]["maxspeed"](around:20,${pts});out geom;`;
    try {
      const res = await fetch(OVERPASS_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "data=" + encodeURIComponent(query)
      });
      if (!res.ok) throw new Error("Overpass " + res.status);
      const json = await res.json();
      if (id !== speedLimit.routeId) return; // a newer route superseded this query
      const ways = [];
      for (const el of json.elements || []) {
        const kmh = parseMaxspeed(el.tags && el.tags.maxspeed);
        if (!kmh || !Array.isArray(el.geometry) || el.geometry.length < 2) continue;
        ways.push({ kmh, pts: el.geometry.map(g => ({ lat: g.lat, lng: g.lon })) });
      }
      speedLimit.ways = ways;
    } catch (err) {
      console.warn("Speed limits unavailable", err);
    }
  }

  function matchSpeedLimit(point, heading){
    let best = null, bestD = SPEED_LIMIT_MATCH_M;
    const latTol = 0.0012, lngTol = 0.0016; // ~130 m coarse reject before projecting
