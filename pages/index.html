    if (Number.isFinite(route.staticDurationMillis) && route.staticDurationMillis > 0) {
      const staticMins = Math.round(route.staticDurationMillis / 60000);
      const trafficDifference = mins - staticMins;
      if (trafficDifference > 1) {
        routeSubEl.textContent = `+${trafficDifference} min traffic`;
        routeSubEl.className = "traffic-delay";
      } else {
        routeSubEl.textContent = "";
        routeSubEl.className = "";
      }
    } else {
      routeSubEl.textContent = "";
      routeSubEl.className = "";
    }

    document.documentElement.classList.add("has-route");

      document.documentElement.classList.remove("navigating");

  function escapeHtml(text){
    return String(text == null ? "" : text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // "Open · Closes at 17:00" style status: a bold state word followed by the detail in grey.
  function hoursStatusHtml(hours){
    const text = String((hours && hours.text) || "");
    const kind = String((hours && hours.kind) || "");
    let state = "", detail = text;
    if (kind === "open24") { state = "Open 24 hours"; detail = ""; }
    else if (kind === "open") { state = "Open"; }
    else if (kind === "soon") { state = "Closing soon"; }
    else if (kind === "closed") {
      if (/^Opens/i.test(text)) state = "Closed";
      else { state = text; detail = ""; }
    }
    if (!state) return escapeHtml(text);
    return `<span class="hours-state">${escapeHtml(state)}</span>` + (detail ? `<span class="hours-detail">· ${escapeHtml(detail)}</span>` : "");
  }

  function fillRouteCardExtras(dest){

    if (routeRatingEl) {

  function showRoutePreview(origin, destination, distanceMeters, opts){
    following = false;

  // `opts.flyover` (default true): sweep the route from the destination back to the car
  // before diving into the drive view.
  function enterNavigation(opts){
    if (!activeRoutePath || activeRoutePath.length < 2) return;
    if (explore.mode) exitExploreMode();
    const fromPreview = !!destPreview;
    armStartCountdown();
    cancelStartCountdown();
    stopDestPreview();
    stopCarInspect();
    document.body.classList.add("navigating");
    document.documentElement.classList.add("navigating");
    following = true;
    cam.userRange = null;
    autoRefollowArmed = false;
    document.getElementById("followBtn").textContent = "Following: ON";
    // Re-acquire the car onto this route at the next fix (the ticker glides the
    // camera from wherever it is - typically the dest preview - into the drive view).
    disengageRoutePuck();
    currentView = "drive";
    setViewSelectValue("drive");
    cam.seeded = false; // never cut: seed from the live (overview) camera and ease
    updateCompassButton();
    resetNavInfo(true);
    const here = currentGpsPoint || getRouteOrigin();
    let heading = Number.isFinite(here.heading) ? here.heading : (Number(map3d.heading) || 0);
    if (activeRoutePath.length >= 2) heading = bearingDegrees(activeRoutePath[0], activeRoutePath[1]);
    // Synthetic re-injection of the current point: carry the modelled speed so it isn't
    // read as "zero metres since the last fix" and briefly stall the car / zoom.
    applyGpsFix({ lat: here.lat, lng: here.lng }, heading, speedKalman.seeded ? { speed: speedKalman.speed } : undefined);
    setMapLabels(true);
    if (!opts || opts.flyover !== false) startFlyover({ fromPreview });
    if (activeDestination) traceRec.dest = { name: activeDestination.name, lat: activeDestination.lat, lng: activeDestination.lng };
    syncCarLod();
    updateRecenterButton();
    updateSpeedLimitBadge();
    updateNavHud();
    resumeNavAudio();
    setMessage("Navigation started.");
  }

    try {

          fields: PLACE_CORE_FIELDS.concat(PLACE_EXTRA_FIELDS),
          locationRestriction: { center: { lat: origin.lat, lng: origin.lng }, radius: 8000 },

          maxResultCount: 10
        });
        found = nearby.places || [];
      } catch (err) {
        console.warn("Nearby place search failed", err);
      }
      if (!found.length) {
        try {
          const nearby = await Place.searchNearby({
            fields: PLACE_CORE_FIELDS.concat(PLACE_EXTRA_FIELDS),
            locationRestriction: { center: { lat: origin.lat, lng: origin.lng }, radius: 12000 },
            maxResultCount: 10
          });
          found = nearby.places || [];
        } catch (err) {
          console.warn("Nearby place search retry failed", err);

      }
      if (!found.length) {
        const sample = TEST_DESTINATIONS[Math.floor(Math.random() * TEST_DESTINATIONS.length)];
        const text = await Place.searchByText({
          textQuery: `${sample.name} Auckland`,
          fields: PLACE_CORE_FIELDS.concat(PLACE_EXTRA_FIELDS),
          locationBias: { center: { lat: sample.lat, lng: sample.lng }, radius: 4000 },
          maxResultCount: 5,
          region: "nz"
        });
        found = text.places || [];
      }
    } catch (err) {
      console.warn("Place search failed", err);
    }
    let dest = null;
    if (found.length) {
      const withPhoto = found.filter(p => p.photos && p.photos.length);
      const farEnough = found.filter(p => {
        const loc = latLngOf(p.location);
        return loc && distanceMetres(origin, loc) > 900;
      });
      const pool = (withPhoto.length ? withPhoto.filter(p => farEnough.indexOf(p) >= 0) : farEnough);
      const pickFrom = pool.length ? pool : (withPhoto.length ? withPhoto : found);
      const picked = pickFrom[Math.floor(Math.random() * pickFrom.length)];
      dest = await fetchPlaceDestination(picked, "Nearby place") || snapshotPlace(picked, "Nearby place");
    }

  window.__aaStartNavCardTest = startNavCardTest;

  function startGps(){
    stopDemo();
    if (!navigator.geolocation) { setMessage("This browser does not support geolocation."); return; }
    if (watchId !== null) return;
    setMessage("Requesting precise location permission...");
    watchId = navigator.geolocation.watchPosition(handlePosition, handleGpsError, { enableHighAccuracy:true, maximumAge:500, timeout:20000 });
    document.getElementById("gpsBtn").textContent = "Stop GPS";
  }

  function stopGps(){
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    document.getElementById("gpsBtn").textContent = "Start GPS";
  }

  function toggleGps(){
    if (watchId !== null) { stopGps(); setMessage("GPS stopped."); }
    else startGps();
  }

  function isDemoRunning(){
    return demoActive || demoTimer !== null;
  }

  // `extra` = { speed (m/s), accuracy (m), bearingAccuracy (deg), headingMeasured (bool) }.
  function applyGpsFix(point, heading, extra){
    const pos = { lat: point.lat, lng: point.lng };
    const h = Number.isFinite(heading) ? heading : lastCarHeading;
    currentGpsPoint = { lat: pos.lat, lng: pos.lng, heading: h };
    previousFix = currentGpsPoint;
    if (placeAutocomplete) {
      placeAutocomplete.locationBias = { radius: 50000, center: pos };
    }
    updateCar(pos, h, extra || {});
  }

  // Provider gating (Vela): once the follow model has a fix, only GPS-quality fixes feed it -
  // a network/fused fix, or anything coarser than 50 m, would yank the car off the road.
  // Only fixes that carry a provider (host-injected) are gated; browser geolocation has none.
  const GPS_MAX_ACCURACY_M = 50;
  function acceptLiveFix(c){
    if (!c.provider || !puck.fix) return true;
    if (String(c.provider).toLowerCase() !== "gps") return false;
    return !(Number.isFinite(c.accuracy) && c.accuracy > GPS_MAX_ACCURACY_M);
  }

  function handlePosition(position){
    if (isDemoRunning()) return;
    const c = position.coords;
    if (!acceptLiveFix(c)) return;
    recordTraceFix(c);
    const fix = { lat:c.latitude, lng:c.longitude, heading:Number.isFinite(c.heading) ? c.heading : null };
    let heading = fix.heading;
    let headingMeasured = heading !== null;
    if (heading === null && previousFix && distanceMetres(previousFix, fix) > 2) {
      heading = bearingDegrees(previousFix, fix);
      headingMeasured = true;
    }
    if (heading === null) heading = Number.isFinite(lastCarHeading) ? lastCarHeading : (map3d && Number.isFinite(Number(map3d.heading)) ? Number(map3d.heading) : 0);
    currentGpsPoint = { lat: fix.lat, lng: fix.lng, heading };
    previousFix = currentGpsPoint;
    if (!map3d) return;
    applyGpsFix(fix, heading, {
      speed: Number.isFinite(c.speed) && c.speed >= 0 ? c.speed : null,
      accuracy: Number.isFinite(c.accuracy) ? c.accuracy : null,
      bearingAccuracy: Number.isFinite(c.bearingAccuracy) ? c.bearingAccuracy : null,
      headingMeasured
    });
    setMessage(`Live GPS · accuracy about ${Math.round(c.accuracy || 0)} m`);
  }

  function carOrientation(heading){
    const yaw = Number.isFinite(activeCarModel().yawOffset) ? activeCarModel().yawOffset : -90;
    return { heading: normaliseHeading(heading + yaw), tilt: 270, roll: 90 };
  }

  function updateCar(point, heading, extra){
    const h = normaliseHeading(heading);
    ingestFix({
      lat: point.lat,
      lng: point.lng,
      heading: h,
      headingMeasured: extra.headingMeasured !== false,
      speed: extra.speed,
      accuracy: extra.accuracy,
      bearingAccuracy: extra.bearingAccuracy
    });
    updateRecenterButton();
    coordsEl.textContent = `${point.lat.toFixed(5)}, ${point.lng.toFixed(5)}`;
    headingEl.textContent = `${Math.round(h)}°`;
  }

  function lookAhead(point, heading, metres){
    const rad = toRad(heading);
    const dLat = (metres * Math.cos(rad)) / 111320;
    const dLng = (metres * Math.sin(rad)) / (111320 * Math.max(0.2, Math.cos(toRad(point.lat))));
    return { lat: point.lat + dLat, lng: point.lng + dLng };
  }

  // NZ drives on the left: shift the Google centerline into the left lane.
  function offsetPathLeft(path, metres){
    if (!metres || !path || path.length < 2) return path;
    const out = new Array(path.length);
    for (let i = 0; i < path.length; i++) {
      const brg = i === 0
        ? bearingDegrees(path[0], path[1])
        : i === path.length - 1
          ? bearingDegrees(path[i - 1], path[i])
          : bearingDegrees(path[i - 1], path[i + 1]);
      out[i] = lookAhead(path[i], brg - 90, metres);
    }
    return out;
  }

  // ---- Route geometry helpers (Vela: pointAtMeters / snapToRouteWindowed) ----

  function setRouteGeometry(path){
    routeCum = cumulativeLengths(path);
    disengageRoutePuck();
    prefetchRouteTerrain(path, routeCum);
  }

  function disengageRoutePuck(){
    puck.engaged = false;
    puck.missCount = 0;
    puck.fwdRejects = 0;
    puck.smoothWin = NaN;
    alongFilter.reset();
  }

  function cumulativeLengths(path){
    const cum = new Array(path.length).fill(0);
    for (let i = 1; i < path.length; i++) cum[i] = cum[i - 1] + distanceMetres(path[i - 1], path[i]);
    return cum;
  }

  // Point + segment bearing at `metres` along the route (binary search on cum).
  function pointAtMetres(path, cum, metres){
    if (path.length < 2) return { point: path[0] || { lat: AUCKLAND.lat, lng: AUCKLAND.lng }, bearing: 0 };
    const total = cum[cum.length - 1];
    const d = clamp(metres, 0, total);
    let lo = 1, hi = path.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (cum[mid] < d) lo = mid + 1; else hi = mid;
    }
    const a = path[lo - 1], b = path[lo];
    const segLen = cum[lo] - cum[lo - 1];
    const t = segLen > 0 ? clamp((d - cum[lo - 1]) / segLen, 0, 1) : 0;
    return { point: { lat: lerp(a.lat, b.lat, t), lng: lerp(a.lng, b.lng, t) }, bearing: bearingDegrees(a, b) };
  }

  // Closest point on segment a->b to p (local equirectangular), plus t in [0,1].
  function projectOnSegment(p, a, b){
    const k = Math.cos(toRad((a.lat + b.lat) / 2));
    const ax = a.lng * k, ay = a.lat, bx = b.lng * k, by = b.lat, px = p.lng * k, py = p.lat;
    const dx = bx - ax, dy = by - ay;
    const len2 = dx * dx + dy * dy;
    const t = len2 === 0 ? 0 : clamp(((px - ax) * dx + (py - ay) * dy) / len2, 0, 1);
    return { point: { lat: ay + t * dy, lng: (ax + t * dx) / k }, t };
  }

  // Map-match `me` onto the route, considering only segments whose along-route range
  // overlaps [loM, hiM] (forward-only once engaged, so a route that passes near itself
  // can't yank the car onto the wrong leg). Null when we're not genuinely on the route:
  // farther than maxM, or the GPS course disagrees with the road by > 55 degrees.
  function snapToRouteWindowed(me, gpsBearing, path, cum, loM, hiM, maxM){
    if (path.length < 2 || cum.length < path.length) return null;
    let bestD = Infinity, best = null;
    for (let i = 1; i < path.length; i++) {
      if (cum[i] < loM || cum[i - 1] > hiM) continue;
      const a = path[i - 1], b = path[i];
      const proj = projectOnSegment(me, a, b);
      const d = distanceMetres(me, proj.point);
      if (d < bestD) {
        bestD = d;
        best = { point: proj.point, bearing: bearingDegrees(a, b), metres: cum[i - 1] + proj.t * (cum[i] - cum[i - 1]) };
      }
    }
    if (!best || bestD > maxM) return null;
    if (Number.isFinite(gpsBearing) && angleDelta(gpsBearing, best.bearing) > 55) return null;
    return best;
  }

  function angleDelta(a, b){ return Math.abs(((a - b + 540) % 360) - 180); }
  function easeK(dt, tau){ return 1 - Math.exp(-dt / tau); }
  function smoothBearing(cur, target, dt, tau){
    const d = ((target - cur + 540) % 360) - 180;
    return normaliseHeading(cur + d * easeK(dt, tau));
  }

  // ---- Fix ingest: a fix updates targets only; the ticker does the moving ----

  function ingestFix(fix){
    const now = performance.now();
    const prev = puck.fix;
    let speed = Number.isFinite(fix.speed) && fix.speed >= 0 ? fix.speed : null;
    if (speed == null && prev) {
      // No doppler speed (browser geolocation often omits it): derive from the fix pair.
      const dt = (now - prev.atMs) / 1000;
      if (dt > 0.3) speed = clamp(distanceMetres(prev, fix) / dt, 0, 60);
    }
    const heading = Number.isFinite(fix.heading) ? normaliseHeading(fix.heading) : null;
    const bearingOk = heading != null && fix.headingMeasured &&
      (!Number.isFinite(fix.bearingAccuracy) || fix.bearingAccuracy <= 45);
    puck.fix = {
      lat: fix.lat, lng: fix.lng, heading, bearingOk, speed,
      accuracy: Number.isFinite(fix.accuracy) ? fix.accuracy : null,
      atMs: now
    };
    if (speed != null) speedKalman.update(speed);

    // First fix, or a teleport: snap into place, don't glide across the city.
    const drawn = Number.isFinite(puck.lat) ? { lat: puck.lat, lng: puck.lng } : null;
    if (!drawn || distanceMetres(drawn, fix) > FOLLOW.TELEPORT_M) {
      puck.lat = fix.lat;
      puck.lng = fix.lng;
      if (heading != null) puck.heading = heading;
      disengageRoutePuck();
      followAlt = null;
      carAlt = null;
    }
    if (!prev && following && map3d && !destPreview && !exploreFly && !isNavigating()) {
      const here = { lat: puck.lat, lng: puck.lng };
      const from = cam.seeded && Number.isFinite(cam.lat)
        ? { lat: cam.lat, lng: cam.lng }
        : readMapCenter();
      if (from && Number.isFinite(from.lat) && distanceMetres(from, here) > 400) {
        cam.lat = here.lat;
        cam.lng = here.lng;
        cam.seeded = true;
        cam.rejoin = false;
        followAlt = null;
        const center = { lat: here.lat, lng: here.lng };
        const alt = followGroundAltitude(center, 1);
        if (Number.isFinite(alt)) center.altitude = alt;
        map3d.center = center;
      }
    }

    // A trustworthy course: moving, measured (not a held-over value), and not flagged inaccurate.
    // Speed unknown = trust the measured heading (handlePosition only derives one after > 2 m).
    if (bearingOk && (speed == null || speed > 2)) puck.freeHeading = heading;
    if (!Number.isFinite(puck.heading) && heading != null) puck.heading = heading;
    prefetchTerrain(fix, Number.isFinite(puck.freeHeading) ? puck.freeHeading : heading);

    const routeLive = isNavigating() && activeRoutePath.length >= 2 && routeCum.length === activeRoutePath.length;
    if (routeLive) {
      ingestRouteFix(puck.fix, now);
      checkOffRoute(puck.fix, now);
    } else if (puck.engaged) {
      disengageRoutePuck();
    }
    updateSpeedLimit(puck.fix);
    ensureFollowTicker();
  }

  // ---- Off-route detection -> reroute (Vela NavEngine) ----

  // Nearest point on the WHOLE route (the map matcher only looks in its forward window).
  function distanceToRoute(me, path){
    let best = Infinity, bearing = NaN;
    for (let i = 1; i < path.length; i++) {
      const a = path[i - 1], b = path[i];
      const proj = projectOnSegment(me, a, b);
      const d = distanceMetres(me, proj.point);
      if (d < best) { best = d; bearing = bearingDegrees(a, b); }
    }
    return { d: best, bearing };
  }

  function checkOffRoute(fix, now){
    if (!activeDestination || activeRoutePath.length < 2) return;
    const { d, bearing } = distanceToRoute(fix, activeRoutePath);
    const acc = Number.isFinite(fix.accuracy) && fix.accuracy > 0 ? fix.accuracy : 12;
    const corridor = Math.max(OFF_ROUTE.CORRIDOR_M, acc * 1.5);
    const moving = speedKalman.speed >= OFF_ROUTE.MOVING_MPS;
    const far = d > OFF_ROUTE.FAR_M;
    const headingOff = moving && fix.bearingOk && Number.isFinite(bearing) && angleDelta(bearing, fix.heading) > OFF_ROUTE.HEADING_DEG;
    if (d <= corridor) {
      // Inside the corridor: clean unless the course disagrees with the road AND we're
      // clearly to one side of it (a parallel street), which counts double.
      if (!headingOff) offRoute.hits = 0;
      else if (d > corridor * 0.25) offRoute.hits += 2;
    } else if (!moving && !far) {
      // Stationary multipath drifting outside the corridor: hold the count.
    } else {
      offRoute.hits += far ? 2 : 1;
    }
    if (offRoute.hits < OFF_ROUTE.HITS) return;
    offRoute.hits = 0;
    if (offRoute.inFlight || now - offRoute.lastRerouteMs < OFF_ROUTE.COOLDOWN_MS) return;
    if (distanceMetres(fix, activeDestination) <= OFF_ROUTE.DEST_ZONE_M) return;
    requestReroute(fix);
  }

  async function requestReroute(fix){
    if (!RouteClass || !activeDestination) return;
    const dest = activeDestination;
    offRoute.inFlight = true;
    offRoute.lastRerouteMs = performance.now();
    setMessage("Rerouting...");
    try {
      const origin = fix.bearingOk && Number.isFinite(fix.heading)
        ? { lat: fix.lat, lng: fix.lng, heading: fix.heading }
        : { lat: fix.lat, lng: fix.lng };
      const { route, path, intervals } = await requestRoute(origin, activeDriveTo || dest);
      // Navigation ended or the destination changed while the request was out: drop it.
      if (!isNavigating() || activeDestination !== dest) return;
      adoptRoute(route, path, intervals, dest, true);
      offRoute.lastRerouteMs = performance.now();
      setMessage("Rerouted.");
    } catch (err) {
      console.error(err);
      setMessage("Reroute failed. " + (err?.message || String(err)));
    } finally {
      offRoute.inFlight = false;
    }
  }

  // ---- Speed limit (OSM maxspeed along the route, via Overpass) ----
  // The Routes API carries no speed limits, so like Vela the badge comes from OpenStreetMap:
  // one query per route for every tagged way within 20 m of the path, then the car is
  // matched to the nearest heading-compatible way each fix. Shown only while navigating
  // and only when a limit is known; never the current speed.

  const SPEED_LIMIT_MATCH_M = 32;      // way must pass this close to the fix
  const SPEED_LIMIT_FORGET_M = 300;    // clear the badge this far past the last matched way
  const IMPLICIT_MAXSPEED = {          // OSM zone tags -> km/h
    "NZ:urban": 50, "NZ:rural": 100, "AU:urban": 50, "AU:rural": 100,
    "GB:nsl_single": 97, "GB:nsl_dual": 113, "GB:motorway": 113,
    "DE:urban": 50, "DE:rural": 100, "FR:urban": 50, "FR:rural": 80
  };
  const speedLimit = { ways: [], routeId: 0, current: null, lastHitMs: 0, nearAtMs: 0, nearAt: null };

  function parseMaxspeed(raw){
    if (!raw) return null;
    const s = String(raw).trim();
    if (IMPLICIT_MAXSPEED[s]) return IMPLICIT_MAXSPEED[s];
    const m = s.match(/^(\d+(?:\.\d+)?)\s*(mph|km\/h|kmh|kph)?$/i);
    if (!m) return null;
    const n = parseFloat(m[1]);
    const kmh = m[2] && m[2].toLowerCase() === "mph" ? n * 1.609344 : n;
    return kmh > 0 ? Math.round(kmh) : null;
  }

  function wayMaxspeed(tags){
    if (!tags) return null;
    const tagged = parseMaxspeed(tags.maxspeed)
      || parseMaxspeed(tags["maxspeed:forward"])
      || parseMaxspeed(tags["maxspeed:type"])
      || parseMaxspeed(tags["source:maxspeed"]);
    if (tagged) return tagged;
    const hw = String(tags.highway || "");
    if (hw === "living_street" || hw === "residential") return 50;
    if (hw === "motorway" || hw === "motorway_link") return 100;
    if (hw === "trunk" || hw === "trunk_link") return 100;
    return null;
  }

  async function fetchSpeedLimits(path){
    const id = ++speedLimit.routeId;
    speedLimit.ways = [];
    speedLimit.current = null;
    speedLimit.lastHitMs = 0;
    updateSpeedLimitBadge();
    if (!path || path.length < 2) return;
    const pts = downsamplePath(path, 36).map(p => `${p.lat.toFixed(5)},${p.lng.toFixed(5)}`).join(",");
    const query = `[out:json][timeout:12];(way["highway"]["maxspeed"](around:30,${pts});way["highway"]["maxspeed:type"](around:30,${pts});way["highway"]["source:maxspeed"](around:30,${pts});way["highway"]["maxspeed:forward"](around:30,${pts});way["highway"]["turn:lanes"](around:30,${pts});way["highway"]["turn:lanes:forward"](around:30,${pts});way["highway"~"^(residential|living_street|motorway|motorway_link|trunk|trunk_link)$"](around:24,${pts}););out geom;`;
    try {
      const json = await overpassJson(query, 12000);
      if (id !== speedLimit.routeId) return; // a newer route superseded this query
      speedLimit.ways = ingestSpeedLimitWays(json.elements);
      rebuildOsmSideStreets();
    } catch (err) {
      console.warn("Speed limits unavailable", err);
    }
  }

  function ingestSpeedLimitWays(elements){
    const ways = [];
    for (const el of elements || []) {
      const tags = el.tags || {};
      const kmh = wayMaxspeed(tags);
      const turnForward = tags["turn:lanes:forward"] || "";
      const turnLanes = turnForward || tags["turn:lanes"] || "";
      const laneCount = parseInt(tags.lanes, 10);
      const lanesForward = parseInt(tags["lanes:forward"], 10);
      const highway = tags.highway || "";
      const name = tags.name || "";
      if (!Array.isArray(el.geometry) || el.geometry.length < 2) continue;
      if (!kmh && !turnLanes && !(laneCount > 0) && !isSideStreetHighway(highway, name)) continue;
      ways.push({
        kmh: kmh || 0,
        turnLanes,
        turnLaneSource: turnForward ? "forward" : (turnLanes ? "way" : ""),
        lanes: Number.isFinite(laneCount) && laneCount > 0 ? laneCount : 0,
        lanesForward: Number.isFinite(lanesForward) && lanesForward > 0 ? lanesForward : 0,
        highway,
        name,
        pts: el.geometry.map(g => ({ lat: g.lat, lng: g.lon }))
      });
    }
    return ways;
  }

  function mergeSpeedLimitWays(ways){
    if (!ways || !ways.length) return;
    if (!speedLimit.ways.length) {
      speedLimit.ways = ways;
      return;
    }
    ways.forEach(w => {
      const a = w.pts && w.pts[0];
      if (!a) return;
      const dup = speedLimit.ways.some(h => {
        const b = h.pts && h.pts[0];
        return b && h.highway === w.highway && Math.abs(b.lat - a.lat) < 1e-4 && Math.abs(b.lng - a.lng) < 1e-4;
      });
      if (!dup) speedLimit.ways.push(w);
    });
  }

  async function fetchSpeedLimitsNear(point){
    if (!point || !Number.isFinite(point.lat) || !Number.isFinite(point.lng)) return;
    const query = `[out:json][timeout:10];way["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|motorway_link|trunk_link|primary_link|secondary_link)$"](around:180,${point.lat.toFixed(5)},${point.lng.toFixed(5)});out geom;`;
    try {
      const json = await overpassJson(query, 10000);
      const ways = ingestSpeedLimitWays(json.elements);
      mergeSpeedLimitWays(ways);
    } catch (err) {
      console.warn("Nearby speed limits unavailable", err);
    }
  }

  function maybeFetchNearbySpeedLimits(point){
    const now = performance.now();
    const wait = isNavigating() ? 8000 : 12000;
    if (now - speedLimit.nearAtMs < wait) return;
    const prev = speedLimit.nearAt;
    if (prev && distanceMetres(prev, point) < 90 && speedLimit.ways.length) return;
    speedLimit.nearAtMs = now;
    speedLimit.nearAt = { lat: point.lat, lng: point.lng };
    fetchSpeedLimitsNear(point);
  }

  function matchSpeedLimit(point, heading){
    let best = null, bestD = SPEED_LIMIT_MATCH_M;
    const latTol = 0.0012, lngTol = 0.0016; // ~130 m coarse reject before projecting
    for (const way of speedLimit.ways) {
      if (!way.kmh) continue;
      const pts = way.pts;
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i];
        if (Math.abs(a.lat - point.lat) > latTol && Math.abs(b.lat - point.lat) > latTol) continue;
        if (Math.abs(a.lng - point.lng) > lngTol && Math.abs(b.lng - point.lng) > lngTol) continue;
        const d = distanceMetres(point, projectOnSegment(point, a, b).point);
        if (d >= bestD) continue;
        if (Number.isFinite(heading)) {
          // Ways are undirected here: accept either direction, reject cross streets.
          const diff = angleDelta(bearingDegrees(a, b), heading);
          if (Math.min(diff, 180 - diff) > 40) continue;
        }
        bestD = d;
        best = way;
      }
    }
    return best;
  }

  function updateSpeedLimit(fix){
    if (!fix) return;
    maybeFetchNearbySpeedLimits(fix);
    const heading = fix.bearingOk ? fix.heading : (Number.isFinite(puck.heading) ? puck.heading : NaN);
    const hit = matchSpeedLimit(fix, heading);
    const now = performance.now();
    if (hit != null && hit.kmh) {
      speedLimit.current = hit.kmh;
      speedLimit.lastHitMs = now;
    } else if (speedLimit.lastHitMs && now - speedLimit.lastHitMs > 10000) {
      speedLimit.current = null;
    }
    updateSpeedLimitBadge();
  }

  function freeHudMoving(){
    return speedKalman.speed * 3.6 > 10;
  }

  function updateSpeedLimitBadge(){
    const el = document.getElementById("speedLimitBadge");
    if (!el) return;
    const show = speedLimit.current != null && (isNavigating() || freeHudMoving());
    el.classList.toggle("visible", show);
    document.body.classList.toggle("has-speed-limit", show);
    document.documentElement.classList.toggle("has-speed-limit", show);
    if (show) el.textContent = String(speedLimit.current);
  }

  // Port of Vela's nav fix block: forward-only map matching with a plausibility gate,
  // then the along-route position filter takes the fix as a MEASUREMENT.
  function ingestRouteFix(fix, now){
    const path = activeRoutePath, cum = routeCum;
    const me = { lat: fix.lat, lng: fix.lng };
    const kSpeed = speedKalman.speed;
    let snap;
    if (puck.engaged) {
      // Look-ahead sized from the speed at the last ACCEPTED fix too, so a decaying model
      // during an outage doesn't shrink the window exactly when the resume fix needs it big.
      const aheadSpeed = Math.max(kSpeed, puck.speedAtAccept);
      const ahead = clamp(aheadSpeed * 8, 150, 600);
      snap = snapToRouteWindowed(
        me,
        (kSpeed < 1 || !fix.bearingOk) ? null : fix.heading, // heading gate skipped when stopped
        path, cum,
        puck.targetM - 25, puck.targetM + ahead,
        FOLLOW.SNAP_MAX_M + clamp(aheadSpeed, 0, 13)
      );
    } else {
      // Not yet engaged (nav start / new route): one global acquisition, then forward-only.
      snap = snapToRouteWindowed(me, fix.bearingOk ? fix.heading : null, path, cum, -Infinity, Infinity, FOLLOW.SNAP_MAX_M + 13);
    }
    if (snap) {
      const m = snap.metres;
      let accepted = false, reanchor = false;
      if (!puck.engaged) {
        puck.engaged = true;
        puck.progressM = m;
        puck.targetM = m;
        puck.smoothWin = NaN;
        puck.fwdRejects = 0;
        accepted = true;
        reanchor = true;
      } else {
        // Monotonic forward only: accept a plausible advance (speed x elapsed x 2.5 + 60 m
        // absorbs a real GPS gap), hold on anything else and let dead reckoning cover it.
        const dtFix = clamp((now - puck.targetAtMs) / 1000, 0, 10);
        const maxStep = Math.max(kSpeed, 1) * dtFix * 2.5 + 60;
        const fwd = m - puck.targetM;
        if (fwd >= 0 && fwd <= maxStep && (kSpeed > 0.5 || fwd > 8)) {
          // (parked-jitter gate: at ~zero speed a small forward hop is noise, not travel)
          puck.targetM = m;
          accepted = true;
          puck.fwdRejects = 0;
        } else if (fwd > maxStep) {
          // An over-cap jump that PERSISTS is the new reality (long fix gap at speed).
          puck.fwdRejects += 1;
          if (puck.fwdRejects >= 2) {
            puck.targetM = m;
            accepted = true;
            reanchor = true;
            puck.fwdRejects = 0;
          }
        } else {
          puck.fwdRejects = 0;
        }
      }
      puck.missCount = 0;
      if (accepted) {
        puck.targetAtMs = now;
        if (reanchor) alongFilter.reseed(m, fix.accuracy);
        else alongFilter.update(m, fix.accuracy);
        puck.speedAtAccept = speedKalman.speed;
      }
    } else if (puck.engaged) {
      // Nothing ahead within tolerance: a spike or we've left the route. Hold and keep
      // dead-reckoning; a short run of misses disengages to re-acquire globally.
      puck.missCount += 1;
      if (puck.missCount >= FOLLOW.MISS_LIMIT) disengageRoutePuck();
    }
  }

  // ---- Per-frame ticker ----

  let followRaf = 0;
  let followLastMs = 0;
  function ensureFollowTicker(){
    if (!followRaf) followRaf = requestAnimationFrame(followTick);
  }

  function followTick(now){
    followRaf = requestAnimationFrame(followTick);
    // Two frame deltas: dtRaw for the PHYSICS (a janky frame must integrate its full
    // travel or the car loses distance and lurches at each fix), dtEase (capped) for
    // the cosmetic eases so a hitch's catch-up spreads over the next few frames.
    const dtRaw = followLastMs ? clamp((now - followLastMs) / 1000, 0, 0.5) : 0;
    followLastMs = now;
    const dtEase = Math.min(dtRaw, FOLLOW.MAX_EASE_DT);
    if (!map3d) return;
    spinCarWheels(dtRaw);
    if (exploreFly) applyExploreOverviewCamera(dtEase, now);
    else if (destPreview) applyDestPreviewCamera(dtEase, now);
    tickStartCountdown(now);
    if (!puck.fix) {
      if (userWheels.length) applyWheelPose(currentCarPoint(), lastCarHeading);
      if (carInspect) applyCarInspectCamera(dtEase, now);
      return;
    }
    stepPuck(dtRaw, dtEase, now);
    applyCarPose({ lat: puck.lat, lng: puck.lng }, puck.heading);
    updateTraversedRoute();
    // Car mode: a pan let go of the car; re-attach once the screen has been untouched long enough.
    if (autoRefollowArmed && now - lastTouchMs > AUTO_REFOLLOW_MS) {
      if (following && cam.userRange != null) {
        cam.userRange = null;
        autoRefollowArmed = false;
        updateRecenterButton();
        syncFreeZoomDot();
      } else if (!following && !destPreview && !exploreFly && !carInspect && currentGpsPoint) {
        attachFollow(currentView === "overview" ? "drive" : null);
      }
    }
    if (exploreFly) {
      // overview fly owns the camera
    } else if (destPreview) {
      // preview owns the camera until Start or a pan
    } else if (carInspect) {
      applyCarInspectCamera(dtEase, now);
    } else if (following && mapRevealDone) applyFollowCamera(dtEase, now);
    else cam.seeded = false; // re-attach eases in from wherever the user left the camera
    updateSpeedLimitBadge();
    updateNavHud();
    updateTurnCue();
    updateNavInfoButton();
  }

  function stepPuck(dtRaw, dtEase, now){
    const fix = puck.fix;
    const sinceFix = (now - fix.atMs) / 1000;
    if (puck.engaged && activeRoutePath.length >= 2 && routeCum.length === activeRoutePath.length) {
      const path = activeRoutePath, cum = routeCum, total = cum[cum.length - 1];
      speedKalman.predict(dtRaw, forwardAccelNow(now));
      // Past the dead-reckon window with no fix = a measurement outage: decay the speed.
      if (sinceFix > FOLLOW.DEAD_RECKON_S) speedKalman.decay(dtRaw);
      const speed = speedKalman.speed;
      // Dead-reckon the position estimate over THIS frame's slice of the blind window.
      const tEnd = clamp(sinceFix, 0, FOLLOW.DEAD_RECKON_S);
      const tStart = clamp(sinceFix - dtRaw, 0, FOLLOW.DEAD_RECKON_S);
      alongFilter.predict(tEnd > tStart ? speed * (tEnd - tStart) : 0, dtRaw);
      // Rate-domain correction: the car always advances at the modelled speed and the
      // estimate error enters as a BOUNDED nudge to that rate. Can't stall, can't lurch,
      // still monotonic.
      const err = alongFilter.alongM - puck.progressM;
      const maxCatchUp = speed * 1.5 + 2;
      const maxHoldBack = speed * 0.25 + 0.5;
      const corr = clamp(err / FOLLOW.CORRECT_TIME_S, -maxHoldBack, maxCatchUp);
      puck.progressM = clamp(puck.progressM + Math.max(0, (speed + corr) * dtRaw), 0, total);
      // Lateral de-jitter: boxcar average across a speed-scaled along-route window, so
      // lane-level kinks in the polyline cancel instead of wobbling the whole view. The
      // window WIDTH eases slowly (it tracks town vs motorway, not per-fix speed noise).
      const winTarget = clamp(speed * 0.7, 5, 14);
      puck.smoothWin = Number.isNaN(puck.smoothWin) ? winTarget
        : puck.smoothWin + (winTarget - puck.smoothWin) * easeK(dtEase, FOLLOW.WIN_TAU);
      const win = puck.smoothWin;
      const n = FOLLOW.SMOOTH_SAMPLES;
      let sLat = 0, sLng = 0;
      for (let k = 0; k < n; k++) {
        const p = pointAtMetres(path, cum, puck.progressM - win + 2 * win * k / (n - 1)).point;
        sLat += p.lat;
        sLng += p.lng;
      }
      puck.lat = sLat / n;
      puck.lng = sLng / n;
      // Heading from the window ENDS (chord), not the local segment: the segment bearing
      // steps at every vertex; the chord barely moves on a straight road.
      const a = pointAtMetres(path, cum, puck.progressM - win);
      const b = pointAtMetres(path, cum, puck.progressM + win);
      const degenerate = Math.abs(a.point.lat - b.point.lat) + Math.abs(a.point.lng - b.point.lng) < 1e-7;
      const chord = degenerate ? b.bearing : bearingDegrees(a.point, b.point);
      puck.heading = Number.isFinite(puck.heading) ? smoothBearing(puck.heading, chord, dtEase, FOLLOW.CAR_BRG_TAU) : chord;
    } else {
      // Free follow (no route): the car rolls on under its own modelled speed along its
      // smoothed heading, and the last fix - dead-reckoned forward along its course
      // (capped) so it moves like the car - enters as a BOUNDED correction to that
      // motion. Same rate-domain idea as the route model: at this close a range a plain
      // ease toward each new fix (Vela's zoomed-out free drive) would show GPS noise as a
      // visible twitch every second; a capped correction spreads it into a gentle drift.
      speedKalman.predict(dtRaw, forwardAccelNow(now));
      if (sinceFix > FOLLOW.FREE_RECKON_S) speedKalman.decay(dtRaw);
      const v = speedKalman.speed;
      const moving = v > 1.5 && Number.isFinite(puck.freeHeading);
      const reckonM = moving ? v * Math.min(sinceFix, FOLLOW.FREE_RECKON_S) : 0;
      const tgt = reckonM > 0 ? lookAhead(fix, puck.freeHeading, reckonM) : fix;
      if (Number.isFinite(puck.freeHeading)) {
        puck.heading = Number.isFinite(puck.heading) ? smoothBearing(puck.heading, puck.freeHeading, dtEase, FOLLOW.CAR_BRG_TAU) : puck.freeHeading;
      }
      if (moving && sinceFix <= FOLLOW.FREE_RECKON_S && Number.isFinite(puck.heading)) {
        const rolled = lookAhead({ lat: puck.lat, lng: puck.lng }, puck.heading, v * dtRaw);
        puck.lat = rolled.lat;
        puck.lng = rolled.lng;
      }
      const errM = distanceMetres({ lat: puck.lat, lng: puck.lng }, tgt);
      if (errM > 1e-3) {
        // Correction rate cap: gentle (half the speed) for a noise-sized residual, ramping
        // up to the route model's 1.5v+2 catch-up by FREE_FULL_M, and never slower than a
        // ~3 s glide for a huge one (GPS re-lock after an outage, under the teleport cap).
        const ramp = clamp((errM - FOLLOW.FREE_GENTLE_M) / (FOLLOW.FREE_FULL_M - FOLLOW.FREE_GENTLE_M), 0, 1);
        const cap = Math.max(Math.max(v * 0.5, 2) + (v + 2) * ramp, ramp * errM / 3);
        const corrSpeed = Math.min(errM / FOLLOW.CORRECT_TIME_S, cap);
        const f = Math.min(1, corrSpeed * dtRaw / errM);
        puck.lat += (tgt.lat - puck.lat) * f;
        puck.lng += (tgt.lng - puck.lng) * f;
      }
    }
  }

  // ---- Follow camera ----

  function viewTargets(){
    let v;
    if (currentView === "high") v = { tilt: 62, range: 650, fov: 40, headingUp: true, breathe: false };
    else if (currentView === "top") v = { tilt: 0, range: 1300, fov: 35, headingUp: false, breathe: false };
    else if (!isNavigating()) v = { tilt: FREE_REF_TILT, range: FREE_REF_RANGE, fov: CAR_REF_FOV, headingUp: true, breathe: true };
    else v = { tilt: CAR_REF_TILT, range: CAR_REF_RANGE, fov: CAR_REF_FOV, headingUp: true, breathe: true };
    if (northUp && v.headingUp) {
      // North-up: fixed heading with the car centred, a little flatter and wider so the
      // road ahead stays in frame whichever way it runs.
      v = { tilt: Math.min(v.tilt, 48), range: v.range * 1.35, fov: v.fov, headingUp: false, breathe: v.breathe };
    }
    return v;
  }

  function visibleAheadMetres(range, tilt, fov){
    const y = carScreenY();
    const carLook = groundLookAhead(range, tilt, fov, y);
    let edgeLook = groundLookAhead(range, tilt, fov, NAV_INFO.TURN_EDGE_FRAC);
    if (!Number.isFinite(edgeLook)) {
      for (let f = NAV_INFO.TURN_EDGE_FRAC + 0.04; f < y - 0.08; f += 0.04) {
        edgeLook = groundLookAhead(range, tilt, fov, f);
        if (Number.isFinite(edgeLook)) break;
      }
    }
    if (!Number.isFinite(carLook) || !Number.isFinite(edgeLook)) {
      const tiltR = toRad(clamp(tilt, 0, 89.9));
      return Math.max(40, range * Math.sin(tiltR) * 0.8);
    }
    return Math.max(40, carLook - edgeLook);
  }

  function rangeToFitAhead(aheadM, tilt, fov, maxRange){
    const cap = Math.max(120, Number(maxRange) || 24000);
    const need = Math.max(aheadM, 80) + Math.max(NAV_INFO.TURN_PAD_M, aheadM * 0.12);
    const visNear = visibleAheadMetres(120, tilt, fov);
    const visFar = visibleAheadMetres(cap, tilt, fov);
    if (!(visFar > visNear + 20)) {
      return clamp(aheadM * 1.05 + 90, 80, cap);
    }
    let lo = 50, hi = cap;
    for (let i = 0; i < 20; i++) {
      const mid = (lo + hi) / 2;
      if (visibleAheadMetres(mid, tilt, fov) < need) lo = mid;
      else hi = mid;
    }
    return clamp(hi, 80, cap);
  }

  function navInfoMaxLevel(){
    if (isNavigating() && activeRoutePath.length >= 2 && routeCum.length === activeRoutePath.length) {
      if (infoSkipMode) return Math.max(1, navSkipCoverTargets().targets.length);
      return Math.min(NAV_INFO.PEEK_LEVELS, Math.max(1, navTurnCoverTargets().targets.length));
    }
    return NAV_INFO.MAX_LEVEL;
  }

  function upcomingInfoTurnMetres(startM){
    const merged = [];
    const pushM = m => {
      if (!(m > startM + 35)) return;
      if (merged.some(g => Math.abs(g - m) < 45)) return;
      merged.push(m);
    };
    routeManeuvers().forEach(t => pushM(t.m));
    (navSteps || []).forEach(s => {
      const fam = maneuverFamily(s.maneuver);
      if (fam !== "dest" && fam !== "straight") pushM(s.m);
    });
    merged.sort((a, b) => a - b);
    return merged;
  }

  function navTurnCoverTargets(){
    const total = routeCum.length ? routeCum[routeCum.length - 1] : 0;
    const startM = clamp(Number.isFinite(puck.progressM) ? puck.progressM : 0, 0, total);
    const turns = upcomingInfoTurnMetres(startM);
    const closeM = NAV_INFO.CLOSE_TURN_M;
    const PEEK = NAV_INFO.PEEK_LEVELS;
    const targets = [];
    let i = 0;
    while (i < turns.length && (turns[i] - startM) < NAV_INFO.TURN_SKIP_M) i++;
    if (i < turns.length) {
      let end = turns[i++];
      if (i < turns.length && (end - startM) <= closeM && (turns[i] - end) <= closeM) {
        end = turns[i++];
      }
      targets.push(Math.min(end, total));
    }
    while (targets.length < PEEK && i < turns.length) {
      const m = turns[i++];
      if (m > targets[targets.length - 1] + 220) targets.push(Math.min(m, total));
    }
    while (targets.length < PEEK) {
      const last = targets.length ? targets[targets.length - 1] : startM;
      const bump = 380 * Math.pow(2, targets.length);
      const next = Math.min(total, last + bump);
      if (next <= last + 50) break;
      targets.push(next);
      if (next >= total - 8) break;
    }
    if (!targets.length) targets.push(Math.min(total, startM + 220));
    return { startM, total, targets };
  }

  function navSkipCoverTargets(){
    const total = routeCum.length ? routeCum[routeCum.length - 1] : 0;
    const startM = clamp(Number.isFinite(puck.progressM) ? puck.progressM : 0, 0, total);
    const targets = [];
    upcomingNavSteps(startM).forEach(step => {
      const m = Math.min(Number(step.m) || 0, total);
      if (!(m > startM + 8)) return;
      if (targets.length && m - targets[targets.length - 1] < 35) {
        targets[targets.length - 1] = m;
        return;
      }
      targets.push(m);
    });
    if (!targets.length || total - targets[targets.length - 1] > 50) targets.push(total);
    return { startM, total, targets };
  }

  function startSkipFlyTo(toM){
    if (!map3d || activeRoutePath.length < 2 || routeCum.length !== activeRoutePath.length) return;
    const total = routeCum[routeCum.length - 1] || 0;
    const fromM = skipFly && Number.isFinite(skipFly.m)
      ? skipFly.m
      : clamp(Number.isFinite(puck.progressM) ? puck.progressM : 0, 0, total);
    const destM = clamp(Number(toM) || 0, 0, total);
    const dist = Math.abs(destM - fromM);
    skipFly = {
      fromM,
      toM: destM,
      m: fromM,
      startMs: performance.now(),
      durMs: clamp(NAV_INFO.SKIP_FLY_MIN_MS + dist / NAV_INFO.SKIP_FLY_MPS * 1000, NAV_INFO.SKIP_FLY_MIN_MS, NAV_INFO.SKIP_FLY_MAX_MS),
      fromRange: numOr(map3d.range, 480),
      fromTilt: numOr(map3d.tilt, 58)
    };
  }

  function skipFlyFrame(now){
    if (!skipFly || !infoSkipMode || infoLevel <= 0) return null;
    if (activeRoutePath.length < 2 || routeCum.length !== activeRoutePath.length) return null;
    const u = clamp((now - skipFly.startMs) / Math.max(skipFly.durMs, 1), 0, 1);
    const e = u * u * (3 - 2 * u);
    skipFly.m = lerp(skipFly.fromM, skipFly.toM, e);
    const at = pointAtMetres(activeRoutePath, routeCum, skipFly.m);
    const ahead = pointAtMetres(activeRoutePath, routeCum, skipFly.m + 55);
    const degenerate = Math.abs(ahead.point.lat - at.point.lat) + Math.abs(ahead.point.lng - at.point.lng) < 1e-7;
    const dest = skipFly.toM >= (routeCum[routeCum.length - 1] || 0) - 8;
    return {
      point: at.point,
      bearing: degenerate ? at.bearing : bearingDegrees(at.point, ahead.point),
      range: lerp(skipFly.fromRange, dest ? 720 : 500, e),
      tilt: lerp(skipFly.fromTilt, dest ? 52 : 56, e)
    };
  }

  function navInfoPreview(view, baseRange, baseTilt){
    const range0 = Math.max(Number(baseRange) || view.range, 40);
    const maxLevel = navInfoMaxLevel();
    const level = clamp(infoLevel, 0, maxLevel);
    if (level <= 0) return null;
    if (isNavigating() && activeRoutePath.length >= 2 && routeCum.length === activeRoutePath.length) {
      const span = infoSkipMode ? navSkipCoverTargets() : navTurnCoverTargets();
      const idx = Math.min(level - 1, Math.max(0, span.targets.length - 1));
      const endM = span.targets[idx];
      const dest = endM >= span.total - 8;
      if (infoSkipMode) {
        const at = pointAtMetres(activeRoutePath, routeCum, endM);
        const behind = pointAtMetres(activeRoutePath, routeCum, Math.max(0, endM - 70));
        const heading = dest
          ? (Number.isFinite(at.bearing) ? at.bearing : 0)
          : bearingDegrees(behind.point, at.point);
        return {
          range: dest ? 720 : 480,
          tilt: dest ? 52 : 58,
          heading,
          aim: at.point
        };
      }
      const caps = NAV_INFO.PEEK_RANGE_CAPS;
      const cap = caps[Math.min(idx, caps.length - 1)];
      const aheadM = Math.max(endM - span.startM, 80);
      const tilt = dest
        ? clamp(baseTilt - Math.log2(Math.max(aheadM / 90, 1)) * 7, NAV_INFO.TURN_TILT_MIN, baseTilt)
        : clamp(baseTilt - idx * 8 - Math.log2(Math.max(aheadM / 700, 1)) * 2, 52, baseTilt);
      let range = rangeToFitAhead(aheadM, tilt, view.fov, cap);
      range = Math.max(range, range0 * (1.2 + idx * 1.4));
      if (idx > 0) {
        const prevCap = caps[Math.min(idx - 1, caps.length - 1)];
        const prevAhead = Math.max(span.targets[idx - 1] - span.startM, 80);
        const prevFit = rangeToFitAhead(prevAhead, tilt, view.fov, prevCap);
        range = Math.max(range, prevFit * NAV_INFO.PEEK_PULL);
      }
      return { range: clamp(range, 80, cap), tilt };
    }
    const stepIdx = Math.min(level - 1, NAV_INFO.RANGE_STEPS.length - 1);
    return {
      range: range0 * NAV_INFO.RANGE_STEPS[stepIdx],
      tilt: Math.min(baseTilt, NAV_INFO.TILT_CAPS[stepIdx])
    };
  }

  // Speed band -> zoom level (Vela's car bands), with hysteresis so a car hovering at a
  // threshold doesn't flap between two ranges.
  function zoomBandForSpeed(v){
    const kmh = v * 3.6;
    let idx = zoomBandIdx;
    while (idx < ZOOM_BANDS.length - 1 && kmh >= ZOOM_BANDS[idx][0] + ZOOM_BAND_HYST_KMH) idx++;
    while (idx > 0 && kmh < ZOOM_BANDS[idx - 1][0] - ZOOM_BAND_HYST_KMH) idx--;
    zoomBandIdx = idx;
    const clicks = (isNavigating() ? FOLLOW_ZOOM_IN_CLICKS_NAV : FOLLOW_ZOOM_IN_CLICKS_FREE) + sessionZoomClicks;
    return ZOOM_BANDS[idx][1] + clicks * ZOOM_PLUS_STEP;
  }

  function refreshZoomModLabel(){
    const el = document.getElementById("zoomModLabel");
    if (!el) return;
    const nav = FOLLOW_ZOOM_IN_CLICKS_NAV + sessionZoomClicks;
    const free = FOLLOW_ZOOM_IN_CLICKS_FREE + sessionZoomClicks;
    const text = "Nav " + nav + " · Free " + free;
    if (el.textContent !== text) el.textContent = text;
  }

  function nudgeSessionZoom(dir){
    sessionZoomClicks = clamp(sessionZoomClicks + dir, SESSION_ZOOM_MIN, SESSION_ZOOM_MAX);
    if (cam && cam.userRange != null) {
      cam.userRange = null;
      updateRecenterButton();
    }
    refreshZoomModLabel();
  }

  // Range multiplier for an (eased) zoom level relative to the tightest band.
  function rangeFactorForZoom(zoom){
    return Math.pow(2, ZOOM_BANDS[0][1] - zoom);
  }

  // ---- Destination preview orbit ----

  function startDestPreview(destination){
    if (!map3d || !destination || !Number.isFinite(destination.lat) || !Number.isFinite(destination.lng)) return;
    exploreFly = null;
    const c = readMapCenter();
    const heading = numOr(map3d.heading, 0);
    const range = numOr(map3d.range, 0);
    destPreview = {
      dest: { lat: destination.lat, lng: destination.lng },
      from: {
        lat: c.lat,
        lng: c.lng,
        heading,
        range: range > 0 ? range : 1600,
        tilt: numOr(map3d.tilt, 55)
      },
      startMs: performance.now()
    };
    cam.lat = destPreview.from.lat;
    cam.lng = destPreview.from.lng;
    cam.heading = destPreview.from.heading;
    cam.range = destPreview.from.range;
    cam.tilt = destPreview.from.tilt;
    cam.seeded = true;
    ensureFollowTicker();
  }

  function stopDestPreview(){
    destPreview = null;
  }

  function stopCarInspect(){
    carInspect = null;
    window.__aaCarInspect = false;
    document.body.classList.remove("car-inspect");
    document.documentElement.classList.remove("car-inspect");
    try { if (window.Car && typeof Car.setCarInspect === "function") Car.setCarInspect(false); } catch (err) {}
  }

  function exitCarInspect(){
    if (!carInspect) return;
    stopCarInspect();
    if (isNavigating()) attachFollow("drive");
    else updateRecenterButton();
  }

  function startCarInspect(){
    if (carInspect) return;
    if (!map3d || !isNavigating()) return;
    const car = currentCarPoint() || (puck.fix ? { lat: puck.lat, lng: puck.lng } : lastCarPoint);
    if (!car || !Number.isFinite(car.lat)) return;
    stopDestPreview();
    flyover = null;
    following = false;
    autoRefollowArmed = false;
    const followBtn = document.getElementById("followBtn");
    if (followBtn) followBtn.textContent = "Following: OFF";
    const heading = numOr(map3d.heading, Number.isFinite(puck.heading) ? puck.heading : 0);
    carInspect = {
      startMs: performance.now(),
      fromRange: numOr(map3d.range, CAR_REF_RANGE),
      fromTilt: numOr(map3d.tilt, CAR_REF_TILT),
      fromHeading: heading,
      fromFov: numOr(map3d.fov, CAR_REF_FOV),
      userRange: CAR_INSPECT.RANGE,
      userTilt: CAR_INSPECT.TILT,
      yaw: 0,
      spinAcc: 0,
      lastInteractMs: performance.now()
    };
    window.__aaCarInspect = true;
    document.body.classList.add("car-inspect");
    document.documentElement.classList.add("car-inspect");
    try { if (window.Car && typeof Car.setCarInspect === "function") Car.setCarInspect(true); } catch (err) {}
    cam.lat = car.lat;
    cam.lng = car.lng;
    cam.heading = heading;
    cam.range = carInspect.fromRange;
    cam.tilt = carInspect.fromTilt;
    cam.fov = carInspect.fromFov;
    cam.seeded = true;
    chromeLocked = false;
    hideChrome();
    if (userCar && !usingArrow) {
      lastCarScale = 1;
      try { userCar.scale = 1; } catch (err) {}
      applyWheelPose(currentCarPoint(), lastCarHeading);
    }
    ensureFollowTicker();
    updateRecenterButton();
  }

  function applyCarInspectCamera(dtEase, now){
    if (!carInspect || !map3d) return;
    const car = currentCarPoint() || (puck.fix ? { lat: puck.lat, lng: puck.lng } : lastCarPoint);
    if (!car || !Number.isFinite(car.lat)) return;
    const idleFrom = Math.max(carInspect.startMs, carInspect.lastInteractMs || 0);
    if (now - idleFrom >= CAR_INSPECT.IDLE_MS) {
      exitCarInspect();
      return;
    }
    const u = clamp((now - carInspect.startMs) / CAR_INSPECT.SWOOP_MS, 0, 1);
    const e = u * u * (3 - 2 * u);
    const targetRange = clamp(Number(carInspect.userRange) || CAR_INSPECT.RANGE, 8, 90);
    const targetTilt = clamp(Number(carInspect.userTilt) || CAR_INSPECT.TILT, 20, 85);
    cam.range = lerp(carInspect.fromRange, targetRange, e);
    cam.tilt = lerp(carInspect.fromTilt, targetTilt, e);
    cam.fov = lerp(carInspect.fromFov, CAR_INSPECT.FOV, e);
    const yaw = Number(carInspect.yaw) || 0;
    const paused = (now - (carInspect.lastInteractMs || 0)) < CAR_INSPECT.PAUSE_MS;
    if (u >= 1 && !paused) {
      carInspect.spinAcc = (Number(carInspect.spinAcc) || 0) + (dtEase * 1000 / CAR_INSPECT.SPIN_MS) * 360;
    }
    cam.heading = normaliseHeading(carInspect.fromHeading + yaw + (Number(carInspect.spinAcc) || 0));
    const center = { lat: car.lat, lng: car.lng };
    const ground = inspectGroundAltitude(car, dtEase);
    if (Number.isFinite(ground)) center.altitude = ground + CAR_INSPECT.LOOK_AT_M;
    map3d.center = center;
    if (Math.abs(((numOr(map3d.heading, 0) - cam.heading + 540) % 360) - 180) > 0.005) map3d.heading = cam.heading;
    if (Math.abs(numOr(map3d.range, 0) - cam.range) > 0.02) map3d.range = cam.range;
    if (Math.abs(numOr(map3d.tilt, 0) - cam.tilt) > 0.005) map3d.tilt = cam.tilt;
    if (Math.abs(numOr(map3d.fov, 0) - cam.fov) > 0.005) map3d.fov = cam.fov;
    applyLiveCarScale();
    updateCompassNeedle(cam.heading);
  }

  function tapHitsCar(event){
    if (!isNavigating() || !event || flyover) return false;
    const car = currentCarPoint() || lastCarPoint;
    if (!car || !Number.isFinite(car.lat)) return false;
    const w = Math.max(1, viewSafe.width || window.innerWidth || 1);
    const h = Math.max(1, viewSafe.height || window.innerHeight || 1);
    const slop = Math.max(150, Math.min(w, h) * 0.2);
    const x = Number(event.clientX);
    const y = Number(event.clientY);
    if (!Number.isFinite(x) || !Number.isFinite(y)) return false;
    if (carInspect) {
      return Math.hypot(x - w * 0.5, y - h * 0.5) < slop * 1.5;
    }
    if (!following) return false;
    const cx = carScreenX() * w;
    const cy = carScreenY() * h - slop * 0.42;
    const rx = slop;
    const ry = slop * 1.45;
    const dx = (x - cx) / rx;
    const dy = (y - cy) / ry;
    return dx * dx + dy * dy < 1;
  }

  function destPreviewScreenX(){
    const w = Math.max(1, viewSafe.width || window.innerWidth || 1);
    const right = viewSafe.right || 0;
    let visLeft = (viewSafe.left || 0) + 24;
    const card = document.getElementById("routeCard");
    if (card && document.body.classList.contains("has-route") && !document.body.classList.contains("navigating") && !document.body.classList.contains("route-card-stowed")) {
      const box = card.getBoundingClientRect();
      if (box.width > 40) visLeft = Math.max(visLeft, box.right + 28);
    }
    const visRight = Math.max(visLeft + 80, w - right);
    return clamp(((visLeft + visRight) / 2) / w, 0.56, 0.82);
  }

  function destPreviewFocus(){
    const dest = destPreview && destPreview.dest;
    const lot = destPreview && destPreview.lot;
    if (!dest) return dest;
    if (!lot || !Number.isFinite(lot.lat) || !Number.isFinite(lot.lng)) return dest;
    return { lat: (dest.lat + lot.lat) / 2, lng: (dest.lng + lot.lng) / 2 };
  }

  function destPreviewRange(){
    const dest = destPreview && destPreview.dest;
    const lot = destPreview && destPreview.lot;
    if (!dest || !lot || !Number.isFinite(lot.lat)) return DEST_PREVIEW.RANGE;
    const span = Math.max(distanceMetres(dest, lot), 40);
    return clamp(span * 2.7, DEST_PREVIEW.RANGE, 2800);
  }

  function destPreviewTilt(){
    return destPreview && destPreview.lot ? Math.min(DEST_PREVIEW.TILT, 52) : DEST_PREVIEW.TILT;
  }

  function destPreviewCenter(dest, heading, range){
    if (!dest) return dest;
    const w = Math.max(1, viewSafe.width || window.innerWidth || 1);
    const h = Math.max(1, viewSafe.height || window.innerHeight || 1);
    const fov = numOr(cam && cam.fov, CAR_REF_FOV);
    const dx = destPreviewScreenX() - 0.5;
    if (dx < 0.02) return dest;
    const hFovRad = 2 * Math.atan(Math.tan(toRad(fov) / 2) * (w / Math.max(h, 1)));
    const halfW = Math.max(range, 40) * Math.tan(hFovRad / 2);
    const shift = clamp(dx * 2 * halfW, 28, Math.max(48, range * 0.42));
    return lookAhead(dest, heading - 90, shift);
  }

  function applyDestPreviewCamera(dtEase, now){
    if (!destPreview || !map3d) return;
    const dest = destPreviewFocus();
    if (!dest) return;
    const from = destPreview.from;
    const u = clamp((now - destPreview.startMs) / DEST_PREVIEW.SWOOP_MS, 0, 1);
    const e = u * u * (3 - 2 * u);
    cam.lat = lerp(from.lat, dest.lat, e);
    cam.lng = lerp(from.lng, dest.lng, e);
    cam.range = lerp(from.range, destPreviewRange(), e);
    cam.tilt = lerp(from.tilt, destPreviewTilt(), e);
    if (u < 1) {
      cam.heading = from.heading;
    } else if (destPreview.noSpin) {
      cam.heading = from.heading;
    } else {
      const spinU = ((now - destPreview.startMs - DEST_PREVIEW.SWOOP_MS) / DEST_PREVIEW.SPIN_MS) % 1;
      cam.heading = normaliseHeading(from.heading + spinU * 360);
    }
    const pin = { lat: cam.lat, lng: cam.lng };
    const aimed = destPreviewCenter(pin, cam.heading, cam.range);
    const center = {
      lat: lerp(pin.lat, aimed.lat, e),
      lng: lerp(pin.lng, aimed.lng, e)
    };
    const alt = followGroundAltitude(center, dtEase);
    if (Number.isFinite(alt)) center.altitude = alt;
    map3d.center = center;
    if (Math.abs(((numOr(map3d.heading, 0) - cam.heading + 540) % 360) - 180) > 0.005) map3d.heading = cam.heading;
    if (Math.abs(numOr(map3d.range, 0) - cam.range) > 0.02) map3d.range = cam.range;
    if (Math.abs(numOr(map3d.tilt, 0) - cam.tilt) > 0.005) map3d.tilt = cam.tilt;
    updateCompassNeedle(cam.heading);
  }

  function setGoProgress(p){
    if (!routeGoEl) return;
    routeGoEl.style.setProperty("--go-p", String(clamp(p, 0, 1)));
    routeGoEl.classList.toggle("counting", !!startCountdown && p < 1);
  }

  function startStartCountdown(){
    if (!routeGoEl || explore.mode || startHeldByUser) return;
    if (isNavigating()) return;
    startCountdown = {
      startMs: performance.now() + START_COUNTDOWN_IGNORE_MS,
      durMs: START_COUNTDOWN_MS
    };
    setGoProgress(0);
    routeGoEl.classList.add("counting");
    ensureFollowTicker();
  }

  function maybeStartRouteCountdown(){
    if (startHeldByUser || explore.mode || isNavigating()) return;
    if (document.body.classList.contains("suppress-route-card")) return;
    if (!document.body.classList.contains("has-route")) return;
    if (!activeRoutePath || activeRoutePath.length < 2) return;
    if (startCountdown) return;
    startStartCountdown();
  }

  function cancelStartCountdown(){
    startCountdown = null;
    setGoProgress(0);
    if (routeGoEl) routeGoEl.classList.remove("counting");
  }

  // User is inspecting the card / parking / map: keep Start idle until they tap it.
  function holdStartCountdown(){
    startHeldByUser = true;
    cancelStartCountdown();
  }

  function armStartCountdown(){
    startHeldByUser = false;
  }

  function tickStartCountdown(now){
    if (!startCountdown || startHeldByUser) {
      if (startHeldByUser && startCountdown) cancelStartCountdown();
      return;
    }
    if (now < startCountdown.startMs) {
      setGoProgress(0);
      if (routeGoEl) routeGoEl.classList.add("counting");
      return;
    }
    const p = clamp((now - startCountdown.startMs) / startCountdown.durMs, 0, 1);
    setGoProgress(p);
    if (p >= 1) {
      startCountdown = null;
      if (explore.mode) {
        cancelStartCountdown();
        return;
      }
      enterNavigation();
    }
  }

  // ---- Route-start fly-over ----

  // Original intro: sweep the route from the destination back to the car, then dive in.
  function startOverviewFlyover(){
    flyover = null;
    if (activeRoutePath.length < 2 || routeCum.length !== activeRoutePath.length) return;
    const total = routeCum[routeCum.length - 1];
    if (total < FLYOVER_MIN_M) return;
    flyover = {
      kind: "overview",
      startMs: performance.now(),
      durMs: clamp(3800 + total / 0.9, 4800, 9000),
      total,
      range: clamp(total * 0.4, 500, 2500)
    };
  }

  function overviewFlyoverFrame(now){
    if (!flyover || flyover.kind !== "overview") return null;
    if (!isNavigating() || activeRoutePath.length < 2 || routeCum.length !== activeRoutePath.length) { flyover = null; return null; }
    const u = (now - flyover.startMs) / flyover.durMs;
    if (u >= 1) { flyover = null; return null; }
    const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const m = lerp(flyover.total, clamp(puck.progressM, 0, flyover.total), e);
    const at = pointAtMetres(activeRoutePath, routeCum, m);
    const look = clamp(flyover.total * 0.1, 200, 800);
    const behind = pointAtMetres(activeRoutePath, routeCum, Math.max(m - look, 0)).point;
    const ahead = pointAtMetres(activeRoutePath, routeCum, Math.min(m + look, flyover.total)).point;
    const degenerate = Math.abs(ahead.lat - behind.lat) + Math.abs(ahead.lng - behind.lng) < 1e-7;
    return { point: at.point, bearing: degenerate ? at.bearing : bearingDegrees(behind, ahead), range: flyover.range, tilt: 55 };
  }

  function startFlyover(opts){
    flyover = null;
    cam.rejoin = false;
    if (activeRoutePath.length < 2 || routeCum.length !== activeRoutePath.length) return;
    const total = routeCum[routeCum.length - 1];
    if (total < FLYOVER_MIN_M) return;
    if (speedKalman.speed * 3.6 > 10) return;
    const dest = activeDestination || activeRoutePath[activeRoutePath.length - 1];
    const last = activeRoutePath[activeRoutePath.length - 1];
    const prev = activeRoutePath[Math.max(0, activeRoutePath.length - 2)];
    const arrivalBrg = bearingDegrees(prev, last);
    const fromPreview = !!(opts && opts.fromPreview);
    const here = readMapCenter();
    const alreadyAtDest = fromPreview || (here && dest && distanceMetres(here, dest) < 140);
    const liveRange = numOr(map3d && map3d.range, cam.range);
    const liveTilt = numOr(map3d && map3d.tilt, cam.tilt);
    const liveHeading = numOr(map3d && map3d.heading, cam.heading);
    const holdRange = alreadyAtDest ? (liveRange > 0 ? liveRange : DEST_PREVIEW.RANGE) : FLYOVER.DEST_RANGE;
    const holdTilt = alreadyAtDest ? (Number.isFinite(liveTilt) ? liveTilt : DEST_PREVIEW.TILT) : FLYOVER.DEST_TILT;
    const holdHeading = alreadyAtDest ? liveHeading : arrivalBrg;
    flyover = {
      kind: "destPath",
      phase: alreadyAtDest ? "holdDest" : "dollyIn",
      dest: { lat: dest.lat, lng: dest.lng },
      total,
      dollyStartMs: performance.now(),
      riseStartMs: 0,
      holdUntil: alreadyAtDest ? performance.now() + FLYOVER.DEST_HOLD_MS : 0,
      pathStartMs: 0,
      pathDurMs: clamp(FLYOVER.PATH_DUR_BASE_MS + total / FLYOVER.PATH_M_PER_MS, FLYOVER.PATH_DUR_MIN_MS, FLYOVER.PATH_DUR_MAX_MS),
      pathRange: clamp(total * 0.55, FLYOVER.PATH_MIN_RANGE, FLYOVER.PATH_MAX_RANGE),
      pathHoldMs: FLYOVER.PATH_HOLD_MS,
      fromRange: holdRange,
      fromTilt: holdTilt,
      fromHeading: holdHeading,
      holdRange,
      holdTilt,
      holdHeading
    };
    cam.lat = dest.lat;
    cam.lng = dest.lng;
    if (alreadyAtDest) {
      if (liveRange > 0) cam.range = liveRange;
      if (Number.isFinite(liveTilt)) cam.tilt = liveTilt;
      if (Number.isFinite(liveHeading)) cam.heading = liveHeading;
    } else {
      cam.range = FLYOVER.DEST_START_RANGE;
      cam.tilt = FLYOVER.DEST_START_TILT;
      cam.heading = arrivalBrg;
    }
    cam.seeded = true;
    if (map3d && !alreadyAtDest) {
      map3d.center = { lat: dest.lat, lng: dest.lng };
      map3d.range = FLYOVER.DEST_START_RANGE;
      map3d.tilt = FLYOVER.DEST_START_TILT;
      map3d.heading = arrivalBrg;
    }
  }

  function destPathFlyoverFrame(now){
    if (!flyover || flyover.kind !== "destPath") return null;
    if (!isNavigating() || activeRoutePath.length < 2 || routeCum.length !== activeRoutePath.length) { flyover = null; return null; }
    const destPt = flyover.dest;
    const last = activeRoutePath[activeRoutePath.length - 1];
    const prev = activeRoutePath[Math.max(0, activeRoutePath.length - 2)];
    const arrivalBrg = bearingDegrees(prev, last);
    if (flyover.phase === "dollyIn") {
      const u = clamp((now - flyover.dollyStartMs) / FLYOVER.DEST_IN_MS, 0, 1);
      const e = u * u * (3 - 2 * u);
      if (u >= 1) {
        flyover.phase = "holdDest";
        flyover.holdUntil = now + FLYOVER.DEST_HOLD_MS;
      }
      return {
        point: destPt,
        bearing: arrivalBrg,
        range: lerp(FLYOVER.DEST_START_RANGE, FLYOVER.DEST_RANGE, e),
        tilt: lerp(FLYOVER.DEST_START_TILT, FLYOVER.DEST_TILT, e)
      };
    }
    if (flyover.phase === "holdDest") {
      if (now >= flyover.holdUntil) {
        flyover.phase = "risePath";
        flyover.riseStartMs = now;
      }
      return {
        point: destPt,
        bearing: Number.isFinite(flyover.holdHeading) ? flyover.holdHeading : arrivalBrg,
        range: Number.isFinite(flyover.holdRange) ? flyover.holdRange : FLYOVER.DEST_RANGE,
        tilt: Number.isFinite(flyover.holdTilt) ? flyover.holdTilt : FLYOVER.DEST_TILT
      };
    }
    if (flyover.phase === "risePath") {
      const u = clamp((now - flyover.riseStartMs) / FLYOVER.RISE_MS, 0, 1);
      const e = u * u * (3 - 2 * u);
      if (u >= 1) {
        flyover.phase = "holdPath";
        flyover.holdUntil = now + (Number.isFinite(flyover.pathHoldMs) ? flyover.pathHoldMs : FLYOVER.PATH_HOLD_MS);
      }
      const fromRange = Number.isFinite(flyover.fromRange) ? flyover.fromRange : FLYOVER.DEST_RANGE;
      const fromTilt = Number.isFinite(flyover.fromTilt) ? flyover.fromTilt : FLYOVER.DEST_TILT;
      const fromHeading = Number.isFinite(flyover.fromHeading) ? flyover.fromHeading : arrivalBrg;
      return {
        point: destPt,
        bearing: fromHeading,
        range: lerp(fromRange, flyover.pathRange, e),
        tilt: lerp(fromTilt, FLYOVER.PATH_TILT, e)
      };
    }
    if (flyover.phase === "holdPath") {
      if (now >= flyover.holdUntil) {
        flyover.phase = "alongPath";
        flyover.pathStartMs = now;
      }
      const fromHeading = Number.isFinite(flyover.fromHeading) ? flyover.fromHeading : arrivalBrg;
      const holdMs = Number.isFinite(flyover.pathHoldMs) ? flyover.pathHoldMs : FLYOVER.PATH_HOLD_MS;
      const holdU = holdMs > 0 ? clamp(1 - (flyover.holdUntil - now) / holdMs, 0, 1) : 1;
      const dH = ((arrivalBrg - fromHeading + 540) % 360) - 180;
      return { point: destPt, bearing: normaliseHeading(fromHeading + dH * holdU), range: flyover.pathRange, tilt: FLYOVER.PATH_TILT };
    }
    const u = (now - flyover.pathStartMs) / flyover.pathDurMs;
    if (u >= 1) { flyover = null; return null; }
    const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const m = lerp(flyover.total, clamp(puck.progressM, 0, flyover.total), e);
    const at = pointAtMetres(activeRoutePath, routeCum, m);
    const look = clamp(flyover.total * 0.1, 200, 800);
    const behind = pointAtMetres(activeRoutePath, routeCum, Math.max(m - look, 0)).point;
    const ahead = pointAtMetres(activeRoutePath, routeCum, Math.min(m + look, flyover.total)).point;
    const degenerate = Math.abs(ahead.lat - behind.lat) + Math.abs(ahead.lng - behind.lng) < 1e-7;
    return {
      point: at.point,
      bearing: degenerate ? at.bearing : bearingDegrees(behind, ahead),
      range: flyover.pathRange,
      tilt: FLYOVER.PATH_TILT
    };
  }

  function flyoverFrame(now){
    if (!flyover) return null;
    if (flyover.kind === "overview") return overviewFlyoverFrame(now);
    return destPathFlyoverFrame(now);
  }

  // Ground distance from the camera's centre point to a point that renders at screen
  // fraction `frac` (0 = top, 1 = bottom), for a camera orbiting the centre at `range`
  // with `tilt` degrees from vertical and a vertical field of view `fov`. Aiming the
  // centre this far AHEAD of the car puts the car at `frac` (Google/Vela's puck-low
  // framing). Works for any tilt including top-down.
  function groundLookAhead(range, tilt, fov, frac){
    const tiltR = toRad(clamp(tilt, 0, 89.9));
    const H = range * Math.cos(tiltR);
    const L = range * Math.sin(tiltR);
    const depCentre = Math.PI / 2 - tiltR;
    const delta = Math.atan(((frac - 0.5) / 0.5) * Math.tan(toRad(clamp(fov, 5, 80)) / 2));
    const dep = depCentre + delta;
    const s = Math.sin(dep), c = Math.cos(dep);
    if (s <= 1e-6) return NaN;
    return L - H * c / s;
  }

  function lookAheadForFraction(range, tilt, fov, frac){
    const d = groundLookAhead(range, tilt, fov, frac);
    if (!Number.isFinite(d)) {
      const tiltR = toRad(clamp(tilt, 0, 89.9));
      return range * Math.sin(tiltR);
    }
    return Math.max(0, d);
  }

  function numOr(value, fallback){
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
  }

  function applyFollowCamera(dtEase, now){
    const view = viewTargets();
    if (!cam.seeded) {
      // (Re)attach: seed from the live camera so the hand-off from a pan, the route
      // overview or a Re-center is a glide, not a cut.
      const c = readMapCenter();
      cam.lat = c.lat;
      cam.lng = c.lng;
      cam.heading = numOr(map3d.heading, 0);
      // (An unset map property can read as 0: fall back to the view's value where 0 is invalid.)
      const liveRange = numOr(map3d.range, 0), liveFov = numOr(map3d.fov, 0);
      cam.range = liveRange > 0 ? liveRange : view.range;
      cam.tilt = numOr(map3d.tilt, view.tilt);
      cam.fov = liveFov >= 5 ? liveFov : view.fov;
      cam.speedLP = speedKalman.speed;
      cam.zoom = zoomBandForSpeed(cam.speedLP);
      cam.latched = false;
      cam.seeded = true;
    }
    cam.speedLP += (speedKalman.speed - cam.speedLP) * easeK(dtEase, FOLLOW.SPEED_TAU);
    // Speed-band zoom: the band steps, the eased level glides between them.
    cam.zoom += (zoomBandForSpeed(cam.speedLP) - cam.zoom) * easeK(dtEase, FOLLOW.ZOOM_TAU);
    let tgtRange = cam.userRange != null ? cam.userRange
      : view.range * (view.breathe ? rangeFactorForZoom(cam.zoom) : 1);
    if (cam.userRange == null && view.breathe && isNavigating()) tgtRange = Math.max(tgtRange, FOLLOW.MIN_DRIVE_RANGE);
    let tiltTarget = view.tilt;
    // Heading-up latch (Vela): the camera takes the car's course only once the car is
    // genuinely moving; parked, it holds where it is instead of spinning with GPS noise.
    // On a route the course is the road's own bearing, which is always trustworthy.
    let headingTarget;
    if (!view.headingUp) {
      headingTarget = 0;
    } else {
      if (!cam.latched && cam.speedLP > FOLLOW.LATCH_MPS) cam.latched = true;
      else if (cam.latched && cam.speedLP < FOLLOW.HOLD_MPS && !puck.engaged) cam.latched = false;
      headingTarget = (cam.latched || puck.engaged) && Number.isFinite(puck.heading) ? puck.heading : cam.heading;
    }
    const car = { lat: puck.lat, lng: puck.lng };
    const fly = flyoverFrame(now) || skipFlyFrame(now);
    const destIntro = !!(fly && flyover && flyover.kind === "destPath" && flyover.phase !== "alongPath");
    const info = (!fly && infoLevel > 0) ? navInfoPreview(view, tgtRange, tiltTarget) : null;
    if (fly) {
      tgtRange = fly.range;
      tiltTarget = fly.tilt;
      headingTarget = fly.bearing;
    } else if (info) {
      tgtRange = info.range;
      tiltTarget = info.tilt;
      if (Number.isFinite(info.heading)) headingTarget = info.heading;
    } else if (cam.rejoin && cam.rejoinLift) {
      const distNow = distanceMetres({ lat: cam.lat, lng: cam.lng }, car);
      if (cam.rejoinPhase === "rise") {
        tgtRange = Math.max(tgtRange, cam.rejoinPeakRange);
        tiltTarget = FOLLOW.REJOIN_TOWN_TILT;
        headingTarget = cam.heading;
        if (cam.range >= cam.rejoinPeakRange * 0.9) cam.rejoinPhase = "travel";
      } else if (cam.rejoinPhase === "travel") {
        tgtRange = Math.max(tgtRange, cam.rejoinPeakRange);
        tiltTarget = FOLLOW.REJOIN_TOWN_TILT;
        headingTarget = cam.heading;
        if (distNow < Math.max(240, cam.rejoinPeakRange * 0.07)) cam.rejoinPhase = "descend";
      }
    }
    const ref = fly ? fly.point : (info && info.aim ? info.aim : car);
    // Flight blend: when the camera is far from where it should be (Re-center after a
    // pan, overview -> drive) every parameter eases with a longer SHARED time constant so
    // it reads as one swoop, tightening back to the follow constants as it closes in.
    const farPos = clamp((distanceMetres({ lat: cam.lat, lng: cam.lng }, ref) - tgtRange) / 1600, 0, 1);
    const farRange = clamp(Math.abs(Math.log(Math.max(cam.range, 1) / Math.max(tgtRange, 1))) / Math.log(4), 0, 1);
    const flight = Math.max(farPos, farRange);
    if (cam.rejoin && flight < 0.07 && distanceMetres({ lat: cam.lat, lng: cam.lng }, car) < Math.max(80, tgtRange * 0.4)) {
      cam.rejoin = false;
      cam.rejoinLift = false;
      cam.rejoinPhase = "";
    }
    let extra = flight * FOLLOW.FLIGHT_TAU + (cam.rejoin ? FOLLOW.RECENTER_EXTRA : 0);
    let extraZoom = flight * FOLLOW.FLIGHT_ZOOM_TAU + (cam.rejoin ? FOLLOW.RECENTER_ZOOM_EXTRA : 0);
    if (infoSkipMode && infoLevel > 0 && !(flyover || skipFly)) {
      extra = 0.28;
      extraZoom = 0.32;
    }
    if (!fly && cam.rejoinLift && cam.rejoinPhase === "rise") {
      extra = 0.2;
      extraZoom = 0.45;
    } else if (!fly && cam.rejoinLift && cam.rejoinPhase === "travel") {
      extra = 0.22;
      extraZoom = 0.12;
    }
    // Aim along the CAMERA heading (not the car's), so the car stays on the screen's
    // vertical centre line even while the camera's heading is still catching up in a turn.
    // The look-ahead comes from the LIVE framing (exact car placement every frame) but
    // blends toward the TARGET framing while in flight: from a 2 km overview the live
    // value would aim a kilometre up the road and drop the car off the bottom edge.
    let lookM = 0;
    const fracY = carScreenY();
    if (view.headingUp && !fly && !(info && info.overhead) && !(cam.rejoinLift && cam.rejoinPhase !== "descend")) {
      const lookLive = lookAheadForFraction(cam.range, cam.tilt, cam.fov, fracY);
      const lookTarget = lookAheadForFraction(tgtRange, tiltTarget, view.fov, fracY);
      lookM = lerp(lookLive, lookTarget, flight);
    }
    let aim = fly ? fly.point : (info && info.aim ? info.aim : (lookM > 0 ? lookAhead(car, cam.heading, lookM) : car));
    if (!fly && cam.rejoinLift && cam.rejoinPhase === "rise" && cam.rejoinFrom) {
      aim = cam.rejoinFrom;
      lookM = 0;
    }
    if (!fly) {
      const dx = carScreenX() - 0.5;
      if (Math.abs(dx) > 0.02) {
        // Shift by the width at the car, not at the look-ahead point. Using the
        // full camera range parked the chase camera beside the car in split view.
        const w = Math.max(1, viewSafe.width || window.innerWidth);
        const h = Math.max(1, viewSafe.height || window.innerHeight);
        const hFovRad = 2 * Math.atan(Math.tan(toRad(cam.fov) / 2) * (w / h));
        const groundToAim = Math.max(cam.range, 40) * Math.cos(toRad(clamp(cam.tilt, 5, 85)));
        const distToCar = Math.max(16, groundToAim - Math.max(0, lookM));
        const halfWAtCar = distToCar * Math.tan(hFovRad / 2);
        const shift = clamp(dx * 2 * halfWAtCar, -0.32 * distToCar, 0.32 * distToCar);
        aim = lookAhead(aim, cam.heading - 90, shift);
      }
    }

    const kPos = easeK(dtEase, FOLLOW.POS_TAU + extra);
    cam.lat += (aim.lat - cam.lat) * kPos;
    cam.lng += (aim.lng - cam.lng) * kPos;
    // Camera heading is adaptively damped: heavy while the error is a few degrees of
    // road-geometry wiggle, quick once it's turn-sized. Google's grammar: a crisp car
    // under a heavy camera.
    const db = ((headingTarget - cam.heading + 540) % 360) - 180;
    const brgTau = FOLLOW.BRG_TAU_STILL + (FOLLOW.BRG_TAU_TURN - FOLLOW.BRG_TAU_STILL) * Math.min(Math.abs(db) / FOLLOW.BRG_TURN_DEG, 1);
    // Rate cap: real corners peak well under it; it tames the half-circle swings of a
    // view switch (heading-up -> north-up) or a re-center after the user spun the map.
    const maxTurn = FOLLOW.BRG_MAX_RATE * dtEase;
    cam.heading = normaliseHeading(cam.heading + clamp(db * easeK(dtEase, brgTau + extra), -maxTurn, maxTurn));
    cam.tilt += (tiltTarget - cam.tilt) * easeK(dtEase, FOLLOW.TILT_TAU + extraZoom);
    cam.range += (tgtRange - cam.range) * easeK(dtEase, FOLLOW.RANGE_TAU + extraZoom);
    cam.fov += (view.fov - cam.fov) * easeK(dtEase, FOLLOW.RANGE_TAU + extraZoom);
    if (destIntro) {
      cam.lat = aim.lat;
      cam.lng = aim.lng;
      cam.heading = headingTarget;
      cam.tilt = tiltTarget;
      cam.range = tgtRange;
    }

    const center = { lat: cam.lat, lng: cam.lng };
    const alt = followGroundAltitude(center, dtEase);
    if (Number.isFinite(alt)) center.altitude = alt;
    map3d.center = center;
    if (Math.abs(((numOr(map3d.heading, 0) - cam.heading + 540) % 360) - 180) > 0.005) map3d.heading = cam.heading;
    if (Math.abs(numOr(map3d.range, 0) - cam.range) > 0.02) map3d.range = cam.range;
    if (Math.abs(numOr(map3d.tilt, 0) - cam.tilt) > 0.005) map3d.tilt = cam.tilt;
    if (Math.abs(numOr(map3d.fov, 0) - cam.fov) > 0.005) map3d.fov = cam.fov;
    applyLiveCarScale();
    updateCompassNeedle(cam.heading);
    syncFreeZoomDot();
  }

  // Attach the follow camera (Re-center, auto re-follow). `view` switches the view first;
  // null keeps the current one. The ticker seeds from the live camera and flies it in.
  function attachFollow(view){
    if (!map3d) return;
    flyover = null;
    cancelStartCountdown();
    stopDestPreview();
    stopCarInspect();

  async function fetchRoutePath(origin, destination){
    const result = await RouteClass.computeRoutes({
      origin: { lat: origin.lat, lng: origin.lng },
      destination: { lat: destination.lat, lng: destination.lng },
      travelMode: "DRIVING",
      routingPreference: "TRAFFIC_AWARE",
      language: "en-NZ",
      units: google.maps.UnitSystem.METRIC,
      fields: ["path", "distanceMeters", "durationMillis", "staticDurationMillis"]
    });
    if (!result.routes || !result.routes.length) throw new Error("Google returned no route.");
    const route = result.routes[0];
    const path = Array.from(route.path || []).map(point => ({
      lat: typeof point.lat === "function" ? point.lat() : point.lat,
      lng: typeof point.lng === "function" ? point.lng() : point.lng
    }));
    if (path.length < 2) throw new Error("Route returned without a usable path.");
