<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Auckland 3D Route Demo</title>
  <style>
    html, body {width:100%; height:100%; margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:linear-gradient(180deg,#c8e3f8 0%,#eaf3fb 42%,#eef4e8 78%,#e4edd6 100%); overflow:hidden}
    #map {position:absolute; top:0; left:0; width:100%; height:108.696%; z-index:1}
    #mapLoader {position:absolute; inset:0; z-index:80; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(ellipse 80% 55% at 50% 36%, #fff 0%, rgba(255,255,255,.72) 34%, rgba(234,243,251,.96) 68%), linear-gradient(180deg,#c8e3f8 0%,#eaf3fb 42%,#eef4e8 78%,#e4edd6 100%); gap:22px; transition:opacity .45s ease, visibility .45s ease}
    body.map-ready #mapLoader {opacity:0; visibility:hidden; pointer-events:none}
    .gmaps-pin {position:relative; width:96px; height:128px; animation:gmapsBounce 1.1s ease-in-out infinite}
    .gmaps-pin svg {width:96px; height:128px; display:block; filter:drop-shadow(0 12px 14px rgba(0,0,0,.4))}
    .gmaps-pin::after {content:""; position:absolute; left:50%; top:34%; width:108px; height:108px; margin:-54px 0 0 -54px; border-radius:50%; background:rgba(234,67,53,.2); animation:gmapsRipple 1.4s ease-out infinite; z-index:-1}
    .gmaps-shadow {width:48px; height:12px; border-radius:50%; background:rgba(0,0,0,.35); animation:gmapsShadow 1.1s ease-in-out infinite}
    .gmaps-status {color:#3c4043; font-weight:650; letter-spacing:.2px; font-size:15px; opacity:.88; max-width:70%; text-align:center}
    @keyframes gmapsBounce {0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @keyframes gmapsShadow {0%,100%{transform:scale(1); opacity:.35}50%{transform:scale(.72); opacity:.18}}
    @keyframes gmapsRipple {0%{transform:scale(.5); opacity:.65}100%{transform:scale(1.75); opacity:0}}
    gmp-map-3d {width:100% !important; height:100% !important; min-width:100%; min-height:100%; display:block}
    #topPanel {position:absolute; z-index:20; top:max(10px,env(safe-area-inset-top)); left:10px; right:10px; display:grid; gap:8px; pointer-events:none}
    #searchRow,#buttonRow,#routeCard,#carDebugBtn {pointer-events:auto}
    #searchRow {display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:stretch}
    #searchHost {min-width:0; min-height:44px; border-radius:12px; background:rgba(255,255,255,.96); box-shadow:0 2px 10px rgba(0,0,0,.24); overflow:hidden}
    #searchHost gmp-place-autocomplete {width:100%; min-height:44px; display:block; border:0; border-radius:12px; background:transparent; overflow:hidden}
    #searchHost gmp-place-autocomplete::part(input),
    #searchHost gmp-place-autocomplete::part(search) {border:0; border-radius:12px; background:transparent; min-height:44px}
    button,select {min-height:44px; border:0; border-radius:12px; padding:0 13px; font:inherit; font-weight:650; background:rgba(255,255,255,.96); color:#111; box-shadow:0 2px 10px rgba(0,0,0,.24)}
    button:active {transform:translateY(1px)}
    #buttonRow {display:flex; flex-wrap:wrap; gap:7px}
    #searchRow,#buttonRow,#searchResults,#status {transition:opacity .4s ease, transform .4s ease}
    body.chrome-hidden #searchRow,body.chrome-hidden #buttonRow,body.chrome-hidden #searchResults {opacity:0; pointer-events:none; transform:translateY(-10px)}
    #searchResults {display:none; pointer-events:auto; justify-self:stretch; max-width:min(640px,100%); max-height:min(46vh,340px); overflow:auto; border-radius:12px; background:rgba(255,255,255,.98); box-shadow:0 8px 24px rgba(0,0,0,.28)}
    #searchResults.open {display:block}
    #searchResults button {display:block; width:100%; min-height:52px; border:0; border-radius:0; box-shadow:none; text-align:left; padding:10px 14px; background:transparent}
    #searchResults button + button {border-top:1px solid rgba(0,0,0,.08)}
    #searchResults .sub {display:block; font-size:13px; font-weight:500; opacity:.62; margin-top:2px}
    body.chrome-hidden #status {opacity:0; pointer-events:none; transform:translateY(10px)}
    #carDebugBtn {display:none; position:absolute; top:max(12px,env(safe-area-inset-top)); left:max(12px,env(safe-area-inset-left)); z-index:32; width:48px; height:48px; min-height:48px; padding:0; border-radius:50%; background:#2E3134; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.45); align-items:center; justify-content:center}
    #carDebugBtn svg {width:22px; height:22px; fill:currentColor}
    body.debug-open #carDebugBtn {background:#1A73E8}
    #recenterBtn {position:absolute; right:max(16px,env(safe-area-inset-right)); bottom:max(20px,env(safe-area-inset-bottom)); z-index:32; display:none; align-items:center; gap:8px; min-height:44px; padding:0 16px 0 12px; border-radius:22px; font:inherit; font-weight:650; background:#2E3134; color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.45)}
    #recenterBtn.visible {display:flex}
    #recenterBtn svg {width:16px; height:22px; display:block; flex:0 0 auto; fill:currentColor}
    #recenterBtn svg circle {fill:#2E3134}
    html.aa-car #searchRow,body.aa-car #searchRow {display:none}
    html.aa-car #searchResults,body.aa-car #searchResults {display:none !important}
    html.aa-car #chromeWake,body.aa-car #chromeWake {display:none; pointer-events:none}
    html.aa-car #carDebugBtn,body.aa-car #carDebugBtn {display:flex}
    html.aa-car #buttonRow,body.aa-car #buttonRow {position:fixed; left:max(140px,calc(env(safe-area-inset-left) + 128px)); right:148px; bottom:max(16px,env(safe-area-inset-bottom)); top:auto; z-index:30; overflow:visible}
    html.aa-car #buttonRow button,html.aa-car #buttonRow select,
    body.aa-car #buttonRow button,body.aa-car #buttonRow select {background:#2E3134; color:#fff}
    html.aa-car:not(.debug-open) #buttonRow,body.aa-car:not(.debug-open) #buttonRow {opacity:0; pointer-events:none}
    html.aa-car.debug-open #buttonRow,body.aa-car.debug-open #buttonRow {opacity:1; pointer-events:auto; transform:none}
    html:not(.aa-car) #carApiBtn,body:not(.aa-car) #carApiBtn {display:none}
    #viewPicker {position:relative; display:inline-flex}
    #viewSelectBtn {white-space:nowrap}
    #viewSelectMenu {display:none; position:absolute; left:0; top:calc(100% + 6px); min-width:max(100%,180px); z-index:46; padding:6px; border-radius:12px; background:#1C1C1E; box-shadow:0 8px 24px rgba(0,0,0,.4)}
    #viewSelectMenu.open {display:grid; gap:4px}
    #viewSelectMenu button {min-height:44px; width:100%; white-space:nowrap; text-align:left; background:#2E3134; color:#fff; box-shadow:none}
    html.aa-car #viewSelectMenu,body.aa-car #viewSelectMenu {top:auto; bottom:calc(100% + 6px)}
    #viewSpecPanel {display:none; position:absolute; z-index:31; top:max(68px,calc(env(safe-area-inset-top) + 56px)); left:max(10px,env(safe-area-inset-left)); width:176px; padding:6px; border-radius:12px; background:#1C1C1E; color:#fff; box-shadow:0 8px 20px rgba(0,0,0,.4); pointer-events:auto; gap:2px}
    body.view-specs #viewSpecPanel {display:grid}
    html.aa-car #viewSpecPanel,body.aa-car #viewSpecPanel {top:max(68px,calc(env(safe-area-inset-top) + 56px)); left:max(12px,env(safe-area-inset-left)); right:auto; width:168px; bottom:auto}
    html.aa-car:not(.debug-open) #viewSpecPanel,body.aa-car:not(.debug-open) #viewSpecPanel {display:none !important}
    #viewSpecPanel .spec-row {display:grid; grid-template-columns:1fr auto 26px 26px; align-items:center; gap:4px}
    #viewSpecPanel .spec-name {font-size:11px; font-weight:650; opacity:.82; line-height:1.1}
    #viewSpecPanel .spec-value {font-size:12px; font-weight:750; font-variant-numeric:tabular-nums; min-width:3.6em; text-align:right}
    #viewSpecPanel button {min-height:26px; width:26px; padding:0; background:#2E3134; color:#fff; box-shadow:none; font-size:15px; font-weight:700; border-radius:8px}
    #viewSpecPanel .spec-zoom {display:grid; grid-template-columns:26px 1fr 26px; align-items:center; gap:4px; margin-bottom:4px; padding-bottom:4px; border-bottom:1px solid rgba(255,255,255,.12)}
    #viewSpecPanel .spec-zoom span {text-align:center; font-size:11px; font-weight:700}
    #routeCard {display:none; position:absolute; z-index:31; top:max(66px,calc(env(safe-area-inset-top) + 56px)); left:max(10px,env(safe-area-inset-left)); width:min(280px,calc(100vw - 180px)); padding:14px 48px 14px 16px; border-radius:20px; background:#1C1C1E; color:#fff; box-shadow:0 8px 28px rgba(0,0,0,.4); pointer-events:auto}
    html.aa-car #routeCard,body.aa-car #routeCard {top:max(72px,calc(env(safe-area-inset-top) + 60px))}
    html.aa-car.view-specs #routeCard,body.aa-car.view-specs #routeCard {left:max(190px,calc(env(safe-area-inset-left) + 178px))}
    body.has-route:not(.navigating) #routeCard {display:block}
    body.navigating #routeCard {display:none !important}
    #routeClose {position:absolute; top:10px; right:10px; width:36px; height:36px; min-height:36px; padding:0; border-radius:50%; background:#3C4043; color:#fff; box-shadow:none; font-size:22px; line-height:1; font-weight:500}
    #routeTime {font-size:32px; font-weight:750; letter-spacing:-.6px; line-height:1.1}
    #routeStats {margin-top:4px; font-size:16px; font-weight:550; opacity:.92}
    #routeSub {margin-top:4px; font-size:14px; font-weight:600; color:rgba(255,255,255,.62)}
    #routeSub.traffic-delay {color:#FFB74D}
    #routeTitle {margin-top:10px; font-size:15px; font-weight:600; opacity:.82; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    #routeGo {margin-top:12px; width:100%; min-height:44px; background:#1A73E8; color:#fff; box-shadow:none}
    #status {display:none}
    #chromeWake {position:absolute; top:0; left:0; right:0; height:max(80px,calc(env(safe-area-inset-top) + 68px)); z-index:25; pointer-events:none}
    body.chrome-hidden #chromeWake {pointer-events:auto}
    body:not(.map-ready) #searchRow,
    body:not(.map-ready) #searchResults,
    body:not(.map-ready) #buttonRow,
    body:not(.map-ready) #carDebugBtn,
    body:not(.map-ready) #recenterBtn,
    body:not(.map-ready) #routeCard,
    body:not(.map-ready) #viewSpecPanel {
      display:none !important;
      visibility:hidden !important;
      pointer-events:none !important;
    }
    #carApiHud {display:none; position:absolute; z-index:45; left:50%; top:50%; transform:translate(-50%,-50%); min-width:140px; padding:14px 22px; border-radius:18px; background:#1C1C1E; color:#fff; box-shadow:0 8px 28px rgba(0,0,0,.45); text-align:center; pointer-events:none}
    #carApiHud.visible {display:grid; gap:2px}
    html.aa-car:not(.debug-open) #carApiHud,body.aa-car:not(.debug-open) #carApiHud {display:none !important}
    #carApiHud .car-api-label {font-size:13px; font-weight:650; opacity:.72}
    #carApiHud .car-api-value {font-size:42px; font-weight:750; line-height:1.1; font-variant-numeric:tabular-nums}
    #carModelOverlay {display:none; position:absolute; inset:0; z-index:47; align-items:center; justify-content:center; background:rgba(0,0,0,.55); pointer-events:auto}
    #carModelOverlay.open {display:flex}
    html.aa-car:not(.debug-open) #carModelOverlay,body.aa-car:not(.debug-open) #carModelOverlay {display:none !important}
    #carModelCard {position:relative; width:min(78vw,760px); height:min(78vh,520px); border-radius:20px; background:#1C1C1E; box-shadow:0 12px 40px rgba(0,0,0,.55); overflow:hidden; display:flex; flex-direction:column}
    #carModelSwitch {display:flex; gap:6px; padding:12px 48px 0 14px; flex:0 0 auto}
    #carModelSwitch button {flex:1; min-height:40px; background:#2E3134; color:#fff; box-shadow:none; font-size:14px}
    #carModelSwitch button.active {background:#1A73E8}
    #carModelHost {flex:1; min-height:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; background:radial-gradient(ellipse at 50% 70%, #3a3e44 0%, #1C1C1E 70%)}
    #carModelHost model-viewer {width:100%; height:100%; --poster-color:transparent; touch-action:none}
    #carModelHint {padding:8px 14px; font-size:13px; font-weight:600; color:rgba(255,255,255,.7); text-align:center}
    #carModelClose {position:absolute; top:10px; right:10px; z-index:2; width:40px; height:40px; min-height:40px; padding:0; border-radius:50%; background:#3C4043; color:#fff; box-shadow:none; font-size:24px; line-height:1}
    @media (max-width:580px){#searchRow{grid-template-columns:minmax(0,1fr)}button,select{font-size:14px}}
  </style>
</head>
<body class="chrome-hidden">
  <div id="map"></div>
  <div id="mapLoader" aria-live="polite">
    <div class="gmaps-pin" aria-hidden="true">
      <svg viewBox="0 0 48 64" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 0c11.6 0 21 9.2 21 20.6 0 14.4-21 35.4-21 35.4S3 35 3 20.6C3 9.2 12.4 0 24 0z" fill="#EA4335"/>
        <circle cx="24" cy="21" r="8.5" fill="#fff"/>
      </svg>
    </div>
    <div class="gmaps-shadow"></div>
    <div class="gmaps-status" id="mapLoaderStatus" hidden></div>
  </div>
  <div id="chromeWake" aria-hidden="true"></div>
  <div id="topPanel">
    <div id="searchRow">
      <div id="searchHost"></div>
    </div>
    <div id="searchResults" hidden></div>
    <div id="buttonRow">
      <button id="gpsBtn" type="button">Start GPS</button>
      <button id="followBtn" type="button">Following: ON</button>
      <button id="labelsBtn" type="button">Labels: OFF</button>
      <button id="demoBtn" type="button">Drive route demo</button>
      <button id="randomBtn" type="button">Random route</button>
      <button id="viewSpecBtn" type="button">View specs</button>
      <button id="carApiBtn" type="button">API level</button>
      <button id="carModelBtn" type="button">Car model</button>
      <div id="viewPicker">
        <button id="viewSelectBtn" type="button" aria-haspopup="listbox" aria-expanded="false">Driving view</button>
        <div id="viewSelectMenu" hidden role="listbox">
          <button type="button" role="option" data-view="overview">Route overview</button>
          <button type="button" role="option" data-view="drive">Driving view</button>
          <button type="button" role="option" data-view="high">Higher view</button>
          <button type="button" role="option" data-view="top">Top-down</button>
        </div>
      </div>
    </div>
  </div>
  <div id="viewSpecPanel" hidden>
    <div class="spec-zoom">
      <button type="button" id="specZoomOut" aria-label="Zoom out">−</button>
      <span>Zoom</span>
      <button type="button" id="specZoomIn" aria-label="Zoom in">+</button>
    </div>
    <div class="spec-row">
      <span class="spec-name">Height</span>
      <span class="spec-value" id="specAltitude">—</span>
      <button type="button" data-spec="altitude" data-dir="-" aria-label="Decrease height">−</button>
      <button type="button" data-spec="altitude" data-dir="+" aria-label="Increase height">+</button>
    </div>
    <div class="spec-row">
      <span class="spec-name">Tilt</span>
      <span class="spec-value" id="specTilt">—</span>
      <button type="button" data-spec="tilt" data-dir="-" aria-label="Decrease tilt">−</button>
      <button type="button" data-spec="tilt" data-dir="+" aria-label="Increase tilt">+</button>
    </div>
    <div class="spec-row">
      <span class="spec-name">Distance</span>
      <span class="spec-value" id="specRange">—</span>
      <button type="button" data-spec="range" data-dir="-" aria-label="Decrease distance">−</button>
      <button type="button" data-spec="range" data-dir="+" aria-label="Increase distance">+</button>
    </div>
    <div class="spec-row">
      <span class="spec-name">Heading</span>
      <span class="spec-value" id="specHeading">—</span>
      <button type="button" data-spec="heading" data-dir="-" aria-label="Decrease heading">−</button>
      <button type="button" data-spec="heading" data-dir="+" aria-label="Increase heading">+</button>
    </div>
    <div class="spec-row">
      <span class="spec-name">Field of view</span>
      <span class="spec-value" id="specFov">—</span>
      <button type="button" data-spec="fov" data-dir="-" aria-label="Decrease field of view">−</button>
      <button type="button" data-spec="fov" data-dir="+" aria-label="Increase field of view">+</button>
    </div>
  </div>
  <div id="carModelOverlay" hidden>
    <div id="carModelCard">
      <button id="carModelClose" type="button" aria-label="Close model viewer">&times;</button>
      <div id="carModelSwitch">
        <button type="button" data-model="forte">Kia Forte</button>
        <button type="button" data-model="cerato">Kia Cerato</button>
      </div>
      <div id="carModelHost"></div>
      <div id="carModelHint">Kia Forte · drag to rotate · pinch to zoom</div>
    </div>
  </div>
  <div id="carApiHud" hidden>
    <div class="car-api-label">Car API</div>
    <div class="car-api-value" id="carApiValue">unknown</div>
  </div>
  <button id="carDebugBtn" type="button" aria-label="Debug">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.57-.2l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81a.5.5 0 0 0-.48-.38h-4.04a.5.5 0 0 0-.48.38l-.33 1.76c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.57.2L2.67 8.07c-.11.2-.07.46.12.61l2.03 1.58c-.05.3-.08.63-.08.95 0 .31.03.63.08.93l-2.03 1.59c-.18.14-.23.4-.12.6l1.92 3.32c.11.2.36.28.57.2l2.39-.96c.5.38 1.03.7 1.62.94l.33 1.76c.05.22.25.38.48.38h4.04c.23 0 .43-.16.48-.38l.33-1.76c.59-.24 1.13-.56 1.62-.94l2.39.96c.21.08.46 0 .57-.2l1.92-3.32c.11-.2.06-.46-.12-.6l-2.03-1.59zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
  </button>
  <div id="routeCard">
    <button id="routeClose" type="button" aria-label="Stop navigation">&times;</button>
    <div id="routeTime">--</div>
    <div id="routeStats"></div>
    <div id="routeSub"></div>
    <div id="routeTitle"></div>
    <button id="routeGo" type="button">Go</button>
  </div>
  <div id="status">
    <div id="message">Loading Google 3D map...</div>
    <div><span id="coords">Auckland CBD</span> · heading <span id="heading">0°</span></div>
  </div>
  <button id="recenterBtn" type="button">
    <svg viewBox="0 0 48 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M24 0c11.6 0 21 9.2 21 20.6 0 14.4-21 35.4-21 35.4S3 35 3 20.6C3 9.2 12.4 0 24 0z"/>
      <circle cx="24" cy="21" r="8.5" fill="#2E3134"/>
    </svg>
    Re-center
  </button>

<script>
  // Injected at GitHub Pages deploy from the GOOGLE_MAPS_API_KEY repo secret.
  const GOOGLE_MAPS_API_KEY = "__GOOGLE_MAPS_API_KEY__";

  const AUCKLAND = { lat: -36.848461, lng: 174.763336 };
  // Maps Model3DElement only accepts URLs that end in ".glb" — no query strings.
  const CAR_MODELS = {
    forte: { id: "forte", label: "Kia Forte", url: new URL("forte.glb", document.baseURI).href, orbit: "35deg 70deg auto" },
    cerato: { id: "cerato", label: "Kia Cerato 2021", url: new URL("cerato.glb", document.baseURI).href, orbit: "35deg 74deg 8m" }
  };
  let activeCarModelId = "forte";
  try {
    const saved = localStorage.getItem("aaCarModel");
    if (saved && CAR_MODELS[saved]) activeCarModelId = saved;
  } catch (err) {}
  // Keep a constant on-screen size: ~half a two-lane road at driving range.
  const CAR_WIDTH_M = 1.80;
  const CAR_TARGET_WIDTH_M = 3.5;
  const CAR_REF_RANGE = 88;
  const CAR_REF_FOV = 42;
  const CAR_BASE_SCALE = CAR_TARGET_WIDTH_M / CAR_WIDTH_M;
  let lastCarScale = 0;
  const TEST_ORIGIN = { name: "Sky Tower", lat: -36.848461, lng: 174.763336 };
  const TEST_DESTINATIONS = [
    { name: "Auckland War Memorial Museum", lat: -36.860158, lng: 174.777953 },
    { name: "Mission Bay", lat: -36.849888, lng: 174.832367 },
    { name: "Mount Eden", lat: -36.877160, lng: 174.764470 },
    { name: "Auckland Zoo", lat: -36.864250, lng: 174.719620 },
    { name: "Cornwall Park", lat: -36.897820, lng: 174.785000 },
    { name: "Wynyard Quarter", lat: -36.841990, lng: 174.757200 }
  ];

  let map3d, Polyline3DElement, Marker3DElement, Model3DElement, PlaceAutocompleteClass, RouteClass, placeAutocomplete;
  let userMarker, userCar, destinationMarker, routeLine;
  let watchId = null, following = true, labelsOn = false, demoTimer = null;
  let previousFix = null, currentGpsPoint = null, activeRoute = null, activeDestination = null;
  let activeRoutePath = [];
  let currentView = "high";
  let carModelReady = false;

  const messageEl = document.getElementById("message");
  const coordsEl = document.getElementById("coords");
  const headingEl = document.getElementById("heading");
  const routeTitleEl = document.getElementById("routeTitle");
  const routeStatsEl = document.getElementById("routeStats");
  const routeSubEl = document.getElementById("routeSub");
  const routeTimeEl = document.getElementById("routeTime");

  function setMessage(text){ messageEl.textContent = text; }

  function createCarPuck(position){
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    svg.setAttribute("viewBox", "0 0 120 52");
    svg.setAttribute("width", "56");
    svg.setAttribute("height", "24");

  function activeCarModel(){
    return CAR_MODELS[activeCarModelId] || CAR_MODELS.forte;
  }

  function carModelUrl(){
    return activeCarModel().url;
  }

  function currentCarPoint(){
    if (currentGpsPoint && Number.isFinite(currentGpsPoint.lat) && Number.isFinite(currentGpsPoint.lng)) {
      return { lat: currentGpsPoint.lat, lng: currentGpsPoint.lng };
    }
    return { lat: AUCKLAND.lat, lng: AUCKLAND.lng };
  }

  function currentCarHeading(){

  function syncCarModelSwitch(){
    document.querySelectorAll("#carModelSwitch [data-model]").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.model === activeCarModelId);

  function setActiveCarModel(id){
    if (!CAR_MODELS[id]) return;
    const changed = id !== activeCarModelId;
    activeCarModelId = id;
    try { localStorage.setItem("aaCarModel", id); } catch (err) {}
    syncCarModelSwitch();
    const viewerHost = document.getElementById("carModelHost");
    if (viewerHost) {

      if (old) old.remove();
      if (document.getElementById("carModelOverlay")?.classList.contains("open")) {
        openCarModelViewer();
      }
    }
    if (!changed || !map3d) return;
    const pos = currentCarPoint();
    const heading = currentCarHeading();
    if (userCar) {
      try { userCar.remove(); } catch (err) {}
      userCar = null;
    }
    carModelReady = false;
    lastCarScale = 0;
    attachUserCar(pos, heading);
  }

  function carMapPosition(point){
    return { lat: point.lat, lng: point.lng, altitude: 0.12 };
  }

  function carScaleForCamera(){
    const range = Number(map3d && map3d.range);
    const fov = Number(map3d && map3d.fov);
    const r = Number.isFinite(range) ? clamp(range, 50, 8000) : CAR_REF_RANGE;
    const f = Number.isFinite(fov) ? clamp(fov, 20, 90) : CAR_REF_FOV;
    const refTan = Math.tan((CAR_REF_FOV * Math.PI / 180) / 2);
    const tan = Math.tan((f * Math.PI / 180) / 2);
    return CAR_BASE_SCALE * (r / CAR_REF_RANGE) * (tan / refTan);
  }

  function applyCarScale(){
    if (!userCar) return;
    const next = carScaleForCamera();
    if (Math.abs(next - lastCarScale) < 0.015) return;
    lastCarScale = next;
    try { userCar.scale = next; } catch (err) {}
  }

  function applyCarPose(point, heading){
    if (!userCar) return;
    const pos = carMapPosition(point);
    const orientation = carOrientation(heading);
    try { userCar.position = pos; } catch (err) {}
    try { userCar.orientation = orientation; } catch (err) {}
    try { userCar.altitudeMode = "RELATIVE_TO_MESH"; } catch (err) {}
    applyCarScale();
  }

  function attachUserCar(position, heading){
    if (!Model3DElement || !map3d) return;
    const h = Number.isFinite(heading) ? heading : 0;
    const src = carModelUrl();
    try {
      userCar = new Model3DElement({
        src,
        position: carMapPosition(position),
        orientation: carOrientation(h),
        scale: CAR_BASE_SCALE,
        altitudeMode: "RELATIVE_TO_MESH"
      });
      const revealModel = () => {
        if (carModelReady) return;
        carModelReady = true;
        if (userMarker) {
          userMarker.remove();
          userMarker = null;
        }
      };
      userCar.addEventListener("gmp-load", revealModel);
      userCar.addEventListener("load", revealModel);
      userCar.addEventListener("gmp-error", () => {
        console.error("3D car model failed to load", src);
        if (userCar) {
          userCar.remove();
          userCar = null;
        }
        carModelReady = false;
        if (!userMarker && Marker3DElement) {
          userMarker = createCarPuck(position);
          map3d.append(userMarker);
        }
      });
      map3d.append(userCar);
      // Re-apply after attach: some WebViews drop constructor options.
      try { userCar.src = src; } catch (err) {}
      applyCarPose(position, h);
      lastCarScale = 0;
      applyCarScale();
    } catch (err) {
      console.error(err);
      userCar = null;
      if (!userMarker && Marker3DElement) {
        userMarker = createCarPuck(position);
        map3d.append(userMarker);
      }
    }
  }

  function setupAutocomplete(PlaceAutocompleteElement){

      try { if (window.Car && typeof Car.onInputFocused === "function") Car.onInputFocused(value); } catch (err) {}
    });

    placeAutocomplete.addEventListener("gmp-select", async ({ placePrediction }) => {
      try {
        setMessage("Loading selected destination...");
        const place = placePrediction.toPlace();
        await place.fetchFields({ fields: ["displayName", "formattedAddress", "location"] });
        if (!place.location) throw new Error("Selected place has no location.");

  function setAutocompleteValue(text){
    const ac = placeAutocomplete || document.querySelector("gmp-place-autocomplete");
    if (!ac) return;
    const value = String(text || "");
    try { ac.value = value; } catch (err) {}
    const inner = ac.shadowRoot && ac.shadowRoot.querySelector("input, textarea, [contenteditable='true']");
    if (inner) {
      if (inner.isContentEditable) inner.textContent = value;
      else inner.value = value;
      inner.dispatchEvent(new Event("input", { bubbles:true }));
      inner.dispatchEvent(new Event("change", { bubbles:true }));
    }
    ac.dispatchEvent(new Event("input", { bubbles:true }));
    ac.dispatchEvent(new Event("change", { bubbles:true }));
  }

  function predictionText(value){
    if (value == null) return "";
    if (typeof value === "string") return value;
    if (typeof value.text === "string") return value.text;
    try { return String(value); } catch (err) { return ""; }
  }

  let suggestTimer = null;
  function scheduleSearchSuggestions(query){
    clearTimeout(suggestTimer);
    suggestTimer = setTimeout(() => previewSearchSuggestions(query), 180);

  function pushSearchSuggestions(query, items){
    renderSearchDropdown(items);
    try {
      if (window.Car && typeof Car.onSearchSuggestions === "function") {

  function renderSearchDropdown(items){
    const box = document.getElementById("searchResults");

    box.innerHTML = "";
    if (!hits.length) {

      return;

    hits.forEach(item => {

      title.textContent = item.title || item.placeId || "Result";

  async function previewSearchSuggestions(query){
    const q = String(query || "").trim();
    if (!q) {
      pushSearchSuggestions("", []);
      return;
    }
    try {
      const { AutocompleteSuggestion } = await google.maps.importLibrary("places");
      const center = currentGpsPoint || AUCKLAND;
      const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
        input: q,
        includedRegionCodes: ["nz"],
        locationBias: { radius: 50000, center }
      });
      const items = (suggestions || []).slice(0, 6).map(entry => {
        const prediction = entry.placePrediction || {};
        const structured = prediction.structuredFormat || {};
        const place = (typeof prediction.toPlace === "function") ? prediction.toPlace() : null;
        const title = predictionText(structured.mainText || prediction.mainText) || predictionText(prediction.text);
        const subtitle = predictionText(structured.secondaryText || prediction.secondaryText);
        return {
          placeId: prediction.placeId || (place && (place.id || place.placeId)) || "",
          title: title || q,
          subtitle
        };
      }).filter(item => item.placeId || item.title);
      pushSearchSuggestions(q, items);
    } catch (err) {
      console.error(err);
    }
  }

  async function searchDestinationFromQuery(query){
    const q = String(query || "").trim();
    setAutocompleteValue(q);
    showChrome();

      pushSearchSuggestions("", []);
      return;

    await previewSearchSuggestions(q);

      const destination = { lat: place.location.lat(), lng: place.location.lng() };

  async function calculateRoute(origin, destination, destinationName){
    stopDemo();
    if (!RouteClass || !map3d) return;
    setMessage(`Calculating route to ${destinationName}...`);

    try {
      const result = await RouteClass.computeRoutes({
        origin: { lat: origin.lat, lng: origin.lng },
        destination: { lat: destination.lat, lng: destination.lng },
        travelMode: "DRIVING",
        routingPreference: "TRAFFIC_AWARE",
        language: "en-NZ",
        units: google.maps.UnitSystem.METRIC,
        fields: ["path", "distanceMeters", "durationMillis", "staticDurationMillis"]
      });

      if (!result.routes || !result.routes.length) throw new Error("Google returned no route.");
      const route = result.routes[0];
      activeRoute = route;
      activeRoutePath = Array.from(route.path || []).map(point => ({
        lat: typeof point.lat === "function" ? point.lat() : point.lat,
        lng: typeof point.lng === "function" ? point.lng() : point.lng
      }));
      activeDestination = { name: destinationName, lat: destination.lat, lng: destination.lng };
      if (activeRoutePath.length < 2) throw new Error("Route returned without a usable path.");

      drawRoute(activeRoutePath);
      drawDestination(activeDestination);
      updateRouteInfo(route, destinationName);
      showRoutePreview(origin, destination, route.distanceMeters);
      setMessage("Route ready. Tap Go to start, or X to cancel.");
    } catch (err) {
      console.error(err);
      setMessage("Route request failed. Check that Routes API is enabled for this key. " + (err?.message || String(err)));
    }
  }

  function drawRoute(path){
    if (routeLine) routeLine.remove();
    routeLine = new Polyline3DElement({
      path,
      strokeColor: "#4285F4",
      outerColor: "#FFFFFF",
      strokeWidth: 9,
      outerWidth: 0.35,
      altitudeMode: "CLAMP_TO_GROUND",
      drawsOccludedSegments: true,
      zIndex: 20
    });
    map3d.append(routeLine);
  }

  function drawDestination(destination){
    if (destinationMarker) destinationMarker.remove();
    destinationMarker = new Marker3DElement({
      position: { lat: destination.lat, lng: destination.lng },
      label: destination.name,
      sizePreserved: true
    });
    map3d.append(destinationMarker);
  }

  function formatDuration(ms){
    const mins = Math.max(1, Math.round(ms / 60000));
    if (mins < 60) return `${mins} min`;
    const hours = Math.floor(mins / 60);
    const remain = mins % 60;
    return remain ? `${hours} hr ${remain} min` : `${hours} hr`;
  }

  function formatDistance(meters){
    const km = meters / 1000;
    if (km < 10) return `${km.toFixed(1)} km`;
    return `${Math.round(km)} km`;
  }

  function updateRouteInfo(route, destinationName){
    const mins = Math.max(1, Math.round(route.durationMillis / 60000));
    const eta = new Date(Date.now() + route.durationMillis);
    routeTimeEl.textContent = formatDuration(route.durationMillis);
    routeStatsEl.textContent = `${formatDistance(route.distanceMeters)} · ${formatTime(eta)}`;
    routeTitleEl.textContent = destinationName;

    if (Number.isFinite(route.staticDurationMillis) && route.staticDurationMillis > 0) {
      const staticMins = Math.round(route.staticDurationMillis / 60000);
      const trafficDifference = mins - staticMins;
      if (trafficDifference > 1) {
        routeSubEl.textContent = `+${trafficDifference} min traffic`;
        routeSubEl.className = "traffic-delay";
      } else {
        routeSubEl.textContent = "Usual traffic";
        routeSubEl.className = "";
      }
    } else {
      routeSubEl.textContent = "Traffic-aware route";
      routeSubEl.className = "";
    }
    document.body.classList.add("has-route");
    document.documentElement.classList.add("has-route");
    document.body.classList.remove("navigating");
    document.documentElement.classList.remove("navigating");
  }

  function showRoutePreview(origin, destination, distanceMeters){
    following = false;
    document.getElementById("followBtn").textContent = "Following: OFF";
    updateRecenterButton();
    showRouteOverview(origin, destination, distanceMeters);
  }

  function enterNavigation(){
    if (!activeRoutePath || activeRoutePath.length < 2) return;
    document.body.classList.add("navigating");
    document.documentElement.classList.add("navigating");
    following = true;
    document.getElementById("followBtn").textContent = "Following: ON";
    setView("drive");
    const here = currentGpsPoint || getRouteOrigin();
    const heading = Number(map3d.heading) || 0;
    updateCar({ lat: here.lat, lng: here.lng }, heading);
    updateRecenterButton();
    setMessage("Navigation started.");
  }

  function clearNavigation(){
    stopDemo();
    if (routeLine) { routeLine.remove(); routeLine = null; }
    if (destinationMarker) { destinationMarker.remove(); destinationMarker = null; }
    activeRoute = null;
    activeDestination = null;
    activeRoutePath = [];
    document.body.classList.remove("has-route", "navigating");
    document.documentElement.classList.remove("has-route", "navigating");
    routeTimeEl.textContent = "--";

  function showRouteOverview(origin, destination, distanceMeters){
    map3d.center = { lat: (origin.lat + destination.lat) / 2, lng: (origin.lng + destination.lng) / 2 };
    map3d.heading = bearingDegrees(origin, destination);
    map3d.tilt = 58;
    const routeDistance = Number.isFinite(distanceMeters) ? distanceMeters : distanceMetres(origin, destination);
    map3d.range = clamp(routeDistance * 0.75, 1200, 18000);
    setViewSelectValue("overview");
  }

  function getRouteOrigin(){
    return currentGpsPoint ? { lat: currentGpsPoint.lat, lng: currentGpsPoint.lng } : { lat: TEST_ORIGIN.lat, lng: TEST_ORIGIN.lng };
  }

  async function randomRoute(){
    const destination = TEST_DESTINATIONS[Math.floor(Math.random() * TEST_DESTINATIONS.length)];
    await calculateRoute(getRouteOrigin(), destination, destination.name);

  function startGps(){
    stopDemo();
    if (!navigator.geolocation) { setMessage("This browser does not support geolocation."); return; }
    if (watchId !== null) return;
    setMessage("Requesting precise location permission...");
    watchId = navigator.geolocation.watchPosition(handlePosition, handleGpsError, { enableHighAccuracy:true, maximumAge:500, timeout:20000 });
    document.getElementById("gpsBtn").textContent = "Stop GPS";
  }

  function stopGps(){
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    document.getElementById("gpsBtn").textContent = "Start GPS";
  }

  function toggleGps(){
    if (watchId !== null) { stopGps(); setMessage("GPS stopped."); }
    else startGps();
  }

  function handlePosition(position){
    if (!map3d || (!userMarker && !userCar)) return;
    const c = position.coords;
    const fix = { lat:c.latitude, lng:c.longitude, heading:Number.isFinite(c.heading) ? c.heading : null };
    currentGpsPoint = fix;
    let heading = fix.heading;
    if (heading === null && previousFix && distanceMetres(previousFix, fix) > 2) heading = bearingDegrees(previousFix, fix);
    if (heading === null) heading = Number.isFinite(map3d.heading) ? map3d.heading : 0;
    updateCar(fix, heading);
    previousFix = fix;
    if (placeAutocomplete) {
      placeAutocomplete.locationBias = { radius: 50000, center: { lat: fix.lat, lng: fix.lng } };
    }
    setMessage(`Live GPS · accuracy about ${Math.round(c.accuracy || 0)} m`);
  }

  function carOrientation(heading){
    // tilt/roll sits a Y-up glTF on the map; -90 yaw aims +Z (nose) along travel,
    // not +X (right doors).
    return { heading: normaliseHeading(heading - 90), tilt: 270, roll: 90 };
  }

  function updateCar(point, heading){
    const pos = { lat: point.lat, lng: point.lng };
    const h = normaliseHeading(heading);
    if (userMarker) userMarker.position = pos;
    applyCarPose(pos, h);
    if (following) {
      map3d.heading = h;
      if (currentView === "drive" || document.body.classList.contains("navigating")) {
        map3d.center = lookAhead(pos, h, 12);
      } else {
        map3d.center = pos;
      }
    }
    updateRecenterButton();
    coordsEl.textContent = `${point.lat.toFixed(5)}, ${point.lng.toFixed(5)}`;
    headingEl.textContent = `${Math.round(h)}°`;
  }

  function lookAhead(point, heading, metres){
    const rad = toRad(heading);
    const dLat = (metres * Math.cos(rad)) / 111320;
    const dLng = (metres * Math.sin(rad)) / (111320 * Math.max(0.2, Math.cos(toRad(point.lat))));
    return { lat: point.lat + dLat, lng: point.lng + dLng };
  }

  function handleGpsError(err){
    console.error(err);
    const messages = {1:"Location permission denied. HTTPS or localhost is required.",2:"Location is currently unavailable.",3:"Location request timed out."};
    setMessage(messages[err.code] || `GPS error: ${err.message}`);
    if (err.code === 1 || err.code === 2) stopGps();
  }

  function toggleFollow(){
    following = !following;
    document.getElementById("followBtn").textContent = `Following: ${following ? "ON" : "OFF"}`;
    updateRecenterButton();
    setMessage(following ? "Camera will follow the next GPS/demo position." : "Camera unlocked. Drag around the photorealistic map.");
  }

  function toggleLabels(){
    labelsOn = !labelsOn;
    map3d.mode = labelsOn ? "HYBRID" : "SATELLITE";
    document.getElementById("labelsBtn").textContent = `Labels: ${labelsOn ? "ON" : "OFF"}`;
  }

  function setView(mode){
    if (!map3d) return;
    currentView = mode;
    if (mode === "overview") {
      if (activeDestination) showRouteOverview(getRouteOrigin(), activeDestination, activeRoute?.distanceMeters);
    } else if (mode === "drive") {
      map3d.tilt = 70; map3d.range = 88; map3d.fov = 42;
    } else if (mode === "high") {
      map3d.tilt = 62; map3d.range = 650; map3d.fov = 40;
    } else {
      map3d.tilt = 0; map3d.range = 1300; map3d.heading = 0; map3d.fov = 35;
    }
    setViewSelectValue(mode);
    applyCarScale();
    refreshViewSpecs();
  }

  function toggleViewSelectMenu(){
    const menu = document.getElementById("viewSelectMenu");
    const btn = document.getElementById("viewSelectBtn");
    if (!menu) return;
    const open = menu.hidden;
    menu.hidden = !open;
    menu.classList.toggle("open", open);
    if (btn) btn.setAttribute("aria-expanded", open ? "true" : "false");
  }

  let viewSpecTimer = null;
  function viewSpecsOpen(){
    const panel = document.getElementById("viewSpecPanel");
    return panel && !panel.hidden;
  }

  function readMapCenter(){
    const c = map3d && map3d.center;
    if (!c) return { lat: AUCKLAND.lat, lng: AUCKLAND.lng, altitude: 0 };
    const lat = typeof c.lat === "function" ? c.lat() : c.lat;
    const lng = typeof c.lng === "function" ? c.lng() : c.lng;
    const altitude = typeof c.altitude === "function" ? c.altitude() : c.altitude;
    return {
      lat: Number(lat) || AUCKLAND.lat,
      lng: Number(lng) || AUCKLAND.lng,
      altitude: Number(altitude) || 0
    };
  }

  function formatRange(meters){
    const m = Number(meters) || 0;
    if (m >= 1000) return `${(m / 1000).toFixed(m >= 10000 ? 0 : 1)} km`;
    return `${Math.round(m)} m`;
  }

  function refreshViewSpecs(){
    if (!map3d || !viewSpecsOpen()) return;
    const center = readMapCenter();
    document.getElementById("specAltitude").textContent = `${Math.round(center.altitude)} m`;
    document.getElementById("specTilt").textContent = `${Math.round(Number(map3d.tilt) || 0)}°`;
    document.getElementById("specRange").textContent = formatRange(map3d.range);
    document.getElementById("specHeading").textContent = `${Math.round(normaliseHeading(Number(map3d.heading) || 0))}°`;
    document.getElementById("specFov").textContent = `${Math.round(Number(map3d.fov) || 35)}°`;
  }

  function unlockCameraForDebug(){
    if (!following) return;
    following = false;
    document.getElementById("followBtn").textContent = "Following: OFF";
    updateRecenterButton();
  }

  function nudgeSpec(spec, dir){
    if (!map3d) return;
    unlockCameraForDebug();
    const sign = dir === "+" ? 1 : -1;
    if (spec === "tilt") {
      map3d.tilt = clamp((Number(map3d.tilt) || 0) + sign * 5, 0, 90);
    } else if (spec === "range") {
      const range = Number(map3d.range) || 260;
      map3d.range = clamp(range * (sign > 0 ? 1.25 : 0.8), 80, 20000);
    } else if (spec === "heading") {
      map3d.heading = normaliseHeading((Number(map3d.heading) || 0) + sign * 15);
    } else if (spec === "fov") {
      map3d.fov = clamp((Number(map3d.fov) || 35) + sign * 5, 5, 80);
    } else if (spec === "altitude") {
      const center = readMapCenter();
      const step = center.altitude >= 80 ? 25 : 5;
      map3d.center = {
        lat: center.lat,
        lng: center.lng,
        altitude: clamp(center.altitude + sign * step, 0, 5000)
      };
    }
    refreshViewSpecs();
  }

  function toggleViewSpecs(){
    const panel = document.getElementById("viewSpecPanel");
    const btn = document.getElementById("viewSpecBtn");
    const open = panel.hidden;
    panel.hidden = !open;
    document.body.classList.toggle("view-specs", open);
    document.documentElement.classList.toggle("view-specs", open);
    btn.textContent = open ? "Hide specs" : "View specs";
    clearInterval(viewSpecTimer);
    if (open) {
      refreshViewSpecs();
      viewSpecTimer = setInterval(refreshViewSpecs, 400);
    } else {
      viewSpecTimer = null;
    }
  }

  function hideViewSpecs(){
    const panel = document.getElementById("viewSpecPanel");
    if (!panel) return;
    panel.hidden = true;
    document.body.classList.remove("view-specs");
    document.documentElement.classList.remove("view-specs");
    document.getElementById("viewSpecBtn").textContent = "View specs";
    clearInterval(viewSpecTimer);
    viewSpecTimer = null;
  }

  function readCarApiLevel(){
    try {
      if (window.Car && typeof Car.getCarAppApiLevel === "function") {
        const level = Number(Car.getCarAppApiLevel());
        if (Number.isFinite(level) && level > 0) return level;
      }
    } catch (err) {}
    const injected = Number(window.__aaCarApiLevel);
    return Number.isFinite(injected) && injected > 0 ? injected : null;
  }

  let modelViewerLoading = null;
  function ensureModelViewer(){
    if (window.customElements && customElements.get("model-viewer")) return Promise.resolve();
    if (!modelViewerLoading) {
      modelViewerLoading = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.type = "module";
        script.src = "https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js";
        script.onload = () => resolve();
        script.onerror = () => {
          modelViewerLoading = null;
          reject(new Error("model-viewer failed to load"));
        };
        document.head.append(script);
      });
    }
    return modelViewerLoading;
  }

  function applyViewerModel(viewer){
    const model = activeCarModel();
    viewer.setAttribute("src", model.url);
    viewer.setAttribute("alt", model.label);
    viewer.setAttribute("camera-orbit", model.orbit || "35deg 70deg auto");
    viewer.setAttribute("min-camera-orbit", "auto 12deg auto");
    viewer.setAttribute("max-camera-orbit", "auto 90deg auto");
    viewer.setAttribute("field-of-view", "30deg");
    try { if (typeof viewer.jumpCameraToGoal === "function") viewer.jumpCameraToGoal(); } catch (err) {}
  }

  async function openCarModelViewer(){
    const overlay = document.getElementById("carModelOverlay");
    const host = document.getElementById("carModelHost");
    if (!overlay || !host) return;
    overlay.hidden = false;
    overlay.classList.add("open");
    syncCarModelSwitch();
    const existing = host.querySelector("model-viewer");
    if (existing) {
      applyViewerModel(existing);
      return;
    }
    host.textContent = "Loading 3D model…";
    try {
      await ensureModelViewer();
    } catch (err) {
      host.textContent = "Could not load the 3D viewer (no network?).";
      return;
    }
    host.textContent = "";
    const viewer = document.createElement("model-viewer");
    viewer.setAttribute("camera-controls", "");
    viewer.setAttribute("auto-rotate", "");
    viewer.setAttribute("auto-rotate-delay", "1500");
    viewer.setAttribute("interaction-prompt", "none");
    viewer.setAttribute("shadow-intensity", "1");
    viewer.setAttribute("exposure", "1.15");
    applyViewerModel(viewer);
    host.append(viewer);
  }

  function closeCarModelViewer(){
    const overlay = document.getElementById("carModelOverlay");
    if (!overlay) return;
    overlay.hidden = true;
    overlay.classList.remove("open");
  }

  function hideCarApiHud(){
    const hud = document.getElementById("carApiHud");
    const btn = document.getElementById("carApiBtn");
    if (hud) {
      hud.hidden = true;
      hud.classList.remove("visible");
    }
    if (btn) btn.textContent = "API level";
  }

  function toggleCarApiHud(){
    const hud = document.getElementById("carApiHud");
    const valueEl = document.getElementById("carApiValue");
    const btn = document.getElementById("carApiBtn");
    if (!hud) return;
    const open = hud.hidden;
    if (!open) {
      hideCarApiHud();
      return;
    }
    const level = readCarApiLevel();
    if (valueEl) {
      const unknown = level == null || level <= 0;
      valueEl.textContent = unknown ? "unknown" : String(level);
      valueEl.style.fontSize = unknown ? "28px" : "";
    }
    hud.hidden = false;
    hud.classList.add("visible");
    if (btn) btn.textContent = "Hide API";
  }

  async function startRouteDemo(){
    if (demoTimer !== null) { stopDemo(); setMessage("Route demo stopped."); return; }
    if (!activeRoutePath || activeRoutePath.length < 2) {
      setMessage("Picking a random route...");
      await randomRoute();
      if (!activeRoutePath || activeRoutePath.length < 2) {
        setMessage("Could not load a route.");
        return;
      }
    }
    if (watchId !== null) { stopGps(); }

    enterNavigation();
    document.getElementById("demoBtn").textContent = "Stop drive demo";
    setMessage("Driving along Google's returned road path.");

    const path = activeRoutePath;
    const DEMO_SPEED = 10;
    const TICK_MS = 50;
    let index = 0;
    let distIntoSeg = 0;

    demoTimer = setInterval(() => {
      let remaining = DEMO_SPEED * (TICK_MS / 1000);
      while (remaining > 0) {
        if (index >= path.length - 1) {
          const last = path[path.length - 1];
          updateCar({ lat: last.lat, lng: last.lng }, Number(map3d.heading) || 0);
          stopDemo();
          setMessage("Demo arrived at destination.");
          return;
        }
        const p1 = path[index];
        const p2 = path[index + 1];
        const segLen = Math.max(distanceMetres(p1, p2), 0.05);
        const left = segLen - distIntoSeg;
        if (remaining >= left) {
          remaining -= left;
          index += 1;
          distIntoSeg = 0;
          continue;
        }
        distIntoSeg += remaining;
        remaining = 0;
        const t = distIntoSeg / segLen;
        updateCar(
          { lat: lerp(p1.lat, p2.lat, t), lng: lerp(p1.lng, p2.lng, t) },
          bearingDegrees(p1, p2)
        );
      }
    }, TICK_MS);
  }

  function stopDemo(){
    if (demoTimer !== null) { clearInterval(demoTimer); demoTimer = null; document.getElementById("demoBtn").textContent = "Drive route demo"; }
  }

  function downsamplePath(path,maxPoints){
    if (path.length <= maxPoints) return path.slice();
    const output = [], stride = (path.length - 1) / (maxPoints - 1);
    for (let i=0;i<maxPoints;i++) output.push(path[Math.round(i*stride)]);
    return output;
  }

  function formatTime(date){ return date.toLocaleTimeString("en-NZ",{hour:"numeric",minute:"2-digit"}); }
  function bearingDegrees(a,b){
    const lat1=toRad(a.lat), lat2=toRad(b.lat), dLng=toRad(b.lng-a.lng);
    const y=Math.sin(dLng)*Math.cos(lat2);
    const x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLng);
    return normaliseHeading(toDeg(Math.atan2(y,x)));
  }
  function distanceMetres(a,b){
    const R=6371000,dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng),lat1=toRad(a.lat),lat2=toRad(b.lat);
    const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function normaliseHeading(value){ return ((value%360)+360)%360; }
  function clamp(value,min,max){ return Math.min(max,Math.max(min,value)); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function toRad(deg){ return deg*Math.PI/180; }
  function toDeg(rad){ return rad*180/Math.PI; }

  window.__aaScaleMap = function(factor){
    if (!map3d) return;
    const range = Number(map3d.range) || 260;
    const next = range / (Number(factor) || 1);
    map3d.range = clamp(next, 40, 20000);
    applyCarScale();
    refreshViewSpecs();
  };
  window.__aaRecenter = function(){
    following = true;
    document.getElementById("followBtn").textContent = "Following: ON";
    startGps();
    if (currentGpsPoint && map3d) updateCar(currentGpsPoint, Number(map3d.heading) || 0);
    updateRecenterButton();
  };
  window.__aaUserPanned = markUserPanned;
  window.__aaSetDebugOverlay = function(on){
    document.documentElement.classList.toggle("debug-open", !!on);
    document.body.classList.toggle("debug-open", !!on);
    if (!on) {
      hideViewSpecs();
      hideCarApiHud();
      closeViewSelectMenu();
      closeCarModelViewer();
    }
    try {
      if (window.Car && typeof Car.setDebugOverlay === "function") Car.setDebugOverlay(!!on);
    } catch (err) {}
  };

  function isAndroidAuto(){
    return document.documentElement.classList.contains("aa-car") || document.body.classList.contains("aa-car");
  }

  function markUserPanned(){
    if (following) {
      following = false;
      const followBtn = document.getElementById("followBtn");
      if (followBtn) followBtn.textContent = "Following: OFF";
    }
    updateRecenterButton();
  }

  function updateRecenterButton(){
    const btn = document.getElementById("recenterBtn");
    if (!btn) return;
    btn.classList.toggle("visible", !following && !!currentGpsPoint);
  }
  window.__aaInjectGps = function(fix){
    if (!fix || !Number.isFinite(Number(fix.lat)) || !Number.isFinite(Number(fix.lng))) return;
    handlePosition({
      coords: {
        latitude: Number(fix.lat),
        longitude: Number(fix.lng),
        heading: Number.isFinite(Number(fix.heading)) ? Number(fix.heading) : null,
        accuracy: Number.isFinite(Number(fix.accuracy)) ? Number(fix.accuracy) : 0
      }
    });
  };
  window.__aaWakeMap = function(){
    window.dispatchEvent(new Event("resize"));
    if (!map3d) return;
    const heading = Number(map3d.heading);
    if (Number.isFinite(heading)) {
      map3d.heading = heading;
    }
  };

  document.getElementById("gpsBtn").addEventListener("click",toggleGps);
  document.getElementById("followBtn").addEventListener("click",toggleFollow);
  document.getElementById("labelsBtn").addEventListener("click",toggleLabels);
  document.getElementById("demoBtn").addEventListener("click",startRouteDemo);
  document.getElementById("randomBtn").addEventListener("click",randomRoute);
  document.getElementById("viewSelectBtn").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    toggleViewSelectMenu();
  });
  document.getElementById("viewSelectMenu").addEventListener("click", event => {
    const btn = event.target.closest("button[data-view]");
    if (!btn) return;
    event.preventDefault();
    event.stopPropagation();
    setView(btn.dataset.view);
  });
  document.getElementById("viewSpecBtn").addEventListener("click", toggleViewSpecs);
  document.getElementById("carApiBtn").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    toggleCarApiHud();
  });
  document.getElementById("carModelBtn").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    openCarModelViewer();
  });
  document.getElementById("carModelSwitch").addEventListener("click", event => {
    const btn = event.target.closest("button[data-model]");
    if (!btn) return;
    event.preventDefault();
    event.stopPropagation();
    setActiveCarModel(btn.dataset.model);
  });
  document.getElementById("carModelClose").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    closeCarModelViewer();
  });
  document.getElementById("carModelOverlay").addEventListener("click", event => {
    if (event.target === event.currentTarget) closeCarModelViewer();
  });
  document.getElementById("specZoomIn").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    window.__aaScaleMap(1.25);
  });
  document.getElementById("specZoomOut").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    window.__aaScaleMap(0.8);
  });
  document.getElementById("viewSpecPanel").addEventListener("click", event => {
    const btn = event.target.closest("button[data-spec]");
    if (!btn) return;
    event.preventDefault();
    event.stopPropagation();
    nudgeSpec(btn.dataset.spec, btn.dataset.dir);
  });
  document.getElementById("recenterBtn").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    window.__aaRecenter();
  });
  document.getElementById("carDebugBtn").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    window.__aaSetDebugOverlay(!document.body.classList.contains("debug-open"));
  });
  document.getElementById("routeClose").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    clearNavigation();
  });
  document.getElementById("routeGo").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    enterNavigation();
  });

  const CHROME_HIDE_MS = 3500;
  let chromeHideTimer = null;
  let chromeLocked = false;

  function showChrome(){
    if (isAndroidAuto()) return;
    document.body.classList.remove("chrome-hidden");
    scheduleChromeHide();
  }

  function hideChrome(){
    if (isAndroidAuto() || chromeLocked) return;
    document.body.classList.add("chrome-hidden");
    clearTimeout(chromeHideTimer);
    hideSearchDropdown();
  }

  function scheduleChromeHide(){
    clearTimeout(chromeHideTimer);
    chromeHideTimer = setTimeout(hideChrome, CHROME_HIDE_MS);
  }

  function isChromeUiTarget(target){
    return !!(target && target.closest && target.closest("#topPanel, #chromeWake, #searchResults, #recenterBtn, #carDebugBtn, #routeCard, #viewSpecPanel, #carApiHud, #viewPicker, #carModelOverlay"));
  }

  let mapDragStart = null;
  window.addEventListener("pointerdown", event => {
    if (!event.target.closest || !event.target.closest("#viewPicker")) closeViewSelectMenu();
    if (isChromeUiTarget(event.target)) {
      mapDragStart = null;
      return;
    }
    mapDragStart = { x: event.clientX, y: event.clientY };
  }, { capture:true, passive:true });
  window.addEventListener("pointermove", event => {
    if (!mapDragStart) return;
    const dx = event.clientX - mapDragStart.x;
    const dy = event.clientY - mapDragStart.y;
    if (dx * dx + dy * dy < 64) return;
    chromeLocked = false;
    hideChrome();
    markUserPanned();
    mapDragStart = null;
  }, { capture:true, passive:true });
  window.addEventListener("pointerup", () => { mapDragStart = null; }, { capture:true, passive:true });
  window.addEventListener("pointercancel", () => { mapDragStart = null; }, { capture:true, passive:true });
  window.addEventListener("wheel", event => {
    if (isChromeUiTarget(event.target)) return;
    chromeLocked = false;
    hideChrome();
    markUserPanned();
  }, { capture:true, passive:true });

  window.addEventListener("click", () => {
    if (isAndroidAuto()) return;
    if (document.body.classList.contains("chrome-hidden")) showChrome();
  }, true);

  const topPanel = document.getElementById("topPanel");
  topPanel.addEventListener("pointerdown", () => {
    if (!document.body.classList.contains("chrome-hidden")) showChrome();
  });
  topPanel.addEventListener("focusin", () => { chromeLocked = true; showChrome(); });
  topPanel.addEventListener("focusout", () => { chromeLocked = false; scheduleChromeHide(); });
  document.getElementById("chromeWake").addEventListener("pointerdown", event => {
    event.preventDefault();
    showChrome();
  });
  document.getElementById("chromeWake").addEventListener("click", event => {
    event.preventDefault();
    showChrome();
  });

  function showMapFailure(text){
    setMessage(text);
    const status = document.getElementById("mapLoaderStatus");
    if (status) {
      status.hidden = false;
      status.textContent = text;
    }
  }

  let mapRevealDone = false;
  function revealMap(){
    if (mapRevealDone) return;
    mapRevealDone = true;
    document.body.classList.add("map-ready");
    document.documentElement.classList.add("map-ready");
    if (!placeAutocomplete && PlaceAutocompleteClass) {
      setupAutocomplete(PlaceAutocompleteClass);
    }
  }

  function armMapReveal(){
    if (!map3d) {
      window.setTimeout(revealMap, 5000);
      return;
    }
    // Keep the map at full opacity under the loader so WebGL/tiles actually
    // run. Only drop the overlay after the 3D view has painted and settled.
    let painted = false;
    let tilesReady = false;
    let minTimeDone = false;
    const maybeReveal = () => {
      if (painted && tilesReady && minTimeDone) revealMap();
    };
    window.setTimeout(() => {
      minTimeDone = true;
      maybeReveal();
    }, 1200);
    const onPainted = () => {
      if (painted) return;
      painted = true;
      window.setTimeout(() => {
        tilesReady = true;
        maybeReveal();
      }, 3200);
    };
    map3d.addEventListener("gmp-steadycamerachange", onPainted, { once: true });
    map3d.addEventListener("gmp-centerchange", onPainted, { once: true });
    window.setTimeout(onPainted, 7000);
    window.setTimeout(revealMap, 14000);
  }

  function mapsKeyIsMissing(key){
    // Do not compare against the deploy placeholder string: GitHub Pages
    // replaces every copy of that token, which used to make this check
    // always true and skipped loading Maps entirely.
    return !key || key.indexOf("AIza") !== 0 || key.length < 20;
  }

  function loadGoogleMaps(){
    if (mapsKeyIsMissing(GOOGLE_MAPS_API_KEY)) {
      showMapFailure("Maps API key was not injected at deploy time.");
      return;
    }
    const script=document.createElement("script");
    script.async=true;
    script.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(GOOGLE_MAPS_API_KEY)+"&v=weekly&loading=async&callback=initMap";
    script.onerror=()=>showMapFailure("Could not load Google Maps JavaScript API.");
    document.head.append(script);
  }

  loadGoogleMaps();
</script>
