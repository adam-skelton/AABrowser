    for (const way of speedLimit.ways) {
      const pts = way.pts;
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i];
        if (Math.abs(a.lat - point.lat) > latTol && Math.abs(b.lat - point.lat) > latTol) continue;
        if (Math.abs(a.lng - point.lng) > lngTol && Math.abs(b.lng - point.lng) > lngTol) continue;
        const d = distanceMetres(point, projectOnSegment(point, a, b).point);
        if (d >= bestD) continue;
        if (Number.isFinite(heading)) {
          // Ways are undirected here: accept either direction, reject cross streets.
          const diff = angleDelta(bearingDegrees(a, b), heading);
          if (Math.min(diff, 180 - diff) > 40) continue;
        }
        bestD = d;
        best = way.kmh;
      }
    }
    return best;
  }

  function updateSpeedLimit(fix){
    if (!isNavigating()) {
      if (speedLimit.current != null) { speedLimit.current = null; updateSpeedLimitBadge(); }
      return;
    }
    const hit = matchSpeedLimit(fix, fix.bearingOk ? fix.heading : NaN);
    if (hit != null) {
      speedLimit.current = hit;
      speedLimit.lastHitM = puck.progressM;
    } else if (puck.progressM - speedLimit.lastHitM > SPEED_LIMIT_FORGET_M) {
      speedLimit.current = null;
    }
    updateSpeedLimitBadge();
  }

  function updateSpeedLimitBadge(){
    const el = document.getElementById("speedLimitBadge");
    if (!el) return;
    const show = isNavigating() && speedLimit.current != null;
    el.classList.toggle("visible", show);
    if (show) el.textContent = String(speedLimit.current);
  }

  // Port of Vela's nav fix block: forward-only map matching with a plausibility gate,
  // then the along-route position filter takes the fix as a MEASUREMENT.
  function ingestRouteFix(fix, now){
    const path = activeRoutePath, cum = routeCum;
    const me = { lat: fix.lat, lng: fix.lng };
    const kSpeed = speedKalman.speed;
    let snap;
    if (puck.engaged) {
      // Look-ahead sized from the speed at the last ACCEPTED fix too, so a decaying model
      // during an outage doesn't shrink the window exactly when the resume fix needs it big.
      const aheadSpeed = Math.max(kSpeed, puck.speedAtAccept);
      const ahead = clamp(aheadSpeed * 8, 150, 600);
      snap = snapToRouteWindowed(
        me,
        (kSpeed < 1 || !fix.bearingOk) ? null : fix.heading, // heading gate skipped when stopped
        path, cum,
        puck.targetM - 25, puck.targetM + ahead,
        FOLLOW.SNAP_MAX_M + clamp(aheadSpeed, 0, 13)
      );
    } else {
      // Not yet engaged (nav start / new route): one global acquisition, then forward-only.
      snap = snapToRouteWindowed(me, fix.bearingOk ? fix.heading : null, path, cum, -Infinity, Infinity, FOLLOW.SNAP_MAX_M + 13);
    }
    if (snap) {
      const m = snap.metres;
      let accepted = false, reanchor = false;
      if (!puck.engaged) {
        puck.engaged = true;
        puck.progressM = m;
        puck.targetM = m;
        puck.smoothWin = NaN;
        puck.fwdRejects = 0;
        accepted = true;
        reanchor = true;
      } else {
        // Monotonic forward only: accept a plausible advance (speed x elapsed x 2.5 + 60 m
        // absorbs a real GPS gap), hold on anything else and let dead reckoning cover it.
        const dtFix = clamp((now - puck.targetAtMs) / 1000, 0, 10);
        const maxStep = Math.max(kSpeed, 1) * dtFix * 2.5 + 60;
        const fwd = m - puck.targetM;
        if (fwd >= 0 && fwd <= maxStep && (kSpeed > 0.5 || fwd > 8)) {
          // (parked-jitter gate: at ~zero speed a small forward hop is noise, not travel)
          puck.targetM = m;
          accepted = true;
          puck.fwdRejects = 0;
        } else if (fwd > maxStep) {
          // An over-cap jump that PERSISTS is the new reality (long fix gap at speed).
          puck.fwdRejects += 1;
          if (puck.fwdRejects >= 2) {
            puck.targetM = m;
            accepted = true;
            reanchor = true;
            puck.fwdRejects = 0;
          }
        } else {
          puck.fwdRejects = 0;
        }
      }
      puck.missCount = 0;
      if (accepted) {
        puck.targetAtMs = now;
        if (reanchor) alongFilter.reseed(m, fix.accuracy);
        else alongFilter.update(m, fix.accuracy);
        puck.speedAtAccept = speedKalman.speed;
      }
    } else if (puck.engaged) {
      // Nothing ahead within tolerance: a spike or we've left the route. Hold and keep
      // dead-reckoning; a short run of misses disengages to re-acquire globally.
      puck.missCount += 1;
      if (puck.missCount >= FOLLOW.MISS_LIMIT) disengageRoutePuck();
    }
  }

  // ---- Per-frame ticker ----

  let followRaf = 0;
  let followLastMs = 0;
  function ensureFollowTicker(){
    if (!followRaf) followRaf = requestAnimationFrame(followTick);
  }

  function followTick(now){
    followRaf = requestAnimationFrame(followTick);
    // Two frame deltas: dtRaw for the PHYSICS (a janky frame must integrate its full
    // travel or the car loses distance and lurches at each fix), dtEase (capped) for
    // the cosmetic eases so a hitch's catch-up spreads over the next few frames.
    const dtRaw = followLastMs ? clamp((now - followLastMs) / 1000, 0, 0.5) : 0;
    followLastMs = now;
    const dtEase = Math.min(dtRaw, FOLLOW.MAX_EASE_DT);
    if (!puck.fix || !map3d) return;
    stepPuck(dtRaw, dtEase, now);
    applyCarPose({ lat: puck.lat, lng: puck.lng }, puck.heading);
    updateTraversedRoute();
    // Car mode: a pan let go of the car; re-attach once the screen has been untouched long enough.
    if (!following && autoRefollowArmed && isAndroidAuto() && currentGpsPoint && now - lastTouchMs > AUTO_REFOLLOW_MS) {
      attachFollow(currentView === "overview" ? "drive" : null);
    }
    if (following) applyFollowCamera(dtEase, now);
    else cam.seeded = false; // re-attach eases in from wherever the user left the camera
  }

  function stepPuck(dtRaw, dtEase, now){
    const fix = puck.fix;
    const sinceFix = (now - fix.atMs) / 1000;
    if (puck.engaged && activeRoutePath.length >= 2 && routeCum.length === activeRoutePath.length) {
      const path = activeRoutePath, cum = routeCum, total = cum[cum.length - 1];
      speedKalman.predict(dtRaw, forwardAccelNow(now));
      // Past the dead-reckon window with no fix = a measurement outage: decay the speed.
      if (sinceFix > FOLLOW.DEAD_RECKON_S) speedKalman.decay(dtRaw);
      const speed = speedKalman.speed;
      // Dead-reckon the position estimate over THIS frame's slice of the blind window.
      const tEnd = clamp(sinceFix, 0, FOLLOW.DEAD_RECKON_S);
      const tStart = clamp(sinceFix - dtRaw, 0, FOLLOW.DEAD_RECKON_S);
      alongFilter.predict(tEnd > tStart ? speed * (tEnd - tStart) : 0, dtRaw);
      // Rate-domain correction: the car always advances at the modelled speed and the
      // estimate error enters as a BOUNDED nudge to that rate. Can't stall, can't lurch,
      // still monotonic.
      const err = alongFilter.alongM - puck.progressM;
      const maxCatchUp = speed * 1.5 + 2;
      const maxHoldBack = speed * 0.25 + 0.5;
      const corr = clamp(err / FOLLOW.CORRECT_TIME_S, -maxHoldBack, maxCatchUp);
      puck.progressM = clamp(puck.progressM + Math.max(0, (speed + corr) * dtRaw), 0, total);
      // Lateral de-jitter: boxcar average across a speed-scaled along-route window, so
      // lane-level kinks in the polyline cancel instead of wobbling the whole view. The
      // window WIDTH eases slowly (it tracks town vs motorway, not per-fix speed noise).
      const winTarget = clamp(speed * 0.7, 5, 14);
      puck.smoothWin = Number.isNaN(puck.smoothWin) ? winTarget
        : puck.smoothWin + (winTarget - puck.smoothWin) * easeK(dtEase, FOLLOW.WIN_TAU);
      const win = puck.smoothWin;
      const n = FOLLOW.SMOOTH_SAMPLES;
      let sLat = 0, sLng = 0;
      for (let k = 0; k < n; k++) {
        const p = pointAtMetres(path, cum, puck.progressM - win + 2 * win * k / (n - 1)).point;
        sLat += p.lat;
        sLng += p.lng;
      }
      puck.lat = sLat / n;
      puck.lng = sLng / n;
      // Heading from the window ENDS (chord), not the local segment: the segment bearing
      // steps at every vertex; the chord barely moves on a straight road.
      const a = pointAtMetres(path, cum, puck.progressM - win);
      const b = pointAtMetres(path, cum, puck.progressM + win);
      const degenerate = Math.abs(a.point.lat - b.point.lat) + Math.abs(a.point.lng - b.point.lng) < 1e-7;
      const chord = degenerate ? b.bearing : bearingDegrees(a.point, b.point);
      puck.heading = Number.isFinite(puck.heading) ? smoothBearing(puck.heading, chord, dtEase, FOLLOW.CAR_BRG_TAU) : chord;
    } else {
      // Free follow (no route): the car rolls on under its own modelled speed along its
      // smoothed heading, and the last fix - dead-reckoned forward along its course
      // (capped) so it moves like the car - enters as a BOUNDED correction to that
      // motion. Same rate-domain idea as the route model: at this close a range a plain
      // ease toward each new fix (Vela's zoomed-out free drive) would show GPS noise as a
      // visible twitch every second; a capped correction spreads it into a gentle drift.
      speedKalman.predict(dtRaw, forwardAccelNow(now));
      if (sinceFix > FOLLOW.FREE_RECKON_S) speedKalman.decay(dtRaw);
      const v = speedKalman.speed;
      const moving = v > 1.5 && Number.isFinite(puck.freeHeading);
      const reckonM = moving ? v * Math.min(sinceFix, FOLLOW.FREE_RECKON_S) : 0;
      const tgt = reckonM > 0 ? lookAhead(fix, puck.freeHeading, reckonM) : fix;
      if (Number.isFinite(puck.freeHeading)) {
        puck.heading = Number.isFinite(puck.heading) ? smoothBearing(puck.heading, puck.freeHeading, dtEase, FOLLOW.CAR_BRG_TAU) : puck.freeHeading;
      }
      if (moving && sinceFix <= FOLLOW.FREE_RECKON_S && Number.isFinite(puck.heading)) {
        const rolled = lookAhead({ lat: puck.lat, lng: puck.lng }, puck.heading, v * dtRaw);
        puck.lat = rolled.lat;
        puck.lng = rolled.lng;
      }
      const errM = distanceMetres({ lat: puck.lat, lng: puck.lng }, tgt);
      if (errM > 1e-3) {
        // Correction rate cap: gentle (half the speed) for a noise-sized residual, ramping
        // up to the route model's 1.5v+2 catch-up by FREE_FULL_M, and never slower than a
        // ~3 s glide for a huge one (GPS re-lock after an outage, under the teleport cap).
        const ramp = clamp((errM - FOLLOW.FREE_GENTLE_M) / (FOLLOW.FREE_FULL_M - FOLLOW.FREE_GENTLE_M), 0, 1);
        const cap = Math.max(Math.max(v * 0.5, 2) + (v + 2) * ramp, ramp * errM / 3);
        const corrSpeed = Math.min(errM / FOLLOW.CORRECT_TIME_S, cap);
        const f = Math.min(1, corrSpeed * dtRaw / errM);
        puck.lat += (tgt.lat - puck.lat) * f;
        puck.lng += (tgt.lng - puck.lng) * f;
      }
    }
  }

  // ---- Follow camera ----

  function viewTargets(){
    let v;
    if (currentView === "high") v = { tilt: 62, range: 650, fov: 40, headingUp: true, breathe: false };
    else if (currentView === "top") v = { tilt: 0, range: 1300, fov: 35, headingUp: false, breathe: false };
    else v = { tilt: CAR_REF_TILT, range: CAR_REF_RANGE, fov: CAR_REF_FOV, headingUp: true, breathe: true };
    if (northUp && v.headingUp) {
      // North-up: fixed heading with the car centred, a little flatter and wider so the
      // road ahead stays in frame whichever way it runs.
      v = { tilt: Math.min(v.tilt, 48), range: v.range * 1.35, fov: v.fov, headingUp: false, breathe: v.breathe };
    }
    return v;
  }

  // Speed band -> zoom level (Vela's car bands), with hysteresis so a car hovering at a
  // threshold doesn't flap between two ranges.
  function zoomBandForSpeed(v){
    const kmh = v * 3.6;
    let idx = zoomBandIdx;
    while (idx < ZOOM_BANDS.length - 1 && kmh >= ZOOM_BANDS[idx][0] + ZOOM_BAND_HYST_KMH) idx++;
    while (idx > 0 && kmh < ZOOM_BANDS[idx - 1][0] - ZOOM_BAND_HYST_KMH) idx--;
    zoomBandIdx = idx;
    return ZOOM_BANDS[idx][1];
  }

  // Range multiplier for an (eased) zoom level relative to the tightest band.
  function rangeFactorForZoom(zoom){
    return Math.pow(2, ZOOM_BANDS[0][1] - zoom);
  }

  // ---- Route-start fly-over ----

  function startFlyover(){
    flyover = null;
    if (activeRoutePath.length < 2 || routeCum.length !== activeRoutePath.length) return;
    const total = routeCum[routeCum.length - 1];
    if (total < FLYOVER_MIN_M) return;
    flyover = {
      startMs: performance.now(),
      durMs: clamp(2000 + total / 1.5, 2500, 5000),
      total,
      range: clamp(total * 0.4, 500, 2500)
    };
  }

  // The camera target while the fly-over runs: a point sliding from the destination back
  // along the route to the car (ease-in-out), looking down the road, from a range that
  // frames a good stretch of it. Null once done - the normal follow then dives in.
  function flyoverFrame(now){
    if (!flyover) return null;
    if (!isNavigating() || activeRoutePath.length < 2 || routeCum.length !== activeRoutePath.length) { flyover = null; return null; }
    const u = (now - flyover.startMs) / flyover.durMs;
    if (u >= 1) { flyover = null; return null; }
    const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const m = lerp(flyover.total, clamp(puck.progressM, 0, flyover.total), e);
    const at = pointAtMetres(activeRoutePath, routeCum, m);
    // Look down the route's general direction (a long chord), not the local segment: at
    // sweep speed the per-vertex bearing would whip the camera at every bend.
    const look = clamp(flyover.total * 0.1, 200, 800);
    const behind = pointAtMetres(activeRoutePath, routeCum, Math.max(m - look, 0)).point;
    const ahead = pointAtMetres(activeRoutePath, routeCum, Math.min(m + look, flyover.total)).point;
    const degenerate = Math.abs(ahead.lat - behind.lat) + Math.abs(ahead.lng - behind.lng) < 1e-7;
    return { point: at.point, bearing: degenerate ? at.bearing : bearingDegrees(behind, ahead), range: flyover.range, tilt: 55 };
  }

  // Ground distance from the camera's centre point to a point that renders at screen
  // fraction `frac` (0 = top, 1 = bottom), for a camera orbiting the centre at `range`
  // with `tilt` degrees from vertical and a vertical field of view `fov`. Aiming the
  // centre this far AHEAD of the car puts the car at `frac` (Google/Vela's puck-low
  // framing). Works for any tilt including top-down.
  function lookAheadForFraction(range, tilt, fov, frac){
    const tiltR = toRad(clamp(tilt, 0, 89.9));
    const H = range * Math.cos(tiltR);
    const L = range * Math.sin(tiltR);
    const depCentre = Math.PI / 2 - tiltR;
    const delta = Math.atan(((frac - 0.5) / 0.5) * Math.tan(toRad(clamp(fov, 5, 80)) / 2));
    const depCar = depCentre + delta;
    const s = Math.sin(depCar), c = Math.cos(depCar);
    if (Math.abs(s) < 1e-6) return L;
    return Math.max(0, L - H * c / s);
  }

  function numOr(value, fallback){
    const n = Number(value);
    return Number.isFinite(n) ? n : fallback;
  }

  function applyFollowCamera(dtEase, now){
    const view = viewTargets();
    if (!cam.seeded) {
      // (Re)attach: seed from the live camera so the hand-off from a pan, the route
      // overview or a Re-center is a glide, not a cut.
      const c = readMapCenter();
      cam.lat = c.lat;
      cam.lng = c.lng;
      cam.heading = numOr(map3d.heading, 0);
      // (An unset map property can read as 0: fall back to the view's value where 0 is invalid.)
      const liveRange = numOr(map3d.range, 0), liveFov = numOr(map3d.fov, 0);
      cam.range = liveRange > 0 ? liveRange : view.range;
      cam.tilt = numOr(map3d.tilt, view.tilt);
      cam.fov = liveFov >= 5 ? liveFov : view.fov;
      cam.speedLP = speedKalman.speed;
      cam.zoom = zoomBandForSpeed(cam.speedLP);
      cam.latched = false;
      cam.seeded = true;
    }
    cam.speedLP += (speedKalman.speed - cam.speedLP) * easeK(dtEase, FOLLOW.SPEED_TAU);
    // Speed-band zoom: the band steps, the eased level glides between them.
    cam.zoom += (zoomBandForSpeed(cam.speedLP) - cam.zoom) * easeK(dtEase, FOLLOW.ZOOM_TAU);
    let tgtRange = cam.userRange != null ? cam.userRange
      : view.range * (view.breathe ? rangeFactorForZoom(cam.zoom) : 1);
    let tiltTarget = view.tilt;
    // Heading-up latch (Vela): the camera takes the car's course only once the car is
    // genuinely moving; parked, it holds where it is instead of spinning with GPS noise.
    // On a route the course is the road's own bearing, which is always trustworthy.
    let headingTarget;
    if (!view.headingUp) {
      headingTarget = 0;
    } else {
      if (!cam.latched && cam.speedLP > FOLLOW.LATCH_MPS) cam.latched = true;
      else if (cam.latched && cam.speedLP < FOLLOW.HOLD_MPS && !puck.engaged) cam.latched = false;
      headingTarget = (cam.latched || puck.engaged) && Number.isFinite(puck.heading) ? puck.heading : cam.heading;
    }
    const car = { lat: puck.lat, lng: puck.lng };
    const fly = flyoverFrame(now);
    if (fly) {
      tgtRange = fly.range;
      tiltTarget = fly.tilt;
      headingTarget = fly.bearing;
    }
    // Flight blend: when the camera is far from where it should be (Re-center after a
    // pan, overview -> drive) every parameter eases with a longer SHARED time constant so
    // it reads as one swoop, tightening back to the follow constants as it closes in.
    const farPos = clamp((distanceMetres({ lat: cam.lat, lng: cam.lng }, car) - tgtRange) / 1200, 0, 1);
    const farRange = clamp(Math.abs(Math.log(Math.max(cam.range, 1) / Math.max(tgtRange, 1))) / Math.log(4), 0, 1);
    const flight = Math.max(farPos, farRange);
    const extra = flight * FOLLOW.FLIGHT_TAU;
    // Aim along the CAMERA heading (not the car's), so the car stays on the screen's
    // vertical centre line even while the camera's heading is still catching up in a turn.
    // The look-ahead comes from the LIVE framing (exact car placement every frame) but
    // blends toward the TARGET framing while in flight: from a 2 km overview the live
    // value would aim a kilometre up the road and drop the car off the bottom edge.
    let lookM = 0;
    if (view.headingUp && !fly) {
      const lookLive = lookAheadForFraction(cam.range, cam.tilt, cam.fov, FOLLOW.CAR_SCREEN_Y);
      const lookTarget = lookAheadForFraction(tgtRange, view.tilt, view.fov, FOLLOW.CAR_SCREEN_Y);
      lookM = lerp(lookLive, lookTarget, flight);
    }
    const aim = fly ? fly.point : (lookM > 0 ? lookAhead(car, cam.heading, lookM) : car);

    const kPos = easeK(dtEase, FOLLOW.POS_TAU + extra);
    cam.lat += (aim.lat - cam.lat) * kPos;
    cam.lng += (aim.lng - cam.lng) * kPos;
    // Camera heading is adaptively damped: heavy while the error is a few degrees of
    // road-geometry wiggle, quick once it's turn-sized. Google's grammar: a crisp car
    // under a heavy camera.
    const db = ((headingTarget - cam.heading + 540) % 360) - 180;
    const brgTau = FOLLOW.BRG_TAU_STILL + (FOLLOW.BRG_TAU_TURN - FOLLOW.BRG_TAU_STILL) * Math.min(Math.abs(db) / FOLLOW.BRG_TURN_DEG, 1);
    // Rate cap: real corners peak well under it; it tames the half-circle swings of a
    // view switch (heading-up -> north-up) or a re-center after the user spun the map.
    const maxTurn = FOLLOW.BRG_MAX_RATE * dtEase;
    cam.heading = normaliseHeading(cam.heading + clamp(db * easeK(dtEase, brgTau + extra), -maxTurn, maxTurn));
    cam.tilt += (tiltTarget - cam.tilt) * easeK(dtEase, FOLLOW.TILT_TAU + extra);
    cam.range += (tgtRange - cam.range) * easeK(dtEase, FOLLOW.RANGE_TAU + extra);
    cam.fov += (view.fov - cam.fov) * easeK(dtEase, FOLLOW.RANGE_TAU + extra);

    const center = { lat: cam.lat, lng: cam.lng };
    const alt = followGroundAltitude(center, dtEase);
    if (Number.isFinite(alt)) center.altitude = alt;
    map3d.center = center;
    if (Math.abs(((numOr(map3d.heading, 0) - cam.heading + 540) % 360) - 180) > 0.005) map3d.heading = cam.heading;
    if (Math.abs(numOr(map3d.range, 0) - cam.range) > 0.02) map3d.range = cam.range;
    if (Math.abs(numOr(map3d.tilt, 0) - cam.tilt) > 0.005) map3d.tilt = cam.tilt;
    if (Math.abs(numOr(map3d.fov, 0) - cam.fov) > 0.005) map3d.fov = cam.fov;
    applyLiveCarScale();
    updateCompassNeedle(cam.heading);
  }

  // Attach the follow camera (Re-center, auto re-follow). `view` switches the view first;
  // null keeps the current one. The ticker seeds from the live camera and flies it in.
  function attachFollow(view){
    if (!map3d) return;
    following = true;
    cam.userRange = null;
    cam.seeded = false;
    autoRefollowArmed = false;
    if (view) {
      currentView = view;
      setViewSelectValue(view);
    }
    const followBtn = document.getElementById("followBtn");
    if (followBtn) followBtn.textContent = "Following: ON";
    ensureFollowTicker();
    updateRecenterButton();
  }

  function recenterToCar(){
    if (!map3d) return;
    attachFollow("drive");
    if (!isDemoRunning()) startGps(); // (startGps stops a running demo - keep a mock drive alive)
  }

  // ---- North-up / heading-up ----

  function toggleNorthUp(){
    northUp = !northUp;
    cam.userRange = null;
    updateCompassButton();
    setMessage(northUp ? "North up." : "Heading up.");
  }

  let compassNeedleDeg = NaN;
  function updateCompassNeedle(heading){
    if (!Number.isFinite(heading)) return;
    if (Number.isFinite(compassNeedleDeg) && angleDelta(compassNeedleDeg, heading) < 0.5) return;
    compassNeedleDeg = heading;
    const needle = document.getElementById("compassNeedle");
    if (needle) needle.style.transform = `rotate(${-heading}deg)`;
  }

  function updateCompassButton(){
    const btn = document.getElementById("compassBtn");
    if (!btn) return;
    btn.classList.toggle("visible", !!currentGpsPoint && following && currentView !== "top" && currentView !== "overview");
    btn.classList.toggle("north-up", northUp);
  }

  function handleGpsError(err){
    console.error(err);
    const messages = {1:"Location permission denied. HTTPS or localhost is required.",2:"Location is currently unavailable.",3:"Location request timed out."};
    setMessage(messages[err.code] || `GPS error: ${err.message}`);
    if (err.code === 1 || err.code === 2) stopGps();
  }

  function toggleFollow(){
    following = !following;
    autoRefollowArmed = false; // an explicit toggle is not a pan: no timed re-attach
    if (!following) flyover = null;
    document.getElementById("followBtn").textContent = `Following: ${following ? "ON" : "OFF"}`;
    updateRecenterButton();
    setMessage(following ? "Camera will follow the next GPS/demo position." : "Camera unlocked. Drag around the photorealistic map.");
  }

  function toggleLabels(){
    labelsOn = !labelsOn;
    map3d.mode = labelsOn ? "HYBRID" : "SATELLITE";
    document.getElementById("labelsBtn").textContent = `Labels: ${labelsOn ? "ON" : "OFF"}`;
  }

  function setView(mode){
    if (!map3d) return;
    currentView = mode;
    if (mode === "overview") {
      // The overview is a detached look at the whole route: the follow ticker would fight
      // it every frame, so let go of the car (re-center brings the drive view back).
      markUserPanned();
      if (activeDestination) showRouteOverview(getRouteOrigin(), activeDestination, activeRoute?.distanceMeters);
    } else if (following && puck.fix) {
      // The follow ticker eases tilt/range/fov toward the new view's targets.
      cam.userRange = null;
    } else if (mode === "drive") {
      map3d.tilt = CAR_REF_TILT; map3d.range = CAR_REF_RANGE; map3d.fov = CAR_REF_FOV;
    } else if (mode === "high") {
      map3d.tilt = 62; map3d.range = 650; map3d.fov = 40;
    } else {
      map3d.tilt = 0; map3d.range = 1300; map3d.heading = 0; map3d.fov = 35;
    }
    setViewSelectValue(mode);
    updateCompassButton();
    syncCarLod();
    refreshViewSpecs();
  }

  const VIEW_LABELS = {
    overview: "Route overview",
    drive: "Driving view",
    high: "Higher view",
    top: "Top-down"
  };

  function setViewSelectValue(mode){
    if (mode) currentView = mode;
    const btn = document.getElementById("viewSelectBtn");
    if (btn) btn.textContent = VIEW_LABELS[mode] || VIEW_LABELS.drive;
    closeViewSelectMenu();
  }

  function closeViewSelectMenu(){
    const menu = document.getElementById("viewSelectMenu");
    const btn = document.getElementById("viewSelectBtn");
    if (menu) {
      menu.hidden = true;
      menu.classList.remove("open");
    }
    if (btn) btn.setAttribute("aria-expanded", "false");
  }

  function toggleViewSelectMenu(){
    const menu = document.getElementById("viewSelectMenu");
    const btn = document.getElementById("viewSelectBtn");
    if (!menu) return;
    const open = menu.hidden;
    menu.hidden = !open;
    menu.classList.toggle("open", open);
    if (btn) btn.setAttribute("aria-expanded", open ? "true" : "false");
  }

  let viewSpecTimer = null;
  function viewSpecsOpen(){
    const panel = document.getElementById("viewSpecPanel");
    return panel && !panel.hidden;
  }

  function readMapCenter(){
    const c = map3d && map3d.center;
    if (!c) return { lat: AUCKLAND.lat, lng: AUCKLAND.lng, altitude: 0 };
    const lat = typeof c.lat === "function" ? c.lat() : c.lat;
    const lng = typeof c.lng === "function" ? c.lng() : c.lng;
    const altitude = typeof c.altitude === "function" ? c.altitude() : c.altitude;
    return {
      lat: Number(lat) || AUCKLAND.lat,
      lng: Number(lng) || AUCKLAND.lng,
      altitude: Number(altitude) || 0
    };
  }

  function formatRange(meters){
    const m = Number(meters) || 0;
    if (m >= 1000) return `${(m / 1000).toFixed(m >= 10000 ? 0 : 1)} km`;
    return `${Math.round(m)} m`;
  }

  function refreshViewSpecs(){
    if (!map3d || !viewSpecsOpen()) return;
    const center = readMapCenter();
    document.getElementById("specAltitude").textContent = `${Math.round(center.altitude)} m`;
    document.getElementById("specTilt").textContent = `${Math.round(Number(map3d.tilt) || 0)}°`;
    document.getElementById("specRange").textContent = formatRange(map3d.range);
    document.getElementById("specHeading").textContent = `${Math.round(normaliseHeading(Number(map3d.heading) || 0))}°`;
    document.getElementById("specFov").textContent = `${Math.round(Number(map3d.fov) || 35)}°`;
  }

  function unlockCameraForDebug(){
    if (!following) return;
    following = false;
    document.getElementById("followBtn").textContent = "Following: OFF";
    updateRecenterButton();
  }

  function nudgeSpec(spec, dir){
    if (!map3d) return;
    unlockCameraForDebug();
    const sign = dir === "+" ? 1 : -1;
    if (spec === "tilt") {
      map3d.tilt = clamp((Number(map3d.tilt) || 0) + sign * 5, 0, 90);
    } else if (spec === "range") {
      const range = Number(map3d.range) || 260;
      map3d.range = clamp(range * (sign > 0 ? 1.25 : 0.8), 80, 20000);
    } else if (spec === "heading") {
      map3d.heading = normaliseHeading((Number(map3d.heading) || 0) + sign * 15);
    } else if (spec === "fov") {
      map3d.fov = clamp((Number(map3d.fov) || 35) + sign * 5, 5, 80);
    } else if (spec === "altitude") {
      const center = readMapCenter();
      const step = center.altitude >= 80 ? 25 : 5;
      map3d.center = {
        lat: center.lat,
        lng: center.lng,
        altitude: clamp(center.altitude + sign * step, 0, 5000)
      };
    }
    refreshViewSpecs();
  }

  function toggleViewSpecs(){
    const panel = document.getElementById("viewSpecPanel");
    const btn = document.getElementById("viewSpecBtn");
    const open = panel.hidden;
    panel.hidden = !open;
    document.body.classList.toggle("view-specs", open);
    document.documentElement.classList.toggle("view-specs", open);
    btn.textContent = open ? "Hide specs" : "View specs";
    clearInterval(viewSpecTimer);
    if (open) {
      refreshViewSpecs();
      viewSpecTimer = setInterval(refreshViewSpecs, 400);
    } else {
      viewSpecTimer = null;
    }
  }

  function hideViewSpecs(){
    const panel = document.getElementById("viewSpecPanel");
    if (!panel) return;
    panel.hidden = true;
    document.body.classList.remove("view-specs");
    document.documentElement.classList.remove("view-specs");
    document.getElementById("viewSpecBtn").textContent = "View specs";
    clearInterval(viewSpecTimer);
    viewSpecTimer = null;
  }

  function readCarApiLevel(){
    try {
      if (window.Car && typeof Car.getCarAppApiLevel === "function") {
        const level = Number(Car.getCarAppApiLevel());
        if (Number.isFinite(level) && level > 0) return level;
      }
    } catch (err) {}
    const injected = Number(window.__aaCarApiLevel);
    return Number.isFinite(injected) && injected > 0 ? injected : null;
  }

  let modelViewerLoading = null;
  function ensureModelViewer(){
    if (window.customElements && customElements.get("model-viewer")) return Promise.resolve();
    if (!modelViewerLoading) {
      modelViewerLoading = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.type = "module";
        script.src = "https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js";
        script.onerror = () => {
          modelViewerLoading = null;
          reject(new Error("model-viewer failed to load"));
        };
        script.onload = () => {
          if (customElements.get("model-viewer")) resolve();
          else customElements.whenDefined("model-viewer").then(resolve, reject);
        };
        document.head.append(script);
      });
    }
    return modelViewerLoading;
  }

  function applyViewerModel(viewer, usePreview){
    const model = activeCarModel();
    const src = (usePreview && model.previewUrl) ? model.previewUrl : model.url;
    viewer.setAttribute("src", src);
    viewer.setAttribute("alt", model.label);
    viewer.setAttribute("camera-orbit", model.orbit || "0deg 75deg 8m");
    viewer.setAttribute("camera-target", model.target || "0m 0.7m 0m");
    viewer.setAttribute("min-camera-orbit", "auto 5deg 3m");
    viewer.setAttribute("max-camera-orbit", "auto 90deg 24m");
    viewer.setAttribute("field-of-view", "28deg");
    viewer.setAttribute("interpolation-decay", "20");
    try { if (typeof viewer.jumpCameraToGoal === "function") viewer.jumpCameraToGoal(); } catch (err) {}
  }

  async function openCarModelViewer(){
    const overlay = document.getElementById("carModelOverlay");
    const host = document.getElementById("carModelHost");
    const hint = document.getElementById("carModelHint");
    if (!overlay || !host) return;
    overlay.hidden = false;
    overlay.classList.add("open");
    syncCarModelSwitch();
    host.querySelector("model-viewer")?.remove();
    host.textContent = "Loading 3D model…";
    try {
      await ensureModelViewer();
    } catch (err) {
      host.textContent = "Could not load the 3D viewer (no network?).";
      return;
    }
    host.textContent = "";
    const viewer = document.createElement("model-viewer");
    viewer.setAttribute("camera-controls", "");
    viewer.setAttribute("auto-rotate", "");
    viewer.setAttribute("auto-rotate-delay", "1500");
    viewer.setAttribute("interaction-prompt", "none");
    viewer.setAttribute("shadow-intensity", "1");
    viewer.setAttribute("exposure", "1.15");
    viewer.setAttribute("loading", "eager");
    viewer.setAttribute("reveal", "auto");
    viewer.setAttribute("crossorigin", "anonymous");
    let usedPreview = false;
    viewer.addEventListener("error", () => {
      if (!usedPreview && activeCarModel().previewUrl) {
        usedPreview = true;
        applyViewerModel(viewer, true);
        return;
      }
      if (hint) hint.textContent = "Could not display this 3D model.";
    });
    applyViewerModel(viewer, false);
    host.append(viewer);
  }

  function closeCarModelViewer(){
    const overlay = document.getElementById("carModelOverlay");
    if (!overlay) return;
    overlay.hidden = true;
    overlay.classList.remove("open");
  }

  function hideCarApiHud(){
    const hud = document.getElementById("carApiHud");
    const btn = document.getElementById("carApiBtn");
    if (hud) {
      hud.hidden = true;
      hud.classList.remove("visible");
    }
    if (btn) btn.textContent = "API level";
  }

  function toggleCarApiHud(){
    const hud = document.getElementById("carApiHud");
    const valueEl = document.getElementById("carApiValue");
    const btn = document.getElementById("carApiBtn");
    if (!hud) return;
    const open = hud.hidden;
    if (!open) {
      hideCarApiHud();
      return;
    }
    const level = readCarApiLevel();
    if (valueEl) {
      const unknown = level == null || level <= 0;
      valueEl.textContent = unknown ? "unknown" : String(level);
      valueEl.style.fontSize = unknown ? "28px" : "";
    }
    hud.hidden = false;
    hud.classList.add("visible");
    if (btn) btn.textContent = "Hide API";
  }

  async function fetchRoutePath(origin, destination){
    const result = await RouteClass.computeRoutes({
      origin: { lat: origin.lat, lng: origin.lng },
      destination: { lat: destination.lat, lng: destination.lng },
      travelMode: "DRIVING",
      routingPreference: "TRAFFIC_AWARE",
      language: "en-NZ",
      units: google.maps.UnitSystem.METRIC,
      fields: ["path", "distanceMeters", "durationMillis", "staticDurationMillis"]
    });
    if (!result.routes || !result.routes.length) throw new Error("Google returned no route.");
    const route = result.routes[0];
    const path = Array.from(route.path || []).map(point => ({
      lat: typeof point.lat === "function" ? point.lat() : point.lat,
      lng: typeof point.lng === "function" ? point.lng() : point.lng
    }));
    if (path.length < 2) throw new Error("Route returned without a usable path.");
    return { route, path };
  }

  function resetDemoButtons(){
    const demoBtn = document.getElementById("demoBtn");
    if (demoBtn) demoBtn.textContent = "Drive route demo";
    const freeBtn = document.getElementById("freeFollowBtn");
    if (freeBtn) freeBtn.textContent = "Free follow";
    const tracesBtn = document.getElementById("tracesBtn");
    if (tracesBtn) tracesBtn.textContent = "Traces";
  }

  // Mock GPS: walks the path at DEMO_SPEED emitting ONE fix per second (position,
  // course, doppler speed, accuracy) - the cadence a real receiver delivers - so the
  // follow model is exercised exactly as it will be on the road (Vela's DemoTrace).
  const DEMO_SPEED = 10;   // m/s (~36 km/h)
  const DEMO_FIX_MS = 1000;
  function demoFix(point, heading){
    applyGpsFix(point, heading, { speed: DEMO_SPEED, accuracy: 4, headingMeasured: true });
  }

  function driveAlongPath(path, onDone){
    let index = 0;
    let distIntoSeg = 0;
    demoTimer = setInterval(() => {
      let remaining = DEMO_SPEED * (DEMO_FIX_MS / 1000);
      while (remaining > 0 && index < path.length - 1) {
        const segLen = Math.max(distanceMetres(path[index], path[index + 1]), 0.05);
        const left = segLen - distIntoSeg;
        if (remaining >= left) {
          remaining -= left;
          index += 1;
          distIntoSeg = 0;
        } else {
          distIntoSeg += remaining;
          remaining = 0;
        }
      }
      if (index >= path.length - 1) {
        const last = path[path.length - 1];
        demoFix(last, bearingDegrees(path[Math.max(0, path.length - 2)], last));
        if (demoTimer !== null) { clearInterval(demoTimer); demoTimer = null; }
        if (typeof onDone === "function") onDone();
        else {
          stopDemo();
          setMessage("Demo arrived at destination.");
        }
        return;
      }
      const p1 = path[index];
      const p2 = path[index + 1];
      const t = distIntoSeg / Math.max(distanceMetres(p1, p2), 0.05);
      demoFix({ lat: lerp(p1.lat, p2.lat, t), lng: lerp(p1.lng, p2.lng, t) }, bearingDegrees(p1, p2));
    }, DEMO_FIX_MS);
  }

  function pickRandomDestination(origin){
    const choices = TEST_DESTINATIONS.filter(dest => distanceMetres(origin, dest) > 400);
    const pool = choices.length ? choices : TEST_DESTINATIONS;
    return pool[Math.floor(Math.random() * pool.length)];
  }
  async function startRouteDemo(){
    if (demoKind === "nav" && isDemoRunning()) { stopDemo(); setMessage("Route demo stopped."); return; }
    if (isDemoRunning()) stopDemo();
    if (!activeRoutePath || activeRoutePath.length < 2) {
      setMessage("Picking a random route...");
      await randomRoute();
      if (!activeRoutePath || activeRoutePath.length < 2) {
        setMessage("Could not load a route.");
        return;
      }
    }
    if (watchId !== null) { stopGps(); }

    demoKind = "nav";
    demoActive = true;
    const path = activeRoutePath;
    enterNavigation();
    demoFix(path[0], bearingDegrees(path[0], path[1]));
    document.getElementById("demoBtn").textContent = "Stop drive demo";
    setMessage("Driving along Google's returned road path.");
    driveAlongPath(path);
  }

  async function continueFreeFollowLeg(){
    if (demoKind !== "free" || !demoActive) return;
    const origin = currentGpsPoint || getRouteOrigin();
    const destination = pickRandomDestination(origin);
    setMessage("Free follow · routing to " + destination.name + "...");
    try {
      const { path } = await fetchRoutePath(origin, destination);
      if (demoKind !== "free" || !demoActive) return;
      demoFix(path[0], bearingDegrees(path[0], path[1]));
      setMessage("Free follow · " + destination.name);
      driveAlongPath(path, () => {
        continueFreeFollowLeg();
      });
    } catch (err) {
      console.error(err);
      stopDemo();
      setMessage("Free follow could not get a route.");
    }
  }

  async function startFreeFollow(){
    if (demoKind === "free" && isDemoRunning()) { stopDemo(); setMessage("Free follow stopped."); return; }
    if (isDemoRunning()) stopDemo();
    if (!RouteClass || !map3d) return;
    if (watchId !== null) { stopGps(); }
    clearNavigation();
    following = true;
    document.getElementById("followBtn").textContent = "Following: ON";
    setView("drive");
    demoKind = "free";
    demoActive = true;
    document.getElementById("freeFollowBtn").textContent = "Stop free follow";
    await continueFreeFollowLeg();
  }

  function stopDemo(){
    demoActive = false;
    demoKind = null;
    if (demoTimer !== null) { clearInterval(demoTimer); demoTimer = null; }
    if (replayTimer !== null) { clearTimeout(replayTimer); replayTimer = null; }
    resetDemoButtons();
  }

  // ---- Drive traces (Vela TripStore/DemoTrace): record live GPS, save to disk, replay ----
  // A trace is { id, startedAt, dest, fixes } with compact fix rows
  // [tMs, lat, lng, heading|null, speed|null, accuracy|null, bearingAccuracy|null].
  // Storage is the host's app files (Car.saveTrace / listTraces / readTrace / deleteTrace);
  // in a plain browser it falls back to localStorage. Replays feed the fixes through the
  // same path as live GPS with their original timing (gaps capped at 2 s).

  const TRACE_AUTOSAVE_EVERY = 30;       // fixes between saves (a crash loses < 30 s)
  const TRACE_REPLAY_MAX_GAP_MS = 2000;
  const traceRec = { on: false, id: null, fixes: [], startedAt: 0, dest: null, sinceSave: 0 };
  let replayTimer = null;

  const traceStore = {
    hasBridge(){
      return !!(window.Car && typeof Car.listTraces === "function" && typeof Car.saveTrace === "function");
    },
    list(){
      if (this.hasBridge()) {
        try {
          const arr = JSON.parse(Car.listTraces() || "[]");
          return Array.isArray(arr) ? arr : [];
        } catch (err) { return []; }
      }
      const out = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (!key || !key.startsWith("aaTraceMeta:")) continue;
          try { out.push(JSON.parse(localStorage.getItem(key))); } catch (err) {}
        }
      } catch (err) {}
      return out;
    },
    read(id){
      try {
        const raw = this.hasBridge() ? Car.readTrace(id) : localStorage.getItem("aaTrace:" + id);
        return raw ? JSON.parse(raw) : null;
      } catch (err) { return null; }
    },
    save(id, trace, meta){
      const body = JSON.stringify(trace), metaJson = JSON.stringify(meta);
      try {
        if (this.hasBridge()) {
          Car.saveTrace(id, body, metaJson);
        } else {
          localStorage.setItem("aaTrace:" + id, body);
          localStorage.setItem("aaTraceMeta:" + id, metaJson);
        }
        return true;
      } catch (err) {
        console.warn("Trace save failed", err);
        return false;
      }
    },
    remove(id){
      try {
        if (this.hasBridge()) Car.deleteTrace(id);
        else { localStorage.removeItem("aaTrace:" + id); localStorage.removeItem("aaTraceMeta:" + id); }
      } catch (err) {}
    }
  };

  function finiteOrNull(v){ return Number.isFinite(v) ? v : null; }

  function traceMeta(){
    const f = traceRec.fixes;
    return {
      id: traceRec.id,
      name: traceRec.dest ? "To " + traceRec.dest.name : "Free drive",
      startedAt: traceRec.startedAt,
      count: f.length,
      durationMs: f.length ? f[f.length - 1][0] - f[0][0] : 0,
      dest: traceRec.dest
    };
  }

  function recordTraceFix(c){
    if (!traceRec.on) return;
    traceRec.fixes.push([
      Date.now(),
      Math.round(c.latitude * 1e6) / 1e6,
      Math.round(c.longitude * 1e6) / 1e6,
      finiteOrNull(c.heading), finiteOrNull(c.speed), finiteOrNull(c.accuracy), finiteOrNull(c.bearingAccuracy)
    ]);
    if (++traceRec.sinceSave >= TRACE_AUTOSAVE_EVERY) saveTrace();
  }

  function saveTrace(){
    traceRec.sinceSave = 0;
    if (!traceRec.id || !traceRec.fixes.length) return;
    traceStore.save(traceRec.id, { id: traceRec.id, startedAt: traceRec.startedAt, dest: traceRec.dest, fixes: traceRec.fixes }, traceMeta());
  }

  function toggleTraceRecording(){
    const btn = document.getElementById("traceRecBtn");
    if (traceRec.on) {
      traceRec.on = false;
      saveTrace();
      const n = traceRec.fixes.length;
      setMessage(n ? `Trace saved (${n} fixes).` : "Trace discarded (no fixes recorded).");
      if (btn) btn.textContent = "Rec trace";
      return;
    }
    if (isDemoRunning()) { setMessage("Stop the demo or replay first - traces record live GPS."); return; }
    traceRec.on = true;
    traceRec.id = "trace_" + new Date().toISOString().replace(/[:.]/g, "-");
    traceRec.fixes = [];
    traceRec.startedAt = Date.now();
    traceRec.sinceSave = 0;
    traceRec.dest = activeDestination ? { name: activeDestination.name, lat: activeDestination.lat, lng: activeDestination.lng } : null;
    if (btn) btn.textContent = "Rec trace: ON";
    if (watchId === null) startGps();
    setMessage("Recording live GPS to a trace.");
  }

  function formatTraceDate(ms){
    if (!Number.isFinite(ms)) return "";
    const d = new Date(ms);
    return d.toLocaleDateString("en-NZ", { day: "numeric", month: "short" }) + " " + formatTime(d);
  }

  function renderTraceList(){
    const list = document.getElementById("traceList");
    if (!list) return;
    const items = traceStore.list().filter(m => m && m.id).sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));
    list.textContent = "";
    if (!items.length) {
      const empty = document.createElement("div");
      empty.id = "traceEmpty";
      empty.textContent = "No recorded drives yet. Tap \"Rec trace\" while driving with live GPS; it saves to " +
        (traceStore.hasBridge() ? "the app's files on this device." : "this browser's storage.");
      list.append(empty);
      return;
    }
    for (const m of items) {
      const row = document.createElement("div");
      row.className = "trace-row";
      const label = document.createElement("div");
      const name = document.createElement("div");
      name.className = "trace-name";
      name.textContent = m.name || m.id;
      const meta = document.createElement("span");
      meta.className = "trace-meta";
      meta.textContent = `${formatTraceDate(m.startedAt)} · ${m.count || 0} fixes · ${formatDuration(m.durationMs || 0)}`;
      label.append(name, meta);
      const replay = document.createElement("button");
      replay.type = "button";
      replay.className = "trace-replay";
      replay.dataset.trace = m.id;
      replay.dataset.action = "replay";
      replay.textContent = "Replay";
      const del = document.createElement("button");
      del.type = "button";
      del.dataset.trace = m.id;
      del.dataset.action = "delete";
      del.textContent = "Delete";
      row.append(label, replay, del);
      list.append(row);
    }
  }

  function openTracePanel(){
    if (demoKind === "replay" && isDemoRunning()) { stopDemo(); setMessage("Replay stopped."); return; }
    const overlay = document.getElementById("traceOverlay");
    if (!overlay) return;
    overlay.hidden = false;
    overlay.classList.add("open");
    renderTraceList();
  }

  function closeTracePanel(){
    const overlay = document.getElementById("traceOverlay");
    if (!overlay) return;
    overlay.hidden = true;
    overlay.classList.remove("open");
  }

  async function startTraceReplay(id){
    const trace = traceStore.read(id);
    if (!trace || !Array.isArray(trace.fixes) || trace.fixes.length < 2) { setMessage("Trace is empty or unreadable."); return; }
    if (traceRec.on) toggleTraceRecording(); // a replay must not record itself
    closeTracePanel();
    if (isDemoRunning()) stopDemo();
    if (watchId !== null) stopGps();
    const fixes = trace.fixes;
    const first = fixes[0];
    const start = { lat: first[1], lng: first[2], heading: Number.isFinite(first[3]) ? first[3] : NaN };
    if (trace.dest && Number.isFinite(trace.dest.lat) && Number.isFinite(trace.dest.lng)) {
      // Recorded while navigating: rebuild the route from the trace start (current traffic).
      await calculateRoute({ lat: start.lat, lng: start.lng }, trace.dest, trace.dest.name || "Destination");
      if (activeRoutePath.length >= 2) {
        currentGpsPoint = start;
        enterNavigation();
      }
    } else {
      clearNavigation();
      following = true;
      document.getElementById("followBtn").textContent = "Following: ON";
      setView("drive");
    }
    demoKind = "replay";
    demoActive = true;
    const btn = document.getElementById("tracesBtn");
    if (btn) btn.textContent = "Stop replay";
    setMessage(`Replaying ${fixes.length} recorded fixes...`);
    let i = 0;
    const step = () => {
      replayTimer = null;
      if (demoKind !== "replay" || !demoActive) return;
      const f = fixes[i];
      applyGpsFix({ lat: f[1], lng: f[2] }, Number.isFinite(f[3]) ? f[3] : NaN, {
        speed: finiteOrNull(f[4]),
        accuracy: finiteOrNull(f[5]),
        bearingAccuracy: finiteOrNull(f[6]),
        headingMeasured: Number.isFinite(f[3])
      });
      i += 1;
      if (i >= fixes.length) { stopDemo(); setMessage("Replay finished."); return; }
      replayTimer = setTimeout(step, clamp(fixes[i][0] - f[0], 50, TRACE_REPLAY_MAX_GAP_MS));
    };
    step();
  }

  function downsamplePath(path,maxPoints){
    if (path.length <= maxPoints) return path.slice();
    const output = [], stride = (path.length - 1) / (maxPoints - 1);
    for (let i=0;i<maxPoints;i++) output.push(path[Math.round(i*stride)]);
    return output;
  }

  function formatTime(date){ return date.toLocaleTimeString("en-NZ",{hour:"numeric",minute:"2-digit"}); }
  function bearingDegrees(a,b){
    const lat1=toRad(a.lat), lat2=toRad(b.lat), dLng=toRad(b.lng-a.lng);
    const y=Math.sin(dLng)*Math.cos(lat2);
    const x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLng);
    return normaliseHeading(toDeg(Math.atan2(y,x)));
  }
  function distanceMetres(a,b){
    const R=6371000,dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng),lat1=toRad(a.lat),lat2=toRad(b.lat);
    const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function normaliseHeading(value){ return ((value%360)+360)%360; }
  function clamp(value,min,max){ return Math.min(max,Math.max(min,value)); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function toRad(deg){ return deg*Math.PI/180; }
  function toDeg(rad){ return rad*180/Math.PI; }

  // ---- Ground elevation for the camera's orbit target ----
  // Map3DElement.center.altitude is metres above SEA LEVEL and has no ground-relative
  // mode, so a follow camera that omits it orbits a point at sea level: in the Auckland
  // CBD (15-25 m ASL) that put the camera almost at street level looking up at the car,
  // and on Mt Eden (160 m) it would sit far underground. The Elevation API isn't enabled
  // for this key, so ground height comes from the keyless AWS Terrarium DEM tiles (the
  // same source Vela uses for its terrain), bilinearly sampled and eased.
  const TERRAIN_TILE_URL = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
  const TERRAIN_Z = 14; // ~7.6 m per pixel at Auckland's latitude
  const TERRAIN_RETRY_MS = 30000;
  const terrainTiles = new Map(); // "x/y" -> { data, pending, failedAt }

  function terrainTileCoords(lat, lng){
    const n = 2 ** TERRAIN_Z;
    const latR = toRad(clamp(lat, -85, 85));
    const fx = ((lng + 180) / 360) * n;
    const fy = ((1 - Math.log(Math.tan(latR) + 1 / Math.cos(latR)) / Math.PI) / 2) * n;
    return { x: Math.floor(fx), y: Math.floor(fy), px: (fx - Math.floor(fx)) * 256, py: (fy - Math.floor(fy)) * 256 };
  }

  function requestTerrainTile(x, y){
    const key = x + "/" + y;
    const entry = terrainTiles.get(key);
    if (entry && (entry.data || entry.pending || (entry.failedAt && performance.now() - entry.failedAt < TERRAIN_RETRY_MS))) return entry;
    const next = { data: null, pending: true, failedAt: 0 };
    terrainTiles.set(key, next);
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      try {
        const cv = document.createElement("canvas");
        cv.width = 256; cv.height = 256;
        const ctx = cv.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        next.data = ctx.getImageData(0, 0, 256, 256).data;
      } catch (err) {
        next.failedAt = performance.now();
      }
      next.pending = false;
    };
    img.onerror = () => { next.pending = false; next.failedAt = performance.now(); };
    img.src = TERRAIN_TILE_URL.replace("{z}", TERRAIN_Z).replace("{x}", x).replace("{y}", y);
    return next;
  }

  function terrainSample(data, px, py){
    const i = (py * 256 + px) * 4;
    return (data[i] * 256 + data[i + 1] + data[i + 2] / 256) - 32768;
  }

  // Ground elevation (m ASL) at a point, or null while its tile is still loading.
  function terrainAltitude(lat, lng){
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
    const t = terrainTileCoords(lat, lng);
    const tile = requestTerrainTile(t.x, t.y);
    if (!tile.data) return null;
    const x0 = clamp(Math.floor(t.px - 0.5), 0, 255), y0 = clamp(Math.floor(t.py - 0.5), 0, 255);
    const x1 = Math.min(x0 + 1, 255), y1 = Math.min(y0 + 1, 255);
    const fx = clamp(t.px - 0.5 - x0, 0, 1), fy = clamp(t.py - 0.5 - y0, 0, 1);
    const top = lerp(terrainSample(tile.data, x0, y0), terrainSample(tile.data, x1, y0), fx);
    const bottom = lerp(terrainSample(tile.data, x0, y1), terrainSample(tile.data, x1, y1), fx);
    return lerp(top, bottom, fy);
  }

  // Warm the tiles under the car and a little way ahead, so the camera never waits.
  function prefetchTerrain(point, heading){
    terrainAltitude(point.lat, point.lng);
    if (Number.isFinite(heading)) {
      const ahead = lookAhead(point, heading, 700);
      terrainAltitude(ahead.lat, ahead.lng);
    }
  }

  function prefetchRouteTerrain(path, cum){
    if (path.length < 2) return;
    const total = cum[cum.length - 1];
    const step = Math.max(1200, total / 40);
    for (let m = 0; m <= total; m += step) {
      const p = pointAtMetres(path, cum, m).point;
      terrainAltitude(p.lat, p.lng);
    }
  }

  // Eased ground altitude for the orbit target (snaps on the first sample / after a teleport).
  function followGroundAltitude(point, dtEase){
    const g = terrainAltitude(point.lat, point.lng);
    if (g == null) return followAlt;
    if (followAlt == null || !Number.isFinite(followAlt)) {
      followAlt = g;
      return g;
    }
    followAlt += (g - followAlt) * easeK(dtEase, 1.0);
    return followAlt;
  }

  window.__aaScaleMap = function(factor){
    if (!map3d) return;
    const range = Number(map3d.range) || 260;
    const next = clamp(range / (Number(factor) || 1), 40, 20000);
    if (following && puck.fix) {
      // Pinch while following: keep following at the user's range (Re-center clears it).
      cam.userRange = next;
      cam.range = next;
      updateRecenterButton();
    }
    map3d.range = next;
    syncCarLod();
    refreshViewSpecs();
  };
  window.__aaNudgeCamera = function(dHeading, dTilt){
    if (!map3d) return;
    const dh = Number(dHeading) || 0;
    const dt = Number(dTilt) || 0;
    if (!dh && !dt) return;
    markUserPanned(true);
    if (dh) map3d.heading = normaliseHeading((Number(map3d.heading) || 0) + dh);
    if (dt) map3d.tilt = clamp((Number(map3d.tilt) || 0) + dt, 0, 90);
    syncCarLod();
    refreshViewSpecs();
  };
  window.__aaRecenter = function(){
    recenterToCar();
  };
  window.__aaUserPanned = function(){ markUserPanned(true); };
  // Host day/night (Android Auto's CarContext.isDarkMode - not wall-clock).
  window.__aaSetNight = function(on){
    document.documentElement.classList.toggle("night", !!on);
    document.body.classList.toggle("night", !!on);
  };
  // Host accelerometer: world-frame horizontal acceleration (m/s^2, East/North).
  window.__aaInjectMotion = function(east, north){
    const e = Number(east), n = Number(north);
    if (!Number.isFinite(e) || !Number.isFinite(n)) return;
    motion.east = e;
    motion.north = n;
    motion.atMs = performance.now();
  };
  window.__aaSetDebugOverlay = function(on){
    document.documentElement.classList.toggle("debug-open", !!on);
    document.body.classList.toggle("debug-open", !!on);
    if (!on) {
      hideViewSpecs();
      hideCarApiHud();
      closeViewSelectMenu();
      closeCarModelViewer();
      closeTracePanel();
    }
    try {
      if (window.Car && typeof Car.setDebugOverlay === "function") Car.setDebugOverlay(!!on);
    } catch (err) {}
  };

  function isAndroidAuto(){
    return document.documentElement.classList.contains("aa-car") || document.body.classList.contains("aa-car");
  }

  // `fromTouch`: a real pan/rotate on the screen (not a programmatic detach such as the
  // route overview). In car mode that arms the timed re-follow from the LAST touch.
  function markUserPanned(fromTouch){
    flyover = null;
    if (fromTouch && isAndroidAuto()) {
      lastTouchMs = performance.now();
      autoRefollowArmed = true;
    }
    if (following) {
      following = false;
      cam.seeded = false; // re-attach eases in from wherever the user leaves the camera
      const followBtn = document.getElementById("followBtn");
      if (followBtn) followBtn.textContent = "Following: OFF";
    }
    updateRecenterButton();
  }

  function updateRecenterButton(){
    const btn = document.getElementById("recenterBtn");
    if (!btn) return;
    // Shown when detached, or when a pinch zoom overrides the follow range.
    btn.classList.toggle("visible", !!currentGpsPoint && (!following || cam.userRange != null));
    updateCompassButton();
  }
  window.__aaInjectGps = function(fix){
    if (!fix || !Number.isFinite(Number(fix.lat)) || !Number.isFinite(Number(fix.lng))) return;
    handlePosition({
      coords: {
        latitude: Number(fix.lat),
        longitude: Number(fix.lng),
        heading: Number.isFinite(Number(fix.heading)) ? Number(fix.heading) : null,
        speed: Number.isFinite(Number(fix.speed)) ? Number(fix.speed) : null,
        bearingAccuracy: Number.isFinite(Number(fix.bearingAccuracy)) ? Number(fix.bearingAccuracy) : null,
        accuracy: Number.isFinite(Number(fix.accuracy)) ? Number(fix.accuracy) : 0,
        provider: typeof fix.provider === "string" && fix.provider ? fix.provider : null
      }
    });
  };
  window.__aaWakeMap = function(){
    if (mapRevealDone || sessionAlreadyRevealed()) {
      document.body.classList.add("map-ready");
      document.documentElement.classList.add("map-ready");
    }
    window.dispatchEvent(new Event("resize"));
    if (!map3d) return;
    const heading = Number(map3d.heading);
    if (Number.isFinite(heading)) {
      map3d.heading = heading;
    }
  };

  document.getElementById("gpsBtn").addEventListener("click",toggleGps);
  document.getElementById("followBtn").addEventListener("click",toggleFollow);
  document.getElementById("labelsBtn").addEventListener("click",toggleLabels);
  document.getElementById("demoBtn").addEventListener("click",startRouteDemo);
  document.getElementById("freeFollowBtn").addEventListener("click",startFreeFollow);

  document.getElementById("viewSelectBtn").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    toggleViewSelectMenu();
  });
  document.getElementById("viewSelectMenu").addEventListener("click", event => {

  document.getElementById("viewSpecBtn").addEventListener("click", toggleViewSpecs);
  document.getElementById("carApiBtn").addEventListener("click", event => {

  document.getElementById("carModelBtn").addEventListener("click", event => {

  document.getElementById("carModelSwitch").addEventListener("click", event => {

  document.getElementById("carModelClose").addEventListener("click", event => {

  document.getElementById("specZoomIn").addEventListener("click", event => {

  document.getElementById("specZoomOut").addEventListener("click", event => {

  document.getElementById("viewSpecPanel").addEventListener("click", event => {
    const btn = event.target.closest("button[data-spec]");
    if (!btn) return;

    nudgeSpec(btn.dataset.spec, btn.dataset.dir);

  document.getElementById("recenterBtn").addEventListener("click", event => {
    event.preventDefault();

    window.__aaRecenter();
  });
  document.getElementById("compassBtn").addEventListener("click", event => {

    toggleNorthUp();
  });
  document.getElementById("traceRecBtn").addEventListener("click", event => {
    event.preventDefault();

  document.getElementById("tracesBtn").addEventListener("click", event => {
    event.preventDefault();

  document.getElementById("traceList").addEventListener("click", event => {
    const btn = event.target.closest("button[data-trace]");
    if (!btn) return;
    event.preventDefault();
    event.stopPropagation();
    if (btn.dataset.action === "delete") {
      traceStore.remove(btn.dataset.trace);
      renderTraceList();
    } else {
      startTraceReplay(btn.dataset.trace);
    }
  });
  document.getElementById("carDebugBtn").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    window.__aaSetDebugOverlay(!document.body.classList.contains("debug-open"));
  });
  document.getElementById("routeClose").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    clearNavigation();
  });
  document.getElementById("routeGo").addEventListener("click", event => {
    event.preventDefault();
    event.stopPropagation();
    enterNavigation();
  });

  const CHROME_HIDE_MS = 3500;
  let chromeHideTimer = null;
  let chromeLocked = false;

  function showChrome(){
    if (isAndroidAuto()) return;
    document.body.classList.remove("chrome-hidden");
    scheduleChromeHide();
  }

  function hideChrome(){
    if (isAndroidAuto() || chromeLocked) return;
    document.body.classList.add("chrome-hidden");
    clearTimeout(chromeHideTimer);
    hideSearchDropdown();
  }

  function scheduleChromeHide(){
    clearTimeout(chromeHideTimer);
    chromeHideTimer = setTimeout(hideChrome, CHROME_HIDE_MS);
  }

  function isChromeUiTarget(target){
    return !!(target && target.closest && target.closest("#topPanel, #chromeWake, #searchResults, #recenterBtn, #compassBtn, #speedLimitBadge, #carDebugBtn, #routeCard, #viewSpecPanel, #carApiHud, #viewPicker, #carModelOverlay, #traceOverlay"));
  }

  let mapDragStart = null;
  window.addEventListener("pointerdown", event => {
    if (!event.target.closest || !event.target.closest("#viewPicker")) closeViewSelectMenu();
    if (isChromeUiTarget(event.target)) {
      mapDragStart = null;
      return;
    }
    mapDragStart = { x: event.clientX, y: event.clientY };
  }, { capture:true, passive:true });
  window.addEventListener("pointermove", event => {
    if (!mapDragStart) return;
    const dx = event.clientX - mapDragStart.x;
    const dy = event.clientY - mapDragStart.y;
    if (dx * dx + dy * dy < 64) return;
    chromeLocked = false;
    hideChrome();
    markUserPanned(true);
    mapDragStart = null;
  }, { capture:true, passive:true });
  window.addEventListener("pointerup", () => { mapDragStart = null; }, { capture:true, passive:true });
  window.addEventListener("pointercancel", () => { mapDragStart = null; }, { capture:true, passive:true });
  window.addEventListener("wheel", event => {
    if (isChromeUiTarget(event.target)) return;
    chromeLocked = false;
    hideChrome();
    markUserPanned(true);
  }, { capture:true, passive:true });

  let camGesture = null;
  function twoTouchState(a, b){
    const dx = b.clientX - a.clientX;
    const dy = b.clientY - a.clientY;
    return {
      dist: Math.hypot(dx, dy) || 1,
      angle: Math.atan2(dy, dx),
      midX: (a.clientX + b.clientX) / 2,
      midY: (a.clientY + b.clientY) / 2
    };
  }
  function applyTwoFingerCamera(event){
    if (!map3d || event.touches.length !== 2 || isChromeUiTarget(event.target)) {
      if (event.touches.length < 2) camGesture = null;
      return false;
    }
    const next = twoTouchState(event.touches[0], event.touches[1]);
    if (!camGesture) {
      camGesture = next;
      return true;
    }
    let dAngle = (next.angle - camGesture.angle) * 180 / Math.PI;
    if (dAngle > 180) dAngle -= 360;
    if (dAngle < -180) dAngle += 360;
    const dDist = next.dist / camGesture.dist;
    const dMidY = next.midY - camGesture.midY;
    chromeLocked = false;
    hideChrome();
    markUserPanned(true);
    if (Math.abs(dAngle) > 0.35) {
      map3d.heading = normaliseHeading((Number(map3d.heading) || 0) + dAngle);
    }
    if (Math.abs(dMidY) > 1.5 && Math.abs(dAngle) < 8) {
      map3d.tilt = clamp((Number(map3d.tilt) || 0) - dMidY * 0.18, 0, 90);
    }
    if (Math.abs(dDist - 1) > 0.012) {
      const range = Number(map3d.range) || 260;
      map3d.range = clamp(range / dDist, 40, 20000);
      syncCarLod();
    }
    camGesture = next;
    refreshViewSpecs();
    return true;
  }
  window.addEventListener("touchstart", event => {
    if (event.touches.length === 2 && !isChromeUiTarget(event.target)) {
      camGesture = twoTouchState(event.touches[0], event.touches[1]);
    }
  }, { capture:true, passive:true });
  window.addEventListener("touchmove", event => {
    if (applyTwoFingerCamera(event)) event.preventDefault();
  }, { capture:true, passive:false });
  window.addEventListener("touchend", event => {
    if (event.touches.length < 2) camGesture = null;
  }, { capture:true, passive:true });
  window.addEventListener("touchcancel", () => { camGesture = null; }, { capture:true, passive:true });

  window.addEventListener("click", () => {
    if (isAndroidAuto()) return;
    if (document.body.classList.contains("chrome-hidden")) showChrome();
  }, true);

  const topPanel = document.getElementById("topPanel");
  topPanel.addEventListener("pointerdown", () => {
    if (!document.body.classList.contains("chrome-hidden")) showChrome();
  });
  topPanel.addEventListener("focusin", () => { chromeLocked = true; showChrome(); });
  topPanel.addEventListener("focusout", () => { chromeLocked = false; scheduleChromeHide(); });
  document.getElementById("chromeWake").addEventListener("pointerdown", event => {
    event.preventDefault();
    showChrome();
  });
  document.getElementById("chromeWake").addEventListener("click", event => {
    event.preventDefault();
    showChrome();
  });

  function showMapFailure(text){
    setMessage(text);
    const status = document.getElementById("mapLoaderStatus");
    if (status) {
      status.hidden = false;
      status.textContent = text;
    }
  }

  let mapRevealDone = false;
  const MAP_REVEAL_KEY = "aaMapRevealed";
  function sessionAlreadyRevealed(){
    try { return sessionStorage.getItem(MAP_REVEAL_KEY) === "1"; } catch (err) { return false; }
  }
  function revealMap(){
    if (mapRevealDone) return;
    mapRevealDone = true;
    try { sessionStorage.setItem(MAP_REVEAL_KEY, "1"); } catch (err) {}
    document.body.classList.add("map-ready");
    document.documentElement.classList.add("map-ready");
    if (!placeAutocomplete && PlaceAutocompleteClass) {
      setupAutocomplete(PlaceAutocompleteClass);
    }
    startGps();
    try {
      if (window.Car && typeof Car.mapReady === "function") Car.mapReady();
    } catch (err) {}
  }

  function armMapReveal(){
    if (sessionAlreadyRevealed()) {
      revealMap();
      return;
    }
    let pokeTimer = 0;
    const pokeMap = () => {
      if (mapRevealDone) return;
      try {
        window.dispatchEvent(new Event("resize"));
        if (map3d) {
          const heading = Number(map3d.heading);
          if (Number.isFinite(heading)) map3d.heading = heading;
        }
      } catch (err) {}
      pokeTimer = window.setTimeout(pokeMap, 280);
    };
    pokeMap();
    window.setTimeout(() => {
      window.clearTimeout(pokeTimer);
      revealMap();
    }, 2000);
  }

  function mapsKeyIsMissing(key){
    // Do not compare against the deploy placeholder string: GitHub Pages
    // replaces every copy of that token, which used to make this check
    // always true and skipped loading Maps entirely.
    return !key || key.indexOf("AIza") !== 0 || key.length < 20;
  }

  function loadGoogleMaps(){
    if (mapsKeyIsMissing(GOOGLE_MAPS_API_KEY)) {
      showMapFailure("Maps API key was not injected at deploy time.");
      return;
    }
    const script=document.createElement("script");
    script.async=true;
    script.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(GOOGLE_MAPS_API_KEY)+"&v=weekly&loading=async&callback=initMap";
    script.onerror=()=>showMapFailure("Could not load Google Maps JavaScript API.");
    document.head.append(script);
  }

  loadGoogleMaps();
</script>
