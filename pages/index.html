  // Mock GPS: walks the path emitting ONE fix per second (position, course, doppler
  // speed, accuracy) - the cadence a real receiver delivers - so the follow model is
  // exercised exactly as it will be on the road (Vela's DemoTrace).
  const DEMO_FIX_MS = 1000;
  // Path fraction -> km/h. Holds each band long enough for zoom breathing to settle.
  const DEMO_SPEED_BANDS = [
    [0.12, 28],
    [0.28, 55],
    [0.48, 100],
    [0.62, 80],
    [0.78, 42],
    [1.00, 110]
  ];
  function demoSpeedMps(alongM, totalM){
    const u = totalM > 1 ? clamp(alongM / totalM, 0, 1) : 0;
    for (let i = 0; i < DEMO_SPEED_BANDS.length; i++) {
      if (u <= DEMO_SPEED_BANDS[i][0]) return DEMO_SPEED_BANDS[i][1] / 3.6;
    }
    return DEMO_SPEED_BANDS[DEMO_SPEED_BANDS.length - 1][1] / 3.6;
  }
  function demoFix(point, heading, speedMps){
    const speed = Number.isFinite(speedMps) ? speedMps : demoSpeedMps(0, 1);
    applyGpsFix(point, heading, { speed, accuracy: 4, headingMeasured: true });
  }

  function driveAlongPath(path, onDone, speedOverrideMps){
    let index = 0;
    let distIntoSeg = 0;
    const cum = cumulativeLengths(path);
    const totalM = cum[cum.length - 1] || 1;
    demoTimer = setInterval(() => {
      const alongM = (index < cum.length ? cum[index] : totalM) + distIntoSeg;
      const speed = Number.isFinite(speedOverrideMps) ? speedOverrideMps : demoSpeedMps(alongM, totalM);
      let remaining = speed * (DEMO_FIX_MS / 1000);
      while (remaining > 0 && index < path.length - 1) {
        const segLen = Math.max(distanceMetres(path[index], path[index + 1]), 0.05);
        const left = segLen - distIntoSeg;
        if (remaining >= left) {
          remaining -= left;
          index += 1;
          distIntoSeg = 0;
        } else {
          distIntoSeg += remaining;
          remaining = 0;
        }
      }
      const nowAlong = (index < cum.length ? cum[index] : totalM) + distIntoSeg;
      const nowSpeed = Number.isFinite(speedOverrideMps) ? speedOverrideMps : demoSpeedMps(nowAlong, totalM);
      if (index >= path.length - 1) {
        const last = path[path.length - 1];
        demoFix(last, bearingDegrees(path[Math.max(0, path.length - 2)], last), nowSpeed);
        if (demoTimer !== null) { clearInterval(demoTimer); demoTimer = null; }
        if (typeof onDone === "function") onDone();
        else {
          stopDemo();
          setMessage("Demo arrived at destination.");
        }
        return;
      }
      const p1 = path[index];
      const p2 = path[index + 1];
      const t = distIntoSeg / Math.max(distanceMetres(p1, p2), 0.05);
      demoFix({ lat: lerp(p1.lat, p2.lat, t), lng: lerp(p1.lng, p2.lng, t) }, bearingDegrees(p1, p2), nowSpeed);
    }, DEMO_FIX_MS);
  }

    } catch (err) {
      setMessage("Private tail test FAIL: Google route failed. " + (err && err.message ? err.message : String(err)));
      return;
    }
    const rawPath = raw.path;
    const rawEnd = rawPath[rawPath.length - 1];
    const rawM = walkPathLengthM(rawPath);
    const osmTrimmed = await trimPrivateRoadTail(rawPath.slice());
    const osmM = Math.max(0, rawM - walkPathLengthM(osmTrimmed));
    let walk = null;
    try {
      const w = await walkAccessFrom(osmTrimmed[osmTrimmed.length - 1], dest);
      walk = w && w.path;
    } catch (err) {}
    const overlap = trimDriveWalkOverlap(osmTrimmed, walk);
    const used = overlap.path || osmTrimmed;
    const usedWalk = overlap.walk || walk;
    const end = used[used.length - 1];
    const pulledM = Math.max(0, rawM - walkPathLengthM(used));
    const intervals = routeTrafficIntervals(raw.route, used);
    setSuppressRouteCard(true);
    try { cancelStartCountdown(); } catch (err) {}
    stopDestPreview();
    adoptRoute(raw.route, used, intervals, dest, false, usedWalk);

      "OSM private tail " + Math.round(osmM) + " m",
      "walk overlap " + Math.round(overlap.trimmedM || 0) + " m",
      "drive pulled back " + Math.round(pulledM) + " m"
    ];

  async function startTurnCueTest(){

    if (isDemoRunning()) stopDemo();
    if (watchId !== null) stopGps();
    setSuppressRouteCard(true);
    resumeNavAudio();
    const logic = evaluateTurnCueLogic();
    const logicLine = logic.pass
      ? `Logic: PASS — wait until ${Math.round(logic.afterDecoy)} m (naive ${Math.round(logic.naive)} m)`
      : `Logic: FAIL — played at ${logic.played == null ? "never" : Math.round(logic.played) + " m"}`;
    showTurnCueHud();
    setTurnCueHud(logicLine, "Live: routing on real streets…", "Google route + OSM side street", logic.pass, null);
    setMessage("Turn cue test: routing on real Auckland streets...");

    let picked = null;
    for (const c of CUE_TEST_CASES) {
      try {
        const { route, path, intervals } = await requestRoute(c.origin, c.dest, false);
        adoptRoute(route, path, intervals, { name: c.dest.name, lat: c.dest.lat, lng: c.dest.lng }, false);
        fetchSpeedLimits(activeRoutePath);
        rebuildOsmSideStreets();
        const step = (navSteps || []).find(s => {
          const fam = maneuverFamily(s.maneuver);
          return fam === "left" || fam === "right";
        });
        if (!step) continue;
        const decoys = decoysForStep(step);
        picked = { dest: c.dest, step, decoys };
        if (decoys.length) break;
      } catch (err) {
        console.warn("Cue test route failed", err);
      }
    }
    if (!picked || !activeRoutePath.length) {
      setTurnCueHud(logicLine, "Live: FAIL — could not load a real road route", "", logic.pass, false);
      setMessage("Turn cue test could not get a Google route.");
      return;
    }
    const step = picked.step;
    const decoy = picked.decoys.length ? picked.decoys[picked.decoys.length - 1] : null;
    extraSideStreets = decoy ? [decoy] : [];
    turnCue.ignoreOsm = false;
    turnCue.played.clear();
    if (Marker3DElement) {
      try {
        if (decoy) {
          addCueDecor(new Marker3DElement({
            position: pointAtMetres(activeRoutePath, routeCum, decoy.m).point,
            label: (decoy.name || "Side street") + " (skip)",
            sizePreserved: true
          }));
        }
        addCueDecor(new Marker3DElement({
          position: pointAtMetres(activeRoutePath, routeCum, step.m).point,
          label: "Turn here",
          sizePreserved: true
        }));
      } catch (err) {}
    }
    const expectSide = turnCueSpeaker(step.maneuver);
    turnCue.test = {
      decoyM: decoy ? decoy.m : null,
      turnM: step.m,
      playedM: null,
      side: null,
      expectSide,
      logicOk: logic.pass,
      liveOk: null,
      logicLine,
      detail: decoy
        ? `${step.maneuver} at ${Math.round(step.m)} m · skip ${decoy.name || "side street"} at ${Math.round(decoy.m)} m · ${expectSide} speaker`
        : `Real Google route · ${step.maneuver} at ${Math.round(step.m)} m · ${expectSide} speaker`
    };
    setTurnCueHud(
      logicLine,
      decoy ? "Live: driving — silent until after the first same-direction street" : "Live: driving a real Google route",
      turnCue.test.detail,
      logic.pass,
      null
    );
    demoKind = "turncue";
    demoActive = true;
    const cueBtn = document.getElementById("turnCueTestBtn");
    if (cueBtn) cueBtn.textContent = "Stop cue test";
    enterNavigation({ flyover: false });
    const heading = bearingDegrees(activeRoutePath[0], activeRoutePath[1]);
    demoFix(activeRoutePath[0], heading, 12);
    setMessage(decoy
      ? "Turn cue test: stay on the Google route, pass the skip street, then listen for dun-dun."
      : "Turn cue test: driving a real Google route.");
    driveAlongPath(activeRoutePath, () => {
      judgeTurnCueDrive(step.m);
      stopDemo();
      const ok = turnCue.test && turnCue.test.liveOk;
      setMessage(ok ? "Turn cue test PASS." : "Turn cue test finished — check the overlay.");
    }, 12);
  }

  async function continueFreeFollowLeg(){

  function stopDemo(){
    demoActive = false;
    demoKind = null;
    if (demoTimer !== null) { clearInterval(demoTimer); demoTimer = null; }
    if (replayTimer !== null) { clearTimeout(replayTimer); replayTimer = null; }
    resetDemoButtons();
  }

  // ---- Drive traces (Vela TripStore/DemoTrace): record live GPS, save to disk, replay ----
  // A trace is { id, startedAt, dest, fixes } with compact fix rows
  // [tMs, lat, lng, heading|null, speed|null, accuracy|null, bearingAccuracy|null].
  // Storage is the host's app files (Car.saveTrace / listTraces / readTrace / deleteTrace);
  // in a plain browser it falls back to localStorage. Replays feed the fixes through the
  // same path as live GPS with their original timing (gaps capped at 2 s).

  const TRACE_AUTOSAVE_EVERY = 30;       // fixes between saves (a crash loses < 30 s)
  const TRACE_REPLAY_MAX_GAP_MS = 2000;
  const traceRec = { on: false, id: null, fixes: [], startedAt: 0, dest: null, sinceSave: 0 };
  let replayTimer = null;

  const traceStore = {
    hasBridge(){
      return !!(window.Car && typeof Car.listTraces === "function" && typeof Car.saveTrace === "function");
    },
    list(){
      if (this.hasBridge()) {
        try {
          const arr = JSON.parse(Car.listTraces() || "[]");
          return Array.isArray(arr) ? arr : [];
        } catch (err) { return []; }
      }
      const out = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (!key || !key.startsWith("aaTraceMeta:")) continue;
          try { out.push(JSON.parse(localStorage.getItem(key))); } catch (err) {}
        }
      } catch (err) {}
      return out;
    },
    read(id){
      try {
        const raw = this.hasBridge() ? Car.readTrace(id) : localStorage.getItem("aaTrace:" + id);
        return raw ? JSON.parse(raw) : null;
      } catch (err) { return null; }
    },
    save(id, trace, meta){
      const body = JSON.stringify(trace), metaJson = JSON.stringify(meta);
      try {
        if (this.hasBridge()) {
          Car.saveTrace(id, body, metaJson);
        } else {
          localStorage.setItem("aaTrace:" + id, body);
          localStorage.setItem("aaTraceMeta:" + id, metaJson);
        }
        return true;
      } catch (err) {
        console.warn("Trace save failed", err);
        return false;
      }
    },
    remove(id){
      try {
        if (this.hasBridge()) Car.deleteTrace(id);
        else { localStorage.removeItem("aaTrace:" + id); localStorage.removeItem("aaTraceMeta:" + id); }
      } catch (err) {}
    }
  };

  function finiteOrNull(v){ return Number.isFinite(v) ? v : null; }

  function traceMeta(){
    const f = traceRec.fixes;
    return {
      id: traceRec.id,
      name: traceRec.dest ? "To " + traceRec.dest.name : "Free drive",
      startedAt: traceRec.startedAt,
      count: f.length,
      durationMs: f.length ? f[f.length - 1][0] - f[0][0] : 0,
      dest: traceRec.dest
    };
  }

  function recordTraceFix(c){
    if (!traceRec.on) return;
    traceRec.fixes.push([
      Date.now(),
      Math.round(c.latitude * 1e6) / 1e6,
      Math.round(c.longitude * 1e6) / 1e6,
      finiteOrNull(c.heading), finiteOrNull(c.speed), finiteOrNull(c.accuracy), finiteOrNull(c.bearingAccuracy)
    ]);
    if (++traceRec.sinceSave >= TRACE_AUTOSAVE_EVERY) saveTrace();
  }

  function saveTrace(){
    traceRec.sinceSave = 0;
    if (!traceRec.id || !traceRec.fixes.length) return;
    traceStore.save(traceRec.id, { id: traceRec.id, startedAt: traceRec.startedAt, dest: traceRec.dest, fixes: traceRec.fixes }, traceMeta());
  }

  function toggleTraceRecording(){
    const btn = document.getElementById("traceRecBtn");
    if (traceRec.on) {
      traceRec.on = false;
      saveTrace();
      const n = traceRec.fixes.length;
      setMessage(n ? `Trace saved (${n} fixes).` : "Trace discarded (no fixes recorded).");
      if (btn) btn.textContent = "Rec trace";
      return;
    }
    if (isDemoRunning()) { setMessage("Stop the demo or replay first - traces record live GPS."); return; }
    traceRec.on = true;
    traceRec.id = "trace_" + new Date().toISOString().replace(/[:.]/g, "-");
    traceRec.fixes = [];
    traceRec.startedAt = Date.now();
    traceRec.sinceSave = 0;
    traceRec.dest = activeDestination ? { name: activeDestination.name, lat: activeDestination.lat, lng: activeDestination.lng } : null;
    if (btn) btn.textContent = "Rec trace: ON";
    if (watchId === null) startGps();
    setMessage("Recording live GPS to a trace.");
  }

  function formatTraceDate(ms){
    if (!Number.isFinite(ms)) return "";
    const d = new Date(ms);
    return d.toLocaleDateString("en-NZ", { day: "numeric", month: "short" }) + " " + formatTime(d);
  }

  function renderTraceList(){
    const list = document.getElementById("traceList");
    if (!list) return;
    const items = traceStore.list().filter(m => m && m.id).sort((a, b) => (b.startedAt || 0) - (a.startedAt || 0));
    list.textContent = "";
    if (!items.length) {
      const empty = document.createElement("div");
      empty.id = "traceEmpty";
      empty.textContent = "No recorded drives yet. Tap \"Rec trace\" while driving with live GPS; it saves to " +
        (traceStore.hasBridge() ? "the app's files on this device." : "this browser's storage.");
      list.append(empty);
      return;
    }
    for (const m of items) {
      const row = document.createElement("div");
      row.className = "trace-row";
      const label = document.createElement("div");
      const name = document.createElement("div");
      name.className = "trace-name";
      name.textContent = m.name || m.id;
      const meta = document.createElement("span");
      meta.className = "trace-meta";
      meta.textContent = `${formatTraceDate(m.startedAt)} · ${m.count || 0} fixes · ${formatDuration(m.durationMs || 0)}`;
      label.append(name, meta);
      const replay = document.createElement("button");
      replay.type = "button";
      replay.className = "trace-replay";
      replay.dataset.trace = m.id;
      replay.dataset.action = "replay";
      replay.textContent = "Replay";
      const del = document.createElement("button");
      del.type = "button";
      del.dataset.trace = m.id;
      del.dataset.action = "delete";
      del.textContent = "Delete";
      row.append(label, replay, del);
      list.append(row);
    }
  }

  function openTracePanel(){
    if (demoKind === "replay" && isDemoRunning()) { stopDemo(); setMessage("Replay stopped."); return; }
    const overlay = document.getElementById("traceOverlay");
    if (!overlay) return;
    overlay.hidden = false;
    overlay.classList.add("open");
    renderTraceList();
  }

  function closeTracePanel(){
    const overlay = document.getElementById("traceOverlay");
    if (!overlay) return;
    overlay.hidden = true;
    overlay.classList.remove("open");
  }

  async function startTraceReplay(id){
    const trace = traceStore.read(id);
    if (!trace || !Array.isArray(trace.fixes) || trace.fixes.length < 2) { setMessage("Trace is empty or unreadable."); return; }
    if (traceRec.on) toggleTraceRecording(); // a replay must not record itself
    closeTracePanel();
    if (isDemoRunning()) stopDemo();
    if (watchId !== null) stopGps();
    const fixes = trace.fixes;
    const first = fixes[0];
    const start = { lat: first[1], lng: first[2], heading: Number.isFinite(first[3]) ? first[3] : NaN };
    if (trace.dest && Number.isFinite(trace.dest.lat) && Number.isFinite(trace.dest.lng)) {
      // Recorded while navigating: rebuild the route from the trace start (current traffic).
      await calculateRoute({ lat: start.lat, lng: start.lng }, trace.dest, trace.dest.name || "Destination", { preview: false });
      if (activeRoutePath.length >= 2) {
        currentGpsPoint = start;
        enterNavigation();
      }
    } else {
      clearNavigation();
      following = true;
      document.getElementById("followBtn").textContent = "Following: ON";
      setView("drive");
    }
    demoKind = "replay";
    demoActive = true;
    const btn = document.getElementById("tracesBtn");
    if (btn) btn.textContent = "Stop replay";
    setMessage(`Replaying ${fixes.length} recorded fixes...`);
    let i = 0;
    const step = () => {
      replayTimer = null;
      if (demoKind !== "replay" || !demoActive) return;
      const f = fixes[i];
      applyGpsFix({ lat: f[1], lng: f[2] }, Number.isFinite(f[3]) ? f[3] : NaN, {
        speed: finiteOrNull(f[4]),
        accuracy: finiteOrNull(f[5]),
        bearingAccuracy: finiteOrNull(f[6]),
        headingMeasured: Number.isFinite(f[3])
      });
      i += 1;
      if (i >= fixes.length) { stopDemo(); setMessage("Replay finished."); return; }
      replayTimer = setTimeout(step, clamp(fixes[i][0] - f[0], 50, TRACE_REPLAY_MAX_GAP_MS));
    };
    step();
  }

  function downsamplePath(path,maxPoints){
    if (path.length <= maxPoints) return path.slice();
    const output = [], stride = (path.length - 1) / (maxPoints - 1);
    for (let i=0;i<maxPoints;i++) output.push(path[Math.round(i*stride)]);
    return output;
  }

  function formatTime(date){ return date.toLocaleTimeString("en-NZ",{hour:"numeric",minute:"2-digit"}); }
  function bearingDegrees(a,b){
    const lat1=toRad(a.lat), lat2=toRad(b.lat), dLng=toRad(b.lng-a.lng);
    const y=Math.sin(dLng)*Math.cos(lat2);
    const x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLng);
    return normaliseHeading(toDeg(Math.atan2(y,x)));
  }
  function distanceMetres(a,b){
    const R=6371000,dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng),lat1=toRad(a.lat),lat2=toRad(b.lat);
    const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function normaliseHeading(value){ return ((value%360)+360)%360; }
  function clamp(value,min,max){ return Math.min(max,Math.max(min,value)); }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function toRad(deg){ return deg*Math.PI/180; }
  function toDeg(rad){ return rad*180/Math.PI; }

  // ---- Ground elevation for the camera's orbit target ----
  // Map3DElement.center.altitude is metres above SEA LEVEL and has no ground-relative
  // mode, so a follow camera that omits it orbits a point at sea level: in the Auckland
  // CBD (15-25 m ASL) that put the camera almost at street level looking up at the car,
  // and on Mt Eden (160 m) it would sit far underground. The Elevation API isn't enabled
  // for this key, so ground height comes from the keyless AWS Terrarium DEM tiles (the
  // same source Vela uses for its terrain), bilinearly sampled and eased.
  const TERRAIN_TILE_URL = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
  const TERRAIN_Z = 14; // ~7.6 m per pixel at Auckland's latitude
  const TERRAIN_RETRY_MS = 30000;
  const terrainTiles = new Map(); // "x/y" -> { data, pending, failedAt }

  function terrainTileCoords(lat, lng){
    const n = 2 ** TERRAIN_Z;
    const latR = toRad(clamp(lat, -85, 85));
    const fx = ((lng + 180) / 360) * n;
    const fy = ((1 - Math.log(Math.tan(latR) + 1 / Math.cos(latR)) / Math.PI) / 2) * n;
    return { x: Math.floor(fx), y: Math.floor(fy), px: (fx - Math.floor(fx)) * 256, py: (fy - Math.floor(fy)) * 256 };
  }

  function requestTerrainTile(x, y){
    const key = x + "/" + y;
    const entry = terrainTiles.get(key);
    if (entry && (entry.data || entry.pending || (entry.failedAt && performance.now() - entry.failedAt < TERRAIN_RETRY_MS))) return entry;
    const next = { data: null, pending: true, failedAt: 0 };
    terrainTiles.set(key, next);
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      try {
        const cv = document.createElement("canvas");
        cv.width = 256; cv.height = 256;
        const ctx = cv.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        next.data = ctx.getImageData(0, 0, 256, 256).data;
      } catch (err) {
        next.failedAt = performance.now();
      }
      next.pending = false;
    };
    img.onerror = () => { next.pending = false; next.failedAt = performance.now(); };
    img.src = TERRAIN_TILE_URL.replace("{z}", TERRAIN_Z).replace("{x}", x).replace("{y}", y);
    return next;
  }

  function terrainSample(data, px, py){
    const i = (py * 256 + px) * 4;
    return (data[i] * 256 + data[i + 1] + data[i + 2] / 256) - 32768;
  }

  // Ground elevation (m ASL) at a point, or null while its tile is still loading.
  function terrainAltitude(lat, lng){
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
    const t = terrainTileCoords(lat, lng);
    const tile = requestTerrainTile(t.x, t.y);
    if (!tile.data) return null;
    const x0 = clamp(Math.floor(t.px - 0.5), 0, 255), y0 = clamp(Math.floor(t.py - 0.5), 0, 255);
    const x1 = Math.min(x0 + 1, 255), y1 = Math.min(y0 + 1, 255);
    const fx = clamp(t.px - 0.5 - x0, 0, 1), fy = clamp(t.py - 0.5 - y0, 0, 1);
    const top = lerp(terrainSample(tile.data, x0, y0), terrainSample(tile.data, x1, y0), fx);
    const bottom = lerp(terrainSample(tile.data, x0, y1), terrainSample(tile.data, x1, y1), fx);
    return lerp(top, bottom, fy);
  }

  // Warm the tiles under the car and a little way ahead, so the camera never waits.
  function prefetchTerrain(point, heading){
    terrainAltitude(point.lat, point.lng);
    if (Number.isFinite(heading)) {
      const ahead = lookAhead(point, heading, 700);
      terrainAltitude(ahead.lat, ahead.lng);
    }
  }

  function prefetchRouteTerrain(path, cum){
    if (path.length < 2) return;
    const total = cum[cum.length - 1];
    const step = Math.max(1200, total / 40);
    for (let m = 0; m <= total; m += step) {
      const p = pointAtMetres(path, cum, m).point;
      terrainAltitude(p.lat, p.lng);
    }
  }

  // Eased ground altitude for the orbit target (snaps on the first sample / after a teleport).
  function followGroundAltitude(point, dtEase){
    const g = terrainAltitude(point.lat, point.lng);
    if (g == null) return followAlt;
    if (followAlt == null || !Number.isFinite(followAlt)) {
      followAlt = g;
      return g;
    }
    followAlt += (g - followAlt) * easeK(dtEase, 1.0);
    return followAlt;
  }

  // Car height from DEM, median-sampled along the heading so photorealistic "ghost cars"
  // in CLAMP_TO_GROUND don't pop the model. Eased so remaining spikes don't jerk.
  const CAR_ALT_LOOKAHEAD_M = [-8, 0, 14, 32, 55, 90];
  const CAR_ALT_TAU = 0.45;
  const CAR_ALT_PAD_M = 0.2;
  function carGroundAltitude(point, heading, dtEase){
    const hdg = Number.isFinite(heading) ? heading : 0;
    const samples = [];
    for (let i = 0; i < CAR_ALT_LOOKAHEAD_M.length; i++) {
      const m = CAR_ALT_LOOKAHEAD_M[i];
      const p = m === 0 ? point : lookAhead(point, hdg, m);
      const g = terrainAltitude(p.lat, p.lng);
      if (g != null) samples.push(g);
    }
    let target = null;
    if (samples.length) {
      samples.sort((a, b) => a - b);
      target = samples[samples.length >> 1] + CAR_ALT_PAD_M;
    } else if (Number.isFinite(followAlt)) {
      target = followAlt + CAR_ALT_PAD_M;
    }
    if (target == null) return carAlt;
    if (carAlt == null || !Number.isFinite(carAlt)) {
      carAlt = target;
      return carAlt;
    }
    const dt = Number.isFinite(dtEase) && dtEase > 0 ? dtEase : 0.05;
    carAlt += (target - carAlt) * easeK(dt, CAR_ALT_TAU);
    return carAlt;
  }

  function inspectGroundAltitude(point, dtEase){
    const heading = Number.isFinite(lastCarHeading) ? lastCarHeading : 0;
    let g = carGroundAltitude(point, heading, dtEase);
    if (!Number.isFinite(g)) g = followGroundAltitude(point, dtEase);
    if (!Number.isFinite(g)) g = terrainAltitude(point.lat, point.lng);
    if (!Number.isFinite(g) && Number.isFinite(point && point.altitude)) g = Number(point.altitude);
    if (!Number.isFinite(g)) {
      const live = readMapCenter();
      if (live && Number.isFinite(live.altitude) && Math.abs(live.altitude) > 1) g = live.altitude;
    }
    return g;
  }

  window.__aaScaleMap = function(factor){
    if (!map3d) return;
    if (carInspect) {
      const cur = Number(carInspect.userRange) || CAR_INSPECT.RANGE;
      carInspect.userRange = clamp(cur / (Number(factor) || 1), 8, 90);
      carInspect.lastInteractMs = performance.now();
      return;
    }
    if (destPreview || (document.body.classList.contains("has-route") && !isNavigating())) {
      markUserPanned(true);
    }
    const range = Number(map3d.range) || 260;
    const next = clamp(range / (Number(factor) || 1), 40, 20000);
    if (following && puck.fix) {
      // Pinch while following: keep following at the user's range (Re-center clears it).
      cam.userRange = next;
      cam.range = next;
      lastTouchMs = performance.now();
      autoRefollowArmed = true;
      updateRecenterButton();
      syncFreeZoomDot();
    }
    map3d.range = next;
    syncCarLod();
    refreshViewSpecs();
  };
  window.__aaNudgeCamera = function(dHeading, dTilt){
    if (!map3d) return;
    let dh = Number(dHeading) || 0;
    let dt = Number(dTilt) || 0;
    // A pinch release is one huge step, about a quarter turn. A real twist arrives as small steps.
    if (Math.abs(dh) > 28) dh = 0;
    if (Math.abs(dt) > 22) dt = 0;
    if (!dh && !dt) return;
    if (carInspect) {
      carInspect.yaw = (Number(carInspect.yaw) || 0) + dh;
      if (dt) carInspect.userTilt = clamp((Number(carInspect.userTilt) || CAR_INSPECT.TILT) + dt, 20, 85);
      carInspect.lastInteractMs = performance.now();
      return;
    }
    markUserPanned(true);
    if (dh) map3d.heading = normaliseHeading((Number(map3d.heading) || 0) + dh);
    if (dt) map3d.tilt = clamp((Number(map3d.tilt) || 0) + dt, 0, 90);
    syncCarLod();
    refreshViewSpecs();
  };
  window.__aaRecenter = function(){
    recenterToCar();
  };
  window.__aaUserPanned = function(){
    if (carInspect) {
      carInspect.lastInteractMs = performance.now();
      return;
    }
    markUserPanned(true);
  };
  // Host day/night (Android Auto's CarContext.isDarkMode - not wall-clock).
  window.__aaSetNight = function(on){
    document.documentElement.classList.toggle("night", !!on);
    document.body.classList.toggle("night", !!on);
  };
  window.__aaSetVisibleArea = function(area){
    if (!area) return;
    const w = window.innerWidth || 1;
    const h = window.innerHeight || 1;

  function stowRouteCard(){
    if (!document.body.classList.contains("has-route") || document.body.classList.contains("navigating")) return;
    document.body.classList.add("route-card-stowed");
    if (routeCardRestoreTimer) {
      window.clearTimeout(routeCardRestoreTimer);
      routeCardRestoreTimer = 0;
    }
  }
  function unstowRouteCard(){
    document.body.classList.remove("route-card-stowed");
    if (routeCardRestoreTimer) {
      window.clearTimeout(routeCardRestoreTimer);
      routeCardRestoreTimer = 0;
    }
  }
  function scheduleRestoreRouteCard(){
    if (!document.body.classList.contains("route-card-stowed")) return;
    if (routeCardRestoreTimer) window.clearTimeout(routeCardRestoreTimer);
    routeCardRestoreTimer = window.setTimeout(() => {
      routeCardRestoreTimer = 0;
      document.body.classList.remove("route-card-stowed");
    }, ROUTE_CARD_RESTORE_MS);
  }
  function releaseMapFromRoutePreview(){
    if (!document.body.classList.contains("has-route") || document.body.classList.contains("navigating")) return;
    holdStartCountdown();
    stopDestPreview();
    stowRouteCard();
    if (following) {
      following = false;
      cam.seeded = false;
      const followBtn = document.getElementById("followBtn");
      if (followBtn) followBtn.textContent = "Following: OFF";
    }
    updateRecenterButton();
  }
  function isPreviewUiTarget(target){
    return !!(target && target.closest && target.closest("#routeCard, #parkDialog, #descDialog"));
  }

  window.addEventListener("pointerdown", event => {
    gesturePointers.add(event.pointerId);
    if (pinchReachesMap(event)) event.stopPropagation();
    if (!event.target.closest || !event.target.closest("#viewPicker")) closeViewSelectMenu();
    if (isPreviewUiTarget(event.target) && !(event.target.closest && event.target.closest("#routeGo, #routeBack, #routeClose"))) {
      holdStartCountdown();
    }
    if (isChromeUiTarget(event.target)) {
      mapDragStart = null;
      return;
    }
    if (carInspect) {
      noteMapPointerDown(event);
      mapDragStart = { x: event.clientX, y: event.clientY, panned: false, car: false };
      return;
    }
    holdStartCountdown();
    closeAaSearchBar();
    if (flyover && isNavigating()) {
      skipNavFlyover();
      mapDragStart = null;
      return;
    }
    releaseMapFromRoutePreview();
    noteMapPointerDown(event);
    mapDragStart = { x: event.clientX, y: event.clientY, panned: false, car: tapHitsCar(event) };
  }, { capture:true, passive:true });
  window.addEventListener("pointermove", event => {
    if (pinchReachesMap(event)) event.stopPropagation();
    if (!mapDragStart) return;
    noteMapPointerMove(event);
    const dx = event.clientX - mapDragStart.x;
    const dy = event.clientY - mapDragStart.y;
    const slop = mapDragStart.car ? 36 : 16;
    if (dx * dx + dy * dy < slop * slop) return;
    if (carInspect) {
      mapDragStart.panned = true;
      chromeLocked = false;
      hideChrome();
      carInspect.yaw = (Number(carInspect.yaw) || 0) + dx * 0.28;
      carInspect.userTilt = clamp((Number(carInspect.userTilt) || CAR_INSPECT.TILT) - dy * 0.18, 20, 85);
      carInspect.lastInteractMs = performance.now();
      mapDragStart.x = event.clientX;
      mapDragStart.y = event.clientY;
      return;
    }
    if (!mapDragStart.panned) {
      mapDragStart.panned = true;
      chromeLocked = false;
      hideChrome();
      markUserPanned(true);
    }
    stowRouteCard();
  }, { capture:true, passive:true });
  window.addEventListener("pointerup", event => {
    const wasPinch = gesturePointers.size >= 2;
    if (wasPinch && event.isPrimary === false) event.stopPropagation();
    gesturePointers.delete(event.pointerId);
    if (wasPinch && gesturePointers.size < 2) finishZoomPinch();
    const start = mapDragStart;
    mapDragStart = null;
    if (!start) return;
    if (start.panned) {
      scheduleRestoreRouteCard();
      return;
    }
    if (!carInspect && (start.car || tapHitsCar(event))) {
      startCarInspect();
      return;
    }
    if (carInspect) {
      carInspect.lastInteractMs = performance.now();
      return;
    }
    onNavMapTap();
    scheduleRestoreRouteCard();
  }, { capture:true, passive:true });
  window.addEventListener("pointercancel", event => {
    gesturePointers.delete(event.pointerId);
    if (gesturePointers.size < 2) finishZoomPinch();
    if (mapDragStart && mapDragStart.panned) scheduleRestoreRouteCard();
    else if (document.body.classList.contains("route-card-stowed")) scheduleRestoreRouteCard();
    mapDragStart = null;
  }, { capture:true, passive:true });
  window.addEventListener("wheel", event => {
    if (isChromeUiTarget(event.target)) return;
    chromeLocked = false;
    hideChrome();
    if (carInspect) {
      const dir = event.deltaY > 0 ? 1.12 : (1 / 1.12);
      const cur = Number(carInspect.userRange) || CAR_INSPECT.RANGE;
      carInspect.userRange = clamp(cur * dir, 8, 90);
      carInspect.lastInteractMs = performance.now();
      return;
    }
    markUserPanned(true);
  }, { capture:true, passive:true });

  let camGesture = null;
  function twoTouchState(a, b){
    const dx = b.clientX - a.clientX;
    const dy = b.clientY - a.clientY;
    return {
      dist: Math.hypot(dx, dy) || 1,
      angle: Math.atan2(dy, dx),
      midX: (a.clientX + b.clientX) / 2,
      midY: (a.clientY + b.clientY) / 2,
      mode: "undecided",
      accAngle: 0,
      accLog: 0,
      accMidY: 0,
      zoomHeading: null,
      startHeading: map3d ? (Number(map3d.heading) || 0) : 0
    };
  }
  function classifyTwoFinger(state, dAngle, dDist, dMidY){
    state.accAngle += dAngle;
    state.accLog += Math.log(dDist || 1);
    state.accMidY += dMidY;
    const twist = Math.abs(state.accAngle);
    const zoom = Math.abs(state.accLog);
    if (state.mode === "undecided") {
      if (zoom > 0.04 && twist < 14) state.mode = "zoom";
      else if (twist > 14 && zoom < 0.03) state.mode = "rotate";
      else if (Math.abs(state.accMidY) > 18 && zoom < 0.03 && twist < 8) state.mode = "tilt";
    }
    return state.mode;
  }
  function applyTwoFingerCamera(event){
    if (!map3d || event.touches.length !== 2 || isChromeUiTarget(event.target)) {
      if (event.touches.length < 2) camGesture = null;
      return false;
    }
    noteMapPinch();
    const next = twoTouchState(event.touches[0], event.touches[1]);
    if (!camGesture) {
      camGesture = next;
      return true;
    }
    let dAngle = (next.angle - camGesture.angle) * 180 / Math.PI;
    if (dAngle > 180) dAngle -= 360;
    if (dAngle < -180) dAngle += 360;
    const dDist = next.dist / camGesture.dist;
    const dMidY = next.midY - camGesture.midY;
    const mode = classifyTwoFinger(camGesture, dAngle, dDist, dMidY);
    if (mode === "zoom" && !Number.isFinite(camGesture.zoomHeading)) {
      camGesture.zoomHeading = Number(map3d.heading) || 0;
    }
    camGesture.dist = next.dist;
    camGesture.angle = next.angle;
    camGesture.midX = next.midX;
    camGesture.midY = next.midY;
    chromeLocked = false;
    hideChrome();
    // Fingers lifting collapses the span and swings its angle by about 90°. That frame is not a gesture.
    const spanOk = dDist > 0.72 && dDist < 1.4;
    const angleOk = Math.abs(dAngle) <= 28;
    const zooming = (mode === "undecided" || mode === "zoom") && spanOk && Math.abs(dDist - 1) > 0.008;
    if (carInspect) {
      if (mode === "rotate" && angleOk && Math.abs(dAngle) > 0.6) carInspect.yaw = (Number(carInspect.yaw) || 0) + dAngle;
      if (zooming) {
        const cur = Number(carInspect.userRange) || CAR_INSPECT.RANGE;
        carInspect.userRange = clamp(cur / dDist, 8, 90);
      }
      if (mode === "tilt" && Math.abs(dMidY) > 1.5) {
        carInspect.userTilt = clamp((Number(carInspect.userTilt) || CAR_INSPECT.TILT) - dMidY * 0.18, 20, 85);
      }
      carInspect.lastInteractMs = performance.now();
      return true;
    }
    markUserPanned(true);
    if (mode === "rotate" && angleOk && Math.abs(dAngle) > 0.6) {
      map3d.heading = normaliseHeading((Number(map3d.heading) || 0) + dAngle);
    }
    if (mode === "tilt" && Math.abs(dMidY) > 1.5) {
      map3d.tilt = clamp((Number(map3d.tilt) || 0) - dMidY * 0.18, 0, 90);
    }
    if (zooming) {
      const range = Number(map3d.range) || 260;
      map3d.range = clamp(range / dDist, 40, 20000);
      syncCarLod();
    }
    refreshViewSpecs();
    return true;
  }
  let headingHold = 0;
  function holdZoomHeading(heading){
    const token = ++headingHold;
    const until = performance.now() + 360;
    const tick = () => {
      if (token !== headingHold || !map3d || performance.now() > until) return;
      const h = Number(map3d.heading) || 0;
      const dh = Math.abs(((h - heading + 540) % 360) - 180);
      if (dh > 28) map3d.heading = heading;
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  function finishZoomPinch(){
    if (!camGesture) return;
    const gesture = camGesture;
    camGesture = null;
    if (gesture.mode === "rotate") return;
    const heading = Number.isFinite(gesture.zoomHeading) ? gesture.zoomHeading : gesture.startHeading;
    if (Number.isFinite(heading)) holdZoomHeading(heading);
  }
  const gesturePointers = new Set();
  function pinchReachesMap(event){
    return gesturePointers.size >= 2 && !(event && isChromeUiTarget(event.target));
  }
  window.addEventListener("touchstart", event => {
    if (event.touches.length >= 2) {
      headingHold++;
      noteMapPinch();
      if (!isChromeUiTarget(event.target)) event.stopPropagation();
    }
    if (event.touches.length === 2 && !isChromeUiTarget(event.target)) {
      camGesture = twoTouchState(event.touches[0], event.touches[1]);
    }
  }, { capture:true, passive:true });
  window.addEventListener("touchmove", event => {
    if (applyTwoFingerCamera(event)) {
      event.preventDefault();
      event.stopPropagation();
    }
  }, { capture:true, passive:false });
  window.addEventListener("touchend", event => {
    if (event.touches.length < 2) finishZoomPinch();
  }, { capture:true, passive:true });
  window.addEventListener("touchcancel", () => { finishZoomPinch(); }, { capture:true, passive:true });

  window.addEventListener("click", event => {
    if (tapHitsCar(event) || carInspect) return;
    if (!isChromeUiTarget(event.target)) onNavMapTap();
    if (isAndroidAuto()) return;
    if (document.body.classList.contains("chrome-hidden")) showChrome();
  }, true);

  const topPanel = document.getElementById("topPanel");
  topPanel.addEventListener("pointerdown", () => {
    if (!document.body.classList.contains("chrome-hidden")) showChrome();
  });
  topPanel.addEventListener("focusin", () => { chromeLocked = true; showChrome(); });
  topPanel.addEventListener("focusout", () => { chromeLocked = false; scheduleChromeHide(); });
  document.getElementById("chromeWake").addEventListener("pointerdown", event => {
    event.preventDefault();
    showChrome();
  });
  document.getElementById("chromeWake").addEventListener("click", event => {
    event.preventDefault();
    showChrome();
  });

  function showMapFailure(text){
    setMessage(text);
    const status = document.getElementById("mapLoaderStatus");
    if (status) {
      status.hidden = false;
      status.textContent = text;
    }
    const loader = document.getElementById("mapLoader");
    if (loader) {
      loader.classList.add("has-status", "map-failed");
      loader.style.pointerEvents = "auto";
    }
    document.documentElement.classList.remove("native-boot");
    try { if (window.Car && typeof Car.bootPainted === "function") Car.bootPainted(); } catch (err) {}
  }

  let mapRevealDone = false;
  let mapRevealTimer = 0;
  const MAP_REVEAL_KEY = "aaMapRevealed";
  const MAP_REVEAL_MIN_MS = 900;
  const MAP_REVEAL_MAX_MS = 2000;
  function revealMap(){
    if (mapRevealDone) return;
    mapRevealDone = true;
    if (mapRevealTimer) { window.clearTimeout(mapRevealTimer); mapRevealTimer = 0; }
    try { sessionStorage.setItem(MAP_REVEAL_KEY, "1"); } catch (err) {}
    document.body.classList.add("map-ready");
    document.documentElement.classList.add("map-ready");
    wakeMapRenderer();
    requestAnimationFrame(() => wakeMapRenderer());
    window.setTimeout(wakeMapRenderer, 80);
    window.setTimeout(wakeMapRenderer, 480);
    if (!placeAutocomplete && PlaceAutocompleteClass) {
      setupAutocomplete(PlaceAutocompleteClass);
    }
    startGps();
    preloadCarModel();
    try {
      if (window.Car && typeof Car.mapReady === "function") Car.mapReady();
    } catch (err) {}
  }

  function mapSteadyFromEvent(event){
    if (!event) return false;
    if (event.isSteady === true) return true;
    if (event.detail && event.detail.isSteady === true) return true;
    if (event.type === "gmp-steadystate" && event.isSteady !== false) return true;
    return false;
  }

  function armMapReveal(){
    const armedAt = performance.now();
    let sawSteady = false;
    const tryReveal = force => {
      if (mapRevealDone) return;
      const elapsed = performance.now() - armedAt;
      if (!force && !sawSteady) return;
      if (elapsed < MAP_REVEAL_MIN_MS) {
        if (mapRevealTimer) window.clearTimeout(mapRevealTimer);
        mapRevealTimer = window.setTimeout(() => tryReveal(force), MAP_REVEAL_MIN_MS - elapsed + 16);
        return;
      }
      revealMap();
    };
    const onSteady = event => {
      if (!mapSteadyFromEvent(event)) return;
      sawSteady = true;
      tryReveal(false);
    };
    if (map3d) {
      map3d.addEventListener("gmp-steadychange", onSteady);
      map3d.addEventListener("gmp-steadystate", onSteady);
    }
    try { window.dispatchEvent(new Event("resize")); } catch (err) {}
    mapRevealTimer = window.setTimeout(() => tryReveal(true), MAP_REVEAL_MAX_MS);
  }

  function mapsKeyIsMissing(key){
    // Do not compare against the deploy placeholder string: GitHub Pages
    // replaces every copy of that token, which used to make this check
    // always true and skipped loading Maps entirely.
    return !key || key.indexOf("AIza") !== 0 || key.length < 20;
  }

  function loadGoogleMaps(){
    if (mapsKeyIsMissing(GOOGLE_MAPS_API_KEY)) {
      showMapFailure("Maps API key was not injected at deploy time.");
      return;
    }
    const script=document.createElement("script");
    script.async=true;
    script.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(GOOGLE_MAPS_API_KEY)+"&v=weekly&loading=async&callback=initMap";
    script.onerror=()=>showMapFailure("Could not load Google Maps JavaScript API.");
    document.head.append(script);
  }

  function showUiPreview(){
    document.body.classList.add("map-ready", "navigating", "has-lanes", "debug-open");
    document.documentElement.classList.add("map-ready", "navigating", "has-lanes", "debug-open");
    const banner = document.getElementById("navBanner");
    const icon = document.getElementById("navIcon");
    const text = document.getElementById("navPrimaryText");
    const distEl = document.getElementById("navPrimaryDist");
    const thenEl = document.getElementById("navThen");
    const thenIcon = document.getElementById("navThenIcon");
    const eta = document.getElementById("navEtaBar");
    const remainEl = document.getElementById("navEtaRemain");
    const clockEl = document.getElementById("navEtaClock");
    if (banner) { banner.hidden = false; banner.classList.add("visible"); }
    if (icon) icon.innerHTML = maneuverIconSvg("TURN_RIGHT", 66);
    if (distEl) distEl.textContent = "250 m";
    if (text) text.textContent = "W 5th Ave";
    if (thenEl && thenIcon) {
      thenEl.hidden = false;
      thenEl.classList.add("visible");
      thenIcon.innerHTML = maneuverIconSvg("TURN_LEFT", 28);
    }
    if (eta) { eta.hidden = false; eta.classList.add("visible"); }
    if (remainEl) remainEl.textContent = "14 min";
    const etaDistEl = document.getElementById("navEtaDist");
    if (etaDistEl) etaDistEl.textContent = "3.9 km";
    if (clockEl) clockEl.textContent = "5:31 pm";
    const sepEl = document.getElementById("navEtaSep");
    if (sepEl) { sepEl.hidden = false; sepEl.classList.add("visible"); }
    const speed = document.getElementById("speedLimitBadge");
    if (speed) {
      speed.textContent = "50";
      speed.classList.add("visible");
      document.body.classList.add("has-speed-limit");
      document.documentElement.classList.add("has-speed-limit");
    }
    renderLaneBar([
      { dirs: ["left"], rec: false },
      { dirs: ["through"], rec: false },
      { dirs: ["through", "right"], rec: true },
      { dirs: ["right"], rec: true }
    ]);
  }

  const pageQuery = new URLSearchParams(location.search);
  if (pageQuery.has("uiPreview")) showUiPreview();
  else loadGoogleMaps();
</script>
</body>
</html>
