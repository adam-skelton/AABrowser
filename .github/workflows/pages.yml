# Publishes pages/ as a static site on GitHub Pages.
# Live URL: https://adam-skelton.github.io/AABrowser/
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Maps API key
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "Add repo secret GOOGLE_MAPS_API_KEY, then re-run this workflow."
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("pages/index.html")
          marker = 'const GOOGLE_MAPS_API_KEY = "__GOOGLE_MAPS_API_KEY__";'
          text = path.read_text(encoding="utf-8")
          if marker not in text:
              raise SystemExit("API key assignment placeholder not found in pages/index.html")
          key = os.environ["GOOGLE_MAPS_API_KEY"].strip()
          if not key.startswith("AIza"):
              raise SystemExit("GOOGLE_MAPS_API_KEY secret does not look like a Maps key")
          assignment = f'const GOOGLE_MAPS_API_KEY = "{key}";'
          path.write_text(text.replace(marker, assignment, 1), encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
